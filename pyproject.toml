[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqttium"
dynamic = ["version"]
description = "Reliable async-native MQTT client for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yoch Melka" },
]
keywords = ["mqtt", "asyncio", "iot"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Internet",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yoch/mqttium"
Repository = "https://github.com/yoch/mqttium"
Issues = "https://github.com/yoch/mqttium/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.17",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.16",
]
fuzz = [
    "hypothesis>=6.100",
    "pytest>=8",
]

[tool.hatch.version]
path = "src/mqttium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mqttium"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mqttium",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "RUF006", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/mqttium/protocol/__init__.py" = ["F401"]
"tests/**" = ["B017", "E731"]
"tests/fuzz/test_hypothesis_fuzz.py" = ["E402"]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
