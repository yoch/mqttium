[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mqttium"
dynamic = ["version"]
description = "Reliable async-native MQTT client for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Yoch Melka", email = "795960+yoch@users.noreply.github.com" },
]
keywords = [
    "mqtt",
    "mqtt-client",
    "mqtt5",
    "mqtt311",
    "asyncio",
    "iot",
    "messaging",
    "backpressure",
    "persistence",
    "websocket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yoch/mqttium"
Documentation = "https://mqttium.readthedocs.io"
Repository = "https://github.com/yoch/mqttium"
Issues = "https://github.com/yoch/mqttium/issues"
Discussions = "https://github.com/yoch/mqttium/discussions"
Changelog = "https://github.com/yoch/mqttium/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "actionlint-py>=1.7.12.24",
    "mypy>=1.17",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
    "py-spy>=0.4.2",
    "ruff>=0.16",
    "shellcheck-py>=0.11.0.1",
    "zizmor>=1.29",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocs-llmstxt>=0.5,<1",
    "mkdocs-redirects>=1.2,<2",
    "mkdocstrings[python]>=1,<2",
]
fuzz = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
]
security = [
    "bandit>=1.8",
]
benchmark = [
    "psutil>=6",
]
release = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "twine>=6",
    "validate-pyproject[all]>=0.24",
]

[tool.hatch.version]
path = "src/mqttium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mqttium"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mqttium",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/README.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/PROVENANCE.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/mkdocs.yml",
    "/.readthedocs.yaml",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-W",
    "error",
    "--timeout=30",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 89.0
precision = 2
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "RUF006", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/mqttium/protocol/__init__.py" = ["F401"]
# The Paho façade's publish path deliberately keeps immediate/queued admission
# and reservation cleanup together so their ordering/error semantics stay visible.
"src/mqttium/compat/paho.py" = ["C901"]
"tests/**" = ["B017", "E731"]
"tests/fuzz/test_hypothesis_fuzz.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
