name: Format final memory performance patch

on:
  push:
    branches:
      - agent/final-perf-publisher
    paths:
      - .github/workflows/apply-final-performance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/memory-profile-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format and publish
        run: |
          python -m pip install "ruff==0.16.1"
          ruff format src/mqttium/api/async_client.py src/mqttium/protocol/engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/async_client.py src/mqttium/protocol/engine.py
          git commit -m "Format final memory performance paths"
          git push origin HEAD:agent/memory-profile-overhaul
