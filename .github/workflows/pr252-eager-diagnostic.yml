name: Apply PR252 Candidate Stability Gate

on:
  push:
    branches: [agent/pr252-eager-diagnostic]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: refactor/simplification-audit-2026-08-16
      EXPECTED_HEAD: b0bbdfb21baeb7fb15f1428cf26d25ab492f731a
      EXPECTED_MAIN: 0999d8abfe44a568209209403d7f215b18cc4eb7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin target and base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/target)" = "$EXPECTED_HEAD"
          test "$(git merge-base refs/remotes/origin/main refs/remotes/origin/target)" = "$EXPECTED_MAIN"
          git config user.name yoch
          git config user.email yoch.melka@gmail.com
          git checkout -B target-work refs/remotes/origin/target

      - name: Apply symmetric candidate stability checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              assert text.count(old) == 1, (path, text.count(old), old[:80])
              path.write_text(text.replace(old, new))

          bench = Path("benchmarks/paired_open_loop.py")
          replace_once(
              bench,
              '        candidate_rates = [_number(item, "completed_rate") for item in samples["candidate"]]\n'
              '        base_latencies = [_number(item, "ack_latency_p50_ms") for item in samples["base"]]\n',
              '        candidate_rates = [_number(item, "completed_rate") for item in samples["candidate"]]\n'
              '        base_latencies = [_number(item, "ack_latency_p50_ms") for item in samples["base"]]\n'
              '        candidate_latencies = [_number(item, "ack_latency_p50_ms") for item in samples["candidate"]]\n',
          )
          replace_once(
              bench,
              '        base_cv = _cv(base_rates)\n        base_latency_cv = _cv(base_latencies)\n',
              '        base_cv = _cv(base_rates)\n'
              '        candidate_cv = _cv(candidate_rates)\n'
              '        base_latency_cv = _cv(base_latencies)\n'
              '        candidate_latency_cv = _cv(candidate_latencies)\n',
          )
          replace_once(
              bench,
              '            "base_completed_cv": base_cv,\n'
              '            "base_ack_latency_p50_cv": base_latency_cv,\n',
              '            "base_completed_cv": base_cv,\n'
              '            "candidate_completed_cv": candidate_cv,\n'
              '            "base_ack_latency_p50_cv": base_latency_cv,\n'
              '            "candidate_ack_latency_p50_cv": candidate_latency_cv,\n',
          )
          replace_once(
              bench,
              '        if base_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: baseline completed-rate CV {base_cv:.2%}")\n'
              '        if base_latency_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: baseline p50-latency CV {base_latency_cv:.2%}")\n',
              '        if base_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: baseline completed-rate CV {base_cv:.2%}")\n'
              '        if candidate_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: candidate completed-rate CV {candidate_cv:.2%}")\n'
              '        if base_latency_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: baseline p50-latency CV {base_latency_cv:.2%}")\n'
              '        if candidate_latency_cv > args.max_baseline_cv:\n'
              '            invalidations.append(f"{label}: candidate p50-latency CV {candidate_latency_cv:.2%}")\n',
          )

          tests = Path("tests/unit/test_paired_open_loop.py")
          text = tests.read_text()
          assert "def test_parent_invalidates_candidate_only_variability(" not in text
          text += '''\n\ndef test_parent_invalidates_candidate_only_variability(\n    open_loop, monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n) -> None:\n    base_root = tmp_path / "base"\n    candidate_root = tmp_path / "candidate"\n    base_root.mkdir()\n    candidate_root.mkdir()\n    samples = {\n        base_root.resolve(): iter(((100.0, 0.5),) * 4),\n        candidate_root.resolve(): iter(((80.0, 0.2), (120.0, 0.8), (80.0, 0.2), (120.0, 0.8))),\n    }\n\n    def fake_run_worker(*call_args, **kwargs):\n        if kwargs["mode"] == "calibrate":\n            return {"capacity": 12_000.0}\n        completed_rate, latency = next(samples[Path(call_args[1]).resolve()])\n        return {\n            "completed_rate": completed_rate,\n            "ack_latency_p50_ms": latency,\n            "loop_lag_p95_ms": 0.1,\n        }\n\n    monkeypatch.setattr(open_loop, "_run_worker", fake_run_worker)\n    output = tmp_path / "candidate-variability.json"\n    args = Namespace(\n        base_root=base_root, candidate_root=candidate_root, protocols="311", payloads="64",\n        completions="callback", window=64, windows=None, fractions=None, target_rates="5000",\n        preflight_report=None, policy="advisory", max_baseline_cv=0.05,\n        min_completed_ratio=0.97, max_loop_lag_ratio=1.05, max_aa_ratio_deviation=0.02,\n        cpu=None, target_sample_seconds=0.01, max_count=10, count_small=1, count_large=1,\n        repeat=4, host="127.0.0.1", port=11883, timeout=1.0, output=output, summary_output=None,\n    )\n\n    assert open_loop.parent(args) == 0\n    result = open_loop.json.loads(output.read_text())\n    scenario = result["scenarios"][0]\n    assert scenario["base_completed_cv"] == 0.0\n    assert scenario["base_ack_latency_p50_cv"] == 0.0\n    assert scenario["candidate_completed_cv"] > 0.05\n    assert scenario["candidate_ack_latency_p50_cv"] > 0.05\n    assert result["status"] == "invalid"\n    assert any("candidate completed-rate CV" in item for item in result["invalidations"])\n    assert any("candidate p50-latency CV" in item for item in result["invalidations"])\n'''
          tests.write_text(text)
          PY

      - name: Format and validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format benchmarks/paired_open_loop.py tests/unit/test_paired_open_loop.py
          python -m ruff format --check benchmarks/paired_open_loop.py tests/unit/test_paired_open_loop.py
          python -m ruff check benchmarks/paired_open_loop.py tests/unit/test_paired_open_loop.py
          python -m pytest -q tests/unit/test_paired_open_loop.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' benchmarks/paired_open_loop.py tests/unit/test_paired_open_loop.py | sort)"

      - name: Commit and push with lease
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/paired_open_loop.py tests/unit/test_paired_open_loop.py
          git commit -m "bench: reject unstable open-loop candidate arms"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target-final"
          test "$(git rev-parse refs/remotes/origin/target-final)" = "$EXPECTED_HEAD"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
