name: Uniform runtime current-main semantic validation

on:
  push:
    branches: [work/uniform-main-sync-validation]
    paths:
      - .github/workflows/uniform-main-sync-validation.yml

permissions:
  contents: read

env:
  MAIN_SHA: 6471c3f8e66bfaaccec1251289605c374e8ec100
  PRODUCT_SHA: 37248378205f6eadb1c62ae5392a6853b9a1db63

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'

      - name: Build live-dispatcher synthesis in working tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$PRODUCT_SHA")" = "$PRODUCT_SHA"
          git config user.name 'mqttium sync validation'
          git config user.email 'sync-validation@invalid.local'
          set +e
          git merge --no-commit --no-ff "$MAIN_SHA" > /tmp/merge.stdout 2> /tmp/merge.stderr
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(git diff --name-only --diff-filter=U | sort)" = $'docs/migration.md\nsrc/mqttium/api/_delivery.py\nsrc/mqttium/api/async_client.py'
          git checkout --ours -- docs/migration.md src/mqttium/api/_delivery.py src/mqttium/api/async_client.py
          git add docs/migration.md src/mqttium/api/_delivery.py src/mqttium/api/async_client.py
          test -z "$(git diff --name-only --diff-filter=U)"

          python - <<'PY'
          from pathlib import Path

          p = Path('src/mqttium/api/_delivery.py')
          text = p.read_text()
          old = (
              '        if self.callback_task is asyncio.current_task():\n'
              '            # An own-worker shutdown cannot join itself. Return to finish the\n'
              '            # active notification; a reconnect may reopen the same consumer.\n'
              '            return\n'
          )
          new = (
              '        if self.callback_task is asyncio.current_task():\n'
              '            # An own-worker shutdown cannot join itself. Retire unstarted work\n'
              '            # now; the active notification may finish and a reconnect may reopen\n'
              '            # the same worker incarnation for the replacement generation.\n'
              '            self._callback_state = "closed"\n'
              '            self._discard_callback_queue()\n'
              '            return\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'shutdown anchor count={text.count(old)}')
          p.write_text(text.replace(old, new))

          Path('tests/unit/test_callback_route_handoff.py').unlink()

          p = Path('tests/unit/test_callback_route_lifecycle.py')
          text = p.read_text()
          old = '        assert not delivery._callback_stop\n'
          new = '        assert delivery._callback_state == "open"\n'
          if text.count(old) != 1:
              raise SystemExit(f'lifecycle state anchor count={text.count(old)}')
          p.write_text(text.replace(old, new))

          p = Path('tests/unit/test_callback_route_reconfiguration.py')
          text = p.read_text()
          old = (
              '            # An inline pair transfers only its unstarted tail. The completed\n'
              '            # first callback no longer reserves a slot while the tail awaits.\n'
              '            expected_pending = 1 if burst == 2 else burst\n'
              '            assert client.stats().delivery.callback_queued == expected_pending\n'
          )
          new = (
              '            # The uniform worker reports only queued notifications; the\n'
              '            # currently active callback is deliberately excluded from qsize.\n'
              '            expected_pending = burst - 1\n'
              '            assert client.stats().delivery.callback_queued == expected_pending\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'queue accounting anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = (
              '            if burst == 2:\n'
              '                assert client._delivery.try_enqueue_callback(lambda: seen.append("refill"))\n'
              '            assert client.stats().delivery.callback_queued == burst\n'
              '            assert not client._delivery.try_enqueue_callback(lambda: seen.append("overflow"))\n'
          )
          new = (
              '            # One queue slot is free because the active callback is not queued.\n'
              '            assert client._delivery.try_enqueue_callback(lambda: seen.append("refill"))\n'
              '            assert client.stats().delivery.callback_queued == burst\n'
              '            assert not client._delivery.try_enqueue_callback(lambda: seen.append("overflow"))\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'refill anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = '            assert seen == expected + ["reentrant"] + (["refill"] if burst == 2 else [])\n'
          new = '            assert seen == expected + ["reentrant", "refill"]\n'
          if text.count(old) != 1:
              raise SystemExit(f'fifo expectation anchor count={text.count(old)}')
          p.write_text(text.replace(old, new))
          PY

          git add -A \
            src/mqttium/api/_delivery.py \
            tests/unit/test_callback_route_handoff.py \
            tests/unit/test_callback_route_lifecycle.py \
            tests/unit/test_callback_route_reconfiguration.py
          git diff --check
          git status --short | tee /tmp/status.txt
          git diff --cached --stat | tee /tmp/merge-stat.txt

      - name: Install and lint synthesized runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format \
            src/mqttium/api/_delivery.py \
            tests/unit/test_callback_route_lifecycle.py \
            tests/unit/test_callback_route_reconfiguration.py
          ruff format --check \
            src/mqttium/api/_delivery.py \
            tests/unit/test_callback_route_lifecycle.py \
            tests/unit/test_callback_route_reconfiguration.py
          ruff check \
            src/mqttium/api/_delivery.py \
            src/mqttium/api/async_client.py \
            tests/unit/test_callback_route_lifecycle.py \
            tests/unit/test_callback_route_pressure.py \
            tests/unit/test_callback_route_qos.py \
            tests/unit/test_callback_route_reconfiguration.py
          git diff --check

      - name: Run retained PR454 behavioral obligations
        shell: bash
        run: |
          set +e
          python -m pytest -q -W error \
            tests/unit/test_callback_route_lifecycle.py \
            tests/unit/test_callback_route_pressure.py \
            tests/unit/test_callback_route_qos.py \
            tests/unit/test_callback_route_reconfiguration.py \
            2>&1 | tee /tmp/pr454-tests.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/pr454-tests.rc
          exit 0

      - name: Run full suite for unexpected regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q -W error 2>&1 | tee /tmp/full-suite.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/full-suite.rc
          exit 0

      - name: Summarize failures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/failure-summary.txt
          from pathlib import Path
          for name in ('pr454-tests','full-suite'):
              text=Path(f'/tmp/{name}.log').read_text(errors='replace')
              failures=[line for line in text.splitlines() if line.startswith('FAILED ')]
              print(f'[{name}] rc={Path(f"/tmp/{name}.rc").read_text().strip()} failures={len(failures)}')
              for line in failures:
                  print(line)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: uniform-main-sync-validation-${{ github.run_id }}
          path: |
            /tmp/merge.stdout
            /tmp/merge.stderr
            /tmp/status.txt
            /tmp/merge-stat.txt
            /tmp/pr454-tests.log
            /tmp/pr454-tests.rc
            /tmp/full-suite.log
            /tmp/full-suite.rc
            /tmp/failure-summary.txt
          retention-days: 14
          if-no-files-found: warn
