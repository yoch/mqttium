name: Apply direct QoS0 staging

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'perf/direct-qos0-callback-capture' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: perf/direct-qos0-callback-capture
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect staged patch checksum
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/direct-qos0.patch.b64 > /tmp/direct-qos0.patch
          sha256sum /tmp/direct-qos0.patch
          exit 1
