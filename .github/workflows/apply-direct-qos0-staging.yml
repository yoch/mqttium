name: Apply direct QoS0 staging

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'perf/direct-qos0-callback-capture' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: perf/direct-qos0-callback-capture
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified patch and remove staging
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/direct-qos0.patch.b64 > /tmp/direct-qos0.patch
          echo 'b879f8888b4f99ecd0e926aeb6fe3ea1cc4a0a52976d9caa48871d444252c568  /tmp/direct-qos0.patch' | sha256sum -c -
          git apply --check /tmp/direct-qos0.patch
          git apply /tmp/direct-qos0.patch
          rm -f .tmp/direct-qos0.patch.b64 .github/workflows/apply-direct-qos0-staging.yml
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Perf: direct QoS0 callback capture'
          git push origin HEAD:perf/direct-qos0-callback-capture
