name: RC2 hardening bootstrap

on:
  push:
    branches: [fix/rc2-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rc2-hardening
      - name: Apply exact RC2 hardening edits
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_one(
              "src/mqttium/protocol/inbound.py",
              "        if state not in (InboundQoSState.WAIT_PUBACK, InboundQoSState.WAIT_USER_ACK):\n"
              "            raise ProtocolError(f\"Inbound mid={mid} is not awaiting ack (state={state!r})\")\n"
              "\n"
              "        if isinstance(record, InboundMessage):\n",
              "        if state not in (InboundQoSState.WAIT_PUBACK, InboundQoSState.WAIT_USER_ACK):\n"
              "            raise ProtocolError(f\"Inbound mid={mid} is not awaiting ack (state={state!r})\")\n"
              "\n"
              "        packet = (\n"
              "            PubAckPacket(mid=mid)\n"
              "            if state is InboundQoSState.WAIT_PUBACK\n"
              "            else PubCompPacket(mid=mid)\n"
              "        )\n"
              "        wire = packet.encode(config.protocol)\n"
              "        self._engine._check_outbound_size(wire)\n"
              "\n"
              "        if isinstance(record, InboundMessage):\n",
          )
          replace_one(
              "src/mqttium/protocol/inbound.py",
              "        packet = (\n"
              "            PubAckPacket(mid=mid)\n"
              "            if state is InboundQoSState.WAIT_PUBACK\n"
              "            else PubCompPacket(mid=mid)\n"
              "        )\n"
              "        self._engine._send(packet.encode(config.protocol))\n"
              "        self._release_slot(logical_size)\n",
              "        self._engine._send(wire)\n"
              "        self._release_slot(logical_size)\n",
          )

          replace_one(
              "src/mqttium/api/async_client.py",
              "            packet = self._engine.begin_disconnect(reason_code) if self.is_connected else None\n"
              "            try:\n",
              "            try:\n"
              "                packet = (\n"
              "                    self._engine.begin_disconnect(reason_code)\n"
              "                    if self.is_connected\n"
              "                    else None\n"
              "                )\n"
              "            except PacketTooLargeError:\n"
              "                # The peer's packet limit makes a legal DISCONNECT impossible.\n"
              "                # Closing the transport is the only conforming shutdown left.\n"
              "                await self._force_close()\n"
              "                return\n"
              "            try:\n",
          )
          replace_one(
              "src/mqttium/api/async_client.py",
              "        async with self._engine_lock:\n"
              "            self._engine.ack(message.mid)\n"
              "            self._collect_effects_locked()\n"
              "        await self._drain_effects()\n",
              "        try:\n"
              "            async with self._engine_lock:\n"
              "                self._engine.ack(message.mid)\n"
              "                self._collect_effects_locked()\n"
              "        except PacketTooLargeError as exc:\n"
              "            # A broker limit below the mandatory ACK size makes this QoS\n"
              "            # exchange impossible to complete without violating negotiation.\n"
              "            self._disconnect_exc = exc\n"
              "            self._intentional_disconnect = True\n"
              "            await self._force_close()\n"
              "            raise\n"
              "        await self._drain_effects()\n",
          )
          replace_one(
              "src/mqttium/api/async_client.py",
              "                if now >= due:\n"
              "                    async with self._engine_lock:\n"
              "                        self._engine.queue_ping()\n"
              "                        self._collect_effects_locked()\n"
              "                    # A lost PINGREQ beats a wedged keepalive under backpressure.\n",
              "                if now >= due:\n"
              "                    try:\n"
              "                        async with self._engine_lock:\n"
              "                            self._engine.queue_ping()\n"
              "                            self._collect_effects_locked()\n"
              "                    except PacketTooLargeError as exc:\n"
              "                        # A broker limit below the two-byte PINGREQ leaves no\n"
              "                        # conforming keepalive packet to send.\n"
              "                        self._disconnect_exc = exc\n"
              "                        self._intentional_disconnect = True\n"
              "                        await self._force_close()\n"
              "                        return\n"
              "                    # A lost PINGREQ beats a wedged keepalive under backpressure.\n",
          )
          replace_one(
              "src/mqttium/api/async_client.py",
              "        elif kind is EffectKind.AUTH:\n"
              "            challenge: AuthPacket = effect.data\n"
              "            if self.auth_handler is None:\n"
              "                await self._enqueue_outbound(\n"
              "                    encode_disconnect(0x8C, self._engine.config.protocol),\n"
              "                    nowait=nowait,\n"
              "                    epoch=epoch,\n"
              "                )\n"
              "                return\n",
              "        elif kind is EffectKind.AUTH:\n"
              "            challenge: AuthPacket = effect.data\n"
              "            if self.auth_handler is None:\n"
              "                packet = encode_disconnect(0x8C, self._engine.config.protocol)\n"
              "                self._engine._check_outbound_size(packet)\n"
              "                await self._enqueue_outbound(\n"
              "                    packet,\n"
              "                    nowait=nowait,\n"
              "                    epoch=epoch,\n"
              "                )\n"
              "                return\n",
          )
          replace_one(
              "src/mqttium/api/async_client.py",
              "        try:\n"
              "            packet = encode_disconnect(reason, MQTTProtocolVersion.MQTTv5)\n"
              "            admitted = self._try_enqueue_outbound(packet, epoch=self._connection_epoch)\n",
              "        try:\n"
              "            packet = encode_disconnect(reason, MQTTProtocolVersion.MQTTv5)\n"
              "            self._engine._check_outbound_size(packet)\n"
              "            admitted = self._try_enqueue_outbound(packet, epoch=self._connection_epoch)\n",
          )
          PY
          python -m compileall -q src/mqttium
          git diff --check
      - name: Remove bootstrap files and push result
        run: |
          set -euo pipefail
          git add src/mqttium/protocol/inbound.py src/mqttium/api/async_client.py
          git rm .rc2-mps.patch .github/workflows/rc2-hardening-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete RC2 maximum packet size hardening'
          git push origin HEAD:fix/rc2-hardening
