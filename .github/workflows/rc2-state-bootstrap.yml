name: RC2 state bootstrap

on:
  push:
    branches: [fix/rc2-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rc2-hardening
      - name: Apply exact state cleanup edits
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mqttium/api/async_client.py')
          text = path.read_text()

          def replace_one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              text = text.replace(old, new)

          replace_one(
              "                await self._force_close()\n                return\n            try:\n",
              "                await self._force_close_after_local_packet_failure()\n"
              "                return\n            try:\n",
          )
          replace_one(
              "            self._disconnect_exc = exc\n"
              "            self._intentional_disconnect = True\n"
              "            await self._force_close()\n"
              "            raise\n"
              "        await self._drain_effects()\n",
              "            self._disconnect_exc = exc\n"
              "            self._intentional_disconnect = True\n"
              "            await self._force_close_after_local_packet_failure()\n"
              "            raise\n"
              "        await self._drain_effects()\n",
          )
          replace_one(
              "                        self._disconnect_exc = exc\n"
              "                        self._intentional_disconnect = True\n"
              "                        await self._force_close()\n"
              "                        return\n"
              "                    # A lost PINGREQ beats a wedged keepalive under backpressure.\n",
              "                        self._disconnect_exc = exc\n"
              "                        self._intentional_disconnect = True\n"
              "                        await self._force_close_after_local_packet_failure()\n"
              "                        return\n"
              "                    # A lost PINGREQ beats a wedged keepalive under backpressure.\n",
          )
          replace_one(
              "    async def _force_close(self, *, preserve_reconnect: bool = False) -> None:\n",
              "    async def _force_close_after_local_packet_failure(self) -> None:\n"
              "        \"\"\"Close transport and finalize engine state for local packet-size failures.\"\"\"\n"
              "        await self._force_close()\n"
              "        async with self._engine_lock:\n"
              "            if self._engine.state not in (\n"
              "                ConnectionState.NEW,\n"
              "                ConnectionState.DISCONNECTED,\n"
              "            ):\n"
              "                self._engine.notify_transport_closed()\n"
              "                self._engine.take_effects()\n"
              "\n"
              "    async def _force_close(self, *, preserve_reconnect: bool = False) -> None:\n",
          )

          path.write_text(text)
          PY
          python -m compileall -q src/mqttium
          git diff --check
      - name: Remove bootstrap and push result
        run: |
          set -euo pipefail
          git add src/mqttium/api/async_client.py
          git rm .github/workflows/rc2-state-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize local packet-size failure cleanup'
          git push origin HEAD:fix/rc2-hardening
