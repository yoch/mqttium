name: TEMP Apply 16-frame latency cap

on:
  push:
    branches: [fix/qos-bounded-microbatch]
    paths: [.github/workflows/apply-cap16.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/qos-bounded-microbatch
          fetch-depth: 0
      - name: Apply cap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mqttium/api/_writer.py')
          s = p.read_text()
          old = '_LATENCY_BATCH_MAX_ITEMS = 32'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '_LATENCY_BATCH_MAX_ITEMS = 16'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/_writer.py
          git commit -m "fix(writer): cap latency microbatches at 16 frames"
          git push origin HEAD:fix/qos-bounded-microbatch
