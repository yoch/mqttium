name: Apply inbound refactor

on:
  push:
    branches:
      - refactor/outbound-session
    paths:
      - .github/inbound-refactor.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/outbound-session
      - name: Apply validated patch
        run: |
          set -euo pipefail
          base64 --decode .github/inbound-refactor.patch.gz.b64 | gzip --decompress > /tmp/inbound-refactor.patch
          git apply --check /tmp/inbound-refactor.patch
          git apply /tmp/inbound-refactor.patch
          rm .github/inbound-refactor.patch.gz.b64
          rm .github/workflows/apply-inbound-refactor.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Give inbound protocol state a single owner"
          git push origin HEAD:refactor/outbound-session
