name: TEMP PR283 resident budget evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temp-pr283-resident-budget-arm64
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
      CANDIDATE_SHA: ec8b9e8063350d265a3c36431a6dfaeb72363387
    steps:
      - name: Check out temporary harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ec8b9e8063350d265a3c36431a6dfaeb72363387
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@v7
        with:
          ref: e80618154bacefed5626d9eb9ba46edf560b54e7
          path: base
          persist-credentials: false

      - name: Verify immutable refs and dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected system Python 3.13, got {sys.version}")
          PY
          command -v mosquitto
          command -v mosquitto_sub
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate benchmark evidence." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-pr283-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install benchmark dependencies
        run: python -m pip install -e "candidate[dev]" "psutil>=6,<8"

      - name: Enforce benchmark-runner eligibility
        run: |
          mkdir -p "$RUNNER_TEMP/mqttium-pr283"
          python harness/benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/mqttium-pr283/runner-preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-pr283"
          cat > "$root/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Strict writer-capacity A/A control
        run: |
          python harness/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base \
            --policy strict \
            --preflight-report "$RUNNER_TEMP/mqttium-pr283/runner-preflight.json" \
            --protocol 311 --qos-values 0,1 \
            --payload-bytes 256 --inflight 20 --outstanding 64 \
            --max-queued 200 --warmup-count 5000 \
            --repeat 8 --count-qos0 100000 --count-qos1 40000 \
            --cpu 1 --max-baseline-cv 0.05 --max-aa-ratio-deviation 0.02 \
            --output "$RUNNER_TEMP/mqttium-pr283/writer-aa.json"

      - name: Strict writer-capacity A/B gate
        run: |
          python harness/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --policy strict \
            --preflight-report "$RUNNER_TEMP/mqttium-pr283/runner-preflight.json" \
            --protocol 311 --qos-values 0,1 \
            --payload-bytes 256 --inflight 20 --outstanding 64 \
            --max-queued 200 --warmup-count 5000 \
            --repeat 8 --count-qos0 100000 --count-qos1 40000 \
            --cpu 1 --max-baseline-cv 0.05 --min-completed-ratio 0.97 \
            --output "$RUNNER_TEMP/mqttium-pr283/writer-ab.json"

      - name: Strict open-loop non-regression guard
        run: |
          python harness/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root candidate \
            --policy strict \
            --preflight-report "$RUNNER_TEMP/mqttium-pr283/runner-preflight.json" \
            --protocols 311 --payloads 64 --completions callback --windows 20 \
            --target-rates 2500,7500 --count-small 5000 \
            --repeat 8 --cpu 1 \
            --max-baseline-cv 0.05 --min-completed-ratio 0.97 --max-loop-lag-ratio 1.05 \
            --output "$RUNNER_TEMP/mqttium-pr283/open-loop-ab.json"

      - name: Strict network non-regression guard
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base --candidate-root candidate \
            --policy strict \
            --preflight-report "$RUNNER_TEMP/mqttium-pr283/runner-preflight.json" \
            --repeat 8 --windows 20,64 --protocols 311 --completions receipt \
            --payloads 64,4096 --count-small 1500 --count-large 750 \
            --cpu 1 --max-baseline-cv 0.05 --min-ack-ratio 0.97 \
            --output "$RUNNER_TEMP/mqttium-pr283/network-ab.json"

      - name: Logical resident-bound probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mqttium-pr283/resident_probe.py" <<'PY'
          import asyncio
          import json
          from mqttium.api._writer import WritePump

          class HeldTransport:
              def __init__(self):
                  self.entered = asyncio.Event()
                  self.hold = asyncio.Event()
              async def write(self, data):
                  self.entered.set()
                  await self.hold.wait()
              async def write_many(self, parts):
                  self.entered.set()
                  await self.hold.wait()
              async def read(self, n=65536):
                  return b""
              async def close(self):
                  return None
              def is_closing(self):
                  return False

          async def no_failure(exc):
              raise exc

          async def main():
              limit = 1024
              pump = WritePump(max_bytes=8 << 20, max_messages=limit, on_failure=no_failure)
              for _ in range(limit):
                  assert pump.try_enqueue(b"x")
              transport = HeldTransport()
              pump.start(transport)
              await asyncio.wait_for(transport.entered.wait(), 5.0)
              active_batch = pump.batched_items
              accepted_extra = 0
              while pump.try_enqueue(b"y"):
                  accepted_extra += 1
                  if accepted_extra > 2048:
                      raise AssertionError("unbounded admission")
              result = {
                  "configured_max_messages": limit,
                  "active_batch_items": active_batch,
                  "queue_messages_after_probe": pump.queued_messages,
                  "accepted_extra_while_batch_in_flight": accepted_extra,
                  "logical_writer_owned_messages": active_batch + pump.queued_messages,
                  "resident_messages_property": getattr(pump, "resident_messages", None),
              }
              print(json.dumps(result))
              transport.hold.set()
              await pump.stop()

          asyncio.run(main())
          PY
          PYTHONPATH=base/src python "$RUNNER_TEMP/mqttium-pr283/resident_probe.py" \
            > "$RUNNER_TEMP/mqttium-pr283/resident-base.json"
          PYTHONPATH=candidate/src python "$RUNNER_TEMP/mqttium-pr283/resident_probe.py" \
            > "$RUNNER_TEMP/mqttium-pr283/resident-candidate.json"
          cat "$RUNNER_TEMP/mqttium-pr283/resident-base.json"
          cat "$RUNNER_TEMP/mqttium-pr283/resident-candidate.json"

      - name: Isolated memory profile baseline
        run: |
          PYTHONPATH=base/src python harness/benchmarks/memory_profile.py \
            --label "$BASE_SHA" \
            --output "$RUNNER_TEMP/mqttium-pr283/memory-base.json"

      - name: Isolated memory profile candidate
        run: |
          PYTHONPATH=candidate/src python harness/benchmarks/memory_profile.py \
            --label "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/mqttium-pr283/memory-candidate.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temp-pr283-resident-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-pr283/*.json
            ${{ runner.temp }}/mqttium-pr283/*.md
            ${{ runner.temp }}/mqttium-pr283/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-pr283/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
