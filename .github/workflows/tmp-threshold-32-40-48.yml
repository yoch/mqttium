name: TEMP Adaptive 4 8 14 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-threshold-32-40-48.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e80618154bacefed5626d9eb9ba46edf560b54e7
          path: current
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v1.0.0rc7
          path: rc7
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v1.0.0rc6
          path: rc6
          persist-credentials: false

      - name: Prepare adaptive candidate and broker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          cp -a current candidate
          python3 - <<'PY'
          from pathlib import Path

          writer = Path('candidate/src/mqttium/api/_writer.py')
          s = writer.read_text()
          s = s.replace('_LATENCY_BATCH_TARGET_BYTES = 48 * 1024', '_LATENCY_BATCH_TARGET_BYTES = 56 * 1024')
          old = '    def _try_flush_latency_batch(self) -> bool:\n'
          new = '    def _try_flush_latency_batch(self, *, max_items: int | None = None) -> bool:\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''        queued = self.queue.qsize()\n        if (\n            queued < _LATENCY_BATCH_MIN_ITEMS\n            or queued > _LATENCY_BATCH_MAX_ITEMS\n            or (\n                queued < _LATENCY_BATCH_MAX_ITEMS\n                and self.queued_bytes < _LATENCY_BATCH_TARGET_BYTES\n            )\n        ):\n'''
          new = '''        queued = self.queue.qsize()\n        batch_max = _LATENCY_BATCH_MAX_ITEMS if max_items is None else max_items\n        if (\n            queued < _LATENCY_BATCH_MIN_ITEMS\n            or queued > batch_max\n            or (\n                queued < batch_max\n                and self.queued_bytes < _LATENCY_BATCH_TARGET_BYTES\n            )\n        ):\n'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          writer.write_text(s)

          client = Path('candidate/src/mqttium/api/async_client.py')
          s = client.read_text()
          old = '                    self._write_pump._try_flush_latency_batch()\n'
          new = '''                    flow_limit = self._engine.flow.limit\n                    if flow_limit <= 32:\n                        latency_batch_max = 4\n                    elif flow_limit <= 96:\n                        latency_batch_max = 8\n                    else:\n                        latency_batch_max = 14\n                    self._write_pump._try_flush_latency_batch(\n                        max_items=latency_batch_max\n                    )\n'''
          assert s.count(old) == 1
          client.write_text(s.replace(old, new))
          PY

          out="$RUNNER_TEMP/adaptive"
          mkdir -p "$out"
          printf '%s\n' '{"eligible": true, "failures": []}' > "$out/preflight.json"
          cat > "$out/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11890 127.0.0.1
          EOF
          mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "$!" > "$out/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11890) >/dev/null 2>&1 && exit 0
            sleep 0.05
          done
          exit 1

      - name: Compare adaptive candidate to rc7 and rc6
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/adaptive"
          for base in rc7 rc6; do
            python3 current/benchmarks/paired_network.py \
              --base-root "$base" --candidate-root candidate \
              --host 127.0.0.1 --port 11890 \
              --policy advisory --preflight-report "$out/preflight.json" \
              --max-baseline-cv 1.0 --min-ack-ratio 0.0 \
              --repeat 8 \
              --windows 20,64,128 --protocols 311 --payloads 64,4096 \
              --count-small 2400 --count-large 2400 \
              --target-sample-seconds 0.8 --max-count 30000 \
              --output "$out/${base}.json" --summary-output "$out/${base}.md"
          done
          python3 - "$out" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          for base in ('rc7','rc6'):
              p = json.load(open(out / f'{base}.json'))
              print(f'## Adaptive 4/8/14 vs {base}')
              print('| payload | window | throughput | p50 base | p50 cand | p95 base | p95 cand | base CV | cand CV |')
              print('|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
              for s in p['scenarios']:
                  print(f"| {s['payload_bytes']} | {s['window']} | {s['median_candidate_over_base_ack']:.4f} | {s['base_median_p50_ms']:.3f} | {s['candidate_median_p50_ms']:.3f} | {s['base_median_p95_ms']:.3f} | {s['candidate_median_p95_ms']:.3f} | {s['base_ack_cv']:.2%} | {s['candidate_ack_cv']:.2%} |")
              print()
          PY

      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-adaptive-4-8-14-${{ github.run_id }}
          path: ${{ runner.temp }}/adaptive/*
          retention-days: 3
      - name: Stop broker
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/adaptive/mosquitto.pid"
          [ ! -f "$f" ] || kill "$(cat "$f")" 2>/dev/null || true
