name: Prepare reviewed PR448 hardening
on:
  push:
    branches: [fix/pr448-ingress-hardening]
permissions:
  contents: read
concurrency:
  group: prepare-pr448-hardening
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/fix/pr448-ingress-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply the independently checked patch to its exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = b7b1e77cb747d8de4c7b8d2725e3f09abf95e101
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          raw = Path('.github/pr448-hardening.changes').read_bytes()
          patch = raw.replace(b'\n diff --git ', b'\ndiff --git ')
          expected = 'f4d61d503213a884b8eb73efedb3f5f9dd4d68618fdd6875a1dc1e4e7ba0a727'
          assert hashlib.sha256(patch).hexdigest() == expected, 'patch digest mismatch'
          Path(os.environ['RUNNER_TEMP'], 'reviewed-hardening.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/reviewed-hardening.patch"
          git apply "$RUNNER_TEMP/reviewed-hardening.patch"
          git rm .github/pr448-hardening.changes .github/workflows/apply-pr448-hardening.yml
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,fuzz,security,docs]'
      - name: Format changed files and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          ruff format src/mqttium/codec/buffer.py src/mqttium/api/async_client.py tests/unit/test_decoder_slab.py tests/unit/test_decoder_ingress_hardening.py tests/unit/test_transport_receive_validation.py tests/unit/test_recv_arch_probe_failures.py tests/resilience/test_decoder_header_budget.py tools/recv_arch_rtt_probe.py
          ruff check src tests benchmarks tools
          mypy src/mqttium
          bandit -q -ll -r src
          mkdocs build --strict
          python -m pytest -q -W error --strict-config --strict-markers tests/unit tests/project tests/resilience
          PYTHONPATH=src python tests/fuzz/fuzz.py --seed 1 --iterations 20000
          python -m pytest -q tests/fuzz/test_hypothesis_fuzz.py tests/fuzz/test_stateful_invariants.py
      - name: Record final source and publish only to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add CHANGELOG.md docs/migration.md docs/reports/README.md src/mqttium/codec/buffer.py src/mqttium/api/async_client.py tests/unit/test_decoder_slab.py tests/unit/test_decoder_ingress_hardening.py tests/unit/test_transport_receive_validation.py tests/unit/test_recv_arch_probe_failures.py tests/resilience/test_decoder_header_budget.py tools/recv_arch_rtt_probe.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bound ingress allocations and validate receive contracts' -m 'Use memoryview destinations to remove hidden live-sized temporaries; normalize buffer views; grow progressively up to known frame extents on both push and pull paths; reject invalid custom transports before CONNECT; terminate the diagnostic on EOF or timeout. Include regression tests and current contract documentation. Remove the one-shot publication scaffold.'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/fix/pr448-ingress-hardening | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/pr448-ingress-hardening
          git rev-parse HEAD
      - name: Retain validation source snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, tarfile
          from pathlib import Path
          paths = ['CHANGELOG.md', 'docs/migration.md', 'docs/reports/README.md', 'src/mqttium/codec/buffer.py', 'src/mqttium/api/async_client.py', 'tests/unit/test_decoder_slab.py', 'tests/unit/test_decoder_ingress_hardening.py', 'tests/unit/test_transport_receive_validation.py', 'tests/unit/test_recv_arch_probe_failures.py', 'tests/resilience/test_decoder_header_budget.py', 'tools/recv_arch_rtt_probe.py']
          out = Path(os.environ['RUNNER_TEMP'], 'hardening-source')
          out.mkdir(exist_ok=True)
          files = {}
          with tarfile.open(out / 'source.tar.gz', 'w:gz') as archive:
              for p in paths:
                  if Path(p).exists():
                      archive.add(p, arcname=p)
                      files[p] = hashlib.sha256(Path(p).read_bytes()).hexdigest()
          result = {'bootstrap_sha': os.environ['GITHUB_SHA'], 'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'files': files}
          (out / 'manifest.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr448-hardening-source
          path: ${{ runner.temp }}/hardening-source
          retention-days: 7
          if-no-files-found: error
