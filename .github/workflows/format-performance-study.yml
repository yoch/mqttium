name: Format performance study harnesses

on:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - .github/workflows/format-performance-study.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/native-hotpath-architecture-study
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.1
      - name: Format experimental harnesses
        run: |
          ruff format \
            benchmarks/experimental/message_representation_costs.py \
            benchmarks/experimental/native_ingress_delivery_matrix.py \
            benchmarks/experimental/remaining_object_costs.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/experimental
          git commit -m "Format performance study harnesses"
          git push origin HEAD:agent/native-hotpath-architecture-study
