name: Apply PR447 residual hardening

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/apply-pr447-residual-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/direct-decoder-ingress-prototype
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply runtime, tests, and release docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/mqttium/codec/buffer.py')
          s = p.read_text()
          s = s.replace(
              '        "_small_drain_streak",\n        "_storage_generation",\n',
              '        "_small_drain_streak",\n        "_small_pressure_peak",\n        "_drain_peak",\n        "_drain_has_large_frame",\n        "_offered_bytes",\n        "_storage_generation",\n',
          )
          s = s.replace(
              '        self._small_drain_streak = 0\n        self._storage_generation = 0\n',
              '        self._small_drain_streak = 0\n        self._small_pressure_peak = 0\n        self._drain_peak = 0\n        self._drain_has_large_frame = False\n        self._offered_bytes = 0\n        self._storage_generation = 0\n',
          )
          s = s.replace(
              '        self._buf = replacement\n        self._start = 0\n',
              '        self._buf = replacement\n        self._offered_bytes = 0\n        self._start = 0\n',
          )
          old = '''        else:\n            offered = preferred\n            self._ensure(offered)\n        return memoryview(self._buf)[self._end : self._end + offered]\n\n    def commit(self, nbytes: int) -> None:\n        if nbytes <= 0:\n            if nbytes < 0:\n                raise ValueError("negative decoder commit")\n            return\n        end = self._end + nbytes\n        if end > len(self._buf):\n            raise ValueError("decoder commit exceeds writable window")\n        self._end = end\n        buffered = end - self._start\n        if buffered > self._high_water:\n            self._high_water = buffered\n\n    def _retire_after_drain(self, extent: int) -> None:\n        capacity = len(self._buf)\n        if capacity <= _STEADY_CAPACITY:\n            self._small_drain_streak = 0\n            return\n        if extent > _STEADY_CAPACITY:\n            # A stream of genuinely large frames benefits from retaining the\n            # slab; do not shrink and regrow on every packet.\n            self._small_drain_streak = 0\n            return\n        self._small_drain_streak += 1\n        if self._small_drain_streak >= _OVERSIZE_RETENTION_DRAINS:\n            self._small_drain_streak = 0\n            self._reallocate(_STEADY_CAPACITY)\n\n    def _fully_consumed(self, extent: int) -> None:\n        self._start = 0\n        self._end = 0\n        self._retire_after_drain(extent)\n'''
          new = '''        else:\n            offered = preferred\n            self._ensure(offered)\n        self._offered_bytes = offered\n        return memoryview(self._buf)[self._end : self._end + offered]\n\n    def commit(self, nbytes: int) -> None:\n        if nbytes < 0:\n            raise ValueError("negative decoder commit")\n        offered = self._offered_bytes\n        if nbytes > offered:\n            raise ValueError("decoder commit exceeds last writable window")\n        # One get_buffer()/buffer_updated() pair owns one offer.  Invalidating\n        # it here makes accidental double commits fail even when retained slab\n        # capacity would otherwise hide the bug.\n        self._offered_bytes = 0\n        if nbytes == 0:\n            return\n        end = self._end + nbytes\n        self._end = end\n        buffered = end - self._start\n        if buffered > self._high_water:\n            self._high_water = buffered\n        if buffered > self._drain_peak:\n            self._drain_peak = buffered\n\n    def _note_consumed_frame(self, frame_size: int) -> None:\n        if frame_size > _STEADY_CAPACITY:\n            self._drain_has_large_frame = True\n\n    def _retire_after_drain(self) -> None:\n        capacity = len(self._buf)\n        pressure = self._drain_peak\n        had_large_frame = self._drain_has_large_frame\n        self._drain_peak = 0\n        self._drain_has_large_frame = False\n        if capacity <= _STEADY_CAPACITY:\n            self._small_drain_streak = 0\n            self._small_pressure_peak = 0\n            return\n        if had_large_frame:\n            # Repeated genuinely-large frames benefit from retaining the slab.\n            self._small_drain_streak = 0\n            self._small_pressure_peak = 0\n            return\n        # Small frames can legitimately arrive coalesced above 256 KiB.  Count\n        # them as evidence that multi-MiB frame capacity is no longer needed,\n        # while retaining enough space for the recent aggregate buffering peak.\n        self._small_drain_streak += 1\n        if pressure > self._small_pressure_peak:\n            self._small_pressure_peak = pressure\n        if self._small_drain_streak >= _OVERSIZE_RETENTION_DRAINS:\n            quantum = _RECONNECT_CAPACITY\n            recent = self._small_pressure_peak\n            target = max(_STEADY_CAPACITY, ((recent + quantum - 1) // quantum) * quantum)\n            self._small_drain_streak = 0\n            self._small_pressure_peak = 0\n            if target < capacity:\n                self._reallocate(target)\n\n    def _fully_consumed(self) -> None:\n        self._start = 0\n        self._end = 0\n        self._retire_after_drain()\n'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace(
              '        self._ensure(size)\n        end = self._end\n',
              '        self._offered_bytes = 0\n        self._ensure(size)\n        end = self._end\n',
          )
          s = s.replace(
              '        if buffered > self._high_water:\n            self._high_water = buffered\n\n    def clear(self) -> None:',
              '        if buffered > self._high_water:\n            self._high_water = buffered\n        if buffered > self._drain_peak:\n            self._drain_peak = buffered\n\n    def clear(self) -> None:',
              1,
          )
          s = s.replace(
              '        self._small_drain_streak = 0\n        capacity = len(self._buf)\n',
              '        self._small_drain_streak = 0\n        self._small_pressure_peak = 0\n        self._drain_peak = 0\n        self._drain_has_large_frame = False\n        self._offered_bytes = 0\n        capacity = len(self._buf)\n',
              1,
          )
          s = s.replace(
              '        self._start = body_end\n        if body_end == self._end:\n            self._fully_consumed(body_end)\n\n    def next_packet',
              '        frame_size = body_end - self._start\n        self._note_consumed_frame(frame_size)\n        self._start = body_end\n        if body_end == self._end:\n            self._fully_consumed()\n\n    def next_packet',
          )
          s = s.replace(
              '        self._start = body_end\n        if body_end == self._end:\n            self._fully_consumed(body_end)\n        return RawPacket(',
              '        frame_size = body_end - self._start\n        self._note_consumed_frame(frame_size)\n        self._start = body_end\n        if body_end == self._end:\n            self._fully_consumed()\n        return RawPacket(',
          )
          p.write_text(s)

          t = Path('tests/unit/test_decoder_ingress_storage.py')
          s = t.read_text()
          if 'import pytest' not in s:
              s = s.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport pytest\n\n')
          s += '''\n\ndef test_coalesced_small_frames_retire_multi_mib_slab_without_thrashing() -> None:\n    decoder = IncrementalDecoder(max_packet_size=8 * 1024 * 1024)\n    large = _publish(4 * 1024 * 1024)\n    _receive(decoder, large)\n    assert decoder.next_packet() is not None\n    grown = decoder.capacity\n    assert grown >= len(large)\n\n    small = _publish(64 * 1024)\n    batch = small * 5\n    assert len(batch) > 256 * 1024\n    growths = decoder.growth_count\n    shrinks = decoder.shrink_count\n    for _ in range(32):\n        _receive(decoder, batch)\n        for _ in range(5):\n            assert decoder.next_packet() is not None\n        assert decoder.next_packet() is None\n\n    expected = ((len(batch) + 64 * 1024 - 1) // (64 * 1024)) * (64 * 1024)\n    assert decoder.capacity == expected\n    assert decoder.capacity < grown\n    assert decoder.growth_count == growths\n    assert decoder.shrink_count == shrinks + 1\n\n    stable_growths = decoder.growth_count\n    stable_shrinks = decoder.shrink_count\n    for _ in range(64):\n        _receive(decoder, batch)\n        for _ in range(5):\n            assert decoder.next_packet() is not None\n    assert decoder.capacity == expected\n    assert decoder.growth_count == stable_growths\n    assert decoder.shrink_count == stable_shrinks\n\n\ndef test_commit_is_bounded_by_last_offered_window_not_retained_capacity() -> None:\n    decoder = IncrementalDecoder(max_packet_size=4 * 1024 * 1024)\n    large = _publish(1024 * 1024)\n    _receive(decoder, large)\n    assert decoder.next_packet() is not None\n    assert decoder.capacity > 64 * 1024\n\n    offered = decoder.writable_window(64 * 1024)\n    offered.release()\n    with pytest.raises(ValueError, match="last writable window"):\n        decoder.commit(64 * 1024 + 1)\n    assert decoder.buffered == 0\n\n    offered = decoder.writable_window(64 * 1024)\n    offered.release()\n    decoder.commit(64 * 1024)\n    assert decoder.buffered == 64 * 1024\n    with pytest.raises(ValueError, match="last writable window"):\n        decoder.commit(1)\n'''
          t.write_text(s)

          c = Path('CHANGELOG.md')
          s = c.read_text()
          old = '- Use a reusable 80 KiB `asyncio.BufferedProtocol` receive buffer for cleartext TCP on asyncio selector event loops. This removes the allocation-heavy `socket.recv()` path behind an ASLR-dependent allocator/page-fault latency regime observed on Linux/ARM64, while keeping asyncio streams responsible for read backpressure, buffered input at EOF, drains, and close semantics. TLS, Proactor, and non-selector event loops retain the existing stream connection path.'
          new = '- On CPython with the stdlib `SelectorEventLoop`, cleartext TCP now receives with `asyncio.BufferedProtocol.recv_into()` directly into decoder-owned reusable storage. The decoder uses lazy/adaptive receive capacity, exact reservation for known large frames, and bounded retirement after oversized traffic; this removes the allocation-heavy selector `socket.recv()` path and the intermediate `StreamReader -> bytes -> decoder.feed()` receive copy. TLS, Proactor, third-party/non-stdlib loops, Unix sockets, and WebSockets retain their established stream paths; selector fallbacks outside the direct-ingress scope keep the reusable 80 KiB StreamReader buffer.'
          assert old in s
          c.write_text(s.replace(old, new))

          p = Path('docs/api-stability.md')
          s = p.read_text()
          marker = 'change still requires a changelog entry and migration guidance. The persistence\ncontract is one complete `InflightStore` interface:'
          repl = '''change still requires a changelog entry and migration guidance. For concrete\ntransports, the Provisional contract is behavioral rather than exact-class based:\n`TcpTransport.connect()` is a factory for a supported `AsyncTransport` receive\nimplementation, and may return a different concrete transport when an optimized\nreceive capability is selected. Preserving subclasses of `TcpTransport` across\nthat factory boundary is not a supported extension seam; integrations that need\ncustom connection construction should provide an `AsyncClient` transport factory.\nThe persistence\ncontract is one complete `InflightStore` interface:'''
          assert marker in s
          p.write_text(s.replace(marker, repl))

          p = Path('docs/migration.md')
          s = p.read_text()
          note = '''\n## Provisional TCP transport factory behavior\n\n`mqttium.transport.TcpTransport` remains a supported Provisional transport, but\n`TcpTransport.connect()` should be treated as a factory for an `AsyncTransport`,\nnot as a promise that the returned object is exactly `TcpTransport` or a caller's\nsubclass. On CPython stdlib selector loops, cleartext TCP may return the\ndecoder-ingress transport selected by the runtime. TLS and other fallbacks can\nstill instantiate `cls(reader, writer)`, but subclass preservation is not a\nportable extension contract. Code that customized connection construction by\nsubclassing `TcpTransport` should move that customization to the injectable\n`AsyncClient` transport-factory seam.\n'''
          if '## Provisional TCP transport factory behavior' not in s:
              s += note
          p.write_text(s)

          p = Path('docs/network-release-gate.md')
          s = p.read_text()
          note = '''\n## Saturated consumer-ceiling qualification\n\nFor a saturated receive comparison, qualification is based on the physical\nbottleneck, not fidelity to a nominal publisher rate. Every arm/cell uses the\nsame rule: measured publisher supply divided by measured consumer throughput\n(`publisher_margin`) must be at least 1.02, SUT CPU must be at least 90%, broker\nCPU must remain below 90%, and neither SUT nor broker may incur major faults.\n\nAn absolute `publisher msgs/s >= 97% of requested rate` check is intentionally\nnot part of this gate. It is useful for fixed-offer experiments, but redundant\nfor a consumer-ceiling experiment once actual publisher margin is measured, and\nit can reject a slower consumer arm merely because the publisher is backpressured\nto a different realized rate. The rule above is applied symmetrically before\ninterpreting candidate/base ratios; no per-cell exception is permitted.\n'''
          if '## Saturated consumer-ceiling qualification' not in s:
              s += note
          p.write_text(s)
          PY
          python -m pip install -e '.[dev]' >/dev/null
          ruff format src/mqttium/codec/buffer.py tests/unit/test_decoder_ingress_storage.py
          ruff check src/mqttium/codec/buffer.py tests/unit/test_decoder_ingress_storage.py
          mypy src/mqttium
          python -m pytest -q tests/unit/test_decoder_ingress_storage.py tests/unit/test_decoder_push_transport.py tests/unit/test_buffered_stream_reader_protocol.py
      - name: Commit tested hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mqttium implementation agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mqttium/codec/buffer.py tests/unit/test_decoder_ingress_storage.py CHANGELOG.md docs/api-stability.md docs/migration.md docs/network-release-gate.md
          git commit -m 'fix: harden ingress retention and contracts'
          git push origin HEAD:perf/direct-decoder-ingress-prototype
