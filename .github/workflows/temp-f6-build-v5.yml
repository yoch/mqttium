name: Temporary Finding 6 candidate builder v5

on:
  push:
    branches: [agent/f6-direct-decode-eval]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/f6-direct-decode-eval
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and validate candidate
        shell: bash
        run: |
          sed -i 's/from mqttium.packets._publish import decode_publish_fields_v5, decode_qos0_message_v5/from mqttium.packets._publish import decode_qos0_message_v5/' tools/temp_f6_builder.py
          python tools/temp_f6_builder.py
          python tools/temp_f6_test_fix.py
          rm -f .github/workflows/temp-f6-scope-benchmark.yml
          rm -f .github/workflows/temp-f6-build.yml
          rm -f .github/workflows/temp-f6-build-v2.yml
          rm -f .github/workflows/temp-f6-build-v3.yml
          rm -f .github/workflows/temp-f6-build-v4.yml
          rm -f .github/workflows/temp-f6-build-v5.yml
          rm -f tools/temp_f6_builder.py tools/temp_f6_test_fix.py
          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/packets/_publish.py src/mqttium/protocol/inbound.py tests/unit/test_qos0_v5_decode_fastpath.py
          ruff check src/mqttium tests/unit/test_qos0_v5_decode_fastpath.py
          mypy src/mqttium
          python -m pytest -q \
            tests/unit/test_qos0_v5_decode_fastpath.py \
            tests/unit/test_small_delivery_properties.py \
            tests/unit/test_inbound_alias_validation.py \
            tests/unit/test_conformance_statements.py \
            tests/unit/test_qos2_matrix.py \
            tests/unit/test_manual_ack.py \
            tests/unit/test_autoack_receive_maximum_handoff.py
          python -m pytest -q tests/unit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Specialize inbound MQTT 5 QoS 0 decode"
          git push origin HEAD:agent/f6-direct-decode-eval
