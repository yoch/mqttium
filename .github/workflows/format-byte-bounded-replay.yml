name: Format byte-bounded replay patch

on:
  push:
    branches: [agent/byte-bounded-inbound-replay]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/byte-bounded-inbound-replay
          fetch-depth: 0
      - name: Align test and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_inbound_replay_streaming.py")
          text = path.read_text()
          old = '''    engine.continue_inbound_replay()
              engine.take_effects()
              assert CountingStore.pages_fetched == 1  # still inside the first page
          '''
          new = '''    engine.continue_inbound_replay()
              engine.take_effects()
              assert CountingStore.pages_fetched == 2
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one replay assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          python -m pip install -q ruff==0.16.1
          ruff format \
            src/mqttium/persistence/memory.py \
            src/mqttium/persistence/sqlite.py \
            src/mqttium/protocol/inbound.py \
            tests/unit/test_inbound_replay_streaming.py \
            tests/unit/test_byte_bounded_inbound_replay.py
          rm .github/workflows/format-byte-bounded-replay.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align bounded replay tests and formatting"
          git push origin HEAD:agent/byte-bounded-inbound-replay
