name: Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact 40-character baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paired-regression
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Validate immutable input commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "base_ref must be an exact commit SHA" >&2; exit 2; }
          [[ "$CANDIDATE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "candidate_ref must be an exact commit SHA" >&2; exit 2; }
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install benchmark support
        run: python -m pip install "psutil>=6"
      - name: Install broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          mkdir -p /tmp/mqttium-paired
          cat > /tmp/mqttium-paired/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/mqttium-paired/mosquitto.conf \
            > /tmp/mqttium-paired/mosquitto.log 2>&1 &
          python harness/tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:11883
      - name: Paired microbenchmarks
        env:
          PYTHONPATH: harness/src
        run: |
          python harness/benchmarks/paired_regression.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 11 \
            --output /tmp/mqttium-paired/micro.json
      - name: Record hosted-runner eligibility
        run: |
          python harness/benchmarks/runner_probe.py \
            --output /tmp/mqttium-paired/runner.json
      - name: Advisory paired network and latency sweep
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base \
            --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --repeat 8 \
            --windows 1,8,32,64,128 \
            --protocols 311,5 \
            --payloads 64,4096 \
            --count-small 20000 \
            --count-large 8000 \
            --output /tmp/mqttium-paired/network.json
      - name: Advisory native QoS 1 receipt/callback diagnostic
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --repeat 4 --windows 64 --protocols 311 \
            --payloads 64 --completions receipt,callback \
            --count-small 5000 \
            --output /tmp/mqttium-paired/qos1-completion.json
      - name: Advisory closed-loop native writer capacity
        run: |
          python harness/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --protocol 311 --qos-values 0,1 \
            --payload-bytes 256 --inflight 20 --outstanding 64 \
            --max-queued 200 --warmup-count 2000 \
            --repeat 4 --count-qos0 50000 --count-qos1 20000 \
            --output /tmp/mqttium-paired/writer-capacity.json
      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paired-regression-${{ github.run_id }}
          path: |
            /tmp/mqttium-paired/*.json
            /tmp/mqttium-paired/*.md
            /tmp/mqttium-paired/mosquitto.log
          if-no-files-found: warn
          retention-days: 30
