name: Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline commit, branch, or tag
        required: true
        default: v0.2.0b2
        type: string
      candidate_ref:
        description: Candidate commit, branch, or tag
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          mkdir -p /tmp/mqttium-paired
          cat > /tmp/mqttium-paired/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/mqttium-paired/mosquitto.conf \
            > /tmp/mqttium-paired/mosquitto.log 2>&1 &
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          cat /tmp/mqttium-paired/mosquitto.log
          exit 1
      - name: Paired microbenchmarks
        run: |
          python harness/benchmarks/paired_regression.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 11 \
            --output /tmp/mqttium-paired/micro.json
      - name: Record hosted-runner eligibility
        run: |
          python harness/benchmarks/runner_probe.py \
            --output /tmp/mqttium-paired/runner.json
      - name: Advisory paired network and latency sweep
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base \
            --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --repeat 8 \
            --windows 1,8,32,64,128 \
            --protocols 311,5 \
            --payloads 64,4096 \
            --count-small 20000 \
            --count-large 8000 \
            --output /tmp/mqttium-paired/network.json
      - name: Advisory native QoS 1 receipt/callback diagnostic
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --repeat 4 --windows 64 --protocols 311 \
            --payloads 64 --completions receipt,callback \
            --count-small 5000 \
            --output /tmp/mqttium-paired/qos1-completion.json
      - name: Advisory closed-loop native writer capacity
        run: |
          python harness/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --policy advisory \
            --preflight-report /tmp/mqttium-paired/runner.json \
            --protocol 311 --qos-values 0,1 \
            --payload-bytes 256 --inflight 20 --outstanding 64 \
            --max-queued 200 --warmup-count 2000 \
            --repeat 4 --count-qos0 50000 --count-qos1 20000 \
            --output /tmp/mqttium-paired/writer-capacity.json
      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-regression-${{ github.run_id }}
          path: |
            /tmp/mqttium-paired/*.json
            /tmp/mqttium-paired/*.md
            /tmp/mqttium-paired/mosquitto.log
          if-no-files-found: warn
          retention-days: 30
