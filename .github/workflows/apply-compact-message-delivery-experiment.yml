name: Apply compact message delivery experiment

on:
  push:
    branches:
      - agent/compact-message-delivery-experiment
    paths:
      - .github/scripts/apply_compact_message_delivery_experiment.py
      - .github/workflows/apply-compact-message-delivery-experiment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compact-message-delivery-experiment
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.1
      - name: Apply focused runtime experiment
        run: |
          python .github/scripts/apply_compact_message_delivery_experiment.py
          ruff format src/mqttium/types.py src/mqttium/api/async_client.py tests/unit/test_compact_delivery_reservation.py
          ruff check src/mqttium/types.py src/mqttium/api/async_client.py tests/unit/test_compact_delivery_reservation.py
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mqttium/types.py src/mqttium/api/async_client.py tests/unit/test_compact_delivery_reservation.py
          git commit -m "Experiment with external delivery reservations"
          git push origin HEAD:agent/compact-message-delivery-experiment
