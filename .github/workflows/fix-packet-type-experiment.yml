name: Fix packet lookup experiment

on:
  push:
    branches:
      - agent/packet-type-lookup-experiment
    paths:
      - .github/workflows/fix-packet-type-experiment.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/packet-type-lookup-experiment
      - name: Repair validation environment
        run: |
          sed -i 's/^          pytest -q tests\/unit$/          PYTHONPATH=. pytest -q tests\/unit/' .github/workflows/packet-type-lookup-experiment.yml
          rm .github/workflows/fix-packet-type-experiment.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Run packet lookup tests from repository root"
          git push origin HEAD:agent/packet-type-lookup-experiment
