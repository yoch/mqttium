name: mqttiumd frozen receptions

# Historical evidence of the bounded preview and pilot (qualified executable
# 51be4079f7ee42f46500e993315eddc971f0a8d4). These receptions assert the
# quotas, event stream and packaging of that executable. They are frozen by
# ADR 0044: they run on demand only and are not maintained as the runtime
# and its limits change. See mqttiumd/docs/reports/0026-frozen-receptions.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqttiumd-frozen-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: mqttiumd

jobs:
  qos0-product:
    name: product QoS 0 volatile and consumed
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: QoS 0 matrix, consumption, losses and precise controls
        run: tools/run_qos0_reception.sh "$RUNNER_TEMP/qos0-product"
      - name: Keep each QoS 0 run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-qos0-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qos0-product
            ${{ runner.temp }}/qos0-product.tar.gz
            ${{ runner.temp }}/qos0-product.tar.gz.sha256
          if-no-files-found: error

  receipts-product:
    name: product live receipt collection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: Live receipt cycles, pressure, replay, crash and exact mutations
        run: tools/run_receipt_reception.sh "$RUNNER_TEMP/receipt-product"
      - name: Keep each receipt run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-receipt-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/receipt-product
            ${{ runner.temp }}/receipt-product.tar.gz
            ${{ runner.temp }}/receipt-product.tar.gz.sha256
          if-no-files-found: error

  sessions-product:
    name: product explicit bounded session lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: Session matrix, 512 cycles, full capacity and guarded recovery
        run: tools/run_session_reception.sh "$RUNNER_TEMP/sessions-product"
      - name: Keep each session run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-sessions-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sessions-product
            ${{ runner.temp }}/sessions-product.tar.gz
            ${{ runner.temp }}/sessions-product.tar.gz.sha256
          if-no-files-found: error

  expiry-product:
    name: product finite session expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt -r tools/requirements.txt
      - name: Finite expiry, time boundaries, capacity, crashes and exact controls
        run: tools/run_expiry_reception.sh "$RUNNER_TEMP/expiry-product"
      - name: Keep each expiry run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-expiry-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/expiry-product
            ${{ runner.temp }}/expiry-product.tar.gz
            ${{ runner.temp }}/expiry-product.tar.gz.sha256
          if-no-files-found: error

  outgoing-pi-product:
    name: product outgoing QoS 1 identifier reuse
    runs-on: ubuntu-24.04
    # One finite normal-client run exceeds the entire 65535-number space;
    # short correlated-observation/crash cases and isolated mutants follow.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: Recycled identifiers, immutable observations and same-file recovery
        run: tools/run_pi_reception.sh "$RUNNER_TEMP/outgoing-pi-product"
      - name: Keep each outgoing identifier run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-outgoing-pi-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/outgoing-pi-product
            ${{ runner.temp }}/outgoing-pi-product.tar.gz
            ${{ runner.temp }}/outgoing-pi-product.tar.gz.sha256
          if-no-files-found: error

  pubsub-product:
    name: product durable exact pubsub
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: Exact pubsub, recovery and three precise negative controls
        run: tools/run_pubsub_reception.sh "$RUNNER_TEMP/pubsub-product"
      - name: Keep each pubsub run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-pubsub-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pubsub-product
            ${{ runner.temp }}/pubsub-product.tar.gz
            ${{ runner.temp }}/pubsub-product.tar.gz.sha256
          if-no-files-found: error

  tcp-product:
    name: product TCP QoS 1 and QoS 2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install the independent external MQTT client
        run: python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
      - name: Instrumented product remains lint-clean
        run: cargo clippy -p mqttiumd --all-targets --features test-hooks --locked -- -D warnings
      - name: Real product TCP reception and precise negative controls
        run: tools/run_tcp_reception.sh "$RUNNER_TEMP/tcp-product"
      - name: Durable QoS 1 with mqttium, Paho and precise negative controls
        run: tools/run_qos1_reception.sh "$RUNNER_TEMP/tcp-qos1"
      - name: Keep each product run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-tcp-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/tcp-product
            ${{ runner.temp }}/tcp-product.tar.gz
            ${{ runner.temp }}/tcp-product.tar.gz.sha256
          if-no-files-found: error
      - name: Keep each QoS 1 run's own evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-tcp-qos1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/tcp-qos1
            ${{ runner.temp }}/tcp-qos1.tar.gz
            ${{ runner.temp }}/tcp-qos1.tar.gz.sha256
          if-no-files-found: error

  wildcard-preview:
    name: hierarchical subscriptions and local preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install independent MQTT clients
        run: |
          python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto-clients
          mosquitto_pub --help | head -3
          mosquitto_sub --help | head -3
      - name: Interoperable hierarchical routing, mutations and extracted preview
        run: tools/run_wildcard_reception.sh "$RUNNER_TEMP/wildcard-preview"
      - name: Upload system evidence and standalone preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-hierarchical-preview
          path: |
            ${{ runner.temp }}/wildcard-preview
            ${{ runner.temp }}/wildcard-preview.tar.gz
            ${{ runner.temp }}/wildcard-preview.tar.gz.sha256
          if-no-files-found: error
      - name: Upload the normal runnable archive separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-local-preview-linux-x86_64
          path: |
            ${{ runner.temp }}/wildcard-preview/preview/*.tar.gz
            ${{ runner.temp }}/wildcard-preview/preview/*.tar.gz.sha256
          if-no-files-found: error

  retained-preview:
    name: durable retained messages and local preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install independent MQTT clients
        run: |
          python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto-clients
          mosquitto_pub --help | head -3
          mosquitto_sub --help | head -3
      - name: Retained public clients, transactional replay, crashes and extracted preview
        run: tools/run_retained_reception.sh "$RUNNER_TEMP/retained-preview"
      - name: Upload system evidence and standalone preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-retained-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/retained-preview
            ${{ runner.temp }}/retained-preview.tar.gz
            ${{ runner.temp }}/retained-preview.tar.gz.sha256
          if-no-files-found: error
      - name: Upload the normal runnable archive separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-retained-preview-linux-x86_64
          path: |
            ${{ runner.temp }}/retained-preview/preview/*.tar.gz
            ${{ runner.temp }}/retained-preview/preview/*.tar.gz.sha256
          if-no-files-found: error

  message-expiry-preview:
    name: durable Message Expiry and local preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install independent MQTT clients
        run: |
          python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto-clients
          mosquitto_pub --help | head -3
          mosquitto_sub --help | head -3
      - name: Message lifetime, quarantine, claims, crashes and extracted preview
        run: tools/run_message_expiry_reception.sh "$RUNNER_TEMP/message-expiry-preview"
      - name: Upload system evidence and standalone preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-message-expiry-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/message-expiry-preview
            ${{ runner.temp }}/message-expiry-preview.tar.gz
            ${{ runner.temp }}/message-expiry-preview.tar.gz.sha256
          if-no-files-found: error
      - name: Upload the normal runnable archive separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-message-expiry-preview-linux-x86_64
          path: |
            ${{ runner.temp }}/message-expiry-preview/preview/*.tar.gz
            ${{ runner.temp }}/message-expiry-preview/preview/*.tar.gz.sha256
          if-no-files-found: error

  will-preview:
    name: durable zero-delay Will and extracted preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install independent MQTT clients
        run: |
          python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto-clients
          mosquitto_pub --help | head -3
          mosquitto_sub --help | head -3
      - name: Will triggers, six crash cuts, unknown results, capacity and extracted sensor demo
        run: tools/run_will_reception.sh "$RUNNER_TEMP/will-preview"
      - name: Upload system evidence and standalone preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-will-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/will-preview
            ${{ runner.temp }}/will-preview.tar.gz
            ${{ runner.temp }}/will-preview.tar.gz.sha256
          if-no-files-found: error
      - name: Upload the normal runnable archive separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-will-preview-linux-x86_64
          path: |
            ${{ runner.temp }}/will-preview/preview/*.tar.gz
            ${{ runner.temp }}/will-preview/preview/*.tar.gz.sha256
          if-no-files-found: error

  secure-preview:
    name: private MQTT 5 mutual TLS and extracted preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install independent MQTT clients
        run: |
          python -m pip install --disable-pip-version-check -r tests/system/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto-clients openssl
      - name: Certificates, authorization, same-file recovery, TLS progress and service measurements
        run: tools/run_secure_reception.sh "$RUNNER_TEMP/secure-preview"
      - name: Monotone policy transition, backup recovery, atomic cuts and extracted onboarding
        run: tools/run_policy_transition_reception.sh "$RUNNER_TEMP/policy-transition" "$RUNNER_TEMP/secure-preview"
      - name: Retained Will presence, ordering, crash cuts and mutations
        run: tools/run_retained_will_reception.sh "$RUNNER_TEMP/retained-will" "$RUNNER_TEMP/secure-preview"
      - name: Publish the normal sealed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-secure-preview-linux-x86_64
          path: |
            ${{ runner.temp }}/secure-preview/preview/*.tar.gz
            ${{ runner.temp }}/secure-preview/preview/*.tar.gz.sha256
          if-no-files-found: error
      - name: Preserve security and service observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-secure-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/secure-preview
          if-no-files-found: warn
      - name: Preserve offline policy transition observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-policy-transition-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/policy-transition
          if-no-files-found: warn
      - name: Preserve retained Will observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-retained-will-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/retained-will
          if-no-files-found: warn

  prepilot-package:
    name: sealed qualified prepilot executable and operator reception
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Fetch the frozen qualified normal build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: yoch/mqttium
          run-id: 44334052710
          name: mqttiumd-secure-preview-linux-x86_64
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pilot-frozen
      - name: Seal operator material around the qualified bytes
        run: |
          python tools/package_pilot.py \
            "$RUNNER_TEMP/pilot-frozen/mqttiumd-preview-51be4079-x86_64-linux.tar.gz" \
            "$RUNNER_TEMP/pilot-package" \
            --source 51be4079f7ee42f46500e993315eddc971f0a8d4 \
            --archive-sha256 154bca883981e8092d1385ec5278d41458c45b8dae5c1120ea408448144d884f \
            --binary-sha256 9ef097977c2cb86669e11e98d7fbceeac87a4f86fd6a24c7deb76ea9c31bf119
      - name: Install the standard reception clients
        run: |
          python -m pip install --disable-pip-version-check -r preview/pilot/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssl mosquitto-clients
      - name: Extract, restart and receive the sealed executable
        id: operator_reception
        run: |
          set -- "$RUNNER_TEMP/pilot-package/"*.tar.gz
          python tools/check_preview.py "$1" "$RUNNER_TEMP/pilot-smoke"
          for pilot in "$RUNNER_TEMP/pilot-smoke/extracted/"mqttiumd-prepilot-*; do
            python "$pilot/pilot/perturb.py" "$RUNNER_TEMP/pilot-presence"
            python "$pilot/pilot/pressure.py" "$RUNNER_TEMP/pilot-pressure"
            python "$pilot/pilot/restore.py" "$RUNNER_TEMP/pilot-restore" --mode charged
            PYTHON=python "$pilot/run-forward-reception.sh" "$RUNNER_TEMP/pilot-forward" "$pilot"
            PYTHON=python "$pilot/run-split-reception.sh" "$RUNNER_TEMP/pilot-split" "$pilot"
            PYTHON=python "$pilot/run-site-reception.sh" "$RUNNER_TEMP/pilot-site" "$pilot"
          done
      - name: Recompute per-event LIVE timing from the original short split run
        if: always() && steps.operator_reception.outcome != 'skipped'
        continue-on-error: true
        run: |
          python tools/diagnose_split_live.py "$RUNNER_TEMP/pilot-split/short" \
            --out "$RUNNER_TEMP/pilot-short-live-timing"
      - name: Publish the sealed pilot archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-prepilot-linux-x86_64
          path: |
            ${{ runner.temp }}/pilot-package/*.tar.gz
            ${{ runner.temp }}/pilot-package/*.tar.gz.sha256
          if-no-files-found: error
      - name: Preserve operator reception evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-prepilot-extraction-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pilot-smoke
            ${{ runner.temp }}/pilot-presence
            ${{ runner.temp }}/pilot-pressure
            ${{ runner.temp }}/pilot-restore
            ${{ runner.temp }}/pilot-forward
            ${{ runner.temp }}/pilot-split
            ${{ runner.temp }}/pilot-short-live-timing
            ${{ runner.temp }}/pilot-site
          if-no-files-found: warn
