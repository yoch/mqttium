name: Temporary PR435 changelog edit

on:
  push:
    branches: [mission/drop-executable-mqtt31]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Insert changelog entry once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "## [Unreleased]\n\n### Changed\n\n"
          entry = (
              "- Stop executing MQTT 3.1 as a client protocol. "
              "`MQTTProtocolVersion.MQTTv31` remains a Stable enum member with value `3`, "
              "but selecting it now fails during configuration before runtime state is created. "
              "The dedicated MQTT 3.1 CONNECT encoder and inbound PUBLISH path are removed; "
              "MQTT 3.1.1 and MQTT 5 remain the supported protocols.\n\n"
          )
          if entry in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit("unexpected Unreleased marker count")
          path.write_text(text.replace(marker, marker + entry, 1))
          PY
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: record MQTT 3.1 fail-fast change"
          git push origin HEAD:mission/drop-executable-mqtt31
