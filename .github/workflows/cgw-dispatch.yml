name: ChatGPT Workbench Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/cgw ')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted slash command
        uses: peter-evans/slash-command-dispatch@v5
        with:
          token: ${{ secrets.CGW_DISPATCH_TOKEN }}
          reaction-token: ${{ github.token }}
          commands: cgw
          permission: ${{ vars.CGW_REQUIRED_PERMISSION || 'admin' }}
          issue-type: pull-request
          event-type-suffix: -command
          dispatch-type: repository
