name: Open-loop Release Gate ARM64

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'yoch/mqttium' && github.head_ref == 'fix/open-loop-release-gate'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RC8_SHA: 5818b63f2226bdac0a4d700be1cad9b75a84c4d5
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact gate HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Check out immutable rc8 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RC8_SHA }}
          path: base
          persist-credentials: false

      - name: Set isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "JOB_ROOT=$RUNNER_TEMP/mqttium-open-loop-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "VENV_ROOT=$RUNNER_TEMP/mqttium-open-loop-gate-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python3 - <<'PY'
          import os
          import sys

          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected system Python 3.13, got {sys.version}")
          if (os.cpu_count() or 0) < 3:
              raise SystemExit("validation requires CPU 0 for broker and CPU 2 for publisher")
          PY
          command -v mosquitto
          command -v taskset
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate evidence." >&2
            exit 1
          fi
          test "$CANDIDATE_SHA" = "$(git -C candidate rev-parse HEAD)"
          test "$RC8_SHA" = "$(git -C base rev-parse HEAD)"
          test -f candidate/benchmarks/open_loop_release_gate.py
          test -f candidate/benchmarks/paired_open_loop.py
          test -f candidate/benchmarks/runner_probe.py

      - name: Verify persistent performance governor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT"
          shopt -s nullglob
          governors=(/sys/devices/system/cpu/cpufreq/policy*/scaling_governor)
          if [ "${#governors[@]}" -eq 0 ]; then
            governors=(/sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_governor)
          fi
          if [ "${#governors[@]}" -eq 0 ]; then
            echo "No CPU scaling governor controls found." >&2
            exit 1
          fi
          : > "$JOB_ROOT/governor-active.txt"
          for path in "${governors[@]}"; do
            current="$(cat "$path")"
            printf '%s\t%s\n' "$path" "$current" | tee -a "$JOB_ROOT/governor-active.txt"
            test "$current" = performance
          done

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_ROOT"
          python3 -m venv "$VENV_ROOT"
          echo "$VENV_ROOT/bin" >> "$GITHUB_PATH"

      - name: Install validation dependencies
        run: python -m pip install -e "candidate[dev,security]" "psutil>=6,<8"

      - name: Start broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$JOB_ROOT/mosquitto.log" 2>&1 &
          echo "$!" > "$JOB_ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$JOB_ROOT/mosquitto.pid")" 2>/dev/null; then
              cat "$JOB_ROOT/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$JOB_ROOT/mosquitto.log"
          exit 1

      - name: Targeted A/A instrument control
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          python candidate/benchmarks/open_loop_release_gate.py \
            --engine candidate/benchmarks/paired_open_loop.py \
            --runner-probe candidate/benchmarks/runner_probe.py \
            --base-root candidate \
            --candidate-root candidate \
            --protocols 311,5 \
            --payloads 4096 \
            --completions receipt \
            --fractions 0.75,0.90,1.00 \
            --cpu 2 \
            --require-temperature \
            --policy strict \
            --output "$JOB_ROOT/aa-targeted.json" \
            > "$JOB_ROOT/aa-targeted.log" 2>&1
          rc=$?
          ended=$(date +%s)
          echo "$rc" > "$JOB_ROOT/aa-targeted.exit-code"
          echo $((ended - started)) > "$JOB_ROOT/aa-targeted.elapsed-seconds"
          cat "$JOB_ROOT/aa-targeted.log"
          exit 0

      - name: Full A/B rc8 to exact HEAD
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          python candidate/benchmarks/open_loop_release_gate.py \
            --engine candidate/benchmarks/paired_open_loop.py \
            --runner-probe candidate/benchmarks/runner_probe.py \
            --base-root base \
            --candidate-root candidate \
            --cpu 2 \
            --require-temperature \
            --policy strict \
            --output "$JOB_ROOT/ab-full.json" \
            > "$JOB_ROOT/ab-full.log" 2>&1
          rc=$?
          ended=$(date +%s)
          echo "$rc" > "$JOB_ROOT/ab-full.exit-code"
          echo $((ended - started)) > "$JOB_ROOT/ab-full.elapsed-seconds"
          cat "$JOB_ROOT/ab-full.log"
          exit 0

      - name: Summarize validation
        if: always()
        shell: bash
        run: |
          set +e
          python - "$JOB_ROOT" <<'PY' | tee "$JOB_ROOT/validation-summary.md" >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          print("# Open-loop release gate ARM64 validation")
          print()
          for name in ("aa-targeted", "ab-full"):
              print(f"## {name}")
              exit_path = root / f"{name}.exit-code"
              elapsed_path = root / f"{name}.elapsed-seconds"
              if exit_path.exists():
                  print(f"- strict exit code: {exit_path.read_text().strip()}")
              if elapsed_path.exists():
                  print(f"- elapsed seconds: {elapsed_path.read_text().strip()}")
              report_path = root / f"{name}.json"
              if not report_path.exists():
                  print("- report missing")
                  print()
                  continue
              report = json.loads(report_path.read_text())
              scenarios = report.get("scenarios", [])
              confirmed = [item for item in scenarios if item.get("confirmation")]
              print(f"- status: {report.get('status')}")
              print(f"- scenarios: {len(scenarios)}")
              print(f"- confirmations: {len(confirmed)}")
              print(f"- failures: {len(report.get('failures', []))}")
              print(f"- invalidations: {len(report.get('invalidations', []))}")
              for item in report.get("failures", []):
                  print(f"  - failure: {item}")
              for item in report.get("invalidations", []):
                  print(f"  - invalidation: {item}")
              print()
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: open-loop-release-gate-arm64-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/*.json
            ${{ env.JOB_ROOT }}/*.md
            ${{ env.JOB_ROOT }}/*.log
            ${{ env.JOB_ROOT }}/*.txt
            ${{ env.JOB_ROOT }}/*.exit-code
            ${{ env.JOB_ROOT }}/*.elapsed-seconds
            ${{ env.JOB_ROOT }}/*-raw/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce validation outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aa="$(cat "$JOB_ROOT/aa-targeted.exit-code" 2>/dev/null || echo 2)"
          ab="$(cat "$JOB_ROOT/ab-full.exit-code" 2>/dev/null || echo 2)"
          test "$aa" -eq 0
          test "$ab" -eq 0

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$JOB_ROOT/mosquitto.pid" ]; then
            pid="$(cat "$JOB_ROOT/mosquitto.pid")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT" "$VENV_ROOT"
