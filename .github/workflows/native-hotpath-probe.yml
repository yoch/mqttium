name: Native RTT and ingress probe

on:
  push:
    branches:
      - agent/native-rtt-ingress-hotpath

permissions:
  contents: read

env:
  EXPERIMENT_STAGE: synchronized-ingress

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: main
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start isolated broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\nmax_queued_messages 1000000\n' > /tmp/mqttium-hotpath.conf
          mosquitto -c /tmp/mqttium-hotpath.conf -d
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.25
          done
          exit 1
      - name: Prepare isolated environments
        run: |
          cp candidate/benchmarks/native_rtt_ingress.py /tmp/native_rtt_ingress.py
          python -m venv /tmp/mqttium-base
          python -m venv /tmp/mqttium-candidate
          /tmp/mqttium-base/bin/pip install -e ./base
          /tmp/mqttium-candidate/bin/pip install -e ./candidate
          mkdir -p /tmp/native-hotpath
      - name: Rotated A/B measurements
        run: |
          PYTHONPATH=base/src /tmp/mqttium-base/bin/python /tmp/native_rtt_ingress.py \
            --label base-a --runs 4 \
            --output /tmp/native-hotpath/base-a.json
          PYTHONPATH=candidate/src /tmp/mqttium-candidate/bin/python /tmp/native_rtt_ingress.py \
            --label candidate-a --runs 4 \
            --output /tmp/native-hotpath/candidate-a.json
          PYTHONPATH=candidate/src /tmp/mqttium-candidate/bin/python /tmp/native_rtt_ingress.py \
            --label candidate-b --runs 4 \
            --output /tmp/native-hotpath/candidate-b.json
          PYTHONPATH=base/src /tmp/mqttium-base/bin/python /tmp/native_rtt_ingress.py \
            --label base-b --runs 4 \
            --output /tmp/native-hotpath/base-b.json
      - name: Compare
        run: |
          python - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path('/tmp/native-hotpath')
          documents = {
              name: json.loads((root / f'{name}.json').read_text())
              for name in ('base-a', 'candidate-a', 'candidate-b', 'base-b')
          }
          comparison = {'runs': documents, 'aggregate': {}, 'ratios': {}}
          for key in ('rtt', 'ingress'):
              base_samples = (
                  documents['base-a'][key]['rate_samples']
                  + documents['base-b'][key]['rate_samples']
              )
              candidate_samples = (
                  documents['candidate-a'][key]['rate_samples']
                  + documents['candidate-b'][key]['rate_samples']
              )
              base_rate = statistics.median(base_samples)
              candidate_rate = statistics.median(candidate_samples)
              comparison['aggregate'][key] = {
                  'base_median': base_rate,
                  'candidate_median': candidate_rate,
                  'base_samples': base_samples,
                  'candidate_samples': candidate_samples,
              }
              comparison['ratios'][key] = {
                  'candidate_over_base': candidate_rate / base_rate,
                  'percent': (candidate_rate / base_rate - 1.0) * 100.0,
              }
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2) + '\n')
          print(json.dumps(comparison['ratios'], indent=2))
          PY
      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: native-hotpath-${{ github.run_id }}
          path: /tmp/native-hotpath
          retention-days: 14
