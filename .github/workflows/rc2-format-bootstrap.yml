name: RC2 format bootstrap

on:
  push:
    branches: [fix/rc2-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rc2-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - name: Format and push
        run: |
          set -euo pipefail
          ruff format src tests benchmarks
          git diff --check
          git add src tests benchmarks
          git rm .github/workflows/rc2-format-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format RC2 hardening changes'
          git push origin HEAD:fix/rc2-hardening
