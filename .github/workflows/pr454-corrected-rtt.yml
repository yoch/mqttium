name: Retire unstarted duplicate PR454 campaign
on:
  push:
    branches: [work/pr454-corrected-rtt-20260910-a7c1]
permissions:
  contents: read
  actions: write
jobs:
  retire-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the verified unstarted duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          root = 'https://api.github.com/repos/yoch/mqttium'
          target = root + '/actions/runs/34426065968'
          def api(url, method='GET'):
              request = urllib.request.Request(url, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
                  data=b'' if method == 'POST' else None)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          run = api(target)
          assert run['head_sha'] == '61b8c19a04bc6822a74d37d9e5d057233e9f58f6', run['head_sha']
          assert run['head_branch'] == 'work/pr454-corrected-rtt-20260910-a7c1', run['head_branch']
          assert run['status'] in ('pending', 'queued', 'waiting', 'requested', 'completed'), run['status']
          jobs = api(target + '/jobs?per_page=100')['jobs']
          assert not any(j.get('started_at') for j in jobs), 'Duplicate already started; refuse automatic cancellation'
          if run['status'] != 'completed':
              api(target + '/cancel', 'POST')
          for attempt in range(15):
              run = api(target)
              if run['status'] == 'completed':
                  break
              time.sleep(2)
          assert run['status'] == 'completed' and run['conclusion'] == 'cancelled', run
          print(json.dumps({'duplicate': run['id'], 'status': run['status'],
                            'conclusion': run['conclusion'], 'active_campaign_untouched': 34425765949}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Cancelled unstarted duplicate 34426065968. Active corrected-harness campaign 34425765949 was not modified.\n')
          PY
