name: RC2 release notes bootstrap
on:
  push:
    branches:
      - release/v1.0.0rc2
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0rc2
      - name: Finalize changelog
        env:
          SCRIPT_B64: 
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/rc2_changelog.py
          python /tmp/rc2_changelog.py
          git diff --check
          git add CHANGELOG.md
          git rm .github/workflows/rc2-release-notes-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Finalize 1.0.0rc2 changelog'
          git push origin HEAD:release/v1.0.0rc2
