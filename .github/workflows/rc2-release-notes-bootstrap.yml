name: RC2 release notes bootstrap

on:
  push:
    branches:
      - release/v1.0.0rc2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0rc2
      - name: Rewrite changelog and push
        run: |
          set -euo pipefail
          python .rc2_changelog.py
          git diff --check
          git add CHANGELOG.md
          git rm .rc2_changelog.py .github/workflows/rc2-release-notes-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize 1.0.0rc2 changelog'
          git push origin HEAD:release/v1.0.0rc2
