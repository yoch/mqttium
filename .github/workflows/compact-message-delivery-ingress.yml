name: Compact message delivery ingress experiment

on:
  push:
    branches:
      - agent/compact-message-delivery-experiment
    paths:
      - benchmarks/experimental/paired_compact_message_delivery.py
      - .github/workflows/compact-message-delivery-ingress.yml

permissions:
  contents: write

jobs:
  paired-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: agent/compact-message-delivery-experiment
          path: candidate
      - name: Check out exact baseline main
        uses: actions/checkout@v7
        with:
          ref: 9207c6cebccbb0a7eb80476619a8ef0b016e14a6
          path: baseline
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove experimental tuple allocation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("candidate/src/mqttium/api/async_client.py")
          text = path.read_text()
          old = '''        # Keep the private signature stable for focused tests and experiments;\n        # accounting state no longer lives on the public Message object.\n        _ = message, callback_delivery\n'''
          new = '''        # Keep the private signature stable for focused tests and experiments;\n        # accounting state no longer lives on the public Message object.\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git -C candidate diff --quiet; then
            git -C candidate config user.name github-actions[bot]
            git -C candidate config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C candidate add src/mqttium/api/async_client.py
            git -C candidate commit -m "Avoid tuple allocation in delivery reservation"
            git -C candidate push origin HEAD:agent/compact-message-delivery-experiment
          fi
      - name: Record revisions
        run: |
          git -C baseline rev-parse HEAD
          git -C candidate rev-parse HEAD
          python --version
          uname -a
      - name: Recover the validated native ingress harness
        run: |
          git -C candidate fetch --depth=1 origin agent/native-hotpath-architecture-study
          git -C candidate show FETCH_HEAD:benchmarks/experimental/native_ingress_delivery_matrix.py > /tmp/native_ingress_delivery_matrix.py
      - name: Run fresh-process ABBA/BAAB matrix
        env:
          PYTHONPATH: candidate/src
        run: |
          mkdir -p results
          python candidate/benchmarks/experimental/paired_compact_message_delivery.py \
            --base-root baseline \
            --candidate-root candidate \
            --harness /tmp/native_ingress_delivery_matrix.py \
            --blocks 4 \
            --output results/compact-message-delivery-ingress.json \
            | tee results/compact-message-delivery-ingress.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: compact-message-delivery-ingress-${{ github.run_id }}
          path: results/
          retention-days: 30
