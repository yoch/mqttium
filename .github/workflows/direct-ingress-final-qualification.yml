name: Direct ingress final qualification

on:
  push:
    branches:
      - perf/direct-decoder-ingress-prototype
    paths:
      - .github/workflows/direct-ingress-final-qualification.yml

permissions:
  contents: read

concurrency:
  group: direct-ingress-final-qualification
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 1a2c8e52efebee845e507a35e1048d994f1b074a
  BASE_SHA: 1b52cbdf642d7b1ebe89db24ca754e949cb23322
  OLD_PROTOTYPE_SHA: 29d1b42fe565ca30baa393b715316c350cd5c076
  PUBLISHER_SHA: e0db2134c35bd50df62540dc26ab87a1e64edc7c
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56

jobs:
  production-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Verify exact runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if grep -R -n -E '_direct_decoder_ingress_prototype|_INGRESS_READY|DirectIngressDecoder|_install_direct_ingress' \
            src tests tools \
            .github/validation/direct_ingress_prepromotion.py \
            .github/validation/test_direct_ingress_differential.py; then
            echo 'obsolete product/prod-validation hook remains' >&2
            exit 1
          fi
      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,fuzz]' 'websockets==15.0.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Differential and production transport tests
        shell: bash
        run: |
          set -euo pipefail
          HYPOTHESIS_PROFILE=direct_production python -m pytest -q \
            .github/validation/test_direct_ingress_differential.py \
            tests/unit/test_decoder_ingress_storage.py \
            tests/unit/test_decoder_push_transport.py \
            tests/unit/test_alternate_transport_lifecycle.py
      - name: Real transport transition and protocol matrix
        shell: bash
        run: |
          set -euo pipefail
          python .github/validation/direct_ingress_prepromotion.py e2e \
            --output "$RUNNER_TEMP/production-e2e.json"
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-final-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/production-e2e.json
          if-no-files-found: warn
          retention-days: 30

  memory-envelope:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OLD_PROTOTYPE_SHA }}
          path: old
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify host and refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C validation rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C old rev-parse HEAD)" = "$OLD_PROTOTYPE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != '0'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          out="$RUNNER_TEMP/direct-ingress-final-memory-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "MEMORY_OUT=$out" >> "$GITHUB_ENV"
      - name: Run isolated old/new scenarios
        shell: bash
        run: |
          set -euo pipefail
          scenarios='tiny mixed large_fragmented near_limit fragment_alignments large_to_tiny repeated_large reconnect multi_connection'
          for scenario in $scenarios; do
            PYTHONPATH=old/src python3 validation/.github/validation/direct_ingress_memory_profile.py \
              --kind old --scenario "$scenario" --output "$MEMORY_OUT/old-$scenario.json"
            PYTHONPATH=candidate/src python3 validation/.github/validation/direct_ingress_memory_profile.py \
              --kind new --scenario "$scenario" --output "$MEMORY_OUT/new-$scenario.json"
          done
      - name: Reduce and enforce structural memory gates
        shell: bash
        run: |
          set -euo pipefail
          MEMORY_OUT="$MEMORY_OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['MEMORY_OUT'])
          scenarios = ['tiny','mixed','large_fragmented','near_limit','fragment_alignments','large_to_tiny','repeated_large','reconnect','multi_connection']
          rows = {}
          for scenario in scenarios:
              rows[scenario] = {
                  kind: json.loads((root / f'{kind}-{scenario}.json').read_text())
                  for kind in ('old','new')
              }
          new = {s: rows[s]['new'] for s in scenarios}
          old = {s: rows[s]['old'] for s in scenarios}
          assert new['tiny']['initial_capacity'] == 0
          assert new['tiny']['capacity'] <= 256 * 1024
          assert old['tiny']['initial_capacity'] >= 512 * 1024
          assert new['near_limit']['capacity_peak'] <= 8 * 1024 * 1024
          assert old['near_limit']['capacity_peak'] >= new['near_limit']['capacity_peak']
          assert new['large_to_tiny']['capacity'] <= 256 * 1024
          assert old['large_to_tiny']['capacity'] > new['large_to_tiny']['capacity']
          assert new['reconnect']['capacity_after_clear'] <= 64 * 1024
          assert old['reconnect']['capacity_after_clear'] > new['reconnect']['capacity_after_clear']
          assert new['multi_connection']['capacity_sum'] <= 32 * 64 * 1024
          assert old['multi_connection']['capacity_sum'] >= 32 * 512 * 1024
          summary = {
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'old_prototype_sha': os.environ['OLD_PROTOTYPE_SHA'],
              'rows': rows,
              'key_ratios': {
                  'near_limit_capacity_peak_new_over_old': new['near_limit']['capacity_peak'] / old['near_limit']['capacity_peak'],
                  'multi_capacity_new_over_old': new['multi_connection']['capacity_sum'] / old['multi_connection']['capacity_sum'],
                  'multi_rss_after_delta_new_over_old': (new['multi_connection']['rss_after']-new['multi_connection']['rss_before']) / max(1, old['multi_connection']['rss_after']-old['multi_connection']['rss_before']),
              },
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-final-memory-${{ github.run_id }}
          path: ${{ env.MEMORY_OUT }}
          if-no-files-found: error
          retention-days: 30

  saturated:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    env:
      PORT: "11886"
      PAYLOAD_SIZE: "65536"
      MEASURE_S: "1.5"
      WARMUP_S: "0.5"
      PUBLISHER_S: "2.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PUBLISHER_SHA }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bench/rc13-vs-445-vs-446
          path: benchtools
          persist-credentials: false
      - name: Verify host and exact refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C publisher rev-parse HEAD)" = "$PUBLISHER_SHA"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != '0'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          out="$RUNNER_TEMP/direct-ingress-final-saturated-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "SAT_OUT=$out" >> "$GITHUB_ENV"
      - name: Start Mosquitto on CPU1
        shell: bash
        run: |
          set -euo pipefail
          version="$({ mosquitto -h 2>&1 || true; } | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"mosquitto version\s+([0-9]+(?:\.[0-9]+)+)",t,re.I); print(m.group(1) if m else "")')"
          test "$version" = '2.1.2'
          cat > "$SAT_OUT/mosquitto.conf" <<EOF
          listener $PORT 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$SAT_OUT/mosquitto.conf" > "$SAT_OUT/mosquitto.log" 2>&1 &
          echo "SAT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/$PORT) >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - name: Run eight balanced pairs
        shell: bash
        run: |
          set -euo pipefail
          : > "$SAT_OUT/completed.tsv"
          for block in $(seq 0 7); do
            if (( block % 2 == 0 )); then order='base candidate'; else order='candidate base'; fi
            pos=0
            for arm in $order; do
              idx=$((block*2+pos)); pos=$((pos+1))
              if [ "$arm" = base ]; then sub_src="$PWD/base/src"; else sub_src="$PWD/candidate/src"; fi
              topic="bench/direct-final/${GITHUB_RUN_ID}/${idx}"
              ready="$SAT_OUT/ready-$idx"
              sub="$SAT_OUT/sub-$idx.json"
              pub="$SAT_OUT/pub-$idx.json"
              rm -f "$ready" "$sub" "$pub"
              taskset -c 0 env PYTHONPATH="$sub_src" python3 benchtools/tools/mqtt_saturated_finalists_probe.py \
                subscriber --arm "$arm" --host 127.0.0.1 --port "$PORT" --topic "$topic" \
                --payload-size "$PAYLOAD_SIZE" --warmup-s "$WARMUP_S" --duration-s "$MEASURE_S" \
                --broker-pid "$SAT_BROKER_PID" --ready-file "$ready" --output "$sub" \
                > "$SAT_OUT/sub-$idx.log" 2>&1 &
              subpid=$!
              for _ in $(seq 1 100); do
                [ -f "$ready" ] && break
                kill -0 "$subpid" 2>/dev/null || { cat "$SAT_OUT/sub-$idx.log"; exit 1; }
                sleep 0.05
              done
              test -f "$ready"
              taskset -c 2 env PYTHONPATH="$PWD/publisher/src" python3 benchtools/tools/mqtt_saturated_finalists_probe.py \
                publisher --host 127.0.0.1 --port "$PORT" --topic "$topic" \
                --payload-size "$PAYLOAD_SIZE" --duration-s "$PUBLISHER_S" --output "$pub" \
                > "$SAT_OUT/pub-$idx.log" 2>&1 &
              pubpid=$!
              wait "$subpid" || { cat "$SAT_OUT/sub-$idx.log"; kill "$pubpid" 2>/dev/null || true; exit 1; }
              wait "$pubpid" || { cat "$SAT_OUT/pub-$idx.log"; exit 1; }
              printf '%s\t%s\t%s\n' "$idx" "$block" "$arm" >> "$SAT_OUT/completed.tsv"
              sleep 0.10
            done
          done
      - name: Reduce saturated evidence
        shell: bash
        run: |
          set -euo pipefail
          SAT_OUT="$SAT_OUT" python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path
          root=Path(os.environ['SAT_OUT'])
          rows=[]
          for line in (root/'completed.tsv').read_text().splitlines():
              idx_s, block_s, arm=line.split('\t'); idx=int(idx_s); block=int(block_s)
              r=json.loads((root/f'sub-{idx}.json').read_text())
              p=json.loads((root/f'pub-{idx}.json').read_text())
              mib=r['payload_bytes']/(1024*1024)
              r.update(idx=idx, block=block, arm=arm, publisher_mib_s=p['payload_mib_s'], publisher_margin=p['payload_mib_s']/r['payload_mib_s'])
              r['cpu_per_mib']=r['ru_cpu_s']/mib
              r['stime_per_mib']=r['ru_stime_s']/mib
              r['qualified']=(r['publisher_margin']>=1.2 and r['sut_cpu_pct']>=90 and (r['broker_cpu_pct'] or 0)<95 and r['ru_majflt']==0 and p['ru_majflt']==0)
              rows.append(r)
          def gm(v): return math.exp(statistics.mean(math.log(x) for x in v))
          pairs=[]
          for block in range(8):
              rs={r['arm']:r for r in rows if r['block']==block}
              assert set(rs)=={'base','candidate'}
              b,c=rs['base'],rs['candidate']
              pairs.append({'block':block,'qualified':b['qualified'] and c['qualified'],'throughput_ratio':c['payload_mib_s']/b['payload_mib_s'],'cpu_per_mib_ratio':c['cpu_per_mib']/b['cpu_per_mib'],'stime_per_mib_ratio':c['stime_per_mib']/b['stime_per_mib']})
          def med(arm,key): return statistics.median(r[key] for r in rows if r['arm']==arm)
          summary={
              'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['CANDIDATE_SHA'],
              'all_cells_qualified':all(r['qualified'] for r in rows),
              'pairs':pairs,
              'throughput_geomean_ratio':gm([p['throughput_ratio'] for p in pairs]),
              'cpu_per_mib_geomean_ratio':gm([p['cpu_per_mib_ratio'] for p in pairs]),
              'stime_per_mib_geomean_ratio':gm([p['stime_per_mib_ratio'] for p in pairs]),
              'base':{k:med('base',k) for k in ('payload_mib_s','sut_cpu_pct','broker_cpu_pct','ru_cpu_s','ru_stime_s','ru_minflt','publisher_margin')},
              'candidate':{k:med('candidate',k) for k in ('payload_mib_s','sut_cpu_pct','broker_cpu_pct','ru_cpu_s','ru_stime_s','ru_minflt','publisher_margin')},
          }
          assert summary['all_cells_qualified']
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Stop saturated broker
        if: always()
        run: |
          [ -n "${SAT_BROKER_PID:-}" ] && kill "$SAT_BROKER_PID" 2>/dev/null || true
      - name: Upload saturated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-final-saturated-${{ github.run_id }}
          path: ${{ env.SAT_OUT }}
          if-no-files-found: error
          retention-days: 30

  rtt:
    needs: saturated
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Prepare host, venv and broker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != '0'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          out="$RUNNER_TEMP/direct-ingress-final-rtt-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "RTT_OUT=$out" >> "$GITHUB_ENV"
          python3 -m venv "$out/venv"
          . "$out/venv/bin/activate"
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e './harness[dev,mqttium]' 'psutil>=6,<8' >/dev/null
          cat > "$out/mosquitto.conf" <<'EOF'
          listener 11887 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "RTT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11887) >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - name: Run exact four-block RTT gate
        shell: bash
        run: |
          set -euo pipefail
          . "$RTT_OUT/venv/bin/activate"
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path base --candidate-path candidate \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 4 --max-block-retries 0 --profile standard \
            --broker 127.0.0.1:11887 --broker-pid "$RTT_BROKER_PID" \
            --output "$RTT_OUT/base-vs-candidate.json" | tee "$RTT_OUT/base-vs-candidate.txt"
      - name: Stop RTT broker
        if: always()
        run: |
          [ -n "${RTT_BROKER_PID:-}" ] && kill "$RTT_BROKER_PID" 2>/dev/null || true
      - name: Upload RTT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-final-rtt-${{ github.run_id }}
          path: ${{ env.RTT_OUT }}
          if-no-files-found: error
          retention-days: 30
