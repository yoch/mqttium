name: Apply QoS0 format fix

on:
  push:
    branches:
      - perf/qos0-topic-bytes-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/qos0-topic-bytes-handoff
      - name: Format size-parts line and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/mqttium/protocol/outbound.py')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)topic_size, wire_property_bytes, logical_property_bytes = self\.size_parts\(\n'
              r'\s*topic, properties\n\s*\)$'
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('expected size_parts format block not found')
          indent = match.group('indent')
          replacement = (
              f'{indent}topic_size, wire_property_bytes, logical_property_bytes = '
              'self.size_parts(topic, properties)'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one replacement, got {count}')
          path.write_text(text)
          PY
          rm .github/workflows/apply-qos0-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format QoS0 topic-byte handoff'
          git push origin HEAD:perf/qos0-topic-bytes-handoff
