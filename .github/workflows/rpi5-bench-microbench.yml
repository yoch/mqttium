name: rpi5 bench micro-benchmarks
run-name: "Bench micro-benchmarks: 1.2.0 publish path vs 1.1.0 (observer variants)"

# Diagnostic only, never merged to main. Runs the micro-benchmarks in
# yoch/mqtt-python-client-bench microbench/mqttium/ (pinned by BENCH_SHA) on the
# quiet Raspberry Pi 5 runner: Mosquitto on core 0, orchestration on core 1,
# the client under test on core 2, the C peer on core 3. Same locked client
# versions and CPython 3.12 build (uv) as campaign 20260930T220715Z.

on:
  push:
    branches: [microbench/bench-weaknesses-rpi5]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

env:
  BENCH_SHA: cd9f475eb27cacedff35a619fb70dd6cc0d3da2e
  # mqttium source trees compared in rotation (name=commit). Each arm imports
  # mqttium from its own checkout through PYTHONPATH, ahead of the locked
  # wheel; the other clients stay the locked ones.
  MQTTIUM_ARMS: >-
    v110=b611d492e418594fb8fbbeeb16cdc04088751fbe
    v120=7227c97ff15a36580ccaff3b9c32fa007aed966b
  UV_VERSION: "0.11.2"

jobs:
  microbench:
    runs-on: [self-hosted, linux, ARM64, rpi5]
    timeout-minutes: 120
    steps:
      - name: Set run-specific workspace
        run: |
          root="$RUNNER_TEMP/bench-mb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "JOB_ROOT=$root"
            echo "UV_CACHE_DIR=$root/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$root/uv-python"
            echo "UV_PROJECT_ENVIRONMENT=$root/venv"
            echo "OUT=$root/out"
          } >> "$GITHUB_ENV"

      - name: Verify host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          for tool in cc openssl mosquitto taskset python3; do command -v "$tool"; done
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process makes the runner unsafe for this job." >&2
            exit 1
          fi
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT" "$OUT"
          {
            echo "model: $(tr -d '\0' < /proc/device-tree/model)"
            echo "kernel: $(uname -r)"
            echo "cores: $(nproc)"
            echo "governor: $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort | uniq -c | xargs)"
            echo "mosquitto: $(mosquitto -h 2>&1 | head -1)"
            echo "loadavg at start: $(cat /proc/loadavg)"
          } | tee "$OUT/host.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: bench
          persist-credentials: false

      - name: Locked environment (uv, CPython 3.12)
        working-directory: bench
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$JOB_ROOT/uv-boot"
          "$JOB_ROOT/uv-boot/bin/pip" install -q "uv==$UV_VERSION"
          "$JOB_ROOT/uv-boot/bin/uv" sync --frozen --python 3.12 --managed-python \
            --extra dev --extra paho --extra gmqtt --extra aiomqtt --extra amqtt \
            --extra awscrt --extra zmqtt --extra mqttium
          "$UV_PROJECT_ENVIRONMENT/bin/python" -c "import sys; print(sys.version)" | tee -a "$OUT/host.txt"
          "$JOB_ROOT/uv-boot/bin/uv" pip list --python "$UV_PROJECT_ENVIRONMENT/bin/python" \
            | grep -iE "paho|gmqtt|awscrt|mqttium" | tee -a "$OUT/host.txt"

      - name: Build the C peer and TLS certificates
        working-directory: bench
        run: |
          PYTHONPATH=src "$UV_PROJECT_ENVIRONMENT/bin/python" -c "
          from mqtt_client_bench import broker
          from mqtt_client_bench.bench import peer
          print(peer.ensure_built()); print(broker.ensure_certs())"

      - name: Start Mosquitto on core 0
        working-directory: bench
        shell: bash
        run: |
          set -euo pipefail
          certs="$PWD/build/certs"
          cat > "$JOB_ROOT/mosquitto.conf" <<EOF
          listener 11883 127.0.0.1
          protocol mqtt
          listener 11884 127.0.0.1
          protocol mqtt
          cafile $certs/ca.crt
          certfile $certs/server.crt
          keyfile $certs/server.key
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          packet_buffer_size 4096
          max_keepalive 120
          EOF
          taskset -c 0 mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$JOB_ROOT/mosquitto.log" 2>&1 &
          echo "$!" > "$JOB_ROOT/mosquitto.pid"
          "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
          import socket, time
          for port in (11883, 11884):
              deadline = time.monotonic() + 15
              while True:
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=1).close()
                      break
                  except OSError:
                      if time.monotonic() > deadline:
                          raise
                      time.sleep(0.1)
          PY

      - name: Check out the mqttium arms
        shell: bash
        run: |
          set -euo pipefail
          for arm in $MQTTIUM_ARMS; do
            name="${arm%%=*}"; sha="${arm#*=}"
            git clone -q --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$JOB_ROOT/mq-$name"
            git -C "$JOB_ROOT/mq-$name" checkout -q "$sha"
            PYTHONPATH="$JOB_ROOT/mq-$name/src" "$UV_PROJECT_ENVIRONMENT/bin/python" -c \
              "import mqttium, sys; print(sys.argv[1], mqttium.__file__)" "$name" | tee -a "$OUT/host.txt"
          done

      - name: Observer variants of the benchmark adapter
        working-directory: bench
        shell: bash
        run: |
          set -euo pipefail
          # src       : the campaign adapter (private future in receipt._waiters)
          # src-cb    : the same adapter observing receipts through the public
          #             PublishReceipt.add_done_callback() (1.2.0 API)
          cp -r src src-cb
          "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
          import pathlib, re
          p = pathlib.Path("src-cb/mqtt_client_bench/adapters/mqttium.py")
          text = p.read_text()
          pattern = re.compile(r"(def observe_receipt\(receipt: Any, on_complete: Any\) -> None:\n)(.*?)(\n\n\ndef )", re.S)
          body = (
              '    receipt.add_done_callback(\n'
              '        lambda r: on_complete(128 if r.exception() is not None else 0)\n'
              '    )'
          )
          new, count = pattern.subn(lambda m: m.group(1) + body + m.group(3), text, count=1)
          assert count == 1, "observe_receipt not found"
          p.write_text(new)
          PY
          grep -n -A4 "def observe_receipt" src-cb/mqtt_client_bench/adapters/mqttium.py | tee -a "$OUT/host.txt"

      - name: Fixed-rate QoS 1 publish, 1.1.0 against 1.2.0, observer variants
        working-directory: bench
        shell: bash
        run: |
          set -euo pipefail
          PY="$UV_PROJECT_ENVIRONMENT/bin/python"
          RATES=2000,5000,10000,20000
          for round in 1 2; do
            for arm in $MQTTIUM_ARMS; do
              name="${arm%%=*}"
              # library alone (noobserve) and the campaign observer (private future)
              export PYTHONPATH="src:$JOB_ROOT/mq-$name/src"
              echo "=== round $round arm $name adapter=private-future (+noobserve)" | tee -a "$OUT/pub_arms.txt"
              taskset -c 1 "$PY" microbench/mqttium/pub_fixed.py --repeat 3 --rates "$RATES" \
                --cases mqttium,mqttium:noobserve 2>&1 | tee -a "$OUT/pub_arms.txt"
            done
            # 1.2.0 observed through the public add_done_callback API
            export PYTHONPATH="src-cb:$JOB_ROOT/mq-v120/src"
            echo "=== round $round arm v120 adapter=add_done_callback" | tee -a "$OUT/pub_arms.txt"
            taskset -c 1 "$PY" microbench/mqttium/pub_fixed.py --repeat 3 --rates "$RATES" \
              --cases mqttium 2>&1 | tee -a "$OUT/pub_arms.txt"
          done

      - name: Receive with 100 callback filters, 1.1.0 against 1.2.0
        working-directory: bench
        shell: bash
        run: |
          set -euo pipefail
          PY="$UV_PROJECT_ENVIRONMENT/bin/python"
          for round in 1 2; do
            for arm in $MQTTIUM_ARMS; do
              name="${arm%%=*}"
              export PYTHONPATH="src:$JOB_ROOT/mq-$name/src"
              echo "=== round $round arm $name" | tee -a "$OUT/sub_arms.txt"
              taskset -c 1 "$PY" microbench/mqttium/sub_fixed.py --repeat 3 \
                --cases plain:2000:mqttium,plain:2000:mqttium:f100 2>&1 | tee -a "$OUT/sub_arms.txt"
            done
          done
          for arm in $MQTTIUM_ARMS; do
            name="${arm%%=*}"
            export PYTHONPATH="src:$JOB_ROOT/mq-$name/src"
            echo "=== profile arm $name" | tee -a "$OUT/sub_profile_arms.txt"
            taskset -c 1 "$PY" microbench/mqttium/sub_fixed.py --profile \
              --cases plain:2000:mqttium,plain:2000:mqttium:f100 2>&1 | tee -a "$OUT/sub_profile_arms.txt"
          done

      - name: Record host load at end
        if: always()
        run: |
          echo "loadavg at end: $(cat /proc/loadavg)" | tee -a "$OUT/host.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bench-microbench-rpi5
          path: ${{ env.OUT }}
          if-no-files-found: warn

      - name: Stop Mosquitto and clean the workspace
        if: always()
        shell: bash
        run: |
          pidfile="$JOB_ROOT/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
