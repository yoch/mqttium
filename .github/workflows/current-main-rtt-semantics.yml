name: Current-main RTT semantics

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - .github/workflows/current-main-rtt-semantics.yml

permissions:
  contents: read

jobs:
  rtt:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out study harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: main
          path: runtime
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gmqtt and broker
        run: |
          python -m pip install gmqtt==0.7.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          mkdir -p /tmp/mqttium-rtt-semantics
          cat > /tmp/mqttium-rtt-semantics/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 1000000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/mqttium-rtt-semantics/mosquitto.conf \
            > /tmp/mqttium-rtt-semantics/mosquitto.log 2>&1 &
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Record revisions
        run: |
          {
            echo "harness=$(git -C harness rev-parse HEAD)"
            echo "runtime=$(git -C runtime rev-parse HEAD)"
            python --version
            python -m pip show gmqtt | grep '^Version:'
            mosquitto -h 2>&1 | head -1
          } | tee /tmp/mqttium-rtt-semantics/revisions.txt
      - name: Recover and correct native harness semantics
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          workflow = Path('harness/.github/workflows/native-hotpath-study.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "cat > /tmp/native-hotpath.b64" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "B64")
          payload = "".join(line.strip() for line in workflow[start:end])
          source = gzip.decompress(base64.b64decode(payload)).decode()
          source = source.replace("max_pending_callbacks=max(65_536, count),", "max_pending_callbacks=8_192,")
          source = source.replace("max_pending_callbacks=65_536,", "max_pending_callbacks=8_192,")
          old_wait = '''async def _wait_gmqtt_storage(*clients: Any) -> None:\n    deadline = time.monotonic() + 10.0\n    while time.monotonic() < deadline:\n        if all(client._persistent_storage.is_empty for client in clients):\n            return\n        await asyncio.sleep(0)\n'''
          new_wait = '''async def _wait_gmqtt_storage(*clients: Any) -> None:\n    await asyncio.wait_for(\n        asyncio.gather(\n            *(client._persistent_storage.wait_empty() for client in clients)\n        ),\n        timeout=10.0,\n    )\n'''
          if old_wait not in source:
              raise SystemExit('gmqtt storage wait patch target not found')
          source = source.replace(old_wait, new_wait)
          source = source.replace(
              '''        elapsed = time.perf_counter() - began\n        await _wait_mqttium_receipts(initiator, responder)\n        counters = {\n''',
              '''        elapsed = time.perf_counter() - began\n        settle_started = time.perf_counter()\n        await _wait_mqttium_receipts(initiator, responder)\n        settle_ms = (time.perf_counter() - settle_started) * 1000.0\n        counters = {\n''',
              1,
          )
          source = source.replace(
              '''        counters = {\n            "initiator": initiator.bench_counters(),\n            "responder": responder.bench_counters(),\n        }\n        counters.update(await lag.stop())\n        return Sample(\n            "rtt",\n''',
              '''        counters = {\n            "initiator": initiator.bench_counters(),\n            "responder": responder.bench_counters(),\n            "completion_ratio": len(latencies) / count,\n            "latency_p99_ms": _percentile(latencies, 0.99),\n            "post_application_settle_ms": settle_ms,\n        }\n        counters.update(await lag.stop())\n        return Sample(\n            "rtt",\n''',
              1,
          )
          source = source.replace(
              '''        elapsed = time.perf_counter() - began\n        await _wait_gmqtt_storage(initiator, responder)\n        counters = {"tcp_nodelay": nodelay}\n''',
              '''        elapsed = time.perf_counter() - began\n        settle_started = time.perf_counter()\n        await _wait_gmqtt_storage(initiator, responder)\n        settle_ms = (time.perf_counter() - settle_started) * 1000.0\n        counters = {\n            "tcp_nodelay": nodelay,\n            "completion_ratio": len(latencies) / count,\n            "latency_p99_ms": _percentile(latencies, 0.99),\n            "post_application_settle_ms": settle_ms,\n        }\n''',
              1,
          )
          Path('/tmp/mqttium-rtt-semantics/native_hotpath_semantics.py').write_text(source)
          PY
          python -m py_compile /tmp/mqttium-rtt-semantics/native_hotpath_semantics.py
      - name: Run rotated closed-loop window matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime/src
        run: |
          for window in 1 8 32 128; do
            python /tmp/mqttium-rtt-semantics/native_hotpath_semantics.py \
              --scenario rtt \
              --cycles 7 \
              --pairs 8000 \
              --window "$window" \
              --variants mqttium-await mqttium-nowait mqttium-sync-inline-nowait gmqtt \
              --output "/tmp/mqttium-rtt-semantics/rtt-window-${window}.json"
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-main-rtt-semantics-${{ github.run_id }}
          path: /tmp/mqttium-rtt-semantics/*
          if-no-files-found: warn
          retention-days: 30
