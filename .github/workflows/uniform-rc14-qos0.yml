name: Uniform RC14 QoS0 callback screening
run-name: "Uniform RC14 QoS0 A/A + A/B"

on:
  push:
    branches: [bench/uniform-rc14-qos0-fb619a27]
    paths: [.github/workflows/uniform-rc14-qos0.yml]

permissions:
  contents: read
concurrency:
  group: uniform-rc14-qos0-hosted
  cancel-in-progress: false

env:
  BASE_SHA: c194597bcf5af4951fbec2b560600eef3cb84b3c
  CANDIDATE_SHA: fb619a27b866c5db869508e6a226db0080e668c7
  PYTHONUNBUFFERED: "1"

jobs:
  screen:
    if: github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/bench/uniform-rc14-qos0-fb619a27'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: slot-a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: slot-c
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: slot-b
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Prepare QoS0-only probe and broker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto
          echo "JOB_ROOT=$RUNNER_TEMP/uniform-qos0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uniform-qos0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/results"
          cp tooling/benchmarks/uniform_callback_probe.py "$RUNNER_TEMP/uniform-qos0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/qos0_probe.py"
          PROBE="$RUNNER_TEMP/uniform-qos0-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/qos0_probe.py" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROBE'])
          text=p.read_text()
          old='''CELLS = [("callback", n) for n in (1, 2, 8, 32)] + [\n    ("async", 8),\n    ("filtered", 8),\n    ("iterator", 8),\n    ("both", 8),\n    ("publish", 8),\n]\n'''
          new='CELLS = [("callback", n) for n in (1, 2, 8, 32)]\n'
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count('receipts.append(pub.publish_nowait(topic, payload, qos=1))')==1
          text=text.replace('receipts.append(pub.publish_nowait(topic, payload, qos=1))','receipts.append(pub.publish_nowait(topic, payload, qos=0))')
          text=text.replace('"workload": "closed_loop_qos1_64B"','"workload": "closed_loop_qos0_64B"')
          p.write_text(text)
          PY
          for s in slot-a slot-b slot-c; do test -z "$(git -C "$s" status --porcelain --untracked-files=no)"; done
      - name: Run six paired 3s QoS0 A/A then A/B cells
        shell: bash
        run: |
          set -euo pipefail
          read -r client_cpu broker_cpu < <(python - <<'PY'
          import os
          cpus=sorted(os.sched_getaffinity(0)); assert len(cpus)>=2; print(cpus[0],cpus[1])
          PY
          )
          port=$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          printf 'listener %s 127.0.0.1\nprotocol mqtt\nset_tcp_nodelay true\nallow_anonymous true\npersistence false\nconnection_messages false\nlog_type error\nmax_queued_messages 10000\n' "$port" > "$JOB_ROOT/results/mosquitto.conf"
          taskset -c "$broker_cpu" mosquitto -c "$JOB_ROOT/results/mosquitto.conf" > "$JOB_ROOT/results/mosquitto.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          python "$JOB_ROOT/qos0_probe.py" --base "$PWD/slot-a" --control "$PWD/slot-c" --candidate "$PWD/slot-b" --output "$JOB_ROOT/results/samples" --port "$port" --cpu "$client_cpu" --seconds 3 --pairs 6 | tee "$JOB_ROOT/results/progress.log"
          python - <<'PY' > "$JOB_ROOT/results/provenance.json"
          import hashlib,json,os,subprocess
          from pathlib import Path
          files=['src/mqttium/api/_delivery.py','src/mqttium/api/async_client.py','src/mqttium/api/_effects.py']
          out={'base':os.environ['BASE_SHA'],'candidate':os.environ['CANDIDATE_SHA'],'sources':{}}
          for slot,expected in [('slot-a',os.environ['BASE_SHA']),('slot-c',os.environ['BASE_SHA']),('slot-b',os.environ['CANDIDATE_SHA'])]:
              def git(*args): return subprocess.check_output(['git','-C',slot,*args],text=True).strip()
              assert git('rev-parse','HEAD')==expected; assert not git('status','--porcelain','--untracked-files=no')
              p=Path(slot); out['sources'][slot]={'src_tree':git('rev-parse','HEAD:src'),'runtime_sha256':{f:hashlib.sha256((p/f).read_bytes()).hexdigest() for f in files}}
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && env.JOB_ROOT != ''
        with:
          name: uniform-rc14-qos0-${{ github.run_id }}
          path: ${{ env.JOB_ROOT }}/results/
          retention-days: 30
          if-no-files-found: warn
