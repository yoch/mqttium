name: PR440 exact effect-drain benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'simplify/effect-drain-waiters' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare exact worktrees
        env:
          BASE: 66a850b52f1f08c6686bb5295fe029413d055adb
          CANDIDATE: 40ec0133d69c20dd9ee14f4af89f390d9b7e1a83
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$CANDIDATE^{commit}"
          git worktree add --detach "$RUNNER_TEMP/pr440-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/pr440-candidate" "$CANDIDATE"
          test "$(git -C "$RUNNER_TEMP/pr440-base" rev-parse HEAD)" = "$BASE"
          test "$(git -C "$RUNNER_TEMP/pr440-candidate" rev-parse HEAD)" = "$CANDIDATE"
      - name: A/A then A/B suspended-drain benchmark
        env:
          BASE: 66a850b52f1f08c6686bb5295fe029413d055adb
          CANDIDATE: 40ec0133d69c20dd9ee14f4af89f390d9b7e1a83
        run: |
          set -euo pipefail
          python .github/pr440_effect_drain_benchmark.py \
            --base-root "$RUNNER_TEMP/pr440-base" \
            --candidate-root "$RUNNER_TEMP/pr440-candidate" \
            --base-sha "$BASE" \
            --candidate-sha "$CANDIDATE" \
            --repeat 7 \
            --operations 20000 \
            --warmup 1000 \
            --output "$RUNNER_TEMP/pr440-effect-drain-benchmark.json"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr440-effect-drain-benchmark
          path: ${{ runner.temp }}/pr440-effect-drain-benchmark.json
          if-no-files-found: error
          retention-days: 7
