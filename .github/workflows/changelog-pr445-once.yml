name: PR445 changelog once

on:
  push:
    branches: [perf/buffered-tcp-recv]
    paths: [.github/workflows/changelog-pr445-once.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/buffered-tcp-recv
      - name: Refresh PR445 changelog and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = (
              '- Use a reusable 64 KiB `asyncio.BufferedProtocol` receive buffer for '
              'cleartext TCP instead of the selector transport\'s allocation-heavy '
              '256 KiB `socket.recv()` path. This removes an ASLR-dependent '
              'allocator/page-fault latency regime observed on Linux/ARM64 while '
              'preserving the public transport API and existing read/write '
              'backpressure. TLS remains on asyncio\'s existing buffered SSL transport.'
          )
          new = (
              '- Use a reusable 80 KiB `asyncio.BufferedProtocol` receive buffer for '
              'cleartext TCP instead of the selector transport\'s allocation-heavy '
              '256 KiB `socket.recv()` path. Keep read backpressure independent at '
              '128 KiB high-water / 64 KiB low-water, and align write-drain '
              'connection-loss semantics with asyncio streams. This removes an '
              'ASLR-dependent allocator/page-fault latency regime observed on '
              'Linux/ARM64 while preserving the public transport API. TLS remains '
              'on asyncio\'s existing buffered SSL transport.'
          )
          if text.count(old) != 1:
              raise SystemExit('expected PR445 changelog entry not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/changelog-pr445-once.yml
          git diff --check
          git diff -- CHANGELOG.md .github/workflows/changelog-pr445-once.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CHANGELOG.md .github/workflows/changelog-pr445-once.yml
          git commit -m 'docs: update buffered TCP receive design'
          git push origin HEAD:perf/buffered-tcp-recv
