name: Temporary Finding 4 minimal evaluation

on:
  push:
    branches:
      - agent/f4-effect-hint-eval

permissions:
  contents: write

jobs:
  evaluate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f4-effect-hint-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild minimal F4 from main
        shell: bash
        run: |
          git checkout 4962b8b92e7c1a24658ddb1898cdeb205854c58e -- \
            src/mqttium/api/_delivery.py \
            src/mqttium/api/async_client.py \
            src/mqttium/packets/_publish.py \
            src/mqttium/protocol/effects.py \
            src/mqttium/protocol/engine.py \
            src/mqttium/protocol/inbound.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Ephemeral metadata belongs to the effect, never the mutable Properties object.
          replace_once(
              "src/mqttium/protocol/effects.py",
              "    requires_delivery_mark: bool | None = None\n",
              "    requires_delivery_mark: bool | None = None\n"
              "    # MESSAGE only: exact non-empty MQTT 5 property-table bytes from\n"
              "    # this fresh decode. Store/replay effects deliberately leave it unset.\n"
              "    decoded_property_wire_size: int | None = None\n",
          )

          # Keep generic _emit unchanged; only MQTT 5 property-bearing messages use this helper.
          replace_once(
              "src/mqttium/protocol/engine.py",
              "        )\n\n    def _send(self, packet: WriteItem) -> None:\n",
              "        )\n\n"
              "    def _emit_decoded_message(\n"
              "        self,\n"
              "        data: Any,\n"
              "        decoded_property_wire_size: int,\n"
              "        *,\n"
              "        requires_delivery_mark: bool = False,\n"
              "    ) -> None:\n"
              "        self._effects.append(\n"
              "            EngineEffect(\n"
              "                kind=EffectKind.MESSAGE,\n"
              "                data=data,\n"
              "                requires_delivery_mark=requires_delivery_mark,\n"
              "                decoded_property_wire_size=decoded_property_wire_size,\n"
              "            )\n"
              "        )\n\n"
              "    def _send(self, packet: WriteItem) -> None:\n",
          )

          # Decode already knows this span. Carry it only for a non-empty table so
          # propertyless MQTT 5 stays on the exact existing path.
          replace_once(
              "src/mqttium/packets/_publish.py",
              ") -> tuple[str, bytes, int | None, bool, bool, Properties]:\n"
              "    \"\"\"Decode MQTT 5 PUBLISH fields without constructing a PublishPacket.\"\"\"\n",
              ") -> tuple[str, bytes, int | None, bool, bool, Properties, int | None]:\n"
              "    \"\"\"Decode MQTT 5 PUBLISH fields plus a non-empty property-table size.\"\"\"\n",
          )
          replace_once(
              "src/mqttium/packets/_publish.py",
              "    properties, pos = decode_properties(raw.remaining, pos, PUBLISH)\n"
              "    # Preserve #128: a non-empty Topic Name must be validated before it can\n",
              "    properties_pos = pos\n"
              "    properties, pos = decode_properties(raw.remaining, pos, PUBLISH)\n"
              "    property_wire_size = pos - properties_pos if properties else None\n"
              "    # Preserve #128: a non-empty Topic Name must be validated before it can\n",
          )
          replace_once(
              "src/mqttium/packets/_publish.py",
              "        dup,\n"
              "        properties,\n"
              "    )\n\n\n"
              "def encode_publish_item_v5(\n",
              "        dup,\n"
              "        properties,\n"
              "        property_wire_size,\n"
              "    )\n\n\n"
              "def encode_publish_item_v5(\n",
          )

          p = Path("src/mqttium/protocol/inbound.py")
          text = p.read_text()
          def inbound_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"inbound {label}: expected one match, got {count}")
              text = text.replace(old, new, 1)

          inbound_once(
              "        topic, payload, decoded_mid, retain, dup, properties = decode_publish_fields_v5(raw, qos)\n",
              "        (\n"
              "            topic,\n"
              "            payload,\n"
              "            decoded_mid,\n"
              "            retain,\n"
              "            dup,\n"
              "            properties,\n"
              "            property_wire_size,\n"
              "        ) = decode_publish_fields_v5(raw, qos)\n",
              "v5 unpack",
          )
          # Fresh QoS0: specialized effect only when the decoded table is non-empty.
          old = """            self._engine._emit(
                EffectKind.MESSAGE,
                Message(
                    topic=topic,
                    payload=payload,
                    qos=qos,
                    retain=retain,
                    dup=False,
                    mid=None,
                    properties=properties,
                ),
            )
            return
"""
          new = """            message = Message(
                topic=topic,
                payload=payload,
                qos=qos,
                retain=retain,
                dup=False,
                mid=None,
                properties=properties,
            )
            if property_wire_size is None:
                self._engine._emit(EffectKind.MESSAGE, message)
            else:
                self._engine._emit_decoded_message(message, property_wire_size)
            return
"""
          inbound_once(old, new, "qos0 emit")
          # Propagate only through the shared fresh QoS1/2 handlers. Persisted replay omits it.
          inbound_once(
              "                properties=properties,\n"
              "            )\n"
              "            return\n"
              "        self._on_qos2(\n",
              "                properties=properties,\n"
              "                decoded_property_wire_size=property_wire_size,\n"
              "            )\n"
              "            return\n"
              "        self._on_qos2(\n",
              "qos1 call",
          )
          inbound_once(
              "            properties=properties,\n"
              "        )\n\n"
              "    def _on_publish_v31",
              "            properties=properties,\n"
              "            decoded_property_wire_size=property_wire_size,\n"
              "        )\n\n"
              "    def _on_publish_v31",
              "qos2 call",
          )
          inbound_once(
              "        dup: bool,\n"
              "        properties: Properties | None,\n"
              "    ) -> None:\n"
              "        engine = self._engine\n",
              "        dup: bool,\n"
              "        properties: Properties | None,\n"
              "        decoded_property_wire_size: int | None = None,\n"
              "    ) -> None:\n"
              "        engine = self._engine\n",
              "qos2 signature",
          )
          old = """        engine._emit(
            EffectKind.MESSAGE,
            Message(
                topic=topic,
                payload=payload,
                qos=QoS.EXACTLY_ONCE,
                retain=retain,
                dup=dup,
                mid=mid,
                properties=properties,
            ),
            requires_delivery_mark=True,
        )
"""
          new = """        fresh_message = Message(
            topic=topic,
            payload=payload,
            qos=QoS.EXACTLY_ONCE,
            retain=retain,
            dup=dup,
            mid=mid,
            properties=properties,
        )
        if decoded_property_wire_size is None:
            engine._emit(
                EffectKind.MESSAGE,
                fresh_message,
                requires_delivery_mark=True,
            )
        else:
            engine._emit_decoded_message(
                fresh_message,
                decoded_property_wire_size,
                requires_delivery_mark=True,
            )
"""
          inbound_once(old, new, "qos2 emit")
          inbound_once(
              "        dup: bool,\n"
              "        properties: Properties | None,\n"
              "    ) -> None:\n"
              "        config = self.config\n",
              "        dup: bool,\n"
              "        properties: Properties | None,\n"
              "        decoded_property_wire_size: int | None = None,\n"
              "    ) -> None:\n"
              "        config = self.config\n",
              "qos1 signature",
          )
          old = """            self._engine._emit(
                EffectKind.MESSAGE,
                Message(
                    topic=topic,
                    payload=payload,
                    qos=QoS.AT_LEAST_ONCE,
                    retain=retain,
                    dup=dup,
                    mid=mid,
                    properties=properties,
                ),
            )
            return
"""
          new = """            fresh_message = Message(
                topic=topic,
                payload=payload,
                qos=QoS.AT_LEAST_ONCE,
                retain=retain,
                dup=dup,
                mid=mid,
                properties=properties,
            )
            if decoded_property_wire_size is None:
                self._engine._emit(EffectKind.MESSAGE, fresh_message)
            else:
                self._engine._emit_decoded_message(
                    fresh_message, decoded_property_wire_size
                )
            return
"""
          inbound_once(old, new, "pending autoack emit")
          old = """        self._engine._emit(
            EffectKind.MESSAGE,
            Message(
                topic=topic,
                payload=payload,
                qos=QoS.AT_LEAST_ONCE,
                retain=retain,
                dup=dup,
                mid=mid,
                properties=properties,
            ),
            requires_delivery_mark=config.manual_ack,
        )
"""
          new = """        fresh_message = Message(
            topic=topic,
            payload=payload,
            qos=QoS.AT_LEAST_ONCE,
            retain=retain,
            dup=dup,
            mid=mid,
            properties=properties,
        )
        if decoded_property_wire_size is None:
            self._engine._emit(
                EffectKind.MESSAGE,
                fresh_message,
                requires_delivery_mark=config.manual_ack,
            )
        else:
            self._engine._emit_decoded_message(
                fresh_message,
                decoded_property_wire_size,
                requires_delivery_mark=config.manual_ack,
            )
"""
          inbound_once(old, new, "fresh qos1 emit")
          p.write_text(text)

          # Only the existing slow accept coroutine learns about the trusted hint.
          p = Path("src/mqttium/api/_delivery.py")
          text = p.read_text()
          old = """    async def accept(
        self,
        message: Message,
        callback: Callable[[Message], Any] | None,
    ) -> None:
"""
          new = """    async def accept(
        self,
        message: Message,
        callback: Callable[[Message], Any] | None,
        *,
        decoded_property_wire_size: int | None = None,
    ) -> None:
"""
          if text.count(old) != 1:
              raise SystemExit("delivery accept signature mismatch")
          text = text.replace(old, new, 1)
          old = """        small_limit = self.small_message_limit
        small_delivery = references and (
            small_limit is None
            or (
                small_limit > 0
                and not message.properties
                and len(message.payload) + 4 * len(message.topic) <= small_limit
            )
        )
"""
          new = """        small_limit = self.small_message_limit
        if decoded_property_wire_size is None:
            small_delivery = references and (
                small_limit is None
                or (
                    small_limit > 0
                    and not message.properties
                    and len(message.payload) + 4 * len(message.topic) <= small_limit
                )
            )
        else:
            small_delivery = bool(
                references
                and small_limit is not None
                and small_limit > 0
                and len(message.payload)
                + 4 * len(message.topic)
                + decoded_property_wire_size
                <= small_limit
            )
"""
          if text.count(old) != 1:
              raise SystemExit("delivery small decision mismatch")
          p.write_text(text.replace(old, new, 1))

          # The normal no-hint branch remains the exact existing acceptor call.
          replace_once(
              "src/mqttium/api/async_client.py",
              "            pending_delivery = self._accept_message(message, self.on_message)\n",
              "            property_wire_size = effect.decoded_property_wire_size\n"
              "            if property_wire_size is None:\n"
              "                pending_delivery = self._accept_message(message, self.on_message)\n"
              "            else:\n"
              "                pending_delivery = self._delivery.accept(\n"
              "                    message,\n"
              "                    self.on_message,\n"
              "                    decoded_property_wire_size=property_wire_size,\n"
              "                )\n",
          )
          PY

          cat > tests/unit/test_small_delivery_properties.py <<'PY'
          """Fresh MQTT 5 property sizes may use the count-bounded small reserve."""

          from __future__ import annotations

          import pytest

          import mqttium.api._delivery as delivery_module
          from mqttium.api.async_client import AsyncClient
          from mqttium.codec.buffer import IncrementalDecoder
          from mqttium.codec.properties import PUBLISH, encode_properties
          from mqttium.enums import MQTTProtocolVersion, PacketType, QoS
          from mqttium.packets import PublishPacket, encode_frame
          from mqttium.protocol.config import EngineConfig
          from mqttium.protocol.effects import EffectKind, EngineEffect
          from mqttium.protocol.engine import ProtocolEngine
          from mqttium.types import Message, Properties


          def _iot_properties() -> Properties:
              properties = Properties()
              properties.set("content_type", "application/octet-stream")
              properties.set("payload_format_indicator", 1)
              properties.set("message_expiry_interval", 60)
              properties.add_user_property("device", "probe")
              properties.add_user_property("site", "lab")
              return properties


          def _connected_engine() -> ProtocolEngine:
              engine = ProtocolEngine(
                  EngineConfig(protocol=MQTTProtocolVersion.MQTTv5, client_id="probe")
              )
              engine.begin_connect()
              decoder = IncrementalDecoder()
              decoder.feed(encode_frame(PacketType.CONNACK, 0, b"\x00\x00\x00"))
              connack = decoder.next_packet()
              assert connack is not None
              engine.handle_raw(connack)
              engine.take_effects()
              return engine


          def _fresh_effect(
              properties: Properties | None,
              *,
              qos: QoS = QoS.AT_MOST_ONCE,
              mid: int | None = None,
              payload: bytes = b"hello",
          ) -> tuple[ProtocolEngine, EngineEffect]:
              engine = _connected_engine()
              packet = PublishPacket(
                  topic="sensors/t",
                  payload=payload,
                  qos=qos,
                  retain=False,
                  dup=False,
                  mid=mid,
                  properties=properties,
              )
              decoder = IncrementalDecoder()
              decoder.feed(packet.encode(MQTTProtocolVersion.MQTTv5))
              raw = decoder.next_packet()
              assert raw is not None
              engine.handle_raw(raw)
              effects = [e for e in engine.take_effects() if e.kind is EffectKind.MESSAGE]
              assert len(effects) == 1
              return engine, effects[0]


          @pytest.mark.parametrize("mode", ["iterator", "callback", "both", "auto"])
          async def test_small_decoded_properties_use_small_reserve(mode: str) -> None:
              _engine, effect = _fresh_effect(_iot_properties())
              message = effect.data
              assert isinstance(message, Message)
              assert message.properties is not None
              assert effect.decoded_property_wire_size == len(
                  encode_properties(message.properties, PUBLISH)
              )
              client = AsyncClient(
                  message_delivery=mode,  # type: ignore[arg-type]
                  protocol=MQTTProtocolVersion.MQTTv5,
                  client_id="probe",
              )
              seen: list[Message] = []
              if mode in ("callback", "both"):
                  client.on_message = seen.append
              await client._apply_effect(effect, nowait=False)
              assert client.pending_delivery_bytes == 0
              if mode in ("iterator", "both", "auto"):
                  assert client._messages.get_nowait() is message
              if mode in ("callback", "both"):
                  await client._callback_queue.join()
                  assert seen == [message]
                  await client._shutdown_callback_worker(drain=False)


          async def test_small_decoded_properties_do_not_reencode(monkeypatch) -> None:
              _engine, effect = _fresh_effect(_iot_properties())
              def fail_encode(*_args: object, **_kwargs: object) -> bytes:
                  raise AssertionError("delivery must use the trusted decode-time size")
              monkeypatch.setattr(delivery_module, "encode_properties", fail_encode)
              client = AsyncClient(
                  message_delivery="iterator",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  client_id="probe",
              )
              await client._apply_effect(effect, nowait=False)
              assert client.pending_delivery_bytes == 0


          async def test_oversized_decoded_properties_remain_accounted() -> None:
              properties = Properties()
              properties.set("correlation_data", b"x" * 200)
              _engine, effect = _fresh_effect(properties)
              client = AsyncClient(
                  message_delivery="iterator",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  client_id="probe",
              )
              await client._apply_effect(effect, nowait=False)
              item = client._messages.get_nowait()
              assert isinstance(item, tuple)
              assert client.pending_delivery_bytes > 0


          async def test_application_built_properties_remain_accounted() -> None:
              message = Message(topic="sensors/t", payload=b"hello", properties=_iot_properties())
              effect = EngineEffect(EffectKind.MESSAGE, message)
              assert effect.decoded_property_wire_size is None
              client = AsyncClient(
                  message_delivery="iterator",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  client_id="probe",
              )
              await client._apply_effect(effect, nowait=False)
              item = client._messages.get_nowait()
              assert isinstance(item, tuple)
              assert client.pending_delivery_bytes > 0


          def test_empty_property_table_keeps_normal_effect_path() -> None:
              _engine, effect = _fresh_effect(None)
              assert effect.decoded_property_wire_size is None


          async def test_replay_drops_hint_after_direct_properties_mutation() -> None:
              engine, first = _fresh_effect(_iot_properties(), qos=QoS.EXACTLY_ONCE, mid=7)
              message = first.data
              assert isinstance(message, Message)
              assert message.properties is not None
              assert first.decoded_property_wire_size is not None
              message.properties.values["correlation_data"] = b"x" * 200
              engine.inbound.replay_session()
              replay = [e for e in engine.take_effects() if e.kind is EffectKind.MESSAGE]
              assert len(replay) == 1
              replay_effect = replay[0]
              assert replay_effect.decoded_property_wire_size is None
              client = AsyncClient(
                  message_delivery="iterator",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  client_id="probe",
              )
              await client._apply_effect(replay_effect, nowait=False)
              item = client._messages.get_nowait()
              assert isinstance(item, tuple)
              assert client.pending_delivery_bytes > 0
          PY

          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          ruff check src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          mypy src/mqttium
          python -m pytest -q tests/unit/test_small_delivery_properties.py tests/unit/test_delivery_byte_budget.py tests/unit/test_property_encoding_cache.py tests/unit/test_inbound_recovery.py tests/unit/test_qos2_matrix.py
          python -m pytest -q tests/unit

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          git commit -m "Use fresh decoded property size for small delivery"
          git push
