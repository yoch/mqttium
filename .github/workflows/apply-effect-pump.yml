name: Apply EffectPump patch

on:
  push:
    branches:
      - agent/effect-pump
    paths:
      - .github/effect-pump.patch.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/effect-pump
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reassemble, verify and apply structural change
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = sorted(Path('.github').glob('effect-pump.patch.part-*'))
          if not parts:
              raise SystemExit('no patch segments')
          encoded = ''.join(part.read_text().strip() for part in parts)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = 'be136527c3acac1ac843602b74416f9861b9e9f01033f4ef2e24550963ecadeb'
          if digest != expected:
              raise SystemExit(f'patch digest mismatch: {digest}')
          Path('/tmp/effect-pump.patch').write_bytes(patch)
          PY
          git apply --check /tmp/effect-pump.patch
          git apply /tmp/effect-pump.patch
          sed -i 's/from typing import Callable/from collections.abc import Callable/' benchmarks/paired_regression.py
          rm -f .github/effect-pump.patch.zlib.b64
          rm -f .github/effect-pump.patch.part-*
          rm -f .github/effect-pump.patch.ready
          rm .github/workflows/apply-effect-pump.yml
          python -m pip install -e ".[dev,security]"
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ordered effect pumping from AsyncClient"
          git push origin HEAD:agent/effect-pump
