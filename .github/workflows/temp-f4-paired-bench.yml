name: Temporary Finding 4 paired benchmark

on:
  push:
    branches:
      - agent/f4-paired-benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f4-paired-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compare main and candidate on one runner
        shell: bash
        run: |
          git worktree add /tmp/mqttium-main 4962b8b92e7c1a24658ddb1898cdeb205854c58e
          cat > /tmp/f4_bench.py <<'PY'
          from __future__ import annotations

          import asyncio
          import statistics
          import time

          from mqttium.api.async_client import AsyncClient
          from mqttium.codec.properties import PUBLISH, encode_properties
          from mqttium.enums import MQTTProtocolVersion
          from mqttium.protocol.effects import EffectKind, EngineEffect
          from mqttium.types import Message, Properties

          N = 30000
          WARM = 3000
          TRIALS = 7

          def iot_properties() -> Properties:
              p = Properties()
              p.set("content_type", "application/octet-stream")
              p.set("payload_format_indicator", 1)
              p.set("message_expiry_interval", 60)
              p.add_user_property("device", "probe")
              p.add_user_property("site", "lab")
              return p

          def big_properties() -> Properties:
              p = Properties()
              p.set("correlation_data", b"x" * 200)
              return p

          async def one_case(name: str, protocol: MQTTProtocolVersion, props: Properties | None) -> None:
              message = Message(topic="sensors/t", payload=b"hello", properties=props)
              kwargs = {}
              fields = getattr(EngineEffect, "__dataclass_fields__", {})
              if props is not None and "decoded_property_wire_size" in fields:
                  kwargs["decoded_property_wire_size"] = len(encode_properties(props, PUBLISH))
              effect = EngineEffect(
                  EffectKind.MESSAGE,
                  message,
                  requires_delivery_mark=False,
                  **kwargs,
              )
              client = AsyncClient(
                  message_delivery="iterator",
                  protocol=protocol,
                  client_id="bench",
              )

              async def cycle() -> None:
                  await client._apply_effect(effect, nowait=False)
                  item = client._messages.get_nowait()
                  if isinstance(item, tuple):
                      client._delivery.release_nowait(item[1])

              for _ in range(WARM):
                  await cycle()
              samples = []
              for _ in range(TRIALS):
                  start = time.perf_counter_ns()
                  for _ in range(N):
                      await cycle()
                  samples.append((time.perf_counter_ns() - start) / N / 1000)
              print(
                  f"{name}: median={statistics.median(samples):.4f} us/msg "
                  f"trials={[round(x, 4) for x in samples]}"
              )

          async def main() -> None:
              await one_case("v5-no-properties", MQTTProtocolVersion.MQTTv5, None)
              await one_case("v5-small-iot-properties", MQTTProtocolVersion.MQTTv5, iot_properties())
              await one_case("v5-oversized-properties", MQTTProtocolVersion.MQTTv5, big_properties())
              await one_case("v311-no-properties", MQTTProtocolVersion.MQTTv311, None)

          asyncio.run(main())
          PY
          echo "=== MAIN ==="
          PYTHONPATH=/tmp/mqttium-main/src python /tmp/f4_bench.py
          echo "=== CANDIDATE ==="
          PYTHONPATH="$GITHUB_WORKSPACE/src" python /tmp/f4_bench.py
