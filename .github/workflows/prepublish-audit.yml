name: Prepublication audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        required: true
        default: main
        type: string
      candidate_tag:
        description: Expected tag, for example v0.2.0b1
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify expected tag
        if: ${{ inputs.candidate_tag != '' }}
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          tree = ast.parse(Path("src/mqttium/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )
          expected = f"v{version}"
          if os.environ["CANDIDATE_TAG"] != expected:
              raise SystemExit(
                  f"candidate tag {os.environ['CANDIDATE_TAG']!r} does not match {expected!r}"
              )
          PY
      - run: python -m pip install ".[release]"
      - run: validate-pyproject pyproject.toml
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Install and import the built wheel
        run: |
          python -m venv /tmp/mqttium-release-wheel
          /tmp/mqttium-release-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/mqttium-release-wheel/bin/python -I - <<'PY'
          import importlib
          import importlib.metadata
          import pkgutil
          import mqttium

          assert mqttium.__version__ == importlib.metadata.version("mqttium")
          for module in pkgutil.walk_packages(mqttium.__path__, mqttium.__name__ + "."):
              importlib.import_module(module.name)
          PY
          /tmp/mqttium-release-wheel/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: mqttium-prepublication-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
