name: Review PR202 performance
on:
  push:
    branches: [review/pr202-performance]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: base
      - uses: actions/checkout@v7
        with:
          ref: cursor/rm-preflight-validate-6aff
          path: candidate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Paired pending-handoff and ordinary MQTT5 ingress
        run: |
          cat > /tmp/measure.py <<'PY'
          import json, os, statistics, subprocess, sys
          from pathlib import Path

          WORKER = r'''
          import json, os, time
          from mqttium.codec.buffer import RawPacket
          from mqttium.codec.primitives import pack_u16, pack_utf8
          from mqttium.enums import ConnectionState, MQTTProtocolVersion, PacketType
          from mqttium.protocol.config import EngineConfig
          from mqttium.protocol.engine import ProtocolEngine

          size=int(os.environ['PAYLOAD'])
          mode=os.environ['MODE']
          count=5000 if size <= 4096 else 800
          body=b'x'*size
          raws=[
              RawPacket(
                  PacketType.PUBLISH,
                  0x02,
                  pack_utf8('bench/preflight') + pack_u16(i) + b'\x00' + body,
              )
              for i in range(1, count + 1)
          ]
          samples=[]
          for rep in range(13):
              e=ProtocolEngine(EngineConfig(protocol=MQTTProtocolVersion.MQTTv5, local_receive_maximum=65535))
              e.state=ConnectionState.CONNECTED
              if mode == 'pending':
                  e._pending_auto_qos1_mids.add(65535)
              start=time.perf_counter_ns()
              for raw in raws:
                  e.handle_raw(raw)
                  e.take_effects()
              elapsed=time.perf_counter_ns()-start
              if rep>=2:
                  samples.append(count*1e9/elapsed)
          print(json.dumps(samples))
          '''

          def run(root, payload, mode):
              env=os.environ.copy()
              env['PYTHONPATH']=str(Path(root).resolve()/'src')
              env['PAYLOAD']=str(payload)
              env['MODE']=mode
              return json.loads(subprocess.check_output([sys.executable,'-c',WORKER],env=env,text=True))

          results={}
          for mode in ('pending','ordinary'):
              results[mode]={}
              for payload in (64,4096,65536):
                  b=run('base',payload,mode); c=run('candidate',payload,mode)
                  ratios=[y/x for x,y in zip(b,c)]
                  results[mode][str(payload)]={
                      'base':b,
                      'candidate':c,
                      'ratios':ratios,
                      'median_ratio':statistics.median(ratios),
                  }
          print(json.dumps(results,indent=2))
          PY
          python /tmp/measure.py
