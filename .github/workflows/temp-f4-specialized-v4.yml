name: Temporary Finding 4 specialized v4

on:
  push:
    branches:
      - agent/small-delivery-decoded-properties

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-delivery-decoded-properties
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply specialized design with type-clean QoS1 locals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temp-f4-specialized-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, 'f4-v3-transform', 'exec'), {})

          p = Path('src/mqttium/protocol/inbound.py')
          text = p.read_text()
          replacements = [
              (
                  '''            message = Message(\n                topic=topic,\n                payload=payload,\n                qos=QoS.AT_LEAST_ONCE,\n                retain=retain,\n                dup=dup,\n                mid=mid,\n                properties=properties,\n            )\n            self._emit_fresh_message(\n                message, decoded_property_wire_size=decoded_property_wire_size\n            )\n''',
                  '''            fresh_message = Message(\n                topic=topic,\n                payload=payload,\n                qos=QoS.AT_LEAST_ONCE,\n                retain=retain,\n                dup=dup,\n                mid=mid,\n                properties=properties,\n            )\n            self._emit_fresh_message(\n                fresh_message, decoded_property_wire_size=decoded_property_wire_size\n            )\n''',
                  'pending-autoack',
              ),
              (
                  '''        message = Message(\n            topic=topic,\n            payload=payload,\n            qos=QoS.AT_LEAST_ONCE,\n            retain=retain,\n            dup=dup,\n            mid=mid,\n            properties=properties,\n        )\n        self._emit_fresh_message(\n            message,\n            requires_delivery_mark=config.manual_ack,\n            decoded_property_wire_size=decoded_property_wire_size,\n        )\n''',
                  '''        fresh_message = Message(\n            topic=topic,\n            payload=payload,\n            qos=QoS.AT_LEAST_ONCE,\n            retain=retain,\n            dup=dup,\n            mid=mid,\n            properties=properties,\n        )\n        self._emit_fresh_message(\n            fresh_message,\n            requires_delivery_mark=config.manual_ack,\n            decoded_property_wire_size=decoded_property_wire_size,\n        )\n''',
                  'fresh-qos1',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} replacement count={count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          ruff check src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          mypy src/mqttium
          python -m pytest -q tests/unit/test_small_delivery_properties.py tests/unit/test_delivery_byte_budget.py tests/unit/test_property_encoding_cache.py tests/unit/test_inbound_recovery.py tests/unit/test_qos2_matrix.py tests/unit/test_batched_message_effects.py
          python -m pytest -q tests/unit

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          git commit -m "Specialize small delivery for fresh MQTT 5 properties"
          git push
