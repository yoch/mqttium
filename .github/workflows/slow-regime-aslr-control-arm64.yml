name: Slow-regime ASLR control ARM64

on:
  push:
    branches: [bench/rc13-slow-regime-bisect]
    paths: [.github/workflows/slow-regime-aslr-control-arm64.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-regime-rpi5
  cancel-in-progress: false

jobs:
  aslr-control:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 180
    env:
      BENCH_SHA: ec332e25003a6484727697c3018ce632a025a7f2
      SUT_SHA: 7d917547b491c8e521d1d82960b1e10810e4bd80
      TARGET_RATE: "3942"
      BROKER_PORT: "11883"

    steps:
      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mqttium-aslr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dir"
          echo "RESULTS_DIR=$dir" >> "$GITHUB_ENV"
          echo "VENV_DIR=$RUNNER_TEMP/mqttium-aslr-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          {
            date -u --iso-8601=seconds
            uname -a
            lscpu
            python3 --version
            command -v setarch
            echo governors; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
            echo frequencies; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq 2>/dev/null || true
            echo temperature; cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || true
            echo unix_dgram; cat /proc/sys/net/unix/max_dgram_qlen 2>/dev/null || true
            uptime
            free -h
          } | tee "$dir/environment.txt"
          test "$(uname -m)" = aarch64
          setarch "$(uname -m)" -R true
          printf 'normal_personality=' > "$dir/personality.txt"
          cat /proc/self/personality >> "$dir/personality.txt" 2>/dev/null || true
          printf 'no_aslr_personality=' >> "$dir/personality.txt"
          setarch "$(uname -m)" -R sh -c 'cat /proc/self/personality' >> "$dir/personality.txt" 2>/dev/null || true

      - name: Checkout exact harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Checkout identical arm A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.SUT_SHA }}
          path: arm-a
          persist-credentials: false

      - name: Checkout identical arm B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.SUT_SHA }}
          path: arm-b
          persist-credentials: false

      - name: Verify immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(git -C arm-a rev-parse HEAD)" = "$SUT_SHA"
          test "$(git -C arm-b rev-parse HEAD)" = "$SUT_SHA"
          test -z "$(git -C arm-a status --porcelain --untracked-files=no)"
          test -z "$(git -C arm-b status --porcelain --untracked-files=no)"
          printf 'harness=%s\nsut_a=%s\nsut_b=%s\n' "$BENCH_SHA" "$SUT_SHA" "$SUT_SHA" | tee "$RESULTS_DIR/provenance.txt"

      - name: Prepare exact harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$VENV_DIR"
          . "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './harness[mqttium]' 'psutil>=6,<8'
          PYTHONPATH=harness/src python -m unittest -v \
            harness.tests.test_quality \
            harness.tests.test_version_compare \
            harness.tests.test_pacing \
            harness.tests.test_rtt_initiator
          PYTHONPATH=harness/src python - <<'PY' | tee "$RESULTS_DIR/cpuset.json"
          import json
          from mqtt_client_bench.telemetry import allocate_cpuset, physical_cpu_groups
          print(json.dumps({
              'physical_groups': physical_cpu_groups(),
              'mapping': allocate_cpuset(['sut','broker','loadgen','orch'], profile='standard'),
          }, indent=2))
          PY

      - name: Start native Mosquitto 2.1.2 and host sampler
        shell: bash
        run: |
          set -euo pipefail
          command -v mosquitto >/dev/null
          { mosquitto -h 2>&1 || true; } | head -n 4 | tee "$RESULTS_DIR/broker-version.txt"
          grep -q 'version 2\.1\.2' "$RESULTS_DIR/broker-version.txt" || { echo 'Mosquitto 2.1.2 required' >&2; exit 1; }
          if pgrep -a mosquitto; then
            echo 'pre-existing Mosquitto would contaminate the run' >&2
            exit 1
          fi
          cat > "$RESULTS_DIR/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          taskset -c 1 mosquitto -c "$RESULTS_DIR/mosquitto.conf" > "$RESULTS_DIR/mosquitto.log" 2>&1 &
          pid=$!
          echo "BROKER_PID=$pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && break
            kill -0 "$pid" 2>/dev/null || { cat "$RESULTS_DIR/mosquitto.log"; exit 1; }
            sleep 0.2
          done
          kill -0 "$pid"
          printf 'pid=%s comm=%s affinity=%s\n' "$pid" "$(cat /proc/$pid/comm)" "$(taskset -pc "$pid")" | tee "$RESULTS_DIR/broker-process.txt"
          (while true; do
            printf 'ts=%s temp=' "$(date +%s.%N)"
            cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | tr '\n' ' ' || true
            printf 'freq='; cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null | tr '\n' ' ' || true
            printf 'load='; cat /proc/loadavg
            sleep 1
          done) >> "$RESULTS_DIR/host-samples.txt" 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

      - name: Measure same SHA with normal and fixed layout
        shell: bash
        run: |
          set -euo pipefail
          . "$VENV_DIR/bin/activate"
          run_segment() {
            condition="$1"
            seg="$2"
            out="$RESULTS_DIR/${condition}-seg-${seg}.json"
            txt="$RESULTS_DIR/${condition}-seg-${seg}.txt"
            args=(
              -m mqtt_client_bench.version_compare
              --client mqttium --baseline-path arm-a --candidate-path arm-b
              --scenario application_rtt_fixed_rate --variant-index 0
              --target-rate "$TARGET_RATE" --pacer-mode external
              --blocks 2 --max-block-retries 1 --profile standard
              --broker 127.0.0.1:11883 --broker-pid "$BROKER_PID"
              --output "$out"
            )
            if [ "$condition" = no-aslr ]; then
              PYTHONPATH=harness/src setarch "$(uname -m)" -R "$VENV_DIR/bin/python" "${args[@]}" | tee "$txt"
            else
              PYTHONPATH=harness/src "$VENV_DIR/bin/python" "${args[@]}" | tee "$txt"
            fi
          }
          # Segment-level ABBA across the environment condition. Each segment is
          # itself an exact same-SHA ABBA/BAAB version_compare block pair.
          run_segment normal 1
          run_segment no-aslr 1
          run_segment no-aslr 2
          run_segment normal 2
          run_segment normal 3
          run_segment no-aslr 3

      - name: Summarize condition distributions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          . "$VENV_DIR/bin/activate"
          python - "$RESULTS_DIR" <<'PY' | tee "$RESULTS_DIR/summary.txt"
          import json, math, statistics, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for condition in ('normal', 'no-aslr'):
              values=[]; all_values=[]; temporal=0; active=0
              for path in sorted(root.glob(f'{condition}-seg-*.json')):
                  data=json.loads(path.read_text())
                  for run in data.get('runs', []):
                      value=run.get('comparison_value')
                      if value is not None and math.isfinite(float(value)):
                          all_values.append(float(value))
                      if not run.get('active_for_verdict'):
                          continue
                      active += 1
                      if not (run.get('temporal_quality') or {}).get('ok'):
                          continue
                      temporal += 1
                      if value is not None and math.isfinite(float(value)):
                          values.append(float(value))
              print(condition, 'active=',active, 'temporal_ok=',temporal, 'finite=',len(values))
              if values:
                  s=sorted(values)
                  print(' median=',statistics.median(s), 'min=',s[0], 'max=',s[-1])
                  print(' sorted=',','.join(f'{x:.6f}' for x in s))
          PY

      - name: Stop processes
        if: always()
        shell: bash
        run: |
          [ -n "${SAMPLER_PID:-}" ] && kill "$SAMPLER_PID" 2>/dev/null || true
          [ -n "${BROKER_PID:-}" ] && kill "$BROKER_PID" 2>/dev/null || true

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slow-regime-aslr-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14
