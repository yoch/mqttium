name: ARM64 Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 0"

permissions:
  contents: read

concurrency:
  group: arm64-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected system Python 3.13, got {sys.version}")
          PY
          command -v mosquitto
          command -v mosquitto_sub
          command -v openssl
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate benchmark evidence." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-bench-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]" paho-mqtt==2.1.0 gmqtt==0.7.0 "psutil>=6,<8"

      - name: Enforce dedicated-runner preflight
        run: |
          python benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/runner-preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated TCP and TLS broker
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-bench"
          rm -rf "$root"
          mkdir -p "$root"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$root/key.pem" \
            -out "$root/cert.pem" \
            -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 0600 "$root/key.pem"
          chmod 0644 "$root/cert.pem"
          cat > "$root/mosquitto.conf" <<EOF
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          listener 18884 127.0.0.1
          cafile $root/cert.pem
          certfile $root/cert.pem
          keyfile $root/key.pem
          require_certificate false
          EOF
          mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 &&
               (echo > /dev/tcp/127.0.0.1/18884) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Comparable publisher benchmark
        run: python benchmarks/compare_libs.py --output "$RUNNER_TEMP/mqttium-bench/compare.json"

      - name: Compat QoS 1 submission handoff A/B
        run: |
          python benchmarks/compat_qosn_submit_ab.py \
            --count 4000 --repeat 5 --workers 8 \
            --output "$RUNNER_TEMP/mqttium-bench/compat-qosn-submit.json"

      - name: QoS 1 and pre-PUBREC frame policy
        run: |
          python benchmarks/qos1_frame_policy.py \
            --repeat 5 \
            --output "$RUNNER_TEMP/mqttium-bench/qos1-frame-policy.json"

      - name: Packet identifier pool A/B
        run: |
          python benchmarks/packet_id_pool_ab.py \
            --count 30000 --repeat 7 \
            --output "$RUNNER_TEMP/mqttium-bench/packet-id-pool.json"

      - name: Confirmed local TCP delivery
        run: |
          python benchmarks/realworld.py \
            --port 11883 --profile local \
            --output "$RUNNER_TEMP/mqttium-bench/realworld-tcp.json"

      - name: Confirmed TLS delivery
        run: |
          python benchmarks/realworld.py \
            --host localhost --port 18884 \
            --cafile "$RUNNER_TEMP/mqttium-bench/cert.pem" \
            --profile local-tls --count 1500 \
            --output "$RUNNER_TEMP/mqttium-bench/realworld-tls.json"

      - name: Application delivery and persistence stress
        run: |
          python benchmarks/application_stress.py \
            --output "$RUNNER_TEMP/mqttium-bench/application-stress.json"

      - name: Isolated memory profile
        run: |
          python benchmarks/memory_profile.py \
            --label "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/mqttium-bench/memory-profile.json"

      - name: Memory regression thresholds
        run: |
          python benchmarks/check_memory_thresholds.py \
            --profile "$RUNNER_TEMP/mqttium-bench/memory-profile.json"

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqttium-arm64-benchmarks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-bench/*.json
            ${{ runner.temp }}/mqttium-bench/mosquitto.log
            ${{ runner.temp }}/runner-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-bench/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
