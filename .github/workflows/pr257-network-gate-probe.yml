name: PR257 Network Gate Probe

on:
  push:
    branches:
      - bench/network-paired-release-gate

permissions:
  contents: read

concurrency:
  group: pr257-network-gate-probe
  cancel-in-progress: true

jobs:
  window20-diagnostic:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUNTIME_SHA: 4677e5500fb33da6b087616e960086e586d96ac7

    steps:
      - name: Fetch exact harness and runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harness runtime
          git init -q harness
          git -C harness fetch -q --depth=1 https://github.com/yoch/mqttium.git "$GITHUB_SHA"
          git -C harness checkout -q --detach FETCH_HEAD
          git init -q runtime
          git -C runtime fetch -q --depth=1 https://github.com/yoch/mqttium.git "$RUNTIME_SHA"
          git -C runtime checkout -q --detach FETCH_HEAD
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C runtime rev-parse HEAD)" = "$RUNTIME_SHA"

      - name: Verify dedicated runner and CPU frequency policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate diagnostic" >&2
            exit 1
          fi
          for cpu in 0 1 2 3; do
            root="/sys/devices/system/cpu/cpu${cpu}/cpufreq"
            echo "cpu=$cpu governor=$(cat "$root/scaling_governor") min=$(cat "$root/scaling_min_freq") max=$(cat "$root/scaling_max_freq") cur=$(cat "$root/scaling_cur_freq")"
          done
          command -v vcgencmd >/dev/null 2>&1 && vcgencmd get_throttled || true

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pr257-window20-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Strict preflight
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr257-window20"
          python harness/benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/pr257-window20/preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-window20"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Same-code exact gate-settings window-20 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-window20"
          freq="/sys/devices/system/cpu/cpu2/cpufreq/scaling_cur_freq"
          (
            while true; do
              printf '%s ' "$(date +%s.%N)"
              cat "$freq"
              sleep 0.05
            done
          ) > "$root/cpu2-freq.log" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          taskset -c 1,3 python harness/benchmarks/paired_network.py \
            --base-root runtime \
            --candidate-root runtime \
            --protocols 311 \
            --completions callback \
            --payloads 64 \
            --windows 20 \
            --repeat 12 \
            --count-small 6000 \
            --target-sample-seconds 2.0 \
            --max-count 60000 \
            --timeout 60 \
            --cpu 2 \
            --policy advisory \
            --max-baseline-cv 10.0 \
            --min-ack-ratio 0.0 \
            --preflight-report "$root/preflight.json" \
            --output "$root/raw.json" \
            --summary-output "$root/raw.md"
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          trap - EXIT

      - name: Print pair-level and frequency diagnostic
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import collections, json, os, pathlib, statistics
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr257-window20"
          path = root / "raw.json"
          print("===== preflight =====")
          print((root / "preflight.json").read_text() if (root / "preflight.json").exists() else "missing")
          freq_path = root / "cpu2-freq.log"
          if freq_path.exists():
              freqs = [int(line.split()[1]) for line in freq_path.read_text().splitlines() if len(line.split()) == 2]
              print("===== CPU2 frequency distribution =====")
              print(dict(sorted(collections.Counter(freqs).items())))
              if freqs:
                  print(f"freq_min={min(freqs)} freq_max={max(freqs)} samples={len(freqs)}")
          if not path.exists():
              raise SystemExit("raw diagnostic JSON missing")
          data = json.loads(path.read_text())
          scenario = data["scenarios"][0]
          print(f"count={scenario['count']} target={scenario['target_sample_seconds']}")
          print("===== pair-level window 20 =====")
          ratios = []
          ack_seconds = []
          for index, pair in enumerate(scenario["pairs"], 1):
              b, c = pair["base"], pair["candidate"]
              ratio = c["publisher_ack_msg_s"] / b["publisher_ack_msg_s"]
              ratios.append(ratio)
              ack_seconds.extend((b["publisher_ack_seconds"], c["publisher_ack_seconds"]))
              print(
                  f"pair={index:02d} order={'/'.join(pair['order'])} "
                  f"base_rate={b['publisher_ack_msg_s']:.2f} cand_rate={c['publisher_ack_msg_s']:.2f} "
                  f"ratio={ratio:.5f} "
                  f"base_cpu={b['cpu_seconds']:.4f} cand_cpu={c['cpu_seconds']:.4f} "
                  f"base_ack_s={b['publisher_ack_seconds']:.4f} cand_ack_s={c['publisher_ack_seconds']:.4f} "
                  f"base_ack_p50={b['ack_latency_p50_ms']:.5f} cand_ack_p50={c['ack_latency_p50_ms']:.5f}"
              )
          forward = [ratios[i] for i in range(0, len(ratios), 2)]
          reverse = [ratios[i] for i in range(1, len(ratios), 2)]
          print(f"median_all={statistics.median(ratios):.5f}")
          print(f"mean_forward={statistics.fmean(forward):.5f} mean_reverse={statistics.fmean(reverse):.5f}")
          print(f"ack_seconds_min={min(ack_seconds):.4f} max={max(ack_seconds):.4f}")
          print("===== raw JSON =====")
          print(json.dumps(data, indent=2))
          PY

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/pr257-window20/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
