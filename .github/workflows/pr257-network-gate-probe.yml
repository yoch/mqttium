name: PR257 Network Gate Probe

on:
  push:
    branches:
      - bench/network-paired-release-gate

permissions:
  contents: read

concurrency:
  group: pr257-network-gate-probe
  cancel-in-progress: true

jobs:
  hash-seed-diagnostic:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUNTIME_SHA: 4677e5500fb33da6b087616e960086e586d96ac7

    steps:
      - name: Fetch exact harness and runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harness runtime
          git init -q harness
          git -C harness fetch -q --depth=1 https://github.com/yoch/mqttium.git "$GITHUB_SHA"
          git -C harness checkout -q --detach FETCH_HEAD
          git init -q runtime
          git -C runtime fetch -q --depth=1 https://github.com/yoch/mqttium.git "$RUNTIME_SHA"
          git -C runtime checkout -q --detach FETCH_HEAD
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C runtime rev-parse HEAD)" = "$RUNTIME_SHA"

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate diagnostic" >&2
            exit 1
          fi
          for cpu in 0 1 2 3; do
            root="/sys/devices/system/cpu/cpu${cpu}/cpufreq"
            test "$(cat "$root/scaling_governor")" = performance
            echo "cpu=$cpu cur=$(cat "$root/scaling_cur_freq")"
          done

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pr257-hash-seed-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Strict preflight
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr257-hash-seed"
          python harness/benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/pr257-hash-seed/preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-hash-seed"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Compare random and fixed hash seeds on same-code window 20
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-hash-seed"
          for mode in random 0 1 2; do
            echo "===== measuring hash seed $mode ====="
            if [ "$mode" = random ]; then
              env -u PYTHONHASHSEED taskset -c 1,3 python harness/benchmarks/paired_network.py \
                --base-root runtime --candidate-root runtime \
                --protocols 311 --completions callback --payloads 64 --windows 20 \
                --repeat 8 --count-small 6000 --target-sample-seconds 2.0 --max-count 60000 \
                --timeout 60 --cpu 2 --policy advisory --max-baseline-cv 10.0 --min-ack-ratio 0.0 \
                --preflight-report "$root/preflight.json" \
                --output "$root/raw-$mode.json" --summary-output "$root/raw-$mode.md"
            else
              PYTHONHASHSEED="$mode" taskset -c 1,3 python harness/benchmarks/paired_network.py \
                --base-root runtime --candidate-root runtime \
                --protocols 311 --completions callback --payloads 64 --windows 20 \
                --repeat 8 --count-small 6000 --target-sample-seconds 2.0 --max-count 60000 \
                --timeout 60 --cpu 2 --policy advisory --max-baseline-cv 10.0 --min-ack-ratio 0.0 \
                --preflight-report "$root/preflight.json" \
                --output "$root/raw-$mode.json" --summary-output "$root/raw-$mode.md"
            fi
          done

      - name: Print seed comparison
        if: always()
        shell: bash
        run: |
          PYTHONPATH=harness python - <<'PY'
          import json, os, pathlib, statistics
          from benchmarks.network_release_gate import paired_ratio_estimate

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr257-hash-seed"
          print("===== preflight =====")
          print((root / "preflight.json").read_text() if (root / "preflight.json").exists() else "missing")
          for mode in ("random", "0", "1", "2"):
              path = root / f"raw-{mode}.json"
              if not path.exists():
                  print(f"seed={mode}: missing")
                  continue
              data = json.loads(path.read_text())
              scenario = data["scenarios"][0]
              ratios = []
              ack_ratios = []
              orders = []
              base_rates = []
              candidate_rates = []
              for pair in scenario["pairs"]:
                  b, c = pair["base"], pair["candidate"]
                  ratios.append(c["publisher_ack_msg_s"] / b["publisher_ack_msg_s"])
                  ack_ratios.append(c["ack_latency_p50_ms"] / b["ack_latency_p50_ms"])
                  orders.append(pair["order"])
                  base_rates.append(b["publisher_ack_msg_s"])
                  candidate_rates.append(c["publisher_ack_msg_s"])
              throughput = paired_ratio_estimate(ratios, orders)
              ack = paired_ratio_estimate(ack_ratios, orders)
              all_rates = base_rates + candidate_rates
              print(
                  f"seed={mode} count={scenario['count']} "
                  f"raw_cv={scenario['base_ack_cv']:.2%}/{scenario['candidate_ack_cv']:.2%} "
                  f"pair_cv={throughput.pair_ratio_cv:.2%} median={statistics.median(ratios):.5f} "
                  f"throughput={throughput.geometric_mean:.5f} "
                  f"ci=[{throughput.lower_95:.5f},{throughput.upper_95:.5f}] "
                  f"ack={ack.geometric_mean:.5f} ci=[{ack.lower_95:.5f},{ack.upper_95:.5f}] "
                  f"rate_mean={statistics.fmean(all_rates):.1f} "
                  f"range=[{min(all_rates):.1f},{max(all_rates):.1f}]"
              )
          PY

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/pr257-hash-seed/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
