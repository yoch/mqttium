name: PR257 Network Gate Probe

on:
  push:
    branches:
      - bench/network-paired-release-gate

permissions:
  contents: read

concurrency:
  group: pr257-network-gate-probe
  cancel-in-progress: true

jobs:
  historical-252-gate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: 21798a7e8a2dbb3f1c1d6fe3890de42b5310798d

    steps:
      - name: Fetch exact harness and historical runtimes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harness base candidate
          git init -q harness
          git -C harness fetch -q --depth=1 https://github.com/yoch/mqttium.git "$GITHUB_SHA"
          git -C harness checkout -q --detach FETCH_HEAD
          git init -q base
          git -C base fetch -q --depth=1 https://github.com/yoch/mqttium.git "$BASE_SHA"
          git -C base checkout -q --detach FETCH_HEAD
          git init -q candidate
          git -C candidate fetch -q --depth=1 https://github.com/yoch/mqttium.git "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate release evidence" >&2
            exit 1
          fi
          for cpu in 0 1 2 3; do
            root="/sys/devices/system/cpu/cpu${cpu}/cpufreq"
            test "$(cat "$root/scaling_governor")" = performance
            echo "cpu=$cpu cur=$(cat "$root/scaling_cur_freq")"
          done

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pr257-network-release-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-network-release"
          rm -rf "$root"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Historical pre-252 versus post-252 release gate
        shell: bash
        run: |
          set -euo pipefail
          # Methodology and thresholds are identical to the accepted same-code
          # gate. Only the two exact source roots change here.
          taskset -c 1,3 python harness/benchmarks/network_release_gate.py \
            --base-root base \
            --candidate-root candidate \
            --engine harness/benchmarks/paired_network.py \
            --runner-probe harness/benchmarks/runner_probe.py \
            --protocols 311 \
            --completions callback \
            --payloads 64 \
            --windows 1,20,64 \
            --cycle-seeds 0,1,2,3,4,5 \
            --target-sample-seconds 2.0 \
            --max-count 60000 \
            --timeout 60 \
            --cpu 2 \
            --inter-phase-quiet-seconds 60 \
            --policy strict \
            --output "$RUNNER_TEMP/pr257-network-release/historical-252.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr257-network-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr257-network-release/*.json
            ${{ runner.temp }}/pr257-network-release/*.md
            ${{ runner.temp }}/pr257-network-release/*-raw/*
            ${{ runner.temp }}/pr257-network-release/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/pr257-network-release/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
