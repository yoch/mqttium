name: PR257 Network Gate Probe

on:
  push:
    branches:
      - bench/network-paired-release-gate

permissions:
  contents: read

concurrency:
  group: pr257-network-gate-probe
  cancel-in-progress: true

jobs:
  same-code-gate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUNTIME_SHA: 4677e5500fb33da6b087616e960086e586d96ac7

    steps:
      - name: Fetch exact harness and runtime without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harness runtime
          git init -q harness
          git -C harness fetch -q --depth=1 https://github.com/yoch/mqttium.git "$GITHUB_SHA"
          git -C harness checkout -q --detach FETCH_HEAD
          git init -q runtime
          git -C runtime fetch -q --depth=1 https://github.com/yoch/mqttium.git "$RUNTIME_SHA"
          git -C runtime checkout -q --detach FETCH_HEAD
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C runtime rev-parse HEAD)" = "$RUNTIME_SHA"

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate benchmark evidence" >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pr257-network-gate-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr257-network-gate"
          rm -rf "$root"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Same-code release-gate validation
        shell: bash
        run: |
          set -euo pipefail
          # Broker CPU 0; observer/gate CPUs 1,3; publisher CPU 2.
          # Defaults: windows 1/20/64, 12 pairs, ~2 s samples and deterministic
          # 60 s quiet periods between phases.
          taskset -c 1,3 python harness/benchmarks/network_release_gate.py \
            --base-root runtime \
            --candidate-root runtime \
            --engine harness/benchmarks/paired_network.py \
            --runner-probe harness/benchmarks/runner_probe.py \
            --cpu 2 \
            --policy strict \
            --output "$RUNNER_TEMP/pr257-network-gate/same-code.json"

      - name: Print evidence
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/pr257-network-gate"
          echo "===== broker log ====="
          cat "$root/mosquitto.log" 2>/dev/null || true
          echo "===== top-level JSON ====="
          cat "$root/same-code.json" 2>/dev/null || true
          echo "===== phase summaries ====="
          for file in "$root"/same-code-raw/*.md; do
            [ -f "$file" ] || continue
            echo "--- $file ---"
            cat "$file"
          done
          echo "===== preflights ====="
          for file in "$root"/same-code-raw/*-preflight.json; do
            [ -f "$file" ] || continue
            echo "--- $file ---"
            cat "$file"
          done

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/pr257-network-gate/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
