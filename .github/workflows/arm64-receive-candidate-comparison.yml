name: ARM64 first-inline network smoke
run-name: "First-inline RTT smoke ${{ inputs.run_label }}"

# Branch-only override of an already registered dispatchable workflow.
# No default-branch change and no automatic execution on push.
on:
  workflow_dispatch:
    inputs:
      confirm_trusted_code:
        description: Run the reviewed first-inline prototype on the persistent Pi
        required: true
        default: false
        type: boolean
      expected_workflow_sha:
        description: Exact prepared commit SHA (reject a moved branch)
        required: true
        type: string
      run_label:
        description: Unique label to find this dispatch
        required: true
        type: string
      profile:
        description: Smoke is diagnostic and non-comparable; standard retains normal timings
        required: true
        default: smoke
        type: choice
        options: [smoke, standard]

permissions:
  contents: read
concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

env:
  BASE_SHA: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
  PROFILE: ${{ inputs.profile }}
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  smoke:
    if: inputs.confirm_trusted_code && github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/bench/first-inline-pi-smoke-9ad1f018'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - name: Reject unexpected workflow revision
        env:
          EXPECTED: ${{ inputs.expected_workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED"
          test "$(uname -m)" = aarch64
          for cmd in python3 mosquitto taskset git; do command -v "$cmd"; done
          python3 -c 'import sys; assert sys.version_info >= (3,11), sys.version'
          if pgrep -x mosquitto; then
            echo "Pre-existing Mosquitto: refusing to contaminate another workload. Nothing killed." >&2
            exit 1
          fi
          echo "JOB_ROOT=$RUNNER_TEMP/mqttium-inline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out exact prepared tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: smoke-tools
          persist-credentials: false
      - name: Check out A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: arm-a
          persist-credentials: false
      - name: Check out second A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: arm-a-aa
          persist-credentials: false
      - name: Check out candidate base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: arm-b
          persist-credentials: false
      - name: Check out immutable reference harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Reconstruct and verify exact prototype runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT/results"
          test "$(git -C smoke-tools rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          python3 smoke-tools/tools/first_inline_pi_smoke.py prepare --out "$JOB_ROOT/results"
          python3 -m compileall -q arm-b/src/mqttium
          python3 -m venv --system-site-packages "$JOB_ROOT/venv"
          "$JOB_ROOT/venv/bin/python" -m pip install 'psutil>=6,<8' 'paho-mqtt==2.1.0'
          "$JOB_ROOT/venv/bin/python" -m pip install --no-deps ./arm-a
          "$JOB_ROOT/venv/bin/python" -m pip freeze > "$JOB_ROOT/results/dependencies.txt"
          cp smoke-tools/tools/first-inline-runtime.patch "$JOB_ROOT/results/"

      - name: Start isolated broker and run A/A then A/B
        shell: bash
        run: |
          set -euo pipefail
          out="$JOB_ROOT/results"
          py="$JOB_ROOT/venv/bin/python"
          port="$($py -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          cat > "$out/mosquitto.conf" <<EOF
          listener $port 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          (mosquitto -h || true) > "$out/mosquitto-version.txt" 2>&1
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          broker_pid=$!
          echo "$broker_pid" > "$out/broker.pid"
          cleanup() { kill "$broker_pid" 2>/dev/null || true; wait "$broker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for _ in $(seq 1 50); do
            kill -0 "$broker_pid" || { cat "$out/mosquitto.log"; exit 1; }
            if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1
          export PYTHONPATH="$PWD/harness/src"
          overall=0
          for phase in aa ab; do
            other=arm-a-aa
            [ "$phase" = ab ] && other=arm-b
            "$py" smoke-tools/tools/first_inline_pi_smoke.py check --out "$out"
            set +e
            "$py" -m mqtt_client_bench.layout_runner \
              --worker-aslr system --entrypoint version_compare -- \
              --client mqttium --baseline-path arm-a --candidate-path "$other" \
              --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
              --pacer-mode external --blocks 2 --max-block-retries 0 --profile "$PROFILE" \
              --broker "127.0.0.1:$port" --broker-pid "$broker_pid" \
              --output "$out/$phase.json" 2>&1 | tee "$out/$phase.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$rc" > "$out/$phase.exitcode"
            if [ ! -s "$out/$phase.json" ]; then exit 1; fi
            [ "$rc" -eq 0 ] || overall=1
            # No retries based on latency. A noisy A/A does not become a
            # performance pass: A/B is collected as explicitly diagnostic data.
            "$py" smoke-tools/tools/first_inline_pi_smoke.py check --out "$out"
          done
          "$py" smoke-tools/tools/first_inline_pi_smoke.py summary --out "$out"
          exit "$overall"

      - name: Summarize even incomplete runs
        if: always() && env.JOB_ROOT != ''
        shell: bash
        run: |
          if [ -d "$JOB_ROOT/results" ] && [ -f smoke-tools/tools/first_inline_pi_smoke.py ]; then
            python3 smoke-tools/tools/first_inline_pi_smoke.py summary --out "$JOB_ROOT/results"
            cat "$JOB_ROOT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw evidence
        if: always() && env.JOB_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-inline-pi-smoke-${{ github.run_id }}
          path: ${{ env.JOB_ROOT }}/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's temporary workspace
        if: always() && env.JOB_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$JOB_ROOT" = "$RUNNER_TEMP/mqttium-inline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$JOB_ROOT"
