name: Temporary PR439 fail-fast v2

on:
  push:
    branches: [mission/investigate-tiny-peer-packet-limit]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'

      - name: Apply corrected fail-fast policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          # Engine: reject a legal-but-unusable peer limit before CONNECTED/replay.
          engine = Path('src/mqttium/protocol/engine.py')
          text = engine.read_text()
          old = '        self.inbound.configure_peer_packet_limit(self.negotiated.maximum_packet_size)\n'
          new = '''        peer_maximum_packet_size = self.negotiated.maximum_packet_size\n        if (\n            self.codec.is_mqtt5\n            and peer_maximum_packet_size is not None\n            and peer_maximum_packet_size < 4\n        ):\n            self._reauth_in_progress = False\n            self.state = ConnectionState.DISCONNECTED\n            raise MandatoryResponseTooLargeError(\n                f"Broker maximum_packet_size {peer_maximum_packet_size} is below the "\n                "4-byte minimum required for mandatory QoS acknowledgements"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected configure_peer_packet_limit call')
          engine.write_text(text.replace(old, new, 1))

          # Runtime: a reader-side capability failure while CONNECTING must wake connect().
          client = Path('src/mqttium/api/async_client.py')
          text = client.read_text()
          marker = '        except MandatoryResponseTooLargeError as exc:\n'
          insertion = '''        except MandatoryResponseTooLargeError as exc:\n            connack_fut = self._connack_fut\n            if connack_fut is not None and not connack_fut.done():\n                connack_fut.set_exception(exc)\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected MandatoryResponseTooLargeError reader handler')
          client.write_text(text.replace(marker, insertion, 1))

          # Inbound: remove the per-connection tiny-peer state and specialized branches.
          inbound = Path('src/mqttium/protocol/inbound.py')
          text = inbound.read_text()
          replacements = {
              'from typing import TYPE_CHECKING, NoReturn\n': 'from typing import TYPE_CHECKING\n',
              'from mqttium.errors import MalformedPacketError, MandatoryResponseTooLargeError, ProtocolError\n':
                  'from mqttium.errors import MalformedPacketError, ProtocolError\n',
              '        "_tiny_peer_packet_limit",\n': '',
              '        self._tiny_peer_packet_limit = False\n': '',
              '''            if self._tiny_peer_packet_limit:\n                self._raise_mandatory_response_too_large("PUBREC")\n            engine._send_ack(_encode_pubrec_success(mid))\n''':
                  '            engine._send_ack(_encode_pubrec_success(mid))\n',
              '''        if self._tiny_peer_packet_limit:\n            self._validate_slot_capacity(logical_size)\n            self._raise_mandatory_response_too_large("PUBREC")\n        self._acquire_slot(logical_size)\n''':
                  '        self._acquire_slot(logical_size)\n',
              '''        if record is None:\n            if self._tiny_peer_packet_limit:\n                self._raise_mandatory_response_too_large("PUBCOMP")\n            engine._send_ack(_encode_pubcomp_success(mid))\n            return\n''':
                  '''        if record is None:\n            engine._send_ack(_encode_pubcomp_success(mid))\n            return\n''',
              '''        if self._tiny_peer_packet_limit:\n            self._raise_mandatory_response_too_large("PUBCOMP")\n        logical_size = self._complete_stored_inbound(mid, state, "completing PUBREL")\n''':
                  '        logical_size = self._complete_stored_inbound(mid, state, "completing PUBREL")\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected inbound replacement count: {old!r} -> {text.count(old)}')
              text = text.replace(old, new, 1)

          tree = ast.parse(text)
          removable = {
              'configure_peer_packet_limit',
              '_on_qos1_auto_tiny',
              '_raise_mandatory_response_too_large',
          }
          spans = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in removable:
                  if node.end_lineno is None:
                      raise SystemExit(f'missing end line for {node.name}')
                  spans.append((node.lineno, node.end_lineno, node.name))
          if {name for _, _, name in spans} != removable:
              raise SystemExit(f'unexpected removable methods: {spans}')
          lines = text.splitlines(keepends=True)
          for start, end, _name in sorted(spans, reverse=True):
              del lines[start - 1:end]
          text = ''.join(lines)
          forbidden = (
              '_tiny_peer_packet_limit',
              'configure_peer_packet_limit',
              '_on_qos1_auto_tiny',
              '_raise_mandatory_response_too_large',
          )
          if any(name in text for name in forbidden):
              raise SystemExit('tiny peer specialization remains after edit')
          inbound.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '### Changed\n\n'
          bullet = (
              '- Fail MQTT 5 connection negotiation locally when the Server advertises '
              '`Maximum Packet Size` below 4 bytes. Such a limit is legal, but MQTTium cannot '
              'both respect it and guarantee the mandatory 4-byte PUBACK/PUBREC/PUBCOMP QoS '
              'responses. The client now raises `PacketTooLargeError` before entering '
              '`CONNECTED` instead of carrying connection-scoped tiny-peer branches until an '
              'acknowledgement is required. A limit of 4 remains supported.\n\n'
          )
          if text.count(marker) < 1:
              raise SystemExit('missing changelog Changed section')
          changelog.write_text(text.replace(marker, marker + bullet, 1))
          PY

          cat > tests/unit/test_inbound_ack_packet_size.py <<'PY'
          """MQTT 5 broker Maximum Packet Size and mandatory inbound ACKs."""

          from __future__ import annotations

          import asyncio
          from collections.abc import Iterator
          from pathlib import Path

          import pytest

          from mqttium.api.async_client import AsyncClient
          from mqttium.codec.buffer import IncrementalDecoder
          from mqttium.codec.properties import CONNACK, encode_properties
          from mqttium.enums import ConnectionState, MQTTProtocolVersion, PacketType, QoS
          from mqttium.errors import MandatoryResponseTooLargeError
          from mqttium.packets import PublishPacket, encode_frame
          from mqttium.packets._ack import encode_pubrel_success
          from mqttium.persistence.memory import InflightStore, MemoryInflightStore
          from mqttium.persistence.sqlite import SqliteInflightStore
          from mqttium.protocol.config import EngineConfig
          from mqttium.protocol.effects import EffectKind
          from mqttium.protocol.engine import ProtocolEngine
          from mqttium.protocol.reconnect import ReconnectPolicy
          from mqttium.types import Properties


          def _feed(engine: ProtocolEngine, wire: bytes) -> None:
              decoder = IncrementalDecoder()
              decoder.feed(wire)
              raw = decoder.next_packet()
              assert raw is not None
              engine.handle_raw(raw)


          def _connack(maximum_packet_size: int, *, session_present: bool = False) -> bytes:
              properties = Properties()
              properties.set("maximum_packet_size", maximum_packet_size)
              body = bytearray((int(session_present), 0))
              body.extend(encode_properties(properties, CONNACK))
              return encode_frame(PacketType.CONNACK, 0, body)


          def _new_engine(
              *, manual_ack: bool = False, store: InflightStore | None = None
          ) -> ProtocolEngine:
              return ProtocolEngine(
                  EngineConfig(
                      client_id="ack-size",
                      protocol=MQTTProtocolVersion.MQTTv5,
                      manual_ack=manual_ack,
                      clean_start=False,
                  ),
                  store=store,
              )


          def _connected_engine(
              maximum_packet_size: int = 4, *, manual_ack: bool = False
          ) -> ProtocolEngine:
              engine = _new_engine(manual_ack=manual_ack)
              engine.begin_connect()
              _feed(engine, _connack(maximum_packet_size))
              engine.take_effects()
              return engine


          def _publish(qos: QoS, mid: int = 7) -> bytes:
              return PublishPacket(
                  topic="inbound/topic",
                  payload=b"payload",
                  qos=qos,
                  retain=False,
                  dup=False,
                  mid=None if qos is QoS.AT_MOST_ONCE else mid,
              ).encode(MQTTProtocolVersion.MQTTv5)


          @pytest.mark.parametrize("maximum_packet_size", [1, 2, 3])
          def test_tiny_broker_packet_limit_fails_connection_locally(
              maximum_packet_size: int,
          ) -> None:
              engine = _new_engine()
              engine.begin_connect()
              with pytest.raises(
                  MandatoryResponseTooLargeError,
                  match=rf"maximum_packet_size {maximum_packet_size}.*4-byte minimum",
              ):
                  _feed(engine, _connack(maximum_packet_size))
              assert engine.state is ConnectionState.DISCONNECTED
              assert engine.negotiated.maximum_packet_size == maximum_packet_size
              assert engine.take_effects() == []


          def test_automatic_puback_at_exact_broker_packet_limit_is_emitted() -> None:
              engine = _connected_engine()
              _feed(engine, _publish(QoS.AT_LEAST_ONCE))
              effects = engine.take_effects()
              assert [e.data for e in effects if e.kind is EffectKind.SEND_ACK] == [
                  b"\x40\x02\x00\x07"
              ]
              assert any(e.kind is EffectKind.MESSAGE for e in effects)


          def test_qos2_at_exact_broker_packet_limit_completes_exchange() -> None:
              engine = _connected_engine()
              _feed(engine, _publish(QoS.EXACTLY_ONCE))
              first = engine.take_effects()
              assert [e.data for e in first if e.kind is EffectKind.SEND_ACK] == [
                  b"\x50\x02\x00\x07"
              ]
              assert engine.store.get_in(7) is not None
              _feed(engine, encode_pubrel_success(7))
              second = engine.take_effects()
              assert [e.data for e in second if e.kind is EffectKind.SEND_ACK] == [
                  b"\x70\x02\x00\x07"
              ]
              assert engine.store.get_in(7) is None


          def test_manual_puback_at_exact_limit_completes_record() -> None:
              engine = _connected_engine(manual_ack=True)
              _feed(engine, _publish(QoS.AT_LEAST_ONCE))
              engine.take_effects()
              engine.ack(7)
              effects = engine.take_effects()
              assert [e.data for e in effects if e.kind is EffectKind.SEND_ACK] == [
                  b"\x40\x02\x00\x07"
              ]
              assert engine.store.get_in(7) is None
              assert engine.inbound._inflight == 0


          @pytest.fixture(params=["memory", "sqlite"])
          def durable_store(
              request: pytest.FixtureRequest, tmp_path: Path
          ) -> Iterator[MemoryInflightStore | SqliteInflightStore]:
              store: MemoryInflightStore | SqliteInflightStore
              if request.param == "memory":
                  store = MemoryInflightStore()
              else:
                  store = SqliteInflightStore(tmp_path / "inflight.db")
              try:
                  yield store
              finally:
                  close = getattr(store, "close", None)
                  if close is not None:
                      close()


          def test_tiny_limit_rejects_resumed_session_before_mutating_durable_qos2(
              durable_store: MemoryInflightStore | SqliteInflightStore,
          ) -> None:
              first = _new_engine(store=durable_store)
              first.begin_connect()
              _feed(first, _connack(4))
              first.take_effects()
              _feed(first, _publish(QoS.EXACTLY_ONCE))
              first.take_effects()
              first.notify_transport_closed()
              first.take_effects()

              resumed = _new_engine(store=durable_store)
              resumed.begin_connect()
              with pytest.raises(MandatoryResponseTooLargeError):
                  _feed(resumed, _connack(3, session_present=True))
              record = durable_store.get_in(7)
              assert record is not None
              assert record.state.name == "WAIT_PUBREL"
              assert resumed.state is ConnectionState.DISCONNECTED
              assert resumed.take_effects() == []


          class _TinyLimitTransport:
              def __init__(self) -> None:
                  self._rx: asyncio.Queue[bytes] = asyncio.Queue()
                  self._closed = False
                  self._sent_connack = False
                  self.writes: list[bytes] = []

              async def write(self, data: bytes) -> None:
                  self.writes.append(bytes(data))
                  if not self._sent_connack:
                      self._sent_connack = True
                      self._rx.put_nowait(_connack(3))

              async def read(self, n: int = 65536) -> bytes:
                  return await self._rx.get()

              async def close(self) -> None:
                  if self._closed:
                      return
                  self._closed = True
                  self._rx.put_nowait(b"")

              def is_closing(self) -> bool:
                  return self._closed


          async def test_runtime_tiny_limit_fails_connect_without_reconnect_or_disconnect() -> None:
              reconnect = ReconnectPolicy(
                  enabled=True,
                  initial_delay=0.0,
                  max_delay=0.0,
                  stable_after=0.0,
                  connect_timeout=0.1,
              )
              client = AsyncClient(
                  client_id="tiny-limit-runtime",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  reconnect=reconnect,
                  keepalive=0,
              )
              transport = _TinyLimitTransport()
              connect_calls = 0

              async def factory(
                  host: str, port: int, *, ssl: object = None
              ) -> _TinyLimitTransport:
                  nonlocal connect_calls
                  connect_calls += 1
                  return transport

              client._transport_factory = factory
              with pytest.raises(MandatoryResponseTooLargeError):
                  await client.connect("fake", timeout=0.2)
              assert connect_calls == 1
              assert type(client._disconnect_exc) is MandatoryResponseTooLargeError
              assert client._reconnect_task is None
              assert transport.is_closing()
              assert len(transport.writes) == 1
          PY

          python - <<'PY'
          from pathlib import Path
          import ast

          def replace_function(path: str, name: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              tree = ast.parse(text)
              matches = [
                  node for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name
              ]
              if len(matches) != 1 or matches[0].end_lineno is None:
                  raise SystemExit(f'unexpected function {name}: {matches}')
              node = matches[0]
              lines = text.splitlines(keepends=True)
              lines[node.lineno - 1:node.end_lineno] = [replacement.rstrip() + '\n']
              p.write_text(''.join(lines))

          replace_function(
              'tests/unit/test_connection_loss_ownership.py',
              'test_impossible_pingreq_teardown_does_not_cycle_reader_and_keepalive',
              '''async def test_tiny_peer_limit_fails_before_keepalive_owner_starts() -> None:
              properties = Properties()
              properties.set("maximum_packet_size", 1)
              connack = encode_frame(
                  PacketType.CONNACK,
                  0,
                  b"\\x00\\x00" + encode_properties(properties, CONNACK),
              )
              broker = _Broker(connack=connack)
              client = AsyncClient(
                  "tiny-ping-owner",
                  protocol=MQTTProtocolVersion.MQTTv5,
                  keepalive=1,
                  reconnect=ReconnectPolicy(enabled=False),
              )

              async def factory(host: str, port: int, *, ssl=None):
                  return broker

              client._transport_factory = factory
              try:
                  with pytest.raises(PacketTooLargeError):
                      await client.connect("fake", 1, timeout=1.0)
                  stats = client.stats()
                  assert not client.is_connected
                  assert client._keepalive_task is None
                  assert client._reconnect_task is None
                  assert not any(
                      (
                          stats.tasks.reader,
                          stats.tasks.writer,
                          stats.tasks.keepalive,
                          stats.tasks.reconnect,
                          stats.tasks.effect_flush,
                          stats.tasks.callback_worker,
                      )
                  )
                  assert stats.writer.waiters == 0
                  assert stats.effects.waiters == 0
                  assert stats.delivery.waiters == 0
              finally:
                  await _cleanup(client)
          ''',
          )

          replace_function(
              'tests/unit/test_protocol_validation_contracts.py',
              'test_pingreq_honors_negotiated_maximum_packet_size',
              '''def test_tiny_peer_limit_fails_before_pingreq() -> None:
              engine = ProtocolEngine(
                  EngineConfig(client_id="packet-size", protocol=MQTTProtocolVersion.MQTTv5)
              )
              engine.begin_connect()
              properties = Properties()
              properties.set("maximum_packet_size", 1)
              with pytest.raises(PacketTooLargeError):
                  _feed(engine, _connack_v5(properties))
              assert engine.state is ConnectionState.DISCONNECTED
              assert engine.take_effects() == []
          ''',
          )
          PY

          rm tests/unit/test_tiny_packet_limit_edge_cases.py
          ruff format src/mqttium/api/async_client.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_inbound_ack_packet_size.py tests/unit/test_connection_loss_ownership.py tests/unit/test_protocol_validation_contracts.py
          ruff check src/mqttium/api/async_client.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_inbound_ack_packet_size.py tests/unit/test_connection_loss_ownership.py tests/unit/test_protocol_validation_contracts.py
          git diff --check
          grep -RInE '_tiny_peer_packet_limit|configure_peer_packet_limit|_on_qos1_auto_tiny|_raise_mandatory_response_too_large' src && exit 1 || true

      - name: Focused and full unit qualification
        run: |
          python -m pytest -q tests/unit/test_inbound_ack_packet_size.py tests/unit/test_pubrel_packet_limit.py tests/unit/test_connection_failure_policy.py tests/unit/test_control_packet_size_lifecycle.py tests/unit/test_connection_loss_ownership.py tests/unit/test_protocol_validation_contracts.py
          python -m pytest -q tests/unit

      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/tmp-pr439-failfast-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: fail fast on unusable MQTT 5 peer packet limit'
          git push origin HEAD:mission/investigate-tiny-peer-packet-limit
