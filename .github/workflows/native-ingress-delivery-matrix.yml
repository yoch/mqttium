name: Native ingress delivery matrix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - benchmarks/experimental/native_ingress_delivery_matrix.py
      - .github/workflows/native-ingress-delivery-matrix.yml

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out study harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: main
          path: runtime
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gmqtt
        run: python -m pip install gmqtt==0.7.0
      - name: Record revisions
        run: |
          mkdir -p /tmp/mqttium-ingress-matrix
          {
            echo "harness=$(git -C harness rev-parse HEAD)"
            echo "runtime=$(git -C runtime rev-parse HEAD)"
            python --version
            python -m pip show gmqtt | grep '^Version:'
          } | tee /tmp/mqttium-ingress-matrix/revisions.txt
      - name: Run rotated fresh-process matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime/src
        run: |
          python harness/benchmarks/experimental/native_ingress_delivery_matrix.py \
            --root runtime \
            --cycles 3 \
            --output /tmp/mqttium-ingress-matrix/native-ingress-delivery.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ingress-delivery-${{ github.run_id }}
          path: /tmp/mqttium-ingress-matrix/*
          if-no-files-found: warn
          retention-days: 30
