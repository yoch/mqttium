name: ChatGPT Persistent Workbench

on:
  repository_dispatch:
    types: [cgw-command]
  pull_request:
    paths:
      - .github/chatgpt-workbench/processor.py
      - .github/workflows/cgw-command.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cgw-${{ github.repository }}-${{ github.event.client_payload.pull_request.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  controller-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Python syntax
        run: python -m py_compile .github/chatgpt-workbench/processor.py

      - name: Exercise Docker bind mounts
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "$RUNNER_TEMP/cgw-controller-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_root"' EXIT
          workspace="$smoke_root/workspace"
          cache="$smoke_root/cache"
          mkdir -p "$workspace" "$cache"
          echo "host file" > "$workspace/input.txt"

          python - "$workspace" "$cache" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          processor_path = Path(".github/chatgpt-workbench/processor.py")
          spec = importlib.util.spec_from_file_location("cgw_processor", processor_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Cannot load processor.py")
          processor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(processor)

          completed = processor.docker_command(
              Path(sys.argv[1]),
              Path(sys.argv[2]),
              {
                  "name": "controller smoke",
                  "image": "ubuntu:24.04",
                  "command": """
          set -e
          test "$(cat input.txt)" = "host file"
          echo "written from container" > output.txt
          mkdir -p "$XDG_CACHE_HOME"
          echo "cache works" > "$XDG_CACHE_HOME/test.txt"
          """,
                  "timeout": 120,
                  "network": False,
              },
          )
          print(completed.stdout, end="")
          print(completed.stderr, end="", file=sys.stderr)
          raise SystemExit(completed.returncode)
          PY

          test "$(cat "$workspace/output.txt")" = "written from container"
          test "$(cat "$cache/xdg/test.txt")" = "cache works"
          test "$(stat -c %u "$workspace/output.txt")" = "$(id -u)"
          test "$(stat -c %g "$workspace/output.txt")" = "$(id -g)"

  workbench:
    if: github.event_name == 'repository_dispatch'
    runs-on:
      - self-hosted
      - linux
      - ${{ vars.CGW_RUNNER_ARCH || 'x64' }}
      - ${{ vars.CGW_RUNNER_LABEL || 'cgw' }}
    timeout-minutes: 120
    env:
      CGW_ROOT: ${{ vars.CGW_ROOT || '/home/yoch/chatgpt-workbench' }}
      CGW_ALLOWED_IMAGES: ${{ vars.CGW_ALLOWED_IMAGES || 'python:3.12-bookworm,node:24-bookworm,ubuntu:24.04' }}
      CGW_DOCKER_SNAP_COMPAT: ${{ vars.CGW_DOCKER_SNAP_COMPAT || 'false' }}
      CGW_DOCKER_UID: ${{ vars.CGW_DOCKER_UID }}
      CGW_DOCKER_GID: ${{ vars.CGW_DOCKER_GID }}
      CGW_JOB_BRANCH: chatgpt-workbench-jobs
      CGW_REPOSITORY: ${{ github.repository }}
      CGW_PR_NUMBER: ${{ github.event.client_payload.pull_request.number }}
      CGW_HEAD_REF: ${{ github.event.client_payload.pull_request.head.ref }}
      CGW_HEAD_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
      CGW_HEAD_REPO: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
      CGW_JOB_ID: ${{ github.event.client_payload.slash_command.args.named.job }}
      CGW_ISSUE_NUMBER: ${{ github.event.client_payload.github.payload.issue.number }}
      CGW_COMMENT_ID: ${{ github.event.client_payload.github.payload.comment.id }}
      CGW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Reject invalid dispatch
        run: |
          set -euo pipefail
          test -n "$CGW_JOB_ID"
          test "$CGW_HEAD_REPO" = "$CGW_REPOSITORY"
          [[ "$CGW_JOB_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]]

      - name: Check out trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Fetch, apply, and validate
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python control/.github/chatgpt-workbench/processor.py execute

      - name: Commit and push
        id: push
        if: steps.execute.outcome == 'success'
        env:
          CGW_PUSH_TOKEN: ${{ secrets.CGW_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          python control/.github/chatgpt-workbench/processor.py push

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cgw-${{ env.CGW_JOB_ID }}-${{ github.run_id }}
          path: ${{ env.CGW_ROOT }}/results/${{ github.repository }}/${{ env.CGW_JOB_ID }}
          if-no-files-found: warn
          retention-days: 30

      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          python control/.github/chatgpt-workbench/processor.py comment

      - name: Fail unsuccessful workbench run
        if: always()
        run: |
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.push.outcome }}" = "success"
