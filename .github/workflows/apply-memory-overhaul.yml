name: Apply memory overhaul bundle

on:
  push:
    branches:
      - agent/memory-profile-overhaul
    paths:
      - .mqttium-agent/apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/memory-profile-overhaul
          fetch-depth: 0
      - name: Apply staged source bundle
        run: |
          cat .mqttium-agent/part-* | base64 -d > /tmp/mqttium-changes.tar.gz
          tar -xzf /tmp/mqttium-changes.tar.gz
          rm -rf .mqttium-agent
          rm .github/workflows/apply-memory-overhaul.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound retained memory across MQTT pipelines"
          git push origin HEAD:agent/memory-profile-overhaul
