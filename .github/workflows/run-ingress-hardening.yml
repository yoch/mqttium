name: Run ingress hardening
on:
  push:
    branches:
      - perf/direct-decoder-ingress-prototype
    paths:
      - .github/workflows/run-ingress-hardening.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/direct-decoder-ingress-prototype
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply and validate
        run: |
          set -euo pipefail
          python tools/_apply_ingress_final.py
          python -m pip install -e '.[dev]' >/dev/null
          ruff format src/mqttium/codec/vbi.py src/mqttium/codec/buffer.py src/mqttium/transport/_push.py tests/unit/test_decoder_ingress_storage.py
          ruff check src/mqttium/codec/vbi.py src/mqttium/codec/buffer.py src/mqttium/transport/_push.py tests/unit/test_decoder_ingress_storage.py
          mypy src/mqttium
          pytest -q tests/unit/test_decoder_ingress_storage.py tests/unit/test_decoder_push_transport.py
      - name: Commit
        run: |
          set -euo pipefail
          rm -f tools/_apply_ingress_final.py
          rm -f .github/workflows/final-ingress-hardening.yml
          rm -f .github/workflows/run-ingress-hardening.yml
          git config user.name 'mqttium implementation agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound decoder framing to committed ingress bytes'
          git push origin HEAD:perf/direct-decoder-ingress-prototype
