name: PR 8 verified fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/pr8_autofix.py
      - .github/workflows/pr8-run.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply fixes
        run: python .github/pr8_autofix.py
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,security]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Format and static checks
        run: |
          ruff format src/mqttium/api/async_client.py src/mqttium/compat/paho.py src/mqttium/protocol/engine.py tests/unit/test_compat_publish_perf.py tests/integration/test_compat_publish_perf.py
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
      - name: Unit tests
        run: python -m pytest -q tests/unit --cov=mqttium --cov-report=term-missing --cov-fail-under=80
      - name: Start Mosquitto
        run: |
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosq-pr8.conf
          mosquitto -c /tmp/mosq-pr8.conf -d
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Integration tests
        run: python -m pytest -q tests/integration
      - name: Commit verified fixes
        run: |
          rm -f .github/pr8_autofix.py .github/workflows/pr8-autofix.yml .github/workflows/pr8-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix compat publish concurrency and callback ordering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
