name: PR454 isolated candidate assembly
on:
  push:
    branches: [work/pr454-assemble]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/work/pr454-assemble'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e371972fdaf6a4783b511227428ddfe654b4ba6a
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply the locally tested exact patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          base = 'e371972fdaf6a4783b511227428ddfe654b4ba6a'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'b5cc2813a0cf61fc008fe475d3aed4c65d4a9f2a9b7b4ddd1a1c6e793d774582'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          expected = {'src/mqttium/api/async_client.py':'f271d5c5fa703cfd86c11f3fb7feaca108a3921b','tests/unit/test_callback_route_reconfiguration.py':'345251c437c2e480d639cbad63317b09a7bbfad7','tests/unit/test_topic_callback_dispatch_contract.py':'ebcfeb57c839d130c20674da5547b9ca6cb9e5ff','tests/unit/test_topic_callbacks.py':'1da7c4aa7948b2cf852465b8084c6685a79e578f','docs/reference/async-client.md':'6e0a9918e2989152e96cf5d7cd6b41770391c418','docs/migration.md':'8c2cd78d532a7fd8b4c66ccd7877811c02551ead','CHANGELOG.md':'56092fdf60b8ecb8d5094dc260131d494f4db11d'}
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(expected)
          for name, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', name], text=True).strip() == sha, name
          (path.parent / 'candidate-paths.json').write_text(json.dumps(list(expected)))
          print('EXACT_LOCAL_CANDIDATE_VERIFIED', base)
          PY
      - run: python -m pip install -e '.[dev,fuzz,security,docs]'
      - name: Format only the candidate files and check source quality
        run: |
          set -euo pipefail
          ruff format src/mqttium/api/async_client.py tests/unit/test_callback_route_reconfiguration.py tests/unit/test_topic_callback_dispatch_contract.py tests/unit/test_topic_callbacks.py
          ruff check src tests benchmarks tools
          mypy src/mqttium
          bandit -q -ll -r src
          git diff --check
          mkdocs build --strict
      - name: Unit and project tests on the candidate checkout
        run: python -m pytest -q tests/unit tests/project
      - name: Seeded and stateful fuzz
        run: |
          set -euo pipefail
          PYTHONPATH=src python tests/fuzz/fuzz.py --seed 1 --iterations 20000
          python -m pytest -q tests/fuzz
      - name: Store verified candidate blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, shutil, subprocess, urllib.request
          base = 'e371972fdaf6a4783b511227428ddfe654b4ba6a'
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          paths = json.loads((temp / 'candidate-paths.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(paths)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          out = temp / 'pr454-candidate'
          out.mkdir()
          manifest = {'base': base, 'tree': tree, 'files': []}
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/yoch/mqttium/git/blobs', data=json.dumps({'content':base64.b64encode(data).decode(), 'encoding':'base64'}).encode(), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              assert actual == sha, name
              destination = out / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              manifest['files'].append({'path':name,'sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          (out / 'candidate.diff').write_bytes(subprocess.check_output(['git', 'diff', '--cached', base]))
          print('VERIFIED_CANDIDATE_MANIFEST=' + json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr454-verified-candidate
          path: ${{ runner.temp }}/pr454-candidate/
          if-no-files-found: error
          retention-days: 7
