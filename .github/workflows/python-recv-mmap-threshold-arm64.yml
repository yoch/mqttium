name: Python recv mmap threshold ARM64

on:
  push:
    branches: [bench/asyncio-recv-arm64-repro]
    paths: [.github/workflows/python-recv-mmap-threshold-arm64.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-regime-rpi5
  cancel-in-progress: false

jobs:
  threshold:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    steps:
      - name: Standalone deterministic recv test
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/recv-threshold-$GITHUB_RUN_ID"
          mkdir -p "$d"
          echo "RESULTS_DIR=$d" >> "$GITHUB_ENV"
          cat > "$d/repro.py" <<'PY'
          import argparse, json, os, resource, socket, time

          def exact(s, n):
              b = bytearray()
              while len(b) < n:
                  x = s.recv(n-len(b))
                  if not x: raise EOFError
                  b.extend(x)
              return b

          def server(path):
              s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('127.0.0.1',0)); s.listen()
              open(path,'w').write(str(s.getsockname()[1]))
              while True:
                  c,_=s.accept()
                  with c:
                      c.setsockopt(socket.IPPROTO_TCP,socket.TCP_NODELAY,1)
                      n=int.from_bytes(exact(c,8),'big')
                      for _ in range(n):
                          c.sendall(b'x'*256); exact(c,1)

          def client(port, size, count):
              s=socket.create_connection(('127.0.0.1',port)); s.setsockopt(socket.IPPROTO_TCP,socket.TCP_NODELAY,1)
              s.sendall(count.to_bytes(8,'big'))
              a=resource.getrusage(resource.RUSAGE_SELF); t=time.perf_counter()
              for _ in range(count):
                  if len(s.recv(size)) != 256: raise RuntimeError('short')
                  s.sendall(b'A')
              dt=time.perf_counter()-t; b=resource.getrusage(resource.RUSAGE_SELF)
              print(json.dumps({'size':size,'count':count,'minflt':b.ru_minflt-a.ru_minflt,'minflt_per_read':(b.ru_minflt-a.ru_minflt)/count,'stime_us_per_read':(b.ru_stime-a.ru_stime)*1e6/count,'us_per_read':dt*1e6/count,'tunables':os.environ.get('GLIBC_TUNABLES','')}))

          p=argparse.ArgumentParser(); p.add_argument('mode'); p.add_argument('arg'); a=p.parse_args()
          if a.mode=='server': server(a.arg)
          else: client(int(a.arg), int(os.environ.get('READ_SIZE','262144')), int(os.environ.get('COUNT','10000')))
          PY
          python3 "$d/repro.py" server "$d/port" & echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 100); do [ -s "$d/port" ] && break; sleep .05; done
          port=$(cat "$d/port")
          out="$d/results.jsonl"; : > "$out"
          for rep in $(seq 1 8); do
            for spec in \
              'glibc.malloc.mmap_threshold=65536 262144 mmap64k_read256k' \
              'glibc.malloc.mmap_threshold=131072 262144 mmap128k_read256k' \
              'glibc.malloc.mmap_threshold=262144 262144 mmap256k_read256k' \
              'glibc.malloc.mmap_threshold=1048576 262144 mmap1m_read256k' \
              'glibc.malloc.mmap_threshold=32768 65536 mmap32k_read64k' \
              'glibc.malloc.mmap_threshold=65536 65536 mmap64k_read64k'; do
              set -- $spec; tun=$1; size=$2; label=$3
              printf '{"label":"%s","measurement":' "$label" >> "$out"
              GLIBC_TUNABLES="$tun" READ_SIZE="$size" COUNT=10000 taskset -c 0 python3 "$d/repro.py" client "$port" | sed 's/}$/}/' >> "$out.tmp"
              python3 - "$label" "$out.tmp" >> "$out" <<'PY'
          import json,sys
          label=sys.argv[1]; p=sys.argv[2]
          r=json.loads(open(p).read().strip()); r['label']=label
          print(json.dumps(r))
          open(p,'w').close()
          PY
            done
          done
          cat "$out"
      - name: Strace deterministic arms
        shell: bash
        run: |
          set -euo pipefail
          port=$(cat "$RESULTS_DIR/port")
          for spec in '131072 slow' '1048576 fast'; do
            set -- $spec; thr=$1; label=$2
            GLIBC_TUNABLES="glibc.malloc.mmap_threshold=$thr" READ_SIZE=262144 COUNT=2000 \
              taskset -c 0 strace -qq -c -e trace=mmap,mremap,munmap,recvfrom,brk \
              -o "$RESULTS_DIR/strace-$label.txt" python3 "$RESULTS_DIR/repro.py" client "$port" > "$RESULTS_DIR/strace-$label.json"
          done
          cat "$RESULTS_DIR"/strace-*.txt
      - name: Stop and save
        if: always()
        shell: bash
        run: '[ -n "${SERVER_PID:-}" ] && kill "$SERVER_PID" 2>/dev/null || true'
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-recv-threshold-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 14
