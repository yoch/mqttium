name: PR434 exact persistence benchmark

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'mission/persistence-contract-pruning' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package metadata
        run: python -m pip install -e .
      - name: Prepare exact worktrees
        env:
          BASE: 7d917547b491c8e521d1d82960b1e10810e4bd80
          CANDIDATE: 5aadffe90e06cff7e91b75d665a2e81764222f53
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$CANDIDATE^{commit}"
          git worktree add --detach "$RUNNER_TEMP/pr434-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/pr434-candidate" "$CANDIDATE"
          test "$(git -C "$RUNNER_TEMP/pr434-base" rev-parse HEAD)" = "$BASE"
          test "$(git -C "$RUNNER_TEMP/pr434-candidate" rev-parse HEAD)" = "$CANDIDATE"
      - name: A/A then A/B persistence benchmark
        env:
          BASE: 7d917547b491c8e521d1d82960b1e10810e4bd80
          CANDIDATE: 5aadffe90e06cff7e91b75d665a2e81764222f53
        run: |
          set -euo pipefail
          python .github/pr434_commit_benchmark.py \
            --base-root "$RUNNER_TEMP/pr434-base" \
            --candidate-root "$RUNNER_TEMP/pr434-candidate" \
            --base-sha "$BASE" \
            --candidate-sha "$CANDIDATE" \
            --repeat 7 \
            --ack-memory 20000 \
            --ack-sqlite 3000 \
            --replay-memory 4000 \
            --replay-sqlite 2000 \
            --payload 4096 \
            --output "$RUNNER_TEMP/pr434-benchmark.json"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr434-persistence-benchmark
          path: ${{ runner.temp }}/pr434-benchmark.json
          if-no-files-found: error
          retention-days: 7
