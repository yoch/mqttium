name: ARM64 Point 4 Targeted Evidence

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact pre-point-4 baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact point-4 candidate commit SHA
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm both reviewed SHAs are trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  targeted:
    # This branch is explicitly reviewed for point-4 evidence. Exact SHAs are
    # validated below before any candidate code runs on the persistent runner.
    if: >-
      inputs.confirm_trusted_code &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/codex/eager-inbound-protocol-responses')
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-point4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "all refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] not in ((3, 13), (3, 14)):
              raise SystemExit(f"expected Python 3.13/3.14, got {sys.version}")
          PY
          command -v mosquitto
          command -v taskset
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate paired evidence." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce quiet-runner preflight
        run: |
          python candidate/benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" --require-temperature --enforce

      - name: Start isolated Mosquitto pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$JOB_ROOT/mosquitto.log" 2>&1 &
          echo "$!" > "$JOB_ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          cat "$JOB_ROOT/mosquitto.log"
          exit 1

      - name: Strict response-socket A/A control
        run: |
          python candidate/benchmarks/paired_protocol_response_socket.py \
            --base-root base --candidate-root base \
            --repeat 8 --count 10000 --timeout 20 \
            --broker-cpu 1 --client-cpu 2 --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/response-socket-aa.json"

      - name: Strict response-socket A/B gate
        run: |
          python candidate/benchmarks/paired_protocol_response_socket.py \
            --base-root base --candidate-root candidate \
            --repeat 8 --count 10000 --timeout 20 \
            --broker-cpu 1 --client-cpu 2 --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/response-socket-ab.json"

      - name: Strict QoS capacity A/A control
        run: |
          python candidate/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base \
            --protocol 311 --qos-values 0,1,2 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 --count-qos2 20000 \
            --min-completed-ratio 0.99 --max-completed-ratio 1.01 \
            --max-cpu-per-message-ratio 1.01 --max-aa-ratio-deviation 0.01 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/capacity-aa.json"

      - name: Strict QoS capacity A/B gate
        run: |
          python candidate/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --protocol 311 --qos-values 0,1,2 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 --count-qos2 20000 \
            --min-completed-ratio 0.99 --max-completed-ratio 1.01 \
            --max-cpu-per-message-ratio 1.01 --max-aa-ratio-deviation 0.01 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/capacity-ab.json"

      - name: Upload targeted measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a # v7
        with:
          name: arm64-point4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-point4-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/mqttium-point4-${{ github.run_id }}-${{ github.run_attempt }}/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$JOB_ROOT/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
