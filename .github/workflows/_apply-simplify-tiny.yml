name: Apply packet-limit simplification

on:
  push:
    branches:
      - agent/simplify-tiny-packet-limit-handling

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/agent/simplify-tiny-packet-limit-handling'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Apply validated refactor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "544355a7ba32a1340e9e8a3936e86ce335d5eb21"
          python - <<'PY'
          import base64
          from pathlib import Path

          patch = ""
          Path("/tmp/refactor.patch").write_bytes(base64.b64decode(patch))
          PY
          git apply --check /tmp/refactor.patch
          git apply /tmp/refactor.patch
          rm .github/workflows/_apply-simplify-tiny.yml
          test "$(git hash-object src/mqttium/protocol/engine.py)" = "b8825b6e4f4dfdfff334aa2ba08a5e84ee63b562"
          test "$(git hash-object src/mqttium/protocol/inbound.py)" = "2f4a2d70563a9480f9dfe97e59d0247feb9b5eef"
          test ! -e src/mqttium/protocol/tiny_packet_limit.py
          git diff --check
          python -m compileall -q src/mqttium
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify tiny packet-limit inbound handling"
          git push origin HEAD:agent/simplify-tiny-packet-limit-handling
