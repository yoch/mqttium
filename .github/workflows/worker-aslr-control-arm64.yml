name: Worker ASLR slow-regime control ARM64

on:
  push:
    branches: [bench/rc13-slow-regime-bisect]
    paths: [.github/workflows/worker-aslr-control-arm64.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-regime-rpi5
  cancel-in-progress: false

jobs:
  control:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 180
    env:
      BENCH_SHA: 14ada0d59ac16649ea785bd945a92b4a8202d738
      SUT_SHA: 4560e44aeb24b8a4f7f6ce903766579fac481cbd
      TARGET_RATE: "3942"
      BROKER_PORT: "11883"

    steps:
      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mqttium-aslr-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dir"
          echo "RESULTS_DIR=$dir" >> "$GITHUB_ENV"
          echo "VENV_DIR=$RUNNER_TEMP/mqttium-aslr-control-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          {
            date -u --iso-8601=seconds
            uname -a
            lscpu
            python3 --version
            command -v setarch
            setarch --version
            echo governors; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
            echo frequencies; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq 2>/dev/null || true
            echo temperature; cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || true
            uptime
            free -h
          } | tee "$dir/environment.txt"
          test "$(uname -m)" = aarch64

      - name: Checkout ASLR-control harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Checkout identical RC13 arm A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.SUT_SHA }}
          path: rc13a
          persist-credentials: false

      - name: Checkout identical RC13 arm B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.SUT_SHA }}
          path: rc13b
          persist-credentials: false

      - name: Verify immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(git -C rc13a rev-parse HEAD)" = "$SUT_SHA"
          test "$(git -C rc13b rev-parse HEAD)" = "$SUT_SHA"
          test -z "$(git -C harness status --porcelain --untracked-files=no)"
          test -z "$(git -C rc13a status --porcelain --untracked-files=no)"
          test -z "$(git -C rc13b status --porcelain --untracked-files=no)"
          printf 'harness=%s\nsut_a=%s\nsut_b=%s\n' "$BENCH_SHA" "$SUT_SHA" "$SUT_SHA" | tee "$RESULTS_DIR/provenance.txt"

      - name: Prepare and verify harness ASLR control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$VENV_DIR"
          . "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './harness[mqttium]' 'psutil>=6,<8'
          PYTHONPATH=harness/src python -m unittest -v \
            harness.tests.test_aslr_runner \
            harness.tests.test_quality \
            harness.tests.test_version_compare \
            harness.tests.test_pacing \
            harness.tests.test_rtt_initiator
          PYTHONPATH=harness/src python - <<'PY' | tee "$RESULTS_DIR/aslr-preflight.txt"
          from mqtt_client_bench.aslr_runner import ADDR_NO_RANDOMIZE, _disabled_personality
          value = _disabled_personality()
          print(f"verified_personality=0x{value:08x}")
          assert value & ADDR_NO_RANDOMIZE
          PY

      - name: Start native Mosquitto 2.1.2 and host sampler
        shell: bash
        run: |
          set -euo pipefail
          { mosquitto -h 2>&1 || true; } | head -n 4 | tee "$RESULTS_DIR/broker-version.txt"
          grep -q 'version 2\.1\.2' "$RESULTS_DIR/broker-version.txt" || { echo 'Mosquitto 2.1.2 required' >&2; exit 1; }
          if pgrep -a mosquitto; then
            echo 'pre-existing Mosquitto would contaminate the run' >&2
            exit 1
          fi
          cat > "$RESULTS_DIR/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          taskset -c 1 mosquitto -c "$RESULTS_DIR/mosquitto.conf" > "$RESULTS_DIR/mosquitto.log" 2>&1 &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"
          pid=$!
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1:11883) >/dev/null 2>&1 && break || true
            kill -0 "$pid" 2>/dev/null || { cat "$RESULTS_DIR/mosquitto.log"; exit 1; }
            sleep 0.2
          done
          kill -0 "$pid"
          (while true; do
            printf 'ts=%s temp=' "$(date +%s.%N)"
            cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | tr '\n' ' ' || true
            printf 'freq='; cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null | tr '\n' ' ' || true
            printf 'load='; cat /proc/loadavg
            sleep 1
          done) >> "$RESULTS_DIR/host-samples.txt" 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

      - name: Measure phase 1 normal then disabled
        shell: bash
        run: |
          set -euo pipefail
          . "$VENV_DIR/bin/activate"
          for item in '1 normal' '2 disabled'; do
            set -- $item; seg=$1; mode=$2
            PYTHONPATH=harness/src python -m mqtt_client_bench.aslr_runner --aslr "$mode" -- \
              --client mqttium --baseline-path rc13a --candidate-path rc13b \
              --scenario application_rtt_fixed_rate --variant-index 0 \
              --target-rate "$TARGET_RATE" --pacer-mode external \
              --blocks 2 --max-block-retries 1 --profile standard \
              --broker 127.0.0.1:11883 --broker-pid "$BROKER_PID" \
              --output "$RESULTS_DIR/aslr-${seg}-${mode}.json" \
              | tee "$RESULTS_DIR/aslr-${seg}-${mode}.txt"
            sleep 5
          done

      - name: Save phase 1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqttium-aslr-control-phase1-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 14

      - name: Measure phase 2 disabled then normal
        shell: bash
        run: |
          set -euo pipefail
          . "$VENV_DIR/bin/activate"
          for item in '3 disabled' '4 normal'; do
            set -- $item; seg=$1; mode=$2
            PYTHONPATH=harness/src python -m mqtt_client_bench.aslr_runner --aslr "$mode" -- \
              --client mqttium --baseline-path rc13a --candidate-path rc13b \
              --scenario application_rtt_fixed_rate --variant-index 0 \
              --target-rate "$TARGET_RATE" --pacer-mode external \
              --blocks 2 --max-block-retries 1 --profile standard \
              --broker 127.0.0.1:11883 --broker-pid "$BROKER_PID" \
              --output "$RESULTS_DIR/aslr-${seg}-${mode}.json" \
              | tee "$RESULTS_DIR/aslr-${seg}-${mode}.txt"
            sleep 5
          done

      - name: Save phase 2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqttium-aslr-control-phase2-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 14

      - name: Measure phase 3 normal then disabled
        shell: bash
        run: |
          set -euo pipefail
          . "$VENV_DIR/bin/activate"
          for item in '5 normal' '6 disabled'; do
            set -- $item; seg=$1; mode=$2
            PYTHONPATH=harness/src python -m mqtt_client_bench.aslr_runner --aslr "$mode" -- \
              --client mqttium --baseline-path rc13a --candidate-path rc13b \
              --scenario application_rtt_fixed_rate --variant-index 0 \
              --target-rate "$TARGET_RATE" --pacer-mode external \
              --blocks 2 --max-block-retries 1 --profile standard \
              --broker 127.0.0.1:11883 --broker-pid "$BROKER_PID" \
              --output "$RESULTS_DIR/aslr-${seg}-${mode}.json" \
              | tee "$RESULTS_DIR/aslr-${seg}-${mode}.txt"
            sleep 5
          done

      - name: Summarize causal control
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee "$RESULTS_DIR/summary.json"
          import glob, json, statistics
          rows = {"normal": [], "disabled": []}
          for path in sorted(glob.glob("${{ env.RESULTS_DIR }}/aslr-*.json")):
              data = json.load(open(path))
              mode = data.get("role_process_layout", {}).get("aslr_mode")
              if mode not in rows:
                  continue
              for run in data.get("runs", []):
                  if not run.get("active_for_verdict") or not run.get("version_ab_observation_usable"):
                      continue
                  p50 = float(run["comparison_value"])
                  effects = 0
                  voluntary = 0
                  for worker in run.get("workers", []):
                      effects += int((((worker.get("runtime") or {}).get("library") or {}).get("effects") or {}).get("batches") or 0)
                  telemetry = run.get("telemetry") or []
                  if len(telemetry) >= 2:
                      first = telemetry[0].get("processes") or {}
                      last = telemetry[-1].get("processes") or {}
                      for key in ("w0", "w1"):
                          voluntary += int((last.get(key) or {}).get("voluntary_ctxt_switches") or 0) - int((first.get(key) or {}).get("voluntary_ctxt_switches") or 0)
                  rows[mode].append({"p50_ms": p50, "effect_batches": effects, "voluntary_ctxt_switches": voluntary})
          out = {}
          for mode, values in rows.items():
              p50 = [v["p50_ms"] for v in values]
              out[mode] = {
                  "qualified_slots": len(values),
                  "slow_slots_ge_0_285_ms": sum(v >= 0.285 for v in p50),
                  "slow_fraction": (sum(v >= 0.285 for v in p50) / len(p50)) if p50 else None,
                  "p50_ms_median": statistics.median(p50) if p50 else None,
                  "p50_ms_min": min(p50) if p50 else None,
                  "p50_ms_max": max(p50) if p50 else None,
                  "effect_batches_median": statistics.median(v["effect_batches"] for v in values) if values else None,
                  "voluntary_ctxt_switches_median": statistics.median(v["voluntary_ctxt_switches"] for v in values) if values else None,
              }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Stop processes
        if: always()
        shell: bash
        run: |
          kill "${SAMPLER_PID:-}" 2>/dev/null || true
          kill "${BROKER_PID:-}" 2>/dev/null || true
          wait "${SAMPLER_PID:-}" 2>/dev/null || true
          wait "${BROKER_PID:-}" 2>/dev/null || true

      - name: Save final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqttium-aslr-control-final-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          retention-days: 14
