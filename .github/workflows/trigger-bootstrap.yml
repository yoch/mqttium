name: Trigger MQTTium bootstrap

on:
  pull_request_target:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bootstrap-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/bootstrap.yml/dispatches" \
            -d '{"ref":"main"}'
