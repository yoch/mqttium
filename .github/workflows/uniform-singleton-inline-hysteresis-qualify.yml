name: Uniform singleton-inline hysteresis qualification
on:
  push:
    branches: [bench/uniform-singleton-inline-hysteresis-fd37]
    paths:
      - .github/apply-uniform-singleton-inline-hysteresis.py
      - .github/uniform-singleton-inline-hysteresis-test.py
      - .github/workflows/uniform-singleton-inline-hysteresis-qualify.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Apply exact one-file runtime ablation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD fd37ed3fff3895adca0e33c3eacc34e611e7a316)" = fd37ed3fff3895adca0e33c3eacc34e611e7a316
          python .github/apply-uniform-singleton-inline-hysteresis.py src/mqttium/api/_delivery.py > /tmp/preformat-sha256.txt
          cp .github/uniform-singleton-inline-hysteresis-test.py tests/unit/test_singleton_inline_hysteresis.py
          git diff --check
          test "$(git diff --name-only)" = src/mqttium/api/_delivery.py
      - name: Lint focused semantics and hotpath ownership rates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format src/mqttium/api/_delivery.py tests/unit/test_singleton_inline_hysteresis.py
          ruff format --check src/mqttium/api/_delivery.py tests/unit/test_singleton_inline_hysteresis.py
          ruff check src/mqttium/api/_delivery.py tests/unit/test_singleton_inline_hysteresis.py
          sha256sum src/mqttium/api/_delivery.py | tee /tmp/runtime-sha256.txt
          python -m pytest -q tests/unit/test_singleton_inline_hysteresis.py -W error
          python - <<'PY' | tee /tmp/hotpath-rates.json
          import asyncio, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('benchmarks').resolve()))
          from hotpath_recon import _run_qos1_inbound_reply
          from mqttium.enums import MQTTProtocolVersion

          async def main():
              serial = await _run_qos1_inbound_reply(
                  protocol=MQTTProtocolVersion.MQTTv311,
                  outstanding=1, count=40, warmup=4, coalesce=False, instrument=True,
              )
              burst = await _run_qos1_inbound_reply(
                  protocol=MQTTProtocolVersion.MQTTv311,
                  outstanding=8, count=64, warmup=8, coalesce=True, instrument=True,
              )
              out = {
                  'serial_inline_rate': serial['counters']['callback_inline_rate'],
                  'coalesced_inline_rate': burst['counters']['callback_inline_rate'],
                  'serial_ops_per_s': serial['ops_per_s'],
                  'coalesced_ops_per_s': burst['ops_per_s'],
              }
              print(json.dumps(out, sort_keys=True))
              assert out['serial_inline_rate'] == 1.0
              assert out['coalesced_inline_rate'] == 0.0
          asyncio.run(main())
          PY
      - name: Full repository suite; permit only explicit worker-policy inversions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q -W error 2>&1 | tee /tmp/full-suite.log
          pytest_rc=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/full-suite.log').read_text()
          failures = [line for line in text.splitlines() if line.startswith('FAILED ')]
          exact = {
              'FAILED tests/unit/test_effect_pump.py::test_idle_sync_message_callback_runs_in_worker_after_engine_lock',
              'FAILED tests/unit/test_hotpath_recon.py::test_qos1_inbound_reply_serial_uses_uniform_worker',
          }
          uniform_prefix = (
              'FAILED tests/unit/test_uniform_callbacks.py::'
              'test_all_message_callbacks_are_worker_owned['
          )
          uniform_expected = {
              'normal-False-callback-1',
              'normal-False-auto-1',
              'eager-False-callback-1',
              'eager-False-auto-1',
          }
          unexpected = []
          seen_exact = set()
          seen_uniform = set()
          for line in failures:
              head = line.split(' - ', 1)[0]
              if head in exact:
                  seen_exact.add(head)
                  continue
              if head.startswith(uniform_prefix) and head.endswith(']'):
                  case = head[len(uniform_prefix):-1]
                  if case in uniform_expected:
                      seen_uniform.add(case)
                      continue
              unexpected.append(line)
          if unexpected:
              raise SystemExit('unexpected failures:\n' + '\n'.join(unexpected))
          if seen_exact != exact or seen_uniform != uniform_expected or len(failures) != 6:
              raise SystemExit(
                  f'policy-failure set drifted: failures={len(failures)} '
                  f'exact={seen_exact!r} uniform={seen_uniform!r}'
              )
          print('Only the six expected worker-ownership policy assertions failed.')
          PY
          test "$pytest_rc" -eq 1
      - name: Record exact diff
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/mqttium/api/_delivery.py > /tmp/hysteresis.diff
          git diff --check
          git diff --stat -- src/mqttium/api/_delivery.py
          sha256sum /tmp/hysteresis.diff /tmp/runtime-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: singleton-inline-hysteresis-${{ github.run_id }}
          path: |
            /tmp/hysteresis.diff
            /tmp/preformat-sha256.txt
            /tmp/runtime-sha256.txt
            /tmp/hotpath-rates.json
            /tmp/full-suite.log
          retention-days: 14
          if-no-files-found: warn
