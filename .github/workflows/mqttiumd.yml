        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mqttiumd-secure-product-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/secure-preview
