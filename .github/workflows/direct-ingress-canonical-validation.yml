name: Direct ingress canonical validation

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/direct-ingress-canonical-validation.yml

permissions:
  contents: read

concurrency:
  group: direct-ingress-canonical-validation
  cancel-in-progress: false

jobs:
  arm64:
    name: RPi5 / short direct validation
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
      PORT: "11883"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - name: Gate host and start broker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "3.14.7"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != "0"
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          version="$({ mosquitto -h 2>&1 || true; } | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"mosquitto version\s+([0-9]+(?:\.[0-9]+)+)",t,re.I); print(m.group(1) if m else "")')"
          test "$version" = "2.1.2"
          dir="$RUNNER_TEMP/direct-ingress-canonical-$GITHUB_RUN_ID"
          mkdir -p "$dir/saturated"
          echo "RESULTS_DIR=$dir" >> "$GITHUB_ENV"
          cat > "$dir/mosquitto.conf" <<EOF
          listener $PORT 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$dir/mosquitto.conf" > "$dir/mosquitto.log" 2>&1 &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/$PORT) >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1
      - name: Run four short paired saturated blocks
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULTS_DIR/matrix.tsv" <<'EOF'
          0	0	base80
          1	0	direct
          2	1	direct
          3	1	base80
          4	2	base80
          5	2	direct
          6	3	direct
          7	3	base80
          EOF
          while IFS=$'\t' read -r idx block arm; do
            topic="bench/direct-canonical/$GITHUB_RUN_ID/$idx"
            ready="$RESULTS_DIR/saturated/ready-$idx"
            sub="$RESULTS_DIR/saturated/sub-$idx.json"
            pub="$RESULTS_DIR/saturated/pub-$idx.json"
            taskset -c 0 env PYTHONPATH="$PWD/experiment/src" python3 experiment/tools/receive_architecture_probe.py \
              subscriber --arm "$arm" --host 127.0.0.1 --port "$PORT" --topic "$topic" \
              --payload-size 65536 --warmup-s 0.20 --duration-s 0.60 \
              --broker-pid "$BROKER_PID" --ready-file "$ready" --output "$sub" \
              > "$RESULTS_DIR/saturated/sub-$idx.log" 2>&1 &
            subpid=$!
            ok=0
            for _ in $(seq 1 100); do
              if [ -f "$ready" ]; then ok=1; break; fi
              kill -0 "$subpid" 2>/dev/null || break
              sleep 0.03
            done
            test "$ok" = 1 || { cat "$RESULTS_DIR/saturated/sub-$idx.log"; exit 1; }
            taskset -c 2 env PYTHONPATH="$PWD/experiment/src" python3 experiment/tools/receive_architecture_probe.py \
              publisher --host 127.0.0.1 --port "$PORT" --topic "$topic" \
              --payload-size 65536 --duration-s 1.05 --output "$pub" \
              > "$RESULTS_DIR/saturated/pub-$idx.log" 2>&1 &
            pubpid=$!
            wait "$subpid" || { cat "$RESULTS_DIR/saturated/sub-$idx.log"; exit 1; }
            wait "$pubpid" || { cat "$RESULTS_DIR/saturated/pub-$idx.log"; exit 1; }
            printf '%s\t%s\t%s\n' "$idx" "$block" "$arm" >> "$RESULTS_DIR/completed.tsv"
            sleep 0.05
          done < "$RESULTS_DIR/matrix.tsv"
      - name: Reduce saturated evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path

          root = Path(os.environ["RESULTS_DIR"])
          rows = []
          for line in (root / "completed.tsv").read_text().splitlines():
              idx_s, block_s, arm = line.split("\t")
              idx = int(idx_s)
              sub = json.load(open(root / "saturated" / f"sub-{idx}.json"))
              pub = json.load(open(root / "saturated" / f"pub-{idx}.json"))
              sub.update(idx=idx, block=int(block_s), arm=arm, publisher_mib_s=pub["payload_mib_s"])
              sub["publisher_margin"] = pub["payload_mib_s"] / sub["payload_mib_s"]
              rows.append(sub)
          blocks = []
          for block in range(4):
              pair = {row["arm"]: row for row in rows if row["block"] == block}
              blocks.append({
                  "block": block,
                  "throughput_ratio_direct_over_base80": pair["direct"]["payload_mib_s"] / pair["base80"]["payload_mib_s"],
                  "direct_minflt": pair["direct"]["ru_minflt"],
                  "direct_receive_stats": pair["direct"]["receive_stats"],
                  "direct_broker_cpu_pct": pair["direct"]["broker_cpu_pct"],
                  "direct_publisher_margin": pair["direct"]["publisher_margin"],
              })
          ratios = [block["throughput_ratio_direct_over_base80"] for block in blocks]
          summary = {
              "head_sha": os.environ["GITHUB_SHA"],
              "blocks": blocks,
              "throughput_geomean_ratio": math.exp(statistics.mean(math.log(x) for x in ratios)),
              "direct_minflt": [block["direct_minflt"] for block in blocks],
          }
          (root / "saturated-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Prepare two RTT variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir base80 direct
          rsync -a --exclude .git experiment/ base80/
          rsync -a --exclude .git experiment/ direct/
          cat >> direct/src/mqttium/api/__init__.py <<'PY'

          # benchmark-only activation of PR #447
          from mqttium._direct_decoder_ingress_prototype import install as _install_direct_ingress
          _install_direct_ingress()
          del _install_direct_ingress
          PY
          python3 -m venv "$RESULTS_DIR/venv"
          . "$RESULTS_DIR/venv/bin/activate"
          python -m pip install --upgrade pip >/dev/null
          pip install -e './harness[dev,mqttium]' 'psutil>=6,<8' >/dev/null
      - name: Run two RTT blocks against dormant control
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path base80 --candidate-path direct \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 2 --max-block-retries 0 --profile standard \
            --broker 127.0.0.1:$PORT --broker-pid "$BROKER_PID" \
            --output "$RESULTS_DIR/base80-vs-direct-rtt.json" \
            | tee "$RESULTS_DIR/base80-vs-direct-rtt.txt"
      - name: Stop broker
        if: always()
        shell: bash
        run: '[ -n "${BROKER_PID:-}" ] && kill "$BROKER_PID" 2>/dev/null || true'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-canonical-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14
