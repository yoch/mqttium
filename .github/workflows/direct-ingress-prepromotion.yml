name: Direct ingress pre-promotion

on:
  workflow_dispatch:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/direct-ingress-prepromotion.yml
      - .github/validation/test_direct_ingress_differential.py
      - .github/validation/direct_ingress_prepromotion.py

permissions:
  contents: read

concurrency:
  group: direct-ingress-prepromotion
  cancel-in-progress: false

jobs:
  cpython-linux:
    name: CPython Linux ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies and Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,fuzz]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Differential decoder oracle
        env:
          HYPOTHESIS_PROFILE: direct_prepromotion
        run: >-
          python -m pytest -q -W error --strict-config --strict-markers
          .github/validation/test_direct_ingress_differential.py
      - name: Direct selector transport focused tests
        run: >-
          python -m pytest -q -W error --strict-config --strict-markers
          tests/unit/test_direct_decoder_ingress_prototype.py
      - name: Installed-client lifecycle / protocol matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-prepromotion"
          PYTHONPATH=src python .github/validation/direct_ingress_prepromotion.py e2e \
            --output "$RUNNER_TEMP/direct-prepromotion/e2e-${{ matrix.python-version }}.json"
      - name: Memory envelope on x86 CPython 3.14
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python .github/validation/direct_ingress_prepromotion.py memory \
            --output "$RUNNER_TEMP/direct-prepromotion/memory-x86-3.14.json"
      - name: Upload CPython evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-prepromotion-cpython-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/direct-prepromotion
          if-no-files-found: warn
          retention-days: 14

  rpi5:
    name: RPi5 pre-promotion resources / ablation / RTT
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 25
    env:
      PORT: "11885"
      BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          persist-credentials: false
      - name: Gate RPi environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "3.14.7"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != "0"
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          version="$({ mosquitto -h 2>&1 || true; } | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"mosquitto version\s+([0-9]+(?:\.[0-9]+)+)",t,re.I); print(m.group(1) if m else "")')"
          test "$version" = "2.1.2"
          root="$RUNNER_TEMP/direct-prepromotion-$GITHUB_RUN_ID"
          rm -rf "$root"
          mkdir -p "$root"
          echo "RESULTS_DIR=$root" >> "$GITHUB_ENV"
      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RESULTS_DIR/venv"
          . "$RESULTS_DIR/venv/bin/activate"
          python -m pip install -e "./experiment[fuzz]" psutil >/dev/null
      - name: RPi differential / lifecycle / memory
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          HYPOTHESIS_PROFILE=direct_prepromotion PYTHONPATH=experiment/src \
            python -m pytest -q -W error --strict-config --strict-markers \
            experiment/.github/validation/test_direct_ingress_differential.py
          PYTHONPATH=experiment/src python experiment/.github/validation/direct_ingress_prepromotion.py e2e \
            --output "$RESULTS_DIR/e2e-rpi.json"
          PYTHONPATH=experiment/src python experiment/.github/validation/direct_ingress_prepromotion.py memory \
            --output "$RESULTS_DIR/memory-rpi.json"
      - name: Prepare ablation variants
        shell: bash
        run: |
          set -euo pipefail
          variants="$RESULTS_DIR/variants"
          mkdir -p "$variants"
          for arm in base80 stream256 direct80 direct80tight direct256tight direct256; do
            git clone --quiet --no-hardlinks experiment "$variants/$arm"
            git -C "$variants/$arm" config user.name "mqttium benchmark"
            git -C "$variants/$arm" config user.email "benchmark@localhost"
          done
          python3 - "$variants" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace(arm, rel, old, new):
              path = root / arm / rel
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{old!r} not found in {arm}/{rel}")
              path.write_text(text.replace(old, new, 1))

          replace(
              "stream256",
              "src/mqttium/transport/tcp.py",
              "_RECEIVE_BUFFER_SIZE = 80 * 1024",
              "_RECEIVE_BUFFER_SIZE = 256 * 1024",
          )
          replace(
              "direct80",
              "src/mqttium/_direct_decoder_ingress_prototype.py",
              "_RX_CHUNK = 256 * 1024",
              "_RX_CHUNK = 80 * 1024",
          )
          replace(
              "direct80tight",
              "src/mqttium/_direct_decoder_ingress_prototype.py",
              "_RX_CHUNK = 256 * 1024",
              "_RX_CHUNK = 80 * 1024",
          )
          for arm in ("direct80tight", "direct256tight"):
              replace(
                  arm,
                  "src/mqttium/_direct_decoder_ingress_prototype.py",
                  "_READ_HIGH_WATER = 512 * 1024",
                  "_READ_HIGH_WATER = 128 * 1024",
              )
              replace(
                  arm,
                  "src/mqttium/_direct_decoder_ingress_prototype.py",
                  "_READ_LOW_WATER = 128 * 1024",
                  "_READ_LOW_WATER = 64 * 1024",
              )

          activation = """
          # benchmark-only activation of direct ingress
          from mqttium._direct_decoder_ingress_prototype import install as _install_direct_ingress
          _install_direct_ingress()
          del _install_direct_ingress
          """
          for arm in ("direct80", "direct80tight", "direct256tight", "direct256"):
              path = root / arm / "src/mqttium/api/__init__.py"
              path.write_text(path.read_text() + activation)
          PY
          for arm in base80 stream256 direct80 direct80tight direct256tight direct256; do
            if [ -n "$(git -C "$variants/$arm" status --porcelain)" ]; then
              git -C "$variants/$arm" add -A
              git -C "$variants/$arm" commit --quiet -m "benchmark: prepare $arm"
            fi
            printf '%s\t%s\n' "$arm" "$(git -C "$variants/$arm" rev-parse HEAD)" \
              >> "$RESULTS_DIR/variant-shas.tsv"
          done
          echo "VARIANTS_DIR=$variants" >> "$GITHUB_ENV"
      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULTS_DIR/mosquitto.conf" <<EOF
          listener $PORT 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 33554432
          EOF
          taskset -c 1 mosquitto -c "$RESULTS_DIR/mosquitto.conf" \
            > "$RESULTS_DIR/mosquitto.log" 2>&1 &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 100); do
            (echo > /dev/tcp/127.0.0.1/$PORT) >/dev/null 2>&1 && exit 0
            sleep 0.03
          done
          exit 1
      - name: Six-arm balanced saturated ablation
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          mkdir -p "$RESULTS_DIR/ablation"
          python3 - "$RESULTS_DIR/ablation/matrix.tsv" <<'PY'
          import sys
          arms = ["base80", "stream256", "direct80", "direct80tight", "direct256tight", "direct256"]
          with open(sys.argv[1], "w") as f:
              idx = 0
              for round_id in range(len(arms)):
                  order = arms[round_id:] + arms[:round_id]
                  for position, arm in enumerate(order):
                      f.write(f"{idx}\t{round_id}\t{position}\t{arm}\n")
                      idx += 1
          PY
          while IFS=$'\t' read -r idx round position arm; do
            topic="bench/prepromotion/$GITHUB_RUN_ID/$idx"
            ready="$RESULTS_DIR/ablation/ready-$idx"
            sub="$RESULTS_DIR/ablation/sub-$idx.json"
            pub="$RESULTS_DIR/ablation/pub-$idx.json"
            source="$VARIANTS_DIR/$arm"
            taskset -c 0 env PYTHONPATH="$source/src" python "$source/tools/receive_architecture_probe.py" \
              subscriber --arm base80 --host 127.0.0.1 --port "$PORT" --topic "$topic" \
              --payload-size 65536 --warmup-s 0.20 --duration-s 0.55 \
              --broker-pid "$BROKER_PID" --ready-file "$ready" --output "$sub" \
              > "$RESULTS_DIR/ablation/sub-$idx.log" 2>&1 &
            subpid=$!
            ok=0
            for _ in $(seq 1 100); do
              if [ -f "$ready" ]; then ok=1; break; fi
              kill -0 "$subpid" 2>/dev/null || break
              sleep 0.03
            done
            test "$ok" = 1 || { cat "$RESULTS_DIR/ablation/sub-$idx.log"; exit 1; }
            taskset -c 2 env PYTHONPATH="$VARIANTS_DIR/base80/src" \
              python "$VARIANTS_DIR/base80/tools/receive_architecture_probe.py" \
              publisher --host 127.0.0.1 --port "$PORT" --topic "$topic" \
              --payload-size 65536 --duration-s 0.95 --output "$pub" \
              > "$RESULTS_DIR/ablation/pub-$idx.log" 2>&1 &
            pubpid=$!
            wait "$subpid" || { cat "$RESULTS_DIR/ablation/sub-$idx.log"; exit 1; }
            wait "$pubpid" || { cat "$RESULTS_DIR/ablation/pub-$idx.log"; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$idx" "$round" "$position" "$arm" \
              >> "$RESULTS_DIR/ablation/completed.tsv"
            sleep 0.04
          done < "$RESULTS_DIR/ablation/matrix.tsv"
      - name: Reduce ablation and identify bottlenecks
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RESULTS_DIR" <<'PY'
          import json
          import math
          import statistics
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          rows = []
          for line in (root / "ablation/completed.tsv").read_text().splitlines():
              idx_s, round_s, pos_s, arm = line.split("\t")
              idx = int(idx_s)
              sub = json.load(open(root / f"ablation/sub-{idx}.json"))
              pub = json.load(open(root / f"ablation/pub-{idx}.json"))
              row = {
                  **sub,
                  "idx": idx,
                  "round": int(round_s),
                  "position": int(pos_s),
                  "variant": arm,
                  "publisher_mib_s": pub["payload_mib_s"],
                  "publisher_cpu_pct": pub["cpu_pct"],
              }
              row["publisher_margin"] = row["publisher_mib_s"] / row["payload_mib_s"]
              row["qualified_consumer_ceiling"] = (
                  row["sut_cpu_pct"] >= 97.0
                  and (row["broker_cpu_pct"] is None or row["broker_cpu_pct"] < 97.0)
                  and row["publisher_margin"] >= 1.5
              )
              rows.append(row)

          arms = sorted({row["variant"] for row in rows})
          summaries = {}
          for arm in arms:
              arm_rows = [row for row in rows if row["variant"] == arm]
              summaries[arm] = {
                  "throughput_median_mib_s": statistics.median(
                      row["payload_mib_s"] for row in arm_rows
                  ),
                  "sut_cpu_median_pct": statistics.median(row["sut_cpu_pct"] for row in arm_rows),
                  "broker_cpu_median_pct": statistics.median(
                      row["broker_cpu_pct"] for row in arm_rows if row["broker_cpu_pct"] is not None
                  ),
                  "publisher_margin_median": statistics.median(
                      row["publisher_margin"] for row in arm_rows
                  ),
                  "qualified_cells": sum(row["qualified_consumer_ceiling"] for row in arm_rows),
                  "cells": len(arm_rows),
                  "utime_per_mib_median": statistics.median(
                      row["ru_utime_s"] / (row["payload_bytes"] / 1048576)
                      for row in arm_rows
                  ),
                  "stime_per_mib_median": statistics.median(
                      row["ru_stime_s"] / (row["payload_bytes"] / 1048576)
                      for row in arm_rows
                  ),
              }

          paired = {}
          for arm in arms:
              if arm == "base80":
                  continue
              ratios = []
              qualified_ratios = []
              for round_id in range(6):
                  base = next(
                      row for row in rows if row["round"] == round_id and row["variant"] == "base80"
                  )
                  candidate = next(
                      row for row in rows if row["round"] == round_id and row["variant"] == arm
                  )
                  ratio = candidate["payload_mib_s"] / base["payload_mib_s"]
                  ratios.append(ratio)
                  if (
                      base["qualified_consumer_ceiling"]
                      and candidate["qualified_consumer_ceiling"]
                  ):
                      qualified_ratios.append(ratio)
              paired[arm] = {
                  "ratios": ratios,
                  "geomean_all": math.exp(statistics.mean(math.log(x) for x in ratios)),
                  "qualified_ratios": qualified_ratios,
                  "geomean_qualified": (
                      math.exp(statistics.mean(math.log(x) for x in qualified_ratios))
                      if qualified_ratios
                      else None
                  ),
              }

          payload = {
              "head_sha": __import__("os").environ["GITHUB_SHA"],
              "rows": rows,
              "arm_summary": summaries,
              "paired_vs_base80": paired,
          }
          path = root / "ablation-summary.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload["arm_summary"], indent=2, sort_keys=True))
          print(json.dumps(payload["paired_vs_base80"], indent=2, sort_keys=True))
          PY
      - name: Stop ablation broker
        shell: bash
        run: |
          set -euo pipefail
          kill "$BROKER_PID" 2>/dev/null || true
          wait "$BROKER_PID" 2>/dev/null || true
      - name: Checkout RTT harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - name: Exact-head three-block RTT
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          rtt="$RESULTS_DIR/rtt"
          mkdir -p "$rtt/variants"
          git clone --quiet --no-hardlinks experiment "$rtt/variants/base80"
          git clone --quiet --no-hardlinks experiment "$rtt/variants/direct"
          cat >> "$rtt/variants/direct/src/mqttium/api/__init__.py" <<'PY'
          from mqttium._direct_decoder_ingress_prototype import install as _install_direct_ingress
          _install_direct_ingress()
          del _install_direct_ingress
          PY
          git -C "$rtt/variants/direct" config user.name "mqttium benchmark"
          git -C "$rtt/variants/direct" config user.email "benchmark@localhost"
          git -C "$rtt/variants/direct" add src/mqttium/api/__init__.py
          git -C "$rtt/variants/direct" commit --quiet -m "benchmark: activate direct ingress"
          git -C "$rtt/variants/base80" rev-parse HEAD > "$rtt/base80.sha"
          git -C "$rtt/variants/direct" rev-parse HEAD > "$rtt/direct.sha"

          cat > "$rtt/mosquitto.conf" <<EOF
          listener $PORT 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$rtt/mosquitto.conf" > "$rtt/mosquitto.log" 2>&1 &
          rtt_broker=$!
          trap 'kill "$rtt_broker" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            (echo > /dev/tcp/127.0.0.1/$PORT) >/dev/null 2>&1 && break
            sleep 0.03
          done
          python -m pip install -e "./harness[dev,mqttium]" psutil >/dev/null
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system --entrypoint version_compare -- \
            --client mqttium \
            --baseline-path "$rtt/variants/base80" \
            --candidate-path "$rtt/variants/direct" \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 3 --max-block-retries 0 --profile standard \
            --broker "127.0.0.1:$PORT" --broker-pid "$rtt_broker" \
            --output "$rtt/base80-vs-direct-rtt.json" \
            | tee "$rtt/base80-vs-direct-rtt.txt"
          kill "$rtt_broker" 2>/dev/null || true
          wait "$rtt_broker" 2>/dev/null || true
          trap - EXIT
      - name: Upload RPi pre-promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-prepromotion-rpi-${{ github.sha }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14
