name: Direct ingress production E2E
on:
  push:
    branches:
      - perf/direct-decoder-ingress-prototype
    paths:
      - .github/workflows/direct-ingress-production-e2e.yml
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,fuzz]' 'websockets==15.0.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: No obsolete product hooks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '_direct_decoder_ingress_prototype|_INGRESS_READY|DirectIngressDecoder|_install_direct_ingress' \
            src tests tools \
            .github/validation/direct_ingress_prepromotion.py \
            .github/validation/test_direct_ingress_differential.py; then
            echo 'obsolete product/prod-validation hook remains' >&2
            exit 1
          fi
      - name: Differential and transport regression suite
        run: |
          set -euo pipefail
          HYPOTHESIS_PROFILE=direct_production python -m pytest -q \
            .github/validation/test_direct_ingress_differential.py \
            tests/unit/test_decoder_ingress_storage.py \
            tests/unit/test_decoder_push_transport.py \
            tests/unit/test_alternate_transport_lifecycle.py
      - name: Real production transport sequence and MQTT matrix
        run: |
          set -euo pipefail
          python .github/validation/direct_ingress_prepromotion.py e2e \
            --output "$RUNNER_TEMP/production-e2e.json"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-production-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/production-e2e.json
          if-no-files-found: warn
          retention-days: 30
