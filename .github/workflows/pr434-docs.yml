name: PR434 persistence docs bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    if: github.event.pull_request.head.ref == 'mission/persistence-contract-pruning' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tooling
        run: python -m pip install -e '.[dev,docs]'
      - name: Apply asserted documentation migration
        run: python .github/pr434_docs_transform.py
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: Diff hygiene
        run: git diff --check
      - name: Publish documentation tree
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/pr434_docs_transform.py .github/workflows/pr434-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: document unified persistence contract'
          git push origin HEAD:"$HEAD_REF"
