name: Temporary PR431 rebuild v3

on:
  push:
    branches: [rebuild/pr431-current-main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Replay historical evidence files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 4560e44aeb24b8a4f7f6ce903766579fac481cbd 8c53b44a3edc9ef8913807e67a597b8ad80600c9
          git diff --binary 4560e44aeb24b8a4f7f6ce903766579fac481cbd 8c53b44a3edc9ef8913807e67a597b8ad80600c9 -- benchmarks/hotpath_recon.py docs/reports/HOTPATH-RECON-2026-09-06.md docs/reports/README.md tests/unit/test_hotpath_recon.py > /tmp/pr431.patch
          git apply --3way /tmp/pr431.patch
          python - <<'PY'
          from pathlib import Path
          import ast

          test = Path('tests/unit/test_hotpath_recon.py')
          text = test.read_text()
          tree = ast.parse(text)
          matches = [
              node for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == 'test_qos1_coalesced_inbound_keeps_window'
          ]
          if len(matches) != 1 or matches[0].end_lineno is None:
              raise SystemExit(f'unexpected coalesced test AST: {matches}')
          node = matches[0]
          lines = text.splitlines(keepends=True)
          segment = ''.join(lines[node.lineno - 1:node.end_lineno])
          replacements = {
              '    assert counters["callback_inline_rate"] == 0.0\n': '''    # Current main may inline eligible exact pairs while the rest of a\n    # coalesced burst retains the bounded callback worker path.\n    assert 0.0 < counters["callback_inline_rate"] < 1.0\n''',
              '    assert counters["eager_data_hit_rate"] == 0.125\n': '''    # Exact eager hit ratios are scheduler-shape observations, not invariants:\n    # pair-inline delivery can create additional turns/reentrant publications.\n    assert 0.0 < counters["eager_data_hit_rate"] < 1.0\n''',
              '    assert counters["eager_ack_hit_rate"] == 0.125\n': '    assert 0.0 < counters["eager_ack_hit_rate"] < 1.0\n',
          }
          for old, new in replacements.items():
              if segment.count(old) != 1:
                  raise SystemExit(f'unexpected scoped assertion count: {old!r} -> {segment.count(old)}')
              segment = segment.replace(old, new, 1)
          lines[node.lineno - 1:node.end_lineno] = [segment]
          test.write_text(''.join(lines))

          report = Path('docs/reports/HOTPATH-RECON-2026-09-06.md')
          text = report.read_text()
          marker = '''Independent review before merge narrowed several µs attributions that had\nbeen read as isolated costs. Path identities and hit rates were not\nretracted. This file is that corrected evidence record, not a second\ncampaign.\n\n'''
          note = '''> **Historical snapshot.** All measurements and source-path claims below describe\n> `main@4560e44aeb24b8a4f7f6ce903766579fac481cbd`. Later main revisions deliberately\n> changed some hot-path behavior, notably allowing an eligible exact pair of\n> synchronous message callbacks to run inline. The “Already landed” / “Preserve”\n> table is therefore historical guidance, not a current architectural contract.\n> The harness itself was revalidated on `main@6f1351e3b60593946c520b7d1915564f76023873`;\n> the historical wall-time measurements were not rewritten or presented as new data.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('unexpected report introduction')
          report.write_text(text.replace(marker, marker + note, 1))
          PY
          rm -f .github/workflows/tmp-pr431-rebuild.yml .github/workflows/tmp-pr431-rebuild-v2.yml .github/workflows/tmp-pr431-rebuild-v3.yml
          git diff --check
      - run: python -m pip install -e '.[dev]'
      - name: Revalidate harness on current main
        run: |
          ruff check benchmarks/hotpath_recon.py tests/unit/test_hotpath_recon.py
          python -m pytest -q tests/unit/test_hotpath_recon.py
          PYTHONPATH=src python benchmarks/hotpath_recon.py --quick --mode campaign --output /tmp/hotpath-recon-current-main.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/hotpath-recon-current-main.json').read_text())
          assert data['cells']
          assert data['engine_ingress']
          assert data['instrumentation_overhead']
          print('cells', len(data['cells']))
          print('engine_ingress', len(data['engine_ingress']))
          print('overhead_rows', len(data['instrumentation_overhead']))
          print('current_main_revalidation_ok')
          PY
      - name: Commit clean reconstructed PR
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: revalidate hotpath reconnaissance on current main'
          git push origin HEAD:rebuild/pr431-current-main
