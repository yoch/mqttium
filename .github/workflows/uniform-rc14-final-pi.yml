name: Uniform RC14 final ARM64 qualification
run-name: "Uniform RC14 final A/A + A/B standard"

on:
  push:
    branches: [bench/uniform-rc14-final-fb619a27]
    paths: [.github/workflows/uniform-rc14-final-pi.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

env:
  BASE_SHA: c194597bcf5af4951fbec2b560600eef3cb84b3c
  CANDIDATE_SHA: fb619a27b866c5db869508e6a226db0080e668c7
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qualify:
    if: github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/bench/uniform-rc14-final-fb619a27'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 32
    steps:
      - name: Validate runner and isolate output
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 -c 'import sys; assert sys.version_info[:3] == (3,14,7), sys.version'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          for cmd in python3 mosquitto taskset git sha256sum; do command -v "$cmd" >/dev/null; done
          if pgrep -x mosquitto >/dev/null; then
            echo "Pre-existing Mosquitto would contaminate the persistent runner; refusing without killing it." >&2
            exit 1
          fi
          echo "JOB_ROOT=$RUNNER_TEMP/mqttium-uniform-rc14-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: slot-a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: slot-c
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: slot-b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Freeze provenance and prepare Python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$JOB_ROOT/results"
          test "$(git -C slot-a rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C slot-c rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C slot-b rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          for s in slot-a slot-b slot-c harness; do test -z "$(git -C "$s" status --porcelain --untracked-files=no)"; done
          python3 -m venv --system-site-packages "$JOB_ROOT/venv"
          "$JOB_ROOT/venv/bin/python" -m pip install 'psutil>=6,<8' 'paho-mqtt==2.1.0'
          "$JOB_ROOT/venv/bin/python" -m pip install --no-deps ./slot-a
          "$JOB_ROOT/venv/bin/python" -m pip freeze > "$JOB_ROOT/results/dependencies.txt"
          python3 - <<'PY' > "$JOB_ROOT/results/provenance.json"
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          files=['src/mqttium/api/_delivery.py','src/mqttium/api/async_client.py','src/mqttium/api/_effects.py']
          out={'run':os.environ['GITHUB_RUN_ID'],'tooling':os.environ['GITHUB_SHA'],'python':platform.python_version(),'kernel':platform.release(),'sources':{}}
          for slot,expected in [('slot-a',os.environ['BASE_SHA']),('slot-c',os.environ['BASE_SHA']),('slot-b',os.environ['CANDIDATE_SHA'])]:
              def git(*args): return subprocess.check_output(['git','-C',slot,*args],text=True).strip()
              assert git('rev-parse','HEAD') == expected
              p=Path(slot)
              out['sources'][slot]={'sha':expected,'tree':git('rev-parse','HEAD^{tree}'),'src_tree':git('rev-parse','HEAD:src'),'runtime_sha256':{f:hashlib.sha256((p/f).read_bytes()).hexdigest() for f in files}}
          out['harness_sha']=subprocess.check_output(['git','-C','harness','rev-parse','HEAD'],text=True).strip()
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Run A/A then A/B standard qualification
        shell: bash
        run: |
          set -euo pipefail
          out="$JOB_ROOT/results"
          py="$JOB_ROOT/venv/bin/python"
          port="$($py -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          cat > "$out/mosquitto.conf" <<EOF
          listener $port 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          (mosquitto -h || true) > "$out/mosquitto-version.txt" 2>&1
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          broker_pid=$!
          cleanup() { kill "$broker_pid" 2>/dev/null || true; wait "$broker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            kill -0 "$broker_pid" 2>/dev/null || { cat "$out/mosquitto.log"; exit 1; }
            if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1
          export PYTHONPATH="$PWD/harness/src"
          "$py" -m mqtt_client_bench.layout_runner --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path slot-a --candidate-path slot-c \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 4 --max-block-retries 1 --profile standard \
            --broker "127.0.0.1:$port" --broker-pid "$broker_pid" --output "$out/aa.json" \
            2>&1 | tee "$out/aa.log"
          "$py" -m mqtt_client_bench.layout_runner --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path slot-a --candidate-path slot-b \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 4 --max-block-retries 1 --profile standard \
            --broker "127.0.0.1:$port" --broker-pid "$broker_pid" --output "$out/ab.json" \
            2>&1 | tee "$out/ab.log"

      - name: Verify exact sources after timings
        if: always() && env.JOB_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C slot-a rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C slot-c rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C slot-b rev-parse HEAD)" = "$CANDIDATE_SHA"
          for s in slot-a slot-b slot-c harness; do test -z "$(git -C "$s" status --porcelain --untracked-files=no)"; done
          echo 'all exact sources unchanged' > "$JOB_ROOT/results/source-verification.txt"

      - name: Upload raw evidence
        if: always() && env.JOB_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uniform-rc14-final-${{ github.run_id }}
          path: ${{ env.JOB_ROOT }}/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Clean this run only
        if: always() && env.JOB_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$JOB_ROOT" = "$RUNNER_TEMP/mqttium-uniform-rc14-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$JOB_ROOT"
