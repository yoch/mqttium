name: PR447 final memory gate v2

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/pr447-final-memory-gate-v2.yml

permissions:
  contents: read

env:
  RUNTIME_SHA: b047477e003e0519fa5f663f1cf434cb229cc6ee

jobs:
  memory:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify exact runtime and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          out="$RUNNER_TEMP/pr447-memory-v2-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Write targeted probe
        shell: bash
        run: |
          cat > "$OUT/probe.py" <<'PY'
          from __future__ import annotations
          import argparse, asyncio, gc, json, os, resource
          from pathlib import Path

          K=1024; M=K*K

          def vbi(n):
              out=bytearray()
              while True:
                  d=n%128; n//=128; out.append(d|0x80 if n else d)
                  if not n: return bytes(out)

          def frame_total(total):
              for fixed in range(2,6):
                  body=total-fixed; enc=vbi(body)
                  if body >= 0 and 1+len(enc)==fixed:
                      return b'\x30'+enc+(b'x'*body)
              raise ValueError(total)

          def rss():
              return int(Path('/proc/self/statm').read_text().split()[1])*os.sysconf('SC_PAGE_SIZE')

          def peak():
              return int(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)*1024

          def ds(d):
              return dict(capacity=d.capacity, peak_capacity=d.capacity_peak,
                          logical_high_water=d.high_water, growths=d.growth_count,
                          shrinks=d.shrink_count, reallocations=d.storage_generation,
                          compactions=d.compaction_count, buffered=d.buffered)

          class Feeder:
              def __init__(self,d): self.d=d; self.preferred=64*K; self.full=0
              def put(self,wire,fragments=(1<<30,)):
                  off=i=0
                  while off < len(wire):
                      w=self.d.writable_window(self.preferred); offered=len(w)
                      take=min(offered,fragments[i%len(fragments)],len(wire)-off)
                      w[:take]=wire[off:off+take]; w.release(); self.d.commit(take)
                      if self.preferred < 256*K:
                          if offered >= 64*K and take*4 >= offered*3:
                              self.full += 1
                              if self.full >= 2: self.preferred=256*K; self.full=0
                          else: self.full=0
                      off += take; i += 1

          def drain(d):
              n=0
              while d.next_packet() is not None: n+=1
              return n

          def scenario(name):
              from mqttium.codec.buffer import IncrementalDecoder
              rb,pb=rss(),peak(); d=IncrementalDecoder(max_packet_size=8*M); f=Feeder(d); extra={}
              if name=='near_limit':
                  f.put(frame_total(8*M),(65536,262144,32767,131071)); extra['capacity_live']=d.capacity; extra['packets']=drain(d)
              elif name=='repeated_large':
                  wire=frame_total(2*M); f.put(wire,(65536,262144)); drain(d); first=ds(d)
                  for _ in range(19): f.put(wire,(65536,262144)); drain(d)
                  extra.update(after_first=first,
                      reallocations_after_first=d.storage_generation-first['reallocations'],
                      shrinks_after_first=d.shrink_count-first['shrinks'])
              elif name=='large_to_tiny':
                  f.put(frame_total(8*M),(65536,262144)); drain(d); extra['capacity_after_large']=d.capacity
                  wire=frame_total(64)
                  for _ in range(64): f.put(wire); drain(d)
                  extra['capacity_after_small']=d.capacity
              elif name=='large_to_coalesced_small':
                  f.put(frame_total(8*M),(65536,262144)); drain(d); extra['capacity_after_large']=d.capacity
                  burst=frame_total(64)*64
                  for _ in range(40): f.put(burst); assert drain(d)==64
                  extra['capacity_after_coalesced_small']=d.capacity
              elif name=='reconnect':
                  f.put(frame_total(2*M),(65536,262144)); drain(d); extra['capacity_before_clear']=d.capacity
                  d.clear(); extra['capacity_after_clear']=d.capacity
              else: raise ValueError(name)
              gc.collect(); ra,pa=rss(),peak()
              return dict(scenario=name,runtime_sha=os.environ['RUNTIME_SHA'],rss_before=rb,rss_after=ra,
                          rss_incremental=ra-rb,peak_rss=pa,peak_incremental=max(0,pa-pb),**ds(d),**extra)

          async def multi():
              from mqttium.codec.buffer import IncrementalDecoder
              from mqttium.transport import DecoderPushTransport
              from mqttium.transport.tcp import TcpTransport
              release=asyncio.Event(); writers=[]
              async def handler(reader,writer):
                  del reader; writers.append(writer); writer.write(b'\xc0\x00'); await writer.drain(); await release.wait()
              server=await asyncio.start_server(handler,'127.0.0.1',0); host,port=server.sockets[0].getsockname()[:2]
              rb,pb=rss(),peak(); ts=await asyncio.gather(*(TcpTransport.connect(str(host),int(port)) for _ in range(32)))
              ds_=[IncrementalDecoder(max_packet_size=8*M) for _ in ts]
              try:
                  for t,d in zip(ts,ds_): assert isinstance(t,DecoderPushTransport); t.attach_decoder(d)
                  await asyncio.gather(*(t.receive() for t in ts)); assert all(d.next_packet() is not None for d in ds_)
                  gc.collect(); ra,pa=rss(),peak()
                  return dict(scenario='multi_connection',runtime_sha=os.environ['RUNTIME_SHA'],connections=32,
                              rss_before=rb,rss_after=ra,rss_incremental=ra-rb,peak_rss=pa,peak_incremental=max(0,pa-pb),
                              capacity_sum=sum(d.capacity for d in ds_),peak_capacity_sum=sum(d.capacity_peak for d in ds_),
                              max_capacity=max(d.capacity for d in ds_),reallocations=sum(d.storage_generation for d in ds_),
                              shrinks=sum(d.shrink_count for d in ds_))
              finally:
                  release.set(); await asyncio.gather(*(t.close() for t in ts),return_exceptions=True)
                  for w in writers: w.close()
                  server.close(); await server.wait_closed()

          p=argparse.ArgumentParser(); p.add_argument('scenario'); p.add_argument('output'); a=p.parse_args()
          result=asyncio.run(multi()) if a.scenario=='multi_connection' else scenario(a.scenario)
          Path(a.output).write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); print(json.dumps(result,sort_keys=True))
          PY
      - name: Run six process-isolated scenarios
        shell: bash
        run: |
          set -euo pipefail
          for s in near_limit repeated_large large_to_tiny large_to_coalesced_small reconnect multi_connection; do
            PYTHONPATH="$PWD/candidate/src" RUNTIME_SHA="$RUNTIME_SHA" python3 "$OUT/probe.py" "$s" "$OUT/$s.json"
          done
      - name: Enforce bounds and summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          K=1024; M=K*K; root=Path(os.environ['OUT']); r={p.stem:json.loads(p.read_text()) for p in root.glob('*.json')}
          n=r['near_limit']; assert n['capacity_live']==8*M and n['peak_capacity']==8*M and n['packets']==1
          x=r['repeated_large']; assert x['reallocations_after_first']==0 and x['shrinks_after_first']==0 and x['capacity']<=2*M
          assert r['large_to_tiny']['capacity_after_small']<=256*K
          assert r['large_to_coalesced_small']['capacity_after_coalesced_small']<=256*K
          assert r['reconnect']['capacity_after_clear']<=64*K
          m=r['multi_connection']; assert m['connections']==32 and m['max_capacity']<=64*K and m['capacity_sum']<=32*64*K
          out={'runtime_sha':os.environ['RUNTIME_SHA'],'bounds_ok':True,'scenarios':r}
          (root/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload exact-runtime memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr447-final-memory-v2-${{ env.RUNTIME_SHA }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
