name: Apply PR333 validation trigger

on:
  push:
    branches:
      - validation/pr333-arm64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/add-pr-trigger.patch
          git apply --index .github/add-pr-trigger.patch
          rm .github/add-pr-trigger.patch .github/workflows/apply-pr333-validation-trigger.yml
          git add -u -- .github/add-pr-trigger.patch .github/workflows/apply-pr333-validation-trigger.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make PR333 ARM64 validation observable"
          git push origin HEAD:validation/pr333-arm64
