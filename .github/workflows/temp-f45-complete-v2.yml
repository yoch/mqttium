name: Temporary Finding 4/5 complete candidate v3

on:
  push:
    branches: [agent/f45-complete-eval]

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f45-complete-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete candidate
        shell: bash
        run: |
          git show 4962b8b92e7c1a24658ddb1898cdeb205854c58e:src/mqttium/api/_delivery.py > /tmp/main_delivery.py
          git show origin/agent/f45-parallel-delivery-eval:.github/workflows/temp-parallel-delivery-eval.yml > /tmp/parallel-base.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-f45-complete.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == '          PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          )
          script = script.replace(
              "'    async def messages(\\n'",
              "'    async def messages(self) -> AsyncIterator[Message]:\\n'",
          )
          exec(compile(script, 'f45-complete-v3-transform', 'exec'), {})

          # Two conformance tests intentionally inspected the internal MESSAGE
          # effect kind. Fresh property-bearing MQTT 5 publications now use the
          # dedicated decoded kind; keep the protocol assertions unchanged and
          # teach those tests about the internal split.
          p = Path('tests/unit/test_conformance_statements.py')
          text = p.read_text()
          old = '    messages = [e.data for e in engine.take_effects() if e.kind is EffectKind.MESSAGE]\n'
          new = '''    effects = engine.take_effects()\n    messages = [\n        effect.data\n        for effect in effects\n        if effect.kind in (EffectKind.MESSAGE, EffectKind.DECODED_MESSAGE)\n    ]\n'''
          if text.count(old) != 1:
              raise SystemExit('conformance effect-kind assertion mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/unit/test_inbound_alias_validation.py')
          text = p.read_text()
          old = '    assert not any(effect.kind is EffectKind.MESSAGE for effect in effects)\n'
          new = '''    assert not any(\n        effect.kind in (EffectKind.MESSAGE, EffectKind.DECODED_MESSAGE)\n        for effect in effects\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('alias invalid-path assertion mismatch')
          text = text.replace(old, new, 1)
          old = '    message = next(effect.data for effect in effects if effect.kind is EffectKind.MESSAGE)\n'
          new = '''    message = next(\n        effect.data\n        for effect in effects\n        if effect.kind in (EffectKind.MESSAGE, EffectKind.DECODED_MESSAGE)\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('alias valid-path assertion mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/_effects.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py tests/unit/test_conformance_statements.py tests/unit/test_inbound_alias_validation.py
          ruff check src/mqttium tests/unit/test_small_delivery_properties.py tests/unit/test_conformance_statements.py tests/unit/test_inbound_alias_validation.py
          mypy src/mqttium
          python -m pytest -q \
            tests/unit/test_small_delivery_properties.py \
            tests/unit/test_batched_message_effects.py \
            tests/unit/test_effect_pump.py \
            tests/unit/test_delivery_byte_budget.py \
            tests/unit/test_inbound_byte_budget.py \
            tests/unit/test_inbound_replay_streaming.py \
            tests/unit/test_qos2_matrix.py \
            tests/unit/test_manual_ack.py \
            tests/unit/test_autoack_receive_maximum_handoff.py \
            tests/unit/test_conformance_statements.py \
            tests/unit/test_inbound_alias_validation.py
          python -m pytest -q tests/unit
          rm .github/workflows/temp-f45-complete.yml .github/workflows/temp-f45-complete-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate fresh decoded property sizing"
          git push origin HEAD:agent/f45-complete-eval
