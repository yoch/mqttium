name: Format publish waiter oracle

on:
  push:
    branches: [fix/runtime-fuzzer-publish-waiter-terminal]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/fuzz/runtime_fuzzer.py)" = "147b1b372790421b683eefb83dc24685b35bf010"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/fuzz/runtime_fuzzer.py")
          text = path.read_text()
          old = '''            assert stats.receipts.publish_waiters == 0, (\n                "publish waiter survived terminal teardown"\n            )\n'''
          new = '''            assert stats.receipts.publish_waiters == 0, "publish waiter survived terminal teardown"\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object tests/fuzz/runtime_fuzzer.py)" = "c28093f137f224a2b3a8e64b539b39b31e3d4541"
          rm .github/workflows/format-389a.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          test "$changed" = $'.github/workflows/format-389a.yml\ntests/fuzz/runtime_fuzzer.py'
          git commit -m "style: format publish waiter terminal oracle"
          git push origin HEAD:fix/runtime-fuzzer-publish-waiter-terminal
