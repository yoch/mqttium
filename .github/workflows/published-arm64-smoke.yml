name: Published ARM64 Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published MQTTium version to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      MQTTIUM_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify ARM64 host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected system Python 3.13, got {sys.version}")
          PY
          command -v mosquitto
          command -v openssl
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process makes the runner unsafe for this job." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - name: Install exact published wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --only-binary=mqttium \
            "mqttium==$MQTTIUM_VERSION"
          python -m pip check

      - name: Start isolated TCP, TLS, WebSocket, and Unix listeners
        shell: bash
        run: |
          set -euo pipefail
          root="$JOB_ROOT"
          python tools/ci/generate_test_tls.py "$root/tls" --label "MQTTium ARM64"

          cat > "$root/mosquitto.conf" <<EOF
          persistence false

          listener 11886 127.0.0.1
          protocol mqtt
          allow_anonymous true

          listener 18083 127.0.0.1
          protocol websockets
          socket_domain ipv4
          allow_anonymous true

          listener 0 $root/mqttium.sock
          protocol mqtt
          allow_anonymous true

          listener 18884 127.0.0.1
          protocol mqtt
          allow_anonymous true
          cafile $root/tls/ca.crt
          certfile $root/tls/server.crt
          keyfile $root/tls/server.key
          EOF

          mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          python tools/ci/wait_for_endpoints.py \
            --tcp 127.0.0.1:11886 --tcp 127.0.0.1:18083 --tcp 127.0.0.1:18884 \
            --unix "$root/mqttium.sock"

      - name: Exercise installed Stable API
        run: |
          python -I tests/installed_distribution_smoke.py \
            --expected-version "$MQTTIUM_VERSION" \
            --host 127.0.0.1 --port 11886

      - name: Exercise TLS and SQLite restart
        run: |
          root="$JOB_ROOT"
          python -I tests/installed_distribution_resilience_smoke.py tls \
            --expected-version "$MQTTIUM_VERSION" \
            --host localhost --port 18884 --ca-file "$root/tls/ca.crt"
          python -I tests/installed_distribution_resilience_smoke.py sqlite-write \
            --expected-version "$MQTTIUM_VERSION" \
            --database "$root/inflight.sqlite"
          python -I tests/installed_distribution_resilience_smoke.py sqlite-read \
            --expected-version "$MQTTIUM_VERSION" \
            --database "$root/inflight.sqlite"

      - name: Exercise transports, Paho migration, cancellation, and shutdown
        run: |
          root="$JOB_ROOT"
          python -I tests/installed_distribution_extended_smoke.py websocket \
            --expected-version "$MQTTIUM_VERSION" \
            --url ws://127.0.0.1:18083/mqtt
          python -I tests/installed_distribution_extended_smoke.py unix \
            --expected-version "$MQTTIUM_VERSION" \
            --socket "$root/mqttium.sock"
          python -I tests/installed_distribution_extended_smoke.py paho \
            --expected-version "$MQTTIUM_VERSION" \
            --host 127.0.0.1 --port 11886
          python -I tests/installed_distribution_extended_smoke.py shutdown \
            --expected-version "$MQTTIUM_VERSION" \
            --host 127.0.0.1 --port 11886

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$JOB_ROOT/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
