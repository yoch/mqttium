name: Publish QoS2 phase-two compaction

on:
  push:
    branches:
      - agent/qos2-phase-two-compaction
    paths:
      - .github/workflows/qos2-compaction-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/qos2-phase-two-compaction
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,security]"
      - name: Apply implementation and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/mqttium/persistence/memory.py",
              """        if compact:\n            # Only PUBREL is retransmissible from here on.\n            msg.encoded_publish = None\n""",
              """        if compact:\n            # The PUBLISH phase is over. PUBREL needs only the packet id and\n            # protocol version, so no application data should survive PUBREC.\n            msg.topic = \"\"\n            msg.payload = b\"\"\n            msg.properties = None\n            msg.encoded_publish = None\n""",
          )

          replace(
              "src/mqttium/persistence/sqlite.py",
              """SQLITE_SCHEMA_VERSION = 2\n\"\"\"Durable schema revision stored in ``PRAGMA user_version``.\n\n* 1 — the original schema, which carried no version marker at all.\n* 2 — adds ``outbound.logical_size``, drops the never-read ``extra`` column,\n  and moves ``payload`` last so metadata reads never traverse BLOB overflow\n  pages.\n\"\"\"\n""",
              """SQLITE_SCHEMA_VERSION = 3\n\"\"\"Durable schema revision stored in ``PRAGMA user_version``.\n\n* 1 — the original schema, which carried no version marker at all.\n* 2 — adds ``outbound.logical_size``, drops the never-read ``extra`` column,\n  and moves ``payload`` last so metadata reads never traverse BLOB overflow\n  pages.\n* 3 — compacts outbound QoS 2 records already in ``WAIT_PUBCOMP`` by removing\n  topic, payload and PUBLISH properties while preserving settlement metadata.\n\"\"\"\n""",
          )
          replace(
              "src/mqttium/persistence/sqlite.py",
              """            if version < 2 and legacy:\n                self._migrate_to_v2()\n            conn.execute(f\"PRAGMA user_version={SQLITE_SCHEMA_VERSION}\")\n""",
              """            if version < 2 and legacy:\n                self._migrate_to_v2()\n            if version < 3 and legacy:\n                self._migrate_to_v3()\n            conn.execute(f\"PRAGMA user_version={SQLITE_SCHEMA_VERSION}\")\n""",
          )
          replace(
              "src/mqttium/persistence/sqlite.py",
              """    def _rebuild_table(self, table: str, *statements: str) -> None:\n""",
              """    def _migrate_to_v3(self) -> None:\n        \"\"\"Discard PUBLISH application data after the QoS 2 PUBREC phase.\n\n        A ``WAIT_PUBCOMP`` record only retransmits PUBREL. Its original logical\n        size remains durable so the admission budget is released exactly once\n        when PUBCOMP eventually settles the record.\n        \"\"\"\n        self._conn.execute(\n            \"\"\"\n            UPDATE outbound\n            SET topic='', properties=NULL, payload=X''\n            WHERE state=?\n            \"\"\",\n            (int(OutboundQoSState.WAIT_PUBCOMP),),\n        )\n\n    def _rebuild_table(self, table: str, *statements: str) -> None:\n""",
          )
          replace(
              "src/mqttium/persistence/sqlite.py",
              """            cursor = self._conn.execute(\n                \"UPDATE outbound SET state=? WHERE mid=? AND state=? AND seq=?\",\n                (int(new_state), mid, int(expected_state), int(row[\"seq\"])),\n            )\n""",
              """            if compact:\n                cursor = self._conn.execute(\n                    \"\"\"\n                    UPDATE outbound\n                    SET state=?, topic='', properties=NULL, payload=X''\n                    WHERE mid=? AND state=? AND seq=?\n                    \"\"\",\n                    (int(new_state), mid, int(expected_state), int(row[\"seq\"])),\n                )\n            else:\n                cursor = self._conn.execute(\n                    \"UPDATE outbound SET state=? WHERE mid=? AND state=? AND seq=?\",\n                    (int(new_state), mid, int(expected_state), int(row[\"seq\"])),\n                )\n""",
          )
          replace(
              "src/mqttium/persistence/sqlite.py",
              """            # `compact` needs no work here: the encoded PUBLISH frame is a\n            # memory-only field this store has never persisted.\n            return OutboundRecordMeta(\n""",
              """            return OutboundRecordMeta(\n""",
          )

          replace(
              "src/mqttium/protocol/outbound.py",
              """        msg.state = OutboundQoSState.WAIT_PUBCOMP\n        msg.encoded_publish = None\n        if msg.encoded_pubrel is None:\n""",
              """        msg.state = OutboundQoSState.WAIT_PUBCOMP\n        # Third-party stores without the transition extension still receive\n        # the same phase-two compaction as the built-in stores.\n        msg.topic = \"\"\n        msg.payload = b\"\"\n        msg.properties = None\n        msg.encoded_publish = None\n        if msg.encoded_pubrel is None:\n""",
          )

          replace(
              "docs/ROADMAP.md",
              "- [ ] Full QoS 2 phase-two compaction (release topic, payload and properties,\n      not only the encoded frame).",
              "- [x] Full QoS 2 phase-two compaction (release topic, payload and properties,\n      not only the encoded frame).",
          )
          replace(
              "CHANGELOG.md",
              "### Changed\n",
              """### Changed\n\n- Outbound QoS 2 records are fully compacted after PUBREC: topic, payload and\n  PUBLISH properties are removed atomically while the original logical size is\n  retained until PUBCOMP releases admission accounting. SQLite schema 3 also\n  compacts pre-existing WAIT_PUBCOMP rows during migration.\n""",
          )

          Path("tests/unit/test_qos2_phase_two_compaction.py").write_text(r'''"""QoS 2 phase-two records retain settlement state, not PUBLISH data."""

from __future__ import annotations

import sqlite3
from pathlib import Path

import pytest

from mqttium.enums import MQTTProtocolVersion, OutboundQoSState, PacketType, QoS
from mqttium.packets import PubCompPacket, PubRecPacket, PubRelPacket, encode_frame
from mqttium.persistence.memory import MemoryInflightStore
from mqttium.persistence.sqlite import SQLITE_SCHEMA_VERSION, SqliteInflightStore
from mqttium.protocol.engine import EffectKind, EngineConfig, ProtocolEngine
from mqttium.types import OutboundMessage, Properties
from tests.support import feed_engine, write_item_bytes


def connack(*, session_present: bool = False) -> bytes:
    return encode_frame(
        PacketType.CONNACK,
        0,
        bytes((int(session_present), 0, 0)),  # flags, success reason, empty properties
    )


def connected_engine(store: object) -> ProtocolEngine:
    engine = ProtocolEngine(
        EngineConfig(
            client_id="qos2-compaction",
            clean_start=False,
            protocol=MQTTProtocolVersion.MQTTv5,
        ),
        store=store,  # type: ignore[arg-type]
    )
    engine.begin_connect()
    feed_engine(engine, connack())
    engine.take_effects()
    return engine


def sent_packets(engine: ProtocolEngine) -> list[bytes]:
    return [
        write_item_bytes(effect.data)
        for effect in engine.take_effects()
        if effect.kind is EffectKind.SEND
    ]


def make_properties() -> Properties:
    properties = Properties()
    properties.set("message_expiry_interval", 60)
    properties.add_user_property("trace", "phase-two")
    return properties


@pytest.mark.parametrize("kind", ["memory", "sqlite"])
def test_pubrec_removes_all_publish_application_data(kind: str, tmp_path: Path) -> None:
    store: MemoryInflightStore | SqliteInflightStore
    store = (
        MemoryInflightStore()
        if kind == "memory"
        else SqliteInflightStore(tmp_path / "phase-two.db")
    )
    try:
        engine = connected_engine(store)
        handle = engine.queue_publish(
            "large/qos2/topic",
            b"x" * (2 * 1024 * 1024),
            qos=QoS.EXACTLY_ONCE,
            properties=make_properties(),
        )
        mid = handle.mid or 0
        logical_size = engine.pending_outbound_bytes
        engine.take_effects()

        feed_engine(
            engine,
            PubRecPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5),
        )

        assert sent_packets(engine) == [
            PubRelPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5)
        ]
        stored = store.get_out(mid)
        assert stored is not None
        assert stored.state is OutboundQoSState.WAIT_PUBCOMP
        assert stored.topic == ""
        assert stored.payload == b""
        assert stored.properties is None
        assert stored.logical_size == logical_size
        assert engine.pending_outbound_bytes == logical_size
        assert engine.pending_outbound_messages == 1
        assert engine.flow.inflight == 1

        feed_engine(
            engine,
            PubCompPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5),
        )
        completions = engine.take_effects()
        assert any(
            effect.kind is EffectKind.PUBLISH_COMPLETE and effect.data == mid
            for effect in completions
        )
        assert store.get_out(mid) is None
        assert engine.pending_outbound_bytes == 0
        assert engine.pending_outbound_messages == 0
        assert engine.flow.inflight == 0
    finally:
        if isinstance(store, SqliteInflightStore):
            store.close()


def test_compacted_sqlite_record_restarts_with_pubrel_only(tmp_path: Path) -> None:
    path = tmp_path / "restart.db"
    store = SqliteInflightStore(path)
    engine = connected_engine(store)
    handle = engine.queue_publish(
        "restart/qos2",
        b"r" * (1024 * 1024),
        qos=QoS.EXACTLY_ONCE,
        properties=make_properties(),
    )
    mid = handle.mid or 0
    logical_size = engine.pending_outbound_bytes
    engine.take_effects()
    feed_engine(engine, PubRecPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5))
    engine.take_effects()
    store.close()

    reopened = SqliteInflightStore(path)
    recovered = ProtocolEngine(
        EngineConfig(
            client_id="qos2-compaction",
            clean_start=False,
            protocol=MQTTProtocolVersion.MQTTv5,
        ),
        store=reopened,
    )
    assert recovered.pending_outbound_bytes == logical_size
    compacted = reopened.get_out(mid)
    assert compacted is not None
    assert compacted.topic == ""
    assert compacted.payload == b""
    assert compacted.properties is None

    recovered.begin_connect()
    feed_engine(recovered, connack(session_present=True))
    assert sent_packets(recovered) == [
        PubRelPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5)
    ]
    feed_engine(
        recovered,
        PubCompPacket(mid=mid).encode(MQTTProtocolVersion.MQTTv5),
    )
    recovered.take_effects()
    assert reopened.get_out(mid) is None
    assert recovered.pending_outbound_bytes == 0
    reopened.close()


def test_schema_v2_migration_compacts_existing_wait_pubcomp_row(tmp_path: Path) -> None:
    path = tmp_path / "schema-v2.db"
    conn = sqlite3.connect(path)
    conn.execute(f"CREATE TABLE outbound ({SqliteInflightStore.OUTBOUND_COLUMNS})")
    conn.execute(
        """
        INSERT INTO outbound(
            mid, seq, qos, retain, state, dup, logical_size, topic, properties, payload
        ) VALUES (7, 1, 2, 0, ?, 0, 4242, 'legacy/topic', ?, ?)
        """,
        (
            int(OutboundQoSState.WAIT_PUBCOMP),
            '{"user_property":[["legacy","yes"]]}',
            sqlite3.Binary(b"legacy payload"),
        ),
    )
    conn.execute("PRAGMA user_version=2")
    conn.commit()
    conn.close()

    store = SqliteInflightStore(path)
    assert int(store._conn.execute("PRAGMA user_version").fetchone()[0]) == SQLITE_SCHEMA_VERSION
    record = store.get_out(7)
    assert record is not None
    assert record.state is OutboundQoSState.WAIT_PUBCOMP
    assert record.topic == ""
    assert record.payload == b""
    assert record.properties is None
    assert record.logical_size == 4242
    store.close()


def test_direct_transition_keeps_logical_size_while_compacting() -> None:
    store = MemoryInflightStore()
    store.put_out(
        OutboundMessage(
            mid=9,
            topic="direct/topic",
            payload=b"payload",
            qos=QoS.EXACTLY_ONCE,
            retain=False,
            state=OutboundQoSState.WAIT_PUBREC,
            properties=make_properties(),
            logical_size=999,
        )
    )

    meta = store.transition_out(
        9,
        OutboundQoSState.WAIT_PUBREC,
        OutboundQoSState.WAIT_PUBCOMP,
        compact=True,
    )

    assert meta is not None and meta.logical_size == 999
    record = store.get_out(9)
    assert record is not None
    assert (record.topic, record.payload, record.properties) == ("", b"", None)
''')
          PY
      - name: Format and validate
        run: |
          ruff format src tests
          ruff check src tests
          mypy src
          bandit -q -ll -r src
          pytest -q tests/unit/test_qos2_phase_two_compaction.py tests/unit/test_store_transitions.py tests/unit/test_sqlite_migration.py
          pytest -q tests/unit
      - name: Commit final tree
        run: |
          rm .github/workflows/qos2-compaction-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact outbound QoS2 phase-two records"
