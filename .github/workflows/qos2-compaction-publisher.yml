name: Publish QoS2 phase-two compaction

on:
  push:
    branches:
      - agent/qos2-phase-two-compaction
    paths:
      - .github/workflows/qos2-compaction-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/qos2-phase-two-compaction
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,security]"
      - run: python .github/scripts/apply_qos2_compaction.py
      - name: Validate
        run: |
          ruff format src tests
          ruff check src tests
          mypy src
          bandit -q -ll -r src
          pytest -q tests/unit/test_qos2_phase_two_compaction.py tests/unit/test_store_transitions.py tests/unit/test_sqlite_migration.py
          pytest -q tests/unit
      - name: Commit final tree
        run: |
          rm .github/workflows/qos2-compaction-publisher.yml
          rm .github/scripts/apply_qos2_compaction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact outbound QoS2 phase-two records"
          git push origin HEAD:agent/qos2-phase-two-compaction
