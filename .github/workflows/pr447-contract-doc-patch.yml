name: PR447 provisional transport contract docs

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/pr447-contract-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/direct-decoder-ingress-prototype
          fetch-depth: 0
          persist-credentials: true
      - name: Patch changelog and API policy only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '### Changed\n\n'
          entry = (
              '- Revise the Provisional `mqttium.transport` contract so receive mode is explicit: '
              '`AsyncTransport` now describes the common write/lifecycle surface, while public '
              '`PullTransport` (`read()`) and `DecoderPushTransport` (`attach_decoder()` / `receive()`) '
              'describe the two supported receive capabilities. Existing custom transports that implement '
              '`read()` remain pull transports without a behavioral migration; new direct-ingress transports '
              'must use the decoder-push capability instead of exposing a synthetic `read()`. See '
              '`docs/transport-receive-capabilities.md` for migration guidance.\n\n'
          )
          assert marker in text
          assert 'Revise the Provisional `mqttium.transport` contract' not in text
          changelog.write_text(text.replace(marker, marker + entry, 1))

          policy = Path('docs/api-stability.md')
          text = policy.read_text()
          old = (
              'For concrete\ntransports, the Provisional contract is behavioral rather than exact-class based:\n'
              '`TcpTransport.connect()` is a factory for a supported `AsyncTransport` receive\n'
              'implementation, and may return a different concrete transport when an optimized\n'
              'receive capability is selected. Preserving subclasses of `TcpTransport` across\n'
              'that factory boundary is not a supported extension seam; integrations that need\n'
              'custom connection construction should provide an `AsyncClient` transport factory.\n'
          )
          new = (
              'For concrete\ntransports, the Provisional contract is behavioral rather than exact-class based. '
              '`AsyncTransport`\ncontains the common write/lifecycle surface; a custom transport additionally implements '
              'the\npublic `PullTransport` capability (`read()`) or `DecoderPushTransport` capability\n'
              '(`attach_decoder()` / `receive()`). Existing read-based custom transports remain valid pull\n'
              'transports. See [`transport-receive-capabilities.md`](transport-receive-capabilities.md) for\n'
              'the supported imports, detection rules and migration guidance. `TcpTransport.connect()` is a\n'
              'factory for a supported receive implementation and may return a different concrete transport\n'
              'when an optimized receive capability is selected. Preserving subclasses of `TcpTransport`\n'
              'across that factory boundary is not a supported extension seam; integrations that need custom\n'
              'connection construction should provide an `AsyncClient` transport factory.\n'
          )
          assert old in text
          policy.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          python -m pip install -e '.[dev]' >/dev/null
          pytest -q tests/project/test_transport_api_surface.py tests/project/test_public_api_surface.py
          git diff --exit-code -- src
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mqttium implementation agent'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md docs/api-stability.md
          git diff --cached --check
          git commit -m 'docs: migrate provisional transport receive contract'
          git push origin HEAD:perf/direct-decoder-ingress-prototype
