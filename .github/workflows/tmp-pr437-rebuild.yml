name: Temporary PR437 rebuild

on:
  push:
    branches: [mission/strict-protocol-error-effects]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Reapply strict effect contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('src/mqttium/api/async_client.py')
          text = path.read_text()
          tree = ast.parse(text)
          target = None
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == '_raise_protocol_effect':
                  target = node
                  break
          if target is None or target.end_lineno is None:
              raise SystemExit('missing _raise_protocol_effect')
          lines = text.splitlines(keepends=True)
          replacement = '''    def _raise_protocol_effect(self, data: object) -> Never:\n        if not isinstance(data, (MalformedPacketError, ProtocolError)):\n            raise TypeError(\n                "PROTOCOL_ERROR effect payload must be MalformedPacketError or ProtocolError"\n            )\n        if self._engine.state is ConnectionState.DISCONNECTED:\n            self._disconnect_exc = data\n        raise data\n'''
          lines[target.lineno - 1:target.end_lineno] = [replacement]
          path.write_text(''.join(lines))

          test = Path('tests/unit/test_effect_failure_routing.py')
          text = test.read_text()
          if 'from mqttium.errors import ProtocolError\n' not in text:
              marker = 'from mqttium.api._effects import EffectPump\n'
              if text.count(marker) != 1:
                  raise SystemExit('unexpected effect routing import marker')
              text = text.replace(marker, marker + 'from mqttium.errors import ProtocolError\n', 1)
          old = 'EngineEffect(EffectKind.PROTOCOL_ERROR, "rude peer")'
          new = 'EngineEffect(EffectKind.PROTOCOL_ERROR, ProtocolError("rude peer"))'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unexpected PROTOCOL_ERROR fixture')
          test.write_text(text)
          PY
          python -m pip install 'ruff>=0.16'
          ruff format src/mqttium/api/async_client.py tests/unit/test_effect_failure_routing.py tests/unit/test_protocol_error_effect_contract.py
          ruff check --fix src/mqttium/api/async_client.py tests/unit/test_effect_failure_routing.py tests/unit/test_protocol_error_effect_contract.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mqttium/api/async_client.py tests/unit/test_effect_failure_routing.py tests/unit/test_protocol_error_effect_contract.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: make protocol error effects strict'
          git push origin HEAD:mission/strict-protocol-error-effects
