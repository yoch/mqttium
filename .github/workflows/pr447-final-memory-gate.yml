name: PR447 final memory gate

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/pr447-final-memory-gate.yml

permissions:
  contents: read

concurrency:
  group: pr447-final-memory-gate
  cancel-in-progress: false

env:
  RUNTIME_SHA: b047477e003e0519fa5f663f1cf434cb229cc6ee

jobs:
  memory:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify runtime and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          out="$RUNNER_TEMP/pr447-memory-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Build process-isolated probe
        shell: bash
        run: |
          cat > "$OUT/probe.py" <<'PY'
          from __future__ import annotations
          import argparse, asyncio, gc, json, os, resource
          from pathlib import Path

          K = 1024
          M = K * K

          def encode_vbi(value: int) -> bytes:
              out = bytearray()
              while True:
                  digit = value % 128
                  value //= 128
                  if value:
                      digit |= 0x80
                  out.append(digit)
                  if not value:
                      return bytes(out)

          def frame_total(total: int, fill: int = 0x61) -> bytes:
              for fixed in range(2, 6):
                  body = total - fixed
                  if body < 0:
                      continue
                  encoded = encode_vbi(body)
                  if 1 + len(encoded) == fixed:
                      return b'\x30' + encoded + bytes((fill,)) * body
              raise ValueError(total)

          def rss() -> int:
              with open('/proc/self/statm', encoding='ascii') as f:
                  return int(f.read().split()[1]) * os.sysconf('SC_PAGE_SIZE')

          def peak() -> int:
              return int(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss) * 1024

          class DirectFeeder:
              def __init__(self, decoder):
                  self.decoder = decoder
                  self.preferred = 64*K
                  self.full = 0
              def put(self, wire: bytes, fragments=(1<<30,)):
                  offset = 0; i = 0
                  while offset < len(wire):
                      view = self.decoder.writable_window(self.preferred)
                      offered = len(view)
                      take = min(offered, fragments[i % len(fragments)], len(wire)-offset)
                      view[:take] = wire[offset:offset+take]
                      view.release()
                      self.decoder.commit(take)
                      if self.preferred < 256*K:
                          if offered >= 64*K and take*4 >= offered*3:
                              self.full += 1
                              if self.full >= 2:
                                  self.preferred = 256*K; self.full = 0
                          else:
                              self.full = 0
                      offset += take; i += 1

          def drain(decoder) -> int:
              n = 0
              while decoder.next_packet() is not None:
                  n += 1
              return n

          def stats(decoder):
              return {
                  'capacity': int(decoder.capacity),
                  'capacity_peak': int(decoder.capacity_peak),
                  'logical_high_water': int(decoder.high_water),
                  'growth_count': int(decoder.growth_count),
                  'reallocation_count': int(decoder.reallocation_count),
                  'shrink_count': int(decoder.shrink_count),
                  'compaction_count': int(decoder.compaction_count),
                  'buffered': int(decoder.buffered),
              }

          def decoder_scenario(name: str):
              from mqttium.codec.buffer import IncrementalDecoder
              before_rss, before_peak = rss(), peak()
              d = IncrementalDecoder(max_packet_size=8*M)
              f = DirectFeeder(d)
              extra = {}
              if name == 'near_limit':
                  wire = frame_total(8*M)
                  f.put(wire, (65536, 262144, 32767, 131071))
                  extra['capacity_live'] = d.capacity
                  extra['packets'] = drain(d)
              elif name == 'repeated_large':
                  wire = frame_total(2*M)
                  f.put(wire, (65536, 262144)); drain(d)
                  first = stats(d)
                  for _ in range(19):
                      f.put(wire, (65536, 262144)); drain(d)
                  extra['after_first'] = first
                  extra['reallocation_delta_after_first'] = d.reallocation_count - first['reallocation_count']
                  extra['shrink_delta_after_first'] = d.shrink_count - first['shrink_count']
              elif name == 'large_to_tiny':
                  f.put(frame_total(8*M), (65536, 262144)); drain(d)
                  extra['capacity_after_large'] = d.capacity
                  tiny = frame_total(64)
                  for _ in range(64):
                      f.put(tiny); drain(d)
                  extra['capacity_after_small'] = d.capacity
              elif name == 'large_to_coalesced_small':
                  f.put(frame_total(8*M), (65536, 262144)); drain(d)
                  extra['capacity_after_large'] = d.capacity
                  burst = frame_total(64) * 64
                  for _ in range(40):
                      f.put(burst)
                      assert drain(d) == 64
                  extra['capacity_after_coalesced_small'] = d.capacity
              elif name == 'reconnect':
                  f.put(frame_total(2*M), (65536, 262144)); drain(d)
                  extra['capacity_before_clear'] = d.capacity
                  d.clear()
                  extra['capacity_after_clear'] = d.capacity
              else:
                  raise ValueError(name)
              gc.collect()
              after_rss, after_peak = rss(), peak()
              return {
                  'scenario': name, 'runtime_sha': os.environ['RUNTIME_SHA'],
                  'rss_before': before_rss, 'rss_after': after_rss,
                  'rss_incremental': after_rss-before_rss,
                  'peak_before': before_peak, 'peak_rss': after_peak,
                  'peak_incremental': max(0, after_peak-before_peak),
                  **stats(d), **extra,
              }

          async def multi_connection():
              from mqttium.codec.buffer import IncrementalDecoder
              from mqttium.transport import DecoderPushTransport
              from mqttium.transport.tcp import TcpTransport
              release = asyncio.Event(); writers = []
              async def handler(reader, writer):
                  del reader
                  writers.append(writer)
                  writer.write(b'\xc0\x00'); await writer.drain()
                  await release.wait()
              server = await asyncio.start_server(handler, '127.0.0.1', 0)
              host, port = server.sockets[0].getsockname()[:2]
              before_rss, before_peak = rss(), peak()
              transports = await asyncio.gather(*(TcpTransport.connect(str(host), int(port)) for _ in range(32)))
              decoders = [IncrementalDecoder(max_packet_size=8*M) for _ in transports]
              try:
                  for t, d in zip(transports, decoders):
                      assert isinstance(t, DecoderPushTransport)
                      t.attach_decoder(d)
                  await asyncio.gather(*(t.receive() for t in transports))
                  assert all(d.next_packet() is not None for d in decoders)
                  gc.collect()
                  after_rss, after_peak = rss(), peak()
                  return {
                      'scenario':'multi_connection', 'runtime_sha':os.environ['RUNTIME_SHA'],
                      'connections':32, 'rss_before':before_rss, 'rss_after':after_rss,
                      'rss_incremental':after_rss-before_rss,
                      'peak_before':before_peak, 'peak_rss':after_peak,
                      'peak_incremental':max(0, after_peak-before_peak),
                      'capacity_sum':sum(d.capacity for d in decoders),
                      'capacity_peak_sum':sum(d.capacity_peak for d in decoders),
                      'max_capacity':max(d.capacity for d in decoders),
                  }
              finally:
                  release.set()
                  await asyncio.gather(*(t.close() for t in transports), return_exceptions=True)
                  for w in writers:
                      w.close()
                  server.close(); await server.wait_closed()

          def main():
              p=argparse.ArgumentParser(); p.add_argument('scenario'); p.add_argument('output'); a=p.parse_args()
              result = asyncio.run(multi_connection()) if a.scenario == 'multi_connection' else decoder_scenario(a.scenario)
              Path(a.output).write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
              print(json.dumps(result, indent=2, sort_keys=True))
          if __name__ == '__main__': main()
          PY
      - name: Run six targeted scenarios
        shell: bash
        run: |
          set -euo pipefail
          for s in near_limit repeated_large large_to_tiny large_to_coalesced_small reconnect multi_connection; do
            env PYTHONPATH="$PWD/candidate/src" RUNTIME_SHA="$RUNTIME_SHA" python3 "$OUT/probe.py" "$s" "$OUT/$s.json"
          done
      - name: Check memory bounds and summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          K=1024; M=K*K; root=Path(os.environ['OUT'])
          rows={p.stem:json.loads(p.read_text()) for p in root.glob('*.json')}
          n=rows['near_limit']; assert n['capacity_live'] == 8*M; assert n['capacity_peak'] == 8*M
          r=rows['repeated_large']; assert r['reallocation_delta_after_first'] == 0; assert r['shrink_delta_after_first'] == 0; assert r['capacity'] <= 2*M
          t=rows['large_to_tiny']; assert t['capacity_after_small'] <= 256*K
          c=rows['large_to_coalesced_small']; assert c['capacity_after_coalesced_small'] <= 256*K
          x=rows['reconnect']; assert x['capacity_after_clear'] <= 64*K
          m=rows['multi_connection']; assert m['connections'] == 32; assert m['max_capacity'] <= 64*K; assert m['capacity_sum'] <= 32*64*K
          summary={'runtime_sha':os.environ['RUNTIME_SHA'],'bounds_ok':True,'scenarios':rows}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr447-final-memory-${{ env.RUNTIME_SHA }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
