name: Open-loop Calibration Investigation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  investigate:
    if: github.head_ref == 'investigate/open-loop-calibration-stability'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact investigation HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$EXPECTED_HEAD" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected Python 3.13, got {sys.version}")
          PY
          command -v mosquitto
          command -v taskset
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate evidence" >&2
            exit 1
          fi
          shopt -s nullglob
          governors=(/sys/devices/system/cpu/cpufreq/policy*/scaling_governor)
          test "${#governors[@]}" -gt 0
          for path in "${governors[@]}"; do
            test "$(cat "$path")" = performance
          done

      - name: Prepare isolated environment and broker
        shell: bash
        run: |
          set -euo pipefail
          echo "JOB_ROOT=$RUNNER_TEMP/mqttium-calibration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "VENV_ROOT=$RUNNER_TEMP/mqttium-calibration-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Install probe dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT" "$VENV_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$VENV_ROOT"
          echo "$VENV_ROOT/bin" >> "$GITHUB_PATH"
          "$VENV_ROOT/bin/python" -m pip install "psutil>=6,<8"

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$JOB_ROOT/mosquitto.log" 2>&1 &
          echo "$!" > "$JOB_ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$JOB_ROOT/mosquitto.pid")" 2>/dev/null || { cat "$JOB_ROOT/mosquitto.log"; exit 1; }
            sleep 0.2
          done
          cat "$JOB_ROOT/mosquitto.log"
          exit 1

      - name: Define adaptive preflight helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/wait-preflight.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          root="$2"
          mkdir -p "$root/preflight-$label-attempts"
          consecutive=0
          for attempt in $(seq 1 16); do
            report="$root/preflight-$label-attempts/$(printf '%02d' "$attempt").json"
            python benchmarks/runner_probe.py --output "$report" --require-temperature
            if python - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          sample = report["sample"]
          print(
              f"eligible={report['eligible']} cpu={sample['cpu_percent']:.1f}% "
              f"load1/cpu={sample['load_1m_per_cpu']:.4f} temp={sample.get('max_temperature_c')}"
          )
          raise SystemExit(0 if report["eligible"] else 1)
          PY
            then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 2 ]; then
                cp "$report" "$root/preflight-$label.json"
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 5
          done
          echo "runner did not become stably eligible for $label" >&2
          exit 2
          EOF
          chmod +x "$JOB_ROOT/wait-preflight.sh"

      - name: Balanced A/A capacity calibration
        shell: bash
        run: |
          set -euo pipefail
          "$JOB_ROOT/wait-preflight.sh" calibration "$JOB_ROOT"
          started=$(date +%s)
          python - "$JOB_ROOT/calibration.json" <<'PY'
          import json
          import math
          import os
          import pathlib
          import statistics
          import subprocess
          import sys
          import time

          output = pathlib.Path(sys.argv[1])
          env = os.environ.copy()
          env["PYTHONPATH"] = str(pathlib.Path("src").resolve())

          def one(protocol: str, arm: str, cycle: int, slot: int) -> dict[str, object]:
              command = [
                  sys.executable,
                  "benchmarks/paired_open_loop.py",
                  "--worker",
                  "--mode", "calibrate",
                  "--host", "127.0.0.1",
                  "--port", "11883",
                  "--protocol", protocol,
                  "--payload-bytes", "4096",
                  "--completion", "receipt",
                  "--count", "5000",
                  "--window", "100",
                  "--target-rate", "0",
                  "--timeout", "120",
                  "--cpu", "2",
              ]
              started = time.perf_counter()
              completed = subprocess.run(command, check=True, capture_output=True, text=True, env=env)
              elapsed = time.perf_counter() - started
              lines = [line for line in completed.stdout.splitlines() if line.strip()]
              payload = json.loads(lines[-1])
              return {
                  "arm": arm,
                  "cycle": cycle,
                  "slot": slot,
                  "capacity": float(payload["capacity"]),
                  "worker_elapsed_seconds": elapsed,
                  "completed_rate": float(payload["completed_rate"]),
                  "ack_latency_p50_ms": float(payload["ack_latency_p50_ms"]),
              }

          result: dict[str, object] = {"count": 5000, "cycles": 2, "protocols": {}}
          for protocol in ("311", "5"):
              measurements = []
              for cycle in (1, 2):
                  for slot, arm in enumerate(("base", "candidate", "candidate", "base"), start=1):
                      item = one(protocol, arm, cycle, slot)
                      measurements.append(item)
                      print(
                          f"calibration protocol={protocol} cycle={cycle} slot={slot} arm={arm} "
                          f"capacity={item['capacity']:.1f}",
                          flush=True,
                      )
              by_arm = {
                  arm: [float(item["capacity"]) for item in measurements if item["arm"] == arm]
                  for arm in ("base", "candidate")
              }
              estimates = {
                  arm: math.exp(statistics.fmean(math.log(value) for value in values))
                  for arm, values in by_arm.items()
              }
              all_values = [float(item["capacity"]) for item in measurements]
              cv = statistics.stdev(all_values) / statistics.fmean(all_values)
              conservative = min(estimates.values())
              result["protocols"][protocol] = {
                  "measurements": measurements,
                  "base_geomean": estimates["base"],
                  "candidate_geomean": estimates["candidate"],
                  "candidate_over_base": estimates["candidate"] / estimates["base"],
                  "all_measurement_cv": cv,
                  "conservative_capacity": conservative,
                  "target_rates": {
                      str(fraction): conservative * fraction
                      for fraction in (0.50, 0.75, 0.90, 1.00)
                  },
              }
          output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
          echo $(( $(date +%s) - started )) > "$JOB_ROOT/calibration-seconds.txt"

      - name: MQTT 3.1.1 receipt load curve
        shell: bash
        run: |
          set -euo pipefail
          "$JOB_ROOT/wait-preflight.sh" curve-311 "$JOB_ROOT"
          rates=$(python - "$JOB_ROOT/calibration.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))["protocols"]["311"]["target_rates"]
          print(",".join(str(data[str(value)]) for value in (0.5, 0.75, 0.9, 1.0)))
          PY
          )
          started=$(date +%s)
          python benchmarks/paired_open_loop.py \
            --base-root . --candidate-root . \
            --protocols 311 --payloads 4096 --windows 100 \
            --completions receipt --target-rates "$rates" \
            --repeat 4 --count-large 5000 --target-sample-seconds 1.5 \
            --cpu 2 --policy advisory \
            --preflight-report "$JOB_ROOT/preflight-curve-311.json" \
            --output "$JOB_ROOT/curve-311.json" \
            --summary-output "$JOB_ROOT/curve-311.md"
          echo $(( $(date +%s) - started )) > "$JOB_ROOT/curve-311-seconds.txt"

      - name: MQTT 5 receipt load curve
        shell: bash
        run: |
          set -euo pipefail
          "$JOB_ROOT/wait-preflight.sh" curve-5 "$JOB_ROOT"
          rates=$(python - "$JOB_ROOT/calibration.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))["protocols"]["5"]["target_rates"]
          print(",".join(str(data[str(value)]) for value in (0.5, 0.75, 0.9, 1.0)))
          PY
          )
          started=$(date +%s)
          python benchmarks/paired_open_loop.py \
            --base-root . --candidate-root . \
            --protocols 5 --payloads 4096 --windows 100 \
            --completions receipt --target-rates "$rates" \
            --repeat 4 --count-large 5000 --target-sample-seconds 1.5 \
            --cpu 2 --policy advisory \
            --preflight-report "$JOB_ROOT/preflight-curve-5.json" \
            --output "$JOB_ROOT/curve-5.json" \
            --summary-output "$JOB_ROOT/curve-5.md"
          echo $(( $(date +%s) - started )) > "$JOB_ROOT/curve-5-seconds.txt"

      - name: Summarize calibration and latency knee
        shell: bash
        run: |
          set -euo pipefail
          python - "$JOB_ROOT" <<'PY' | tee "$JOB_ROOT/comparison.txt" >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import statistics
          import sys

          root = pathlib.Path(sys.argv[1])
          calibration = json.loads((root / "calibration.json").read_text())
          print("# Balanced calibration and receipt load curve")
          print(f"\nCalibration wall time: {(root / 'calibration-seconds.txt').read_text().strip()}s")
          for protocol in ("311", "5"):
              cal = calibration["protocols"][protocol]
              print(f"\n## Protocol {protocol} calibration")
              print(f"- base geomean: {cal['base_geomean']:.1f} msg/s")
              print(f"- candidate geomean: {cal['candidate_geomean']:.1f} msg/s")
              print(f"- A/A candidate/base: {cal['candidate_over_base']:.4f}")
              print(f"- raw calibration CV: {cal['all_measurement_cv']:.2%}")
              print(f"- conservative capacity: {cal['conservative_capacity']:.1f} msg/s")

              curve = json.loads((root / f"curve-{protocol}.json").read_text())
              by_rate = {
                  float(value): float(fraction)
                  for fraction, value in cal["target_rates"].items()
              }
              print(f"- curve wall time: {(root / f'curve-{protocol}-seconds.txt').read_text().strip()}s")
              print("\n| load | completed ratio | completed CV base/cand | ACK p50 median base/cand ms | ACK p50 CV base/cand | loop-lag ratio |")
              print("| ---: | ---: | ---: | ---: | ---: | ---: |")
              for scenario in curve["scenarios"]:
                  target = float(scenario["target_rate"])
                  fraction = min(by_rate, key=lambda value: abs(value - target))
                  base_p50 = [float(pair["base"]["ack_latency_p50_ms"]) for pair in scenario["pairs"]]
                  cand_p50 = [float(pair["candidate"]["ack_latency_p50_ms"]) for pair in scenario["pairs"]]
                  print(
                      f"| {by_rate[fraction]:.0%} | {scenario['median_candidate_over_base_completed']:.4f} | "
                      f"{scenario['base_completed_cv']:.2%}/{scenario['candidate_completed_cv']:.2%} | "
                      f"{statistics.median(base_p50):.4f}/{statistics.median(cand_p50):.4f} | "
                      f"{scenario['base_ack_latency_p50_cv']:.2%}/{scenario['candidate_ack_latency_p50_cv']:.2%} | "
                      f"{scenario['median_candidate_over_base_loop_lag_p95']:.4f} |"
                  )
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: open-loop-calibration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-calibration-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/mqttium-calibration-${{ github.run_id }}-${{ github.run_attempt }}/*.md
            ${{ runner.temp }}/mqttium-calibration-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            ${{ runner.temp }}/mqttium-calibration-${{ github.run_id }}-${{ github.run_attempt }}/preflight-*-attempts/*.json
            ${{ runner.temp }}/mqttium-calibration-${{ github.run_id }}-${{ github.run_attempt }}/mosquitto.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$JOB_ROOT/mosquitto.pid" ]; then
            pid="$(cat "$JOB_ROOT/mosquitto.pid")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT" "$VENV_ROOT"
