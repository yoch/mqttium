name: Direct ingress paired probe

on:
  push:
    branches:
      - agent/native-rtt-ingress-hotpath
    paths:
      - benchmarks/direct_ingress_hotpath.py
      - .github/workflows/direct-ingress-paired-probe.yml

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: main
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare isolated environments
        run: |
          cp candidate/benchmarks/direct_ingress_hotpath.py /tmp/direct_ingress_hotpath.py
          python -m venv /tmp/mqttium-base
          python -m venv /tmp/mqttium-candidate
          /tmp/mqttium-base/bin/pip install -e ./base
          /tmp/mqttium-candidate/bin/pip install -e ./candidate
          mkdir -p /tmp/direct-ingress-paired
      - name: Five ABBA cycles
        run: |
          set -euo pipefail
          for cycle in $(seq 1 5); do
            PYTHONPATH=base/src /tmp/mqttium-base/bin/python /tmp/direct_ingress_hotpath.py \
              --runs 1 --messages 160000 --label "base-${cycle}-a" \
              --output "/tmp/direct-ingress-paired/base-${cycle}-a.json"
            PYTHONPATH=candidate/src /tmp/mqttium-candidate/bin/python /tmp/direct_ingress_hotpath.py \
              --runs 1 --messages 160000 --label "candidate-${cycle}-a" \
              --output "/tmp/direct-ingress-paired/candidate-${cycle}-a.json"
            PYTHONPATH=candidate/src /tmp/mqttium-candidate/bin/python /tmp/direct_ingress_hotpath.py \
              --runs 1 --messages 160000 --label "candidate-${cycle}-b" \
              --output "/tmp/direct-ingress-paired/candidate-${cycle}-b.json"
            PYTHONPATH=base/src /tmp/mqttium-base/bin/python /tmp/direct_ingress_hotpath.py \
              --runs 1 --messages 160000 --label "base-${cycle}-b" \
              --output "/tmp/direct-ingress-paired/base-${cycle}-b.json"
          done
      - name: Compare paired cycles
        run: |
          python - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path('/tmp/direct-ingress-paired')
          cycles = []
          base_rates = []
          candidate_rates = []
          base_suspensions = []
          candidate_suspensions = []
          for cycle in range(1, 6):
              docs = {
                  f'{kind}-{side}': json.loads(
                      (root / f'{kind}-{cycle}-{side}.json').read_text()
                  )
                  for kind in ('base', 'candidate')
                  for side in ('a', 'b')
              }
              base = [docs[f'base-{side}'] for side in ('a', 'b')]
              candidate = [docs[f'candidate-{side}'] for side in ('a', 'b')]
              b_rate = statistics.median(item['rate_median'] for item in base)
              c_rate = statistics.median(item['rate_median'] for item in candidate)
              cycles.append({
                  'cycle': cycle,
                  'base': b_rate,
                  'candidate': c_rate,
                  'ratio': c_rate / b_rate,
              })
              base_rates.extend(item['rate_median'] for item in base)
              candidate_rates.extend(item['rate_median'] for item in candidate)
              base_suspensions.extend(
                  item['samples'][0]['effect_suspensions'] for item in base
              )
              candidate_suspensions.extend(
                  item['samples'][0]['effect_suspensions'] for item in candidate
              )
          result = {
              'cycles': cycles,
              'rate': {
                  'base_median': statistics.median(base_rates),
                  'candidate_median': statistics.median(candidate_rates),
                  'paired_ratio_median': statistics.median(
                      item['ratio'] for item in cycles
                  ),
              },
              'effect_suspensions': {
                  'base_median': statistics.median(base_suspensions),
                  'candidate_median': statistics.median(candidate_suspensions),
              },
          }
          (root / 'comparison.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: direct-ingress-paired-${{ github.run_id }}
          path: /tmp/direct-ingress-paired
          retention-days: 14
