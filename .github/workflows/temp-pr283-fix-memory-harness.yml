name: TEMP PR283 repair memory harness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR283 branch
        uses: actions/checkout@v7
        with:
          ref: agent/scheduler-resident-message-budget
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and patch benchmark fixture
        shell: bash
        env:
          EXPECTED_SHA: ec8b9e8063350d265a3c36431a6dfaeb72363387
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/memory_profile.py")
          text = path.read_text()
          old = '''    for payload in payloads:\n        client._outbound.put_nowait(payload)\n        client._outbound_bytes += len(payload)\n'''
          new = '''    for payload in payloads:\n        assert client._try_enqueue_outbound(payload)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one private writer injection, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          python -m py_compile benchmarks/memory_profile.py
          git diff --check
          git diff -- benchmarks/memory_profile.py

      - name: Commit and push benchmark repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/memory_profile.py
          git commit -m "bench: seed reconnect cleanup through writer admission"
          git push origin HEAD:agent/scheduler-resident-message-budget
