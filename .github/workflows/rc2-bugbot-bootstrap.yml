name: RC2 Bugbot follow-up bootstrap

on:
  push:
    branches:
      - fix/rc2-bugbot-followups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rc2-bugbot-followups
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fixes and targeted regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mqttium/api/async_client.py')
          text = path.read_text()

          old = 'and self._engine.state is ConnectionState.DISCONNECTING'
          new = 'and self._engine.state in (ConnectionState.CONNECTED, ConnectionState.DISCONNECTING)'
          if text.count(old) != 1:
              raise SystemExit(f'clean_disconnect match count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              '                self._engine._check_outbound_size(packet)\n'
              '                await self._enqueue_outbound(\n'
          )
          new = (
              '                try:\n'
              '                    self._engine._check_outbound_size(packet)\n'
              '                except PacketTooLargeError as exc:\n'
              '                    # The broker limit makes the required AUTH rejection\n'
              '                    # impossible to send. Close the transport so the connection\n'
              '                    # cannot remain active after this terminal condition.\n'
              '                    self._disconnect_exc = exc\n'
              '                    self._intentional_disconnect = True\n'
              '                    if self._transport is not None:\n'
              '                        try:\n'
              '                            await self._transport.close()\n'
              '                        except Exception:\n'
              '                            pass\n'
              '                    return\n'
              '                await self._enqueue_outbound(\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'AUTH size-check match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = '  emitting an illegal packet.\n- Graceful and fatal shutdown preserve'
          new = (
              '  emitting an illegal packet. An intentional `disconnect()` fallback still reports\n'
              '  a clean `on_disconnect(None)`, while an AUTH rejection that cannot fit closes the\n'
              '  active connection instead of leaving it open.\n- Graceful and fatal shutdown preserve'
          )
          if text.count(old) != 1:
              raise SystemExit(f'changelog MPS match count={text.count(old)}')
          changelog.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e '.[dev]'
          ruff format src tests
          ruff check src tests
          python -m pytest -q tests/unit/test_control_packet_size_lifecycle.py tests/unit/test_async_lifecycle.py
          git diff --check
      - name: Commit and remove bootstrap
        run: |
          set -euo pipefail
          git add src/mqttium/api/async_client.py tests/unit/test_control_packet_size_lifecycle.py CHANGELOG.md
          git rm .github/workflows/rc2-bugbot-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Bugbot RC2 lifecycle findings'
          git push origin HEAD:fix/rc2-bugbot-followups
