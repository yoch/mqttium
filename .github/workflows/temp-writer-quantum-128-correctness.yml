name: TEMP writer quantum 128 KiB correctness

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-writer-quantum-128-correctness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: 7d20fc5200e868df61391d00c21e5d7b0d63c78a
  OLD_286_SHA: 8362d50072ce5a09bbf564fff1368c62a06e88fc
  QUANTUM_BYTES: "131072"
  PYTHONUNBUFFERED: "1"

jobs:
  correctness:
    name: Full correctness from candidate root
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout study support
        uses: actions/checkout@v7
        with:
          path: support
          persist-credentials: false
      - name: Checkout immutable candidate root
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Checkout historical #286 tests
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OLD_286_SHA }}
          path: old286
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e "candidate[dev]"
      - name: Apply 128 KiB candidate
        run: python support/benchmarks/temp_apply_writer_quantum_128.py candidate --quantum "$QUANTUM_BYTES"
      - name: Port historical quantum invariants
        run: |
          cp old286/tests/unit/test_write_pump_byte_quantum.py candidate/tests/unit/test_write_pump_byte_quantum_temp.py
          python support/benchmarks/temp_port_writer_quantum_tests.py candidate/tests/unit/test_write_pump_byte_quantum_temp.py
      - name: Full unit suite from repository root
        working-directory: candidate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit
