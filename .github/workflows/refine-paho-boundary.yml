name: Refine native publish boundary

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply focused refinements
        run: python .github/refine_paho_boundary.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format and validate
        run: |
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src
          PYTHONPATH=. pytest -q tests/unit
      - name: Smoke new paired controls
        run: |
          python benchmarks/paired_regression.py --worker --scenario async_publish_nowait_qos0
          python benchmarks/paired_regression.py --worker --scenario compat_publish_qos1
          python benchmarks/paired_regression.py --worker --scenario compat_publish_qos0_batch
      - name: Commit validated refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add paired compatibility performance controls"
          git push origin HEAD:agent/paho-native-publish-boundary
