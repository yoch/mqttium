name: recv allocator threshold probe ARM64

on:
  push:
    branches: [bench/recv-allocator-probe-arm64]
    paths: [.github/workflows/recv-allocator-probe-arm64.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PROBE_SHA: a0dc3ae779799ab623227c02c05459b64896930f
    steps:
      - name: Set run workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recv-threshold-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root/results"
          echo "JOB_ROOT=$root" >> "$GITHUB_ENV"

      - name: Verify ARM host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /proc/sys/kernel/randomize_va_space)" != 0
          python3 --version
          ldd --version | head -n1
          echo "aslr=$(cat /proc/sys/kernel/randomize_va_space)"
          echo "personality=$(cat /proc/$$/personality)"
          command -v strace

      - name: Checkout exact allocator probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.PROBE_SHA }}
          path: probe
          persist-credentials: false

      - name: Verify probe provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C probe rev-parse HEAD)" = "$PROBE_SHA"
          cp probe/scripts/recv_allocator_probe.py "$JOB_ROOT/recv_allocator_probe.py"
          printf 'probe_sha=%s\nworker_aslr=system\n' "$PROBE_SHA" > "$JOB_ROOT/results/provenance.txt"

      - name: Force 256 KiB above glibc mmap threshold
        shell: bash
        run: |
          set -euo pipefail
          GLIBC_TUNABLES=glibc.malloc.mmap_threshold=131072 \
            python3 "$JOB_ROOT/recv_allocator_probe.py" \
              --samples 10 --iterations 3000 --warmup 50 \
              --payload-size 256 --recv-sizes 262144 \
              --aslr system \
              --output "$JOB_ROOT/results/threshold-128k.json" \
              | tee "$JOB_ROOT/results/threshold-128k.txt"

      - name: Force 256 KiB below glibc mmap threshold
        shell: bash
        run: |
          set -euo pipefail
          GLIBC_TUNABLES=glibc.malloc.mmap_threshold=524288 \
            python3 "$JOB_ROOT/recv_allocator_probe.py" \
              --samples 10 --iterations 3000 --warmup 50 \
              --payload-size 256 --recv-sizes 262144 \
              --aslr system \
              --output "$JOB_ROOT/results/threshold-512k.json" \
              | tee "$JOB_ROOT/results/threshold-512k.txt"

      - name: Capture syscall profile across fresh normal-ASLR layouts
        shell: bash
        run: |
          set -euo pipefail
          printf 'sample,ru_minflt,ns_per_op\n' > "$JOB_ROOT/results/strace-classification.csv"
          for i in $(seq 1 16); do
            strace -qq -c -e trace=mmap,mremap,munmap,brk \
              -o "$JOB_ROOT/results/recv256-$i.strace" \
              python3 "$JOB_ROOT/recv_allocator_probe.py" --child \
                --recv-size 262144 --payload-size 256 --iterations 500 --warmup 20 \
              > "$JOB_ROOT/results/recv256-$i.json"
            python3 - "$i" "$JOB_ROOT/results/recv256-$i.json" <<'PY' >> "$JOB_ROOT/results/strace-classification.csv"
          import json, sys
          sample=sys.argv[1]
          row=json.load(open(sys.argv[2], encoding='utf-8'))
          print(f"{sample},{row['ru_minflt']},{row['ns_per_op']}")
          PY
          done
          cat "$JOB_ROOT/results/strace-classification.csv"

      - name: Upload allocator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recv-allocator-threshold-arm64-${{ github.run_id }}
          path: ${{ env.JOB_ROOT }}/results
          if-no-files-found: error
          retention-days: 14
