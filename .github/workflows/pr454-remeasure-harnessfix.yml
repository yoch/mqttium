name: PR454 remeasure with fixed RTT harness
on:
  push:
    branches: [work/pr454-remeasure-harnessfix-20260910]
permissions:
  contents: read
jobs:
  fixed-rate-rpi5:
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: mqttium-arm64-runner
      cancel-in-progress: false
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MQTTIUM_BASE: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
      MQTTIUM_CANDIDATE: 636de564dc2c92822a8361050cc24e369fe027d4
      HARNESS_SHA: ef2382cf8ed20e5df4288102c1ae17e791a25d68
      TARGET_RATE: '3942'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
          path: arm-a
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 636de564dc2c92822a8361050cc24e369fe027d4
          path: arm-b
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: yoch/mqtt-python-client-bench
          ref: ef2382cf8ed20e5df4288102c1ae17e791a25d68
          path: bench
      - name: Verify exact sources and isolate environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C arm-a rev-parse HEAD)" = "$MQTTIUM_BASE"
          test "$(git -C arm-b rev-parse HEAD)" = "$MQTTIUM_CANDIDATE"
          test "$(git -C bench rev-parse HEAD)" = "$HARNESS_SHA"
          test -z "$(git -C arm-a status --porcelain --untracked-files=no)"
          test -z "$(git -C arm-b status --porcelain --untracked-files=no)"
          test -z "$(git -C bench status --porcelain --untracked-files=no)"
          ROOT=$(mktemp -d "$RUNNER_TEMP/pr454-harnessfix-${GITHUB_RUN_ID}-XXXXXX")
          echo "JOB_ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 -m venv "$ROOT/venv"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
          mkdir -p results
          {
            uname -a
            lscpu
            python3 -V
            printf 'runner=%s\n' "$RUNNER_NAME"
            if test -f /proc/device-tree/model; then printf 'model='; cat /proc/device-tree/model; echo; fi
            for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor /sys/class/thermal/thermal_zone*/temp; do
              if test -f "$f"; then printf '%s=' "$f"; cat "$f"; fi
            done
          } > results/machine.txt
      - name: Install corrected harness
        run: python -m pip install -e 'bench[paho]'
      - name: Start isolated Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          command -v mosquitto
          (mosquitto -h || true) > results/mosquitto-version.txt 2>&1
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          listener 18894 127.0.0.1
          allow_anonymous true
          persistence false
          set_tcp_nodelay true
          max_inflight_messages 1000
          max_queued_messages 100000
          log_type error
          EOF
          cp "$JOB_ROOT/mosquitto.conf" results/
          mosquitto -c "$JOB_ROOT/mosquitto.conf" > results/mosquitto.log 2>&1 &
          echo $! > "$JOB_ROOT/broker.pid"
          python arm-b/tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:18894
          kill -0 "$(cat "$JOB_ROOT/broker.pid")"
      - name: Pin external broker to harness broker cpuset
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          from mqtt_client_bench.telemetry import allocate_cpuset
          sets = allocate_cpuset(['sut','broker','loadgen','orch'], profile='standard')
          pathlib.Path('results/cpusets.json').write_text(json.dumps(sets, indent=2))
          ids=[]
          for part in sets['broker'].split(','):
              if '-' in part:
                  a,b=map(int,part.split('-')); ids.extend(range(a,b+1))
              else:
                  ids.append(int(part))
          pid=int((pathlib.Path(os.environ['JOB_ROOT'])/'broker.pid').read_text())
          os.sched_setaffinity(pid,set(ids))
          PY
      - name: Prepare clean duplicate for same-source A/A
        shell: bash
        run: |
          set -euo pipefail
          cp -a arm-a "$JOB_ROOT/arm-aa"
          test "$(git -C "$JOB_ROOT/arm-aa" rev-parse HEAD)" = "$MQTTIUM_BASE"
          test -z "$(git -C "$JOB_ROOT/arm-aa" status --porcelain --untracked-files=no)"
      - name: Same-source A/A control — 6 balanced blocks
        shell: bash
        run: |
          set -euo pipefail
          python -m mqtt_client_bench.version_compare \
            --client mqttium \
            --baseline-path arm-a \
            --candidate-path "$JOB_ROOT/arm-aa" \
            --scenario application_rtt_fixed_rate \
            --variant-index 0 \
            --target-rate "$TARGET_RATE" \
            --pacer-mode external \
            --broker 127.0.0.1:18894 \
            --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 6 \
            --max-block-retries 1 \
            --profile standard \
            --output results/fixed-rate-aa.json | tee results/fixed-rate-aa.log
      - name: Candidate A/B — 8 balanced blocks
        shell: bash
        run: |
          set -euo pipefail
          python -m mqtt_client_bench.version_compare \
            --client mqttium \
            --baseline-path arm-a \
            --candidate-path arm-b \
            --scenario application_rtt_fixed_rate \
            --variant-index 0 \
            --target-rate "$TARGET_RATE" \
            --pacer-mode external \
            --broker 127.0.0.1:18894 \
            --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 8 \
            --max-block-retries 1 \
            --profile standard \
            --output results/fixed-rate-ab.json | tee results/fixed-rate-ab.log
      - name: Independent readback and tail summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, math, pathlib, random
          out={}
          for name in ('aa','ab'):
              p=pathlib.Path(f'results/fixed-rate-{name}.json')
              if not p.exists():
                  continue
              d=json.loads(p.read_text())
              rows=[]
              for r in d.get('runs',[]):
                  if not r.get('active_for_verdict'):
                      continue
                  workers=r.get('workers') or []
                  w=next((x for x in workers if x.get('role')=='rtt_initiator'), {})
                  lat=w.get('latency_summary') or {}
                  rows.append({
                      'label':r.get('ab_label'), 'block':r.get('logical_block'),
                      'attempt':r.get('block_attempt'), 'status':r.get('status'),
                      'usable':r.get('version_ab_observation_usable'),
                      'p50_ms':lat.get('p50_ms'),'p95_ms':lat.get('p95_ms'),'p99_ms':lat.get('p99_ms'),
                      'offered':w.get('offered'),'completed':w.get('completed_in_window'),
                      'missed':w.get('missed_due_to_backpressure'),
                  })
              out[name]={'qualification':d.get('qualification'),'verdict':d.get('verdict'),'rows':rows}
          pathlib.Path('results/readback.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
          cat results/readback.json
      - name: Final identity and cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if test -n "${JOB_ROOT:-}" && test -f "$JOB_ROOT/broker.pid"; then kill "$(cat "$JOB_ROOT/broker.pid")" 2>/dev/null; fi
          git -C arm-a rev-parse HEAD > results/final-base-sha.txt
          git -C arm-b rev-parse HEAD > results/final-candidate-sha.txt
          git -C bench rev-parse HEAD > results/final-harness-sha.txt
          git -C arm-a status --porcelain --untracked-files=no > results/final-base-status.txt
          git -C arm-b status --porcelain --untracked-files=no > results/final-candidate-status.txt
          git -C bench status --porcelain --untracked-files=no > results/final-harness-status.txt
          if test -n "${JOB_ROOT:-}"; then rm -rf "$JOB_ROOT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr454-fixed-harness-rpi5
          path: results/
          retention-days: 30
