name: Format final fuzz regression

on:
  push:
    branches: [fix/runtime-fuzzer-wire-obligations]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/runtime-fuzzer-wire-obligations
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact Ruff formatting
        run: |
          set -euo pipefail
          test "$(git hash-object tests/fuzz/test_runtime_fuzzer.py)" = b51aae2024a5a5a2af1384d4ffaf62c9f842ff37
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/fuzz/test_runtime_fuzzer.py")
          text = path.read_text()
          old = '''        if any(\n            item[0].packet_type is runtime_fuzzer.PacketType.DISCONNECT\n            for item in newly_completed\n        ):'''
          new = '''        if any(\n            item[0].packet_type is runtime_fuzzer.PacketType.DISCONNECT for item in newly_completed\n        ):'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          test "$(git hash-object tests/fuzz/test_runtime_fuzzer.py)" = 80d5f4ec2a769ec019febd325a45afd5addb45fb
          rm .github/workflows/format-final-fuzz.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format late wire regression'
          git push origin HEAD:fix/runtime-fuzzer-wire-obligations
