name: Publish nowait exact-size fix v2

on:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - benchmarks/publish-nowait-exact-size-v2.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out study harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Check out clean target branch
        uses: actions/checkout@v7
        with:
          ref: agent/nowait-exact-wire-size
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build candidate
        run: python harness/.github/scripts/build_nowait_exact_pr.py candidate
      - name: Validate exact tree
        working-directory: candidate
        run: |
          python -m pip install -e ".[dev,security]"
          ruff format \
            src/mqttium/api/async_client.py \
            src/mqttium/protocol/outbound.py \
            tests/unit/test_nowait_wire_size.py \
            benchmarks/nowait_wire_size.py
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
          python benchmarks/nowait_wire_size.py \
            --count 50000 --repeat 5 --output /tmp/nowait-wire-size.json
          git diff --check
      - name: Publish one commit
        working-directory: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            benchmarks/nowait_wire_size.py \
            docs/NOWAIT-WIRE-SIZE.md \
            src/mqttium/api/async_client.py \
            src/mqttium/protocol/outbound.py \
            tests/unit/test_nowait_wire_size.py
          git diff --cached --check
          test "$(git rev-list --count origin/main..HEAD)" -eq 0
          git commit -m 'Avoid preview encoding in publish_nowait'
          git push origin HEAD:agent/nowait-exact-wire-size
