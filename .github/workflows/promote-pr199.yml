name: Promote PR199
on:
  push:
    branches: [review/promote-pr199]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Preserve baseline and apply non-conflicting original files
        run: |
          git worktree add /tmp/mqttium-base HEAD
          git diff c34a9499ed2723054c2e0d3b730248f176be0856..origin/cursor/ack-success-fastpath-6aff -- src/mqttium/packets/acks.py tests/unit/test_ack_hotpath.py > /tmp/pr199-clean.patch
          git apply --3way --whitespace=error-all /tmp/pr199-clean.patch
          git show origin/cursor/ack-success-fastpath-6aff:docs/reports/ACK-SUCCESS-FASTPATH.md > docs/reports/ACK-SUCCESS-FASTPATH.md
          git show origin/review/promote-pr199:.github/promote_pr199.py > /tmp/promote_pr199.py
          git show origin/review/promote-pr199:.github/remove_pr199_config.py > /tmp/remove_pr199_config.py
          git show origin/review/promote-pr199:.github/bench_pr199.py > /tmp/bench_pr199.py
          python /tmp/promote_pr199.py
          python /tmp/remove_pr199_config.py
          git diff --check
      - name: Validate cumulative implementation
        run: |
          python -m pip install -e ".[dev,security]"
          ruff check --fix src tests benchmarks
          ruff format src tests benchmarks
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit/test_ack_hotpath.py tests/unit/test_ack_fastpath_rpi.py tests/unit/test_rc2_hardening_followups.py
          python -m pytest -q tests/unit
          git diff --check
      - name: Paired full in-memory QoS2 cycle
        run: python /tmp/bench_pr199.py
      - name: Commit corrected cumulative branch
        run: |
          git config user.name yoch
          git config user.email yoch.melka@gmail.com
          git add CHANGELOG.md docs src tests
          git commit -m "Fast-path common success acknowledgement frames"
          git push --force origin HEAD:cursor/ack-success-fastpath-6aff
