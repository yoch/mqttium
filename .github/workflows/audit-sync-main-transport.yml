name: Audit sync main into transport PR

on:
  push:
    branches:
      - agent/harden-websocket-transport-audit
    paths:
      - .github/workflows/audit-sync-main-transport.yml

permissions:
  contents: write

jobs:
  sync-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-websocket-transport-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main with constrained conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if (( merge_rc != 0 )); then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            printf 'unresolved: %s\n' "${unresolved[*]}"
            [[ ${#unresolved[@]} -eq 1 && "${unresolved[0]}" == 'CHANGELOG.md' ]]
            git show :2:CHANGELOG.md > /tmp/ours
            git show :1:CHANGELOG.md > /tmp/base
            git show :3:CHANGELOG.md > /tmp/theirs
            git merge-file --union -p /tmp/ours /tmp/base /tmp/theirs > CHANGELOG.md || true
            ! grep -qE '^(<<<<<<<|=======|>>>>>>>)' CHANGELOG.md
            grep -qi 'WebSocket' CHANGELOG.md
            grep -q 'U+FEFF' CHANGELOG.md
            grep -qi 'Paho VERSION2' CHANGELOG.md
            grep -qi 'reconnect' CHANGELOG.md
            git add CHANGELOG.md
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/audit-sync-main-transport.yml
          git diff --cached --check
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,security]'
      - name: Quality and unit gates on merged tree
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
      - name: Commit validated main sync
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Merge main into WebSocket transport audit branch'
          git push origin HEAD:agent/harden-websocket-transport-audit
