name: Native hotpath architecture study

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - .github/workflows/native-hotpath-study.yml
      - benchmarks/native-hotpath-study-trigger.txt

permissions:
  contents: read

concurrency:
  group: native-hotpath-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clients and broker
        run: |
          python -m pip install -e ".[dev]" gmqtt==0.7.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Start isolated Mosquitto
        run: |
          mkdir -p /tmp/mqttium-hotpath
          cat > /tmp/mqttium-hotpath/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 1000000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/mqttium-hotpath/mosquitto.conf \
            > /tmp/mqttium-hotpath/mosquitto.log 2>&1 &
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          cat /tmp/mqttium-hotpath/mosquitto.log
          exit 1
      - name: Materialize experimental native harness
        shell: bash
        run: |
          cat > /tmp/native-hotpath.b64 <<'B64'
          
          B64
          base64 -d /tmp/native-hotpath.b64 | gzip -d > /tmp/native_hotpath_matrix.py
          python -m py_compile /tmp/native_hotpath_matrix.py
      - name: Smoke native variants
        run: |
          python /tmp/native_hotpath_matrix.py --worker \
            --scenario ingress_direct --variant mqttium-baseline --messages 10000
          python /tmp/native_hotpath_matrix.py --worker \
            --scenario ingress_direct --variant gmqtt --messages 10000
          python /tmp/native_hotpath_matrix.py --worker \
            --scenario rtt --variant mqttium-nowait --pairs 1000 --window 32
          python /tmp/native_hotpath_matrix.py --worker \
            --scenario rtt --variant gmqtt --pairs 1000 --window 32
      - name: Run rotated native architecture matrix
        run: |
          python /tmp/native_hotpath_matrix.py \
            --scenario all \
            --cycles 4 \
            --messages 120000 \
            --pairs 8000 \
            --window 32 \
            --output /tmp/mqttium-hotpath/native-hotpath-matrix.json
      - name: Upload study evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hotpath-study-${{ github.run_id }}
          path: |
            /tmp/mqttium-hotpath/native-hotpath-matrix.json
            /tmp/mqttium-hotpath/mosquitto.log
          if-no-files-found: warn
          retention-days: 30
