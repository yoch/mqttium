name: PR205 conservative fallback fix

on:
  push:
    branches:
      - cursor/qos12-message-batch-6aff

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix PR205 conservative delivery mark fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply conservative fallback and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/mqttium/protocol/effects.py",
              "    # MESSAGE only: True when application acceptance must mark a persisted\n    # inbound record delivered. Keeping this on the effect avoids inferring\n    # persistence from the current manual_ack setting during restart replay.\n    requires_delivery_mark: bool = False\n",
              "    # MESSAGE only: False explicitly means no persisted delivery mark is\n    # required, True means one is required, and None preserves the conservative\n    # legacy behavior for unclassified/internal effects constructed directly.\n    requires_delivery_mark: bool | None = None\n",
          )
          replace(
              "src/mqttium/api/_delivery.py",
              "            if effect.requires_delivery_mark or not self._is_small(message, 1):\n",
              "            if effect.requires_delivery_mark is not False or not self._is_small(message, 1):\n",
          )
          replace(
              "src/mqttium/api/async_client.py",
              "            if effect.requires_delivery_mark:\n                assert message.mid is not None\n                async with self._engine_lock:\n                    self._engine.mark_inbound_delivered(message.mid)\n",
              "            if effect.requires_delivery_mark is not False and message.mid is not None:\n                async with self._engine_lock:\n                    self._engine.mark_inbound_delivered(message.mid)\n",
          )

          test_path = Path("tests/unit/test_batched_message_effects.py")
          text = test_path.read_text()
          anchor = "\n\n@pytest.mark.parametrize(\"qos\", [QoS.AT_LEAST_ONCE, QoS.EXACTLY_ONCE])\ndef test_batch_defers_persisted_acknowledged_messages(qos: QoS) -> None:\n"
          addition = '''\n\ndef test_unclassified_identified_message_is_not_batched() -> None:\n    client = AsyncClient(message_delivery="iterator")\n    unknown = EngineEffect(\n        kind=EffectKind.MESSAGE,\n        data=Message(\n            topic="hot/path",\n            payload=b"payload",\n            qos=QoS.AT_LEAST_ONCE,\n            mid=7,\n        ),\n    )\n\n    applied = client._apply_message_effect_batch_inline(\n        deque([unknown, _effect()]),\n        client._connection_epoch,\n    )\n\n    assert unknown.requires_delivery_mark is None\n    assert applied == 0\n    assert client._messages.empty()\n'''
          if anchor not in text:
              raise SystemExit("test insertion anchor missing")
          test_path.write_text(text.replace(anchor, addition + anchor, 1))

          report = Path("docs/reports/AUTO-QOS1-MESSAGE-BATCH-DELIVERY.md")
          text = report.read_text()
          anchor = "This makes persistence ownership explicit at the protocol/runtime boundary\ninstead of reconstructing it from current configuration.\n"
          replacement = anchor + "\nFor safety and compatibility, an `EngineEffect(MESSAGE, ...)` constructed without\nclassification keeps `requires_delivery_mark=None`. Such an unclassified effect\nis never batch-eligible; if it has a packet identifier, the runtime preserves the\nlegacy delivery-mark behavior. Only an authoritative producer setting explicit\n`False` opts a MESSAGE into the non-persisted fast path.\n"
          if anchor not in text:
              raise SystemExit("report insertion anchor missing")
          report.write_text(text.replace(anchor, replacement, 1))
          PY

          python -m pip install -q -e '.[dev]'
          python -m ruff format src/mqttium/protocol/effects.py src/mqttium/api/_delivery.py src/mqttium/api/async_client.py tests/unit/test_batched_message_effects.py
          python -m ruff check src/mqttium/protocol/effects.py src/mqttium/api/_delivery.py src/mqttium/api/async_client.py tests/unit/test_batched_message_effects.py
          python -m mypy src/mqttium/protocol/effects.py src/mqttium/api/_delivery.py src/mqttium/api/async_client.py
          python -m pytest -q tests/unit

          git rm .github/workflows/pr205-conservative-fallback-fix.yml
          git config user.name 'yoch'
          git config user.email 'yoch.melka@gmail.com'
          git add -A
          git commit -m 'Preserve conservative MESSAGE delivery marking'
          git push origin HEAD:cursor/qos12-message-batch-6aff
