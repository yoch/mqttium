name: RC Gate Investigation Report

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: github.repository == 'yoch/mqttium' && github.head_ref == 'investigate/rc-release-gate-stability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch latest completed ARM64 investigation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch='investigate%2Frc-release-gate-stability'
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/rc-gate-investigation.yml/runs?branch=${encoded_branch}&event=push&status=completed&per_page=20")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs")"
          if [ -z "$run_id" ]; then
            echo 'No completed RC Gate Investigation push run exists.' >&2
            exit 2
          fi
          echo "Investigation run: $run_id"
          jq -r '.workflow_runs[0] | "status=\(.status) conclusion=\(.conclusion) head_sha=\(.head_sha) created_at=\(.created_at) updated_at=\(.updated_at) html_url=\(.html_url)"' <<<"$runs"

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > jobs.json
          jq -r '.jobs[] | "job=\(.name) status=\(.status) conclusion=\(.conclusion) id=\(.id)"' jobs.json

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > artifacts.json
          artifact_id="$(jq -r '.artifacts[] | select(.name | startswith("rc-gate-investigation-")) | .id' artifacts.json | head -n1)"
          if [ -z "$artifact_id" ]; then
            echo 'No investigation evidence artifact was uploaded.' >&2
            exit 3
          fi
          echo "Evidence artifact: $artifact_id"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > evidence.zip
          mkdir evidence
          unzip -q evidence.zip -d evidence
          echo '--- evidence files ---'
          find evidence -type f -maxdepth 6 -print | sort

          summary="$(find evidence -name investigation-summary.md -type f -print -quit)"
          if [ -n "$summary" ]; then
            echo '--- investigation summary ---'
            cat "$summary"
          fi

          for report in aa-unpinned-diagnostic.json aa-pinned-diagnostic.json ab-pinned-diagnostic.json; do
            path="$(find evidence -name "$report" -type f -print -quit)"
            if [ -n "$path" ]; then
              echo "--- $report ---"
              jq '{source_status,max_loop_lag_ratio,scenario_count,relative_loop_lag_failures,invalidations,regressions,relative_failures:[.scenarios[]|select(.relative_failure)|{protocol,payload_bytes,completion,load,loop_lag_ratio,base_loop_lag_p95_ms_median,candidate_loop_lag_p95_ms_median,median_absolute_delta_ms,max_abs_pair_delta_ms}]}' "$path"
            fi
          done

          carry="$(find evidence -name carryover.txt -type f -print -quit)"
          if [ -n "$carry" ]; then
            echo '--- carryover ---'
            cat "$carry"
          fi
