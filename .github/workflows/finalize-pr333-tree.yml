name: Finalize PR333 tree

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'validation/pr333-arm64'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate tree branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: validation/pr333-final-tree
          fetch-depth: 0
      - name: Apply lint-only annotation with exact guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ad5b64ec0714b398fbd19bfc0cc12953295021a9"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mqttium/api/async_client.py')
          text = path.read_text()
          old = '    def _process_direct_qos0_batch(\n'
          new = '    def _process_direct_qos0_batch(  # noqa: C901\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          python -m compileall -q src/mqttium
          git diff -- src/mqttium/api/async_client.py
      - name: Commit final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/async_client.py
          git commit -m "Annotate intentional QoS0 hot-path complexity"
          git push origin HEAD:validation/pr333-final-tree
