name: TEMP Apply QoS bounded microbatch

on:
  push:
    branches: [fix/qos-bounded-microbatch]
    paths:
      - .github/patches/qos-bounded-microbatch.patch
      - .github/workflows/apply-qos-bounded-microbatch.yml

permissions:
  contents: write

concurrency:
  group: apply-qos-bounded-microbatch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/qos-bounded-microbatch
          fetch-depth: 0
      - name: Apply production patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/qos-bounded-microbatch.patch
          git apply .github/patches/qos-bounded-microbatch.patch
          rm .github/patches/qos-bounded-microbatch.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqttium/api/_writer.py src/mqttium/api/async_client.py tests/unit/test_write_pump_latency_batch.py .github/patches/qos-bounded-microbatch.patch
          git commit -m "fix(writer): bound QoS latency microbatches"
          git push origin HEAD:fix/qos-bounded-microbatch
