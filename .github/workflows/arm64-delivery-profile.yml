name: ARM64 Delivery Profile
run-name: "Delivery profile: ${{ inputs.base_ref }} -> ${{ inputs.candidate_ref }}"

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact reviewed baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that both commits were reviewed and are trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  delivery-profile:
    if: inputs.confirm_trusted_code && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/lean-native-experiment')
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out profiling harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: harness
          persist-credentials: false

      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "all refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v taskset
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected system Python 3.14, got {sys.version}")
          PY

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-delivery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_ROOT=$root" >> "$GITHUB_ENV"
          rm -rf "$root"
          mkdir -p "$root"
          python3 -m venv "$root/venv"
          echo "$root/venv/bin" >> "$GITHUB_PATH"

      - name: Enforce dedicated-runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Paired delivery timings and cProfile attribution
        env:
          PYTHONPATH: harness/src
        run: |
          taskset -c 2 python harness/benchmarks/paired_delivery_profile.py \
            --base-root base \
            --candidate-root candidate \
            --cpu 2 \
            --repeat 5 \
            --warmup 2000 \
            --operations 30000 \
            --profile-operations 5000 \
            --output "$JOB_ROOT/delivery-profile.json"

      - name: Summarize attribution
        run: |
          python - "$JOB_ROOT/delivery-profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          for scenario in payload["scenarios"]:
              print(f"\n## {scenario['name']} ratio={scenario['median_candidate_over_base']:.4f}")
              for variant in ("base", "candidate"):
                  print(f"  {variant} top cumulative:")
                  rows = scenario["profile"][variant]["top_cumulative"][:12]
                  for row in rows:
                      print(
                          f"    {row['cumulative_us_per_op']:8.3f} us/op "
                          f"{row['calls_per_op']:7.3f} calls/op  {row['function']}"
                      )
          PY

      - name: Upload delivery profiling evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-delivery-profile-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/delivery-profile.json
            ${{ env.JOB_ROOT }}/runner.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$JOB_ROOT"
