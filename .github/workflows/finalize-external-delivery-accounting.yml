name: Finalize external delivery accounting candidate

on:
  push:
    branches:
      - agent/external-delivery-accounting
    paths:
      - .github/workflows/finalize-external-delivery-accounting.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/external-delivery-accounting
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Add changelog entry and remove experimental tooling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "## [Unreleased]\n\n"
          replacement = (
              "## [Unreleased]\n\n"
              "### Changed\n\n"
              "- Inbound delivery byte accounting is now kept outside public `Message`\n"
              "  instances. One consumer carries the byte count directly; simultaneous\n"
              "  callback and iterator delivery share a compact two-reference reservation.\n"
              "  This removes private mutable state from the frozen model, makes each\n"
              "  `Message` 16 bytes smaller and preserves exact backpressure and queue bounds.\n\n"
          )
          if text.count(marker) != 1:
              raise RuntimeError("unexpected Unreleased changelog marker")
          path.write_text(text.replace(marker, replacement, 1))
          PY
          rm benchmarks/experimental/external_delivery_accounting_matrix.py
          rm .github/workflows/external-delivery-accounting-benchmark.yml
          rm .github/workflows/external-delivery-accounting-cost.yml
          rm .github/workflows/finalize-external-delivery-accounting.yml
      - name: Validate final tree
        run: |
          python -m pip install -e ".[dev,security]"
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
      - name: Commit final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src tests benchmarks .github
          git commit -m "Finalize external delivery accounting candidate"
          git push origin HEAD:agent/external-delivery-accounting
