name: Apply external delivery accounting

on:
  push:
    branches:
      - agent/external-delivery-accounting
    paths:
      - .github/scripts/apply_external_delivery_accounting.py
      - .github/workflows/apply-external-delivery-accounting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/external-delivery-accounting
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply focused transformation
        run: python .github/scripts/apply_external_delivery_accounting.py
      - name: Format and run focused tests
        run: |
          python -m pip install -e ".[dev]"
          ruff format src/mqttium/types.py src/mqttium/api/async_client.py \
            tests/unit/test_memory_cleanup.py tests/unit/test_external_delivery_accounting.py
          ruff check src/mqttium/types.py src/mqttium/api/async_client.py \
            tests/unit/test_memory_cleanup.py tests/unit/test_external_delivery_accounting.py
          python -m pytest -q \
            tests/unit/test_external_delivery_accounting.py \
            tests/unit/test_memory_cleanup.py \
            tests/unit/test_delivery_limits.py \
            tests/unit/test_callback_worker.py
      - name: Remove one-shot transformer
        run: |
          rm .github/scripts/apply_external_delivery_accounting.py
          rm .github/workflows/apply-external-delivery-accounting.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github
          git commit -m "Externalize delivery accounting from Message"
          git push origin HEAD:agent/external-delivery-accounting
