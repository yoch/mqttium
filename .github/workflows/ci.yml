name: TEMP ARM64 writer regime instrumentation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  instrument:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 120
    steps:
      - name: Define paths
        shell: bash
        run: |
          echo "ROOT=$RUNNER_TEMP/writer-regime" >> "$GITHUB_ENV"
          echo "VENV=$RUNNER_TEMP/writer-regime-venv" >> "$GITHUB_ENV"

      - name: Checkout immutable base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout immutable base into stack workspace
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: stack
          persist-credentials: false

      - name: Compose exact runtime heads
        working-directory: stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid
          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"
          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"
          git checkout --ours docs/reports/README.md src/mqttium/api/_writer.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/mqttium/api/_writer.py')
          text=p.read_text()
          def one(old,new):
              global text
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one writer match, got {n}: {old!r}')
              text=text.replace(old,new)
          one(
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                finally:\n                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                except asyncio.CancelledError:\n                    if self.waiters > 1:\n                        self.space.notify(1)\n                    raise\n                finally:\n                    self.waiters -= 1\n',
          )
          one(
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        writer_task = asyncio.current_task()\n        assert writer_task is not None\n        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          one(
              '                self._writing = True\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n                batch_completed = False\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          one(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                    batch_completed = True\n                finally:\n',
          )
          one(
              '                        self._release_resident(n_batch)\n                        if self.waiters:\n                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n                        if batch_completed and self.waiters and not writer_task.cancelling():\n                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          p.write_text(text)
          PY
          git add docs/reports/README.md src/mqttium/api/_writer.py
          git commit --no-edit
          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            git checkout --ours docs/reports/README.md
            git add docs/reports/README.md
            git commit --no-edit
          fi
          git diff --check "$BASE_SHA"..HEAD

      - name: Patch temporary benchmark with per-worker instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('base/benchmarks/paired_writer_capacity.py')
          text=p.read_text()
          old='''    sync_rejected: int\n    drain_seconds: float\n'''
          new='''    sync_rejected: int\n    drain_seconds: float\n    writer_batches: int = 0\n    writer_batched_items: int = 0\n    writer_batched_bytes: int = 0\n    writer_eager_writes: int = 0\n    writer_eager_bytes: int = 0\n    writer_enqueue_suspensions: int = 0\n    writer_segmented_writes: int = 0\n    publish_wakeups: int = 0\n    publish_wait_retries: int = 0\n    gc_gen0: int = 0\n    gc_gen1: int = 0\n    gc_gen2: int = 0\n    cpu_freq_start_khz: int | None = None\n    cpu_freq_end_khz: int | None = None\n'''
          if text.count(old)!=1: raise SystemExit('dataclass anchor mismatch')
          text=text.replace(old,new)
          old='''        result = await _run_phase(\n            client,\n            topic=topic,\n            payload=payload,\n            qos=args.qos,\n            count=args.count,\n            outstanding=args.outstanding,\n            timeout=args.timeout,\n        )\n        result.protocol = args.protocol\n        result.inflight = args.inflight\n        return result\n'''
          new='''        import gc\n\n        writer = client._write_pump\n        before_writer = writer.stats()\n        before_wakeups = getattr(client, "_publish_wakeups", 0)\n        before_retries = getattr(client, "_publish_wait_retries", 0)\n        before_gc = [entry["collections"] for entry in gc.get_stats()]\n\n        def cpu_freq_khz() -> int | None:\n            if args.cpu is None:\n                return None\n            path = Path(f"/sys/devices/system/cpu/cpu{args.cpu}/cpufreq/scaling_cur_freq")\n            try:\n                return int(path.read_text().strip())\n            except (OSError, ValueError):\n                return None\n\n        freq_start = cpu_freq_khz()\n        result = await _run_phase(\n            client,\n            topic=topic,\n            payload=payload,\n            qos=args.qos,\n            count=args.count,\n            outstanding=args.outstanding,\n            timeout=args.timeout,\n        )\n        freq_end = cpu_freq_khz()\n        after_writer = writer.stats()\n        after_gc = [entry["collections"] for entry in gc.get_stats()]\n        result.protocol = args.protocol\n        result.inflight = args.inflight\n        result.writer_batches = after_writer.batches - before_writer.batches\n        result.writer_batched_items = after_writer.batched_items - before_writer.batched_items\n        result.writer_batched_bytes = after_writer.batched_bytes - before_writer.batched_bytes\n        result.writer_eager_writes = after_writer.eager_writes - before_writer.eager_writes\n        result.writer_eager_bytes = after_writer.eager_bytes - before_writer.eager_bytes\n        result.writer_enqueue_suspensions = after_writer.enqueue_suspensions - before_writer.enqueue_suspensions\n        result.writer_segmented_writes = after_writer.segmented_writes - before_writer.segmented_writes\n        result.publish_wakeups = getattr(client, "_publish_wakeups", 0) - before_wakeups\n        result.publish_wait_retries = getattr(client, "_publish_wait_retries", 0) - before_retries\n        result.gc_gen0 = after_gc[0] - before_gc[0]\n        result.gc_gen1 = after_gc[1] - before_gc[1]\n        result.gc_gen2 = after_gc[2] - before_gc[2]\n        result.cpu_freq_start_khz = freq_start\n        result.cpu_freq_end_khz = freq_end\n        return result\n'''
          if text.count(old)!=1: raise SystemExit('sample anchor mismatch')
          text=text.replace(old,new)
          p.write_text(text)
          PY
          python3 -m py_compile base/benchmarks/paired_writer_capacity.py

      - name: Prepare runner and isolated broker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(nproc)" -ge 4
          rm -rf "$ROOT" "$VENV"
          mkdir -p "$ROOT"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install -e "stack[dev]" "psutil>=6,<8"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          cat > "$ROOT/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          taskset -c 0 mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && break
            sleep .2
          done
          test "$(awk '/Cpus_allowed_list/ {print $2}' /proc/$(cat "$ROOT/mosquitto.pid")/status)" = 0

      - name: Strict preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-$attempt.json"
            if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Default hash seed A/A and A/B instrumentation
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONHASHSEED || true
          "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
            --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 16 --cpu 1 \
            --policy advisory --preflight-report "$ROOT/preflight.json" --max-baseline-cv 1.0 \
            --min-completed-ratio 0.0 --output "$ROOT/default-aa.json"
          "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
            --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 16 --cpu 1 \
            --policy advisory --preflight-report "$ROOT/preflight.json" --max-baseline-cv 1.0 \
            --min-completed-ratio 0.0 --output "$ROOT/default-ab.json"

      - name: Requalify before fixed hash seed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-hash0-$attempt.json"
            if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight-hash0.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Fixed PYTHONHASHSEED=0 A/A and A/B instrumentation
        shell: bash
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
            --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 16 --cpu 1 \
            --policy advisory --preflight-report "$ROOT/preflight-hash0.json" --max-baseline-cv 1.0 \
            --min-completed-ratio 0.0 --output "$ROOT/hash0-aa.json"
          "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
            --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 16 --cpu 1 \
            --policy advisory --preflight-report "$ROOT/preflight-hash0.json" --max-baseline-cv 1.0 \
            --min-completed-ratio 0.0 --output "$ROOT/hash0-ab.json"

      - name: Analyze regime correlations
        shell: bash
        run: |
          "$VENV/bin/python" - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          fields=[
              'writer_batches','writer_batched_items','writer_eager_writes','writer_enqueue_suspensions',
              'publish_wakeups','publish_wait_retries','gc_gen0','gc_gen1','gc_gen2',
              'cpu_freq_start_khz','cpu_freq_end_khz','cpu_seconds'
          ]
          report={}
          for name in ('default-aa','default-ab','hash0-aa','hash0-ab'):
              d=json.loads((root/f'{name}.json').read_text())
              s=d['scenarios'][0]
              rows=[]
              for pair_index,pair in enumerate(s['pairs'],1):
                  for variant in ('base','candidate'):
                      r=dict(pair[variant])
                      r['pair']=pair_index
                      r['variant']=variant
                      r['order']=pair['order']
                      rows.append(r)
              entry={
                  'ratio':s['median_candidate_over_base_completed'],
                  'base_cv':s['base_completed_cv'],
                  'candidate_cv':s['candidate_completed_cv'],
                  'rows':rows,
                  'correlations':{},
              }
              rates=[r['completed_rate'] for r in rows]
              for field in fields:
                  vals=[r.get(field) for r in rows]
                  if all(isinstance(v,(int,float)) for v in vals) and len(set(vals))>1:
                      try: entry['correlations'][field]=statistics.correlation(rates, vals)
                      except statistics.StatisticsError: pass
              report[name]=entry
          (root/'regime-analysis.json').write_text(json.dumps(report,indent=2)+'\n')
          for name,e in report.items():
              print('\n',name,'ratio',round(e['ratio'],5),'CV',round(e['base_cv'],4),round(e['candidate_cv'],4))
              corrs=sorted(e['correlations'].items(), key=lambda kv: abs(kv[1]), reverse=True)
              print(' strongest correlations:', [(k,round(v,3)) for k,v in corrs[:8]])
              slow=sorted(e['rows'],key=lambda r:r['completed_rate'])[:4]
              fast=sorted(e['rows'],key=lambda r:r['completed_rate'])[-4:]
              for label,group in [('slow',slow),('fast',fast)]:
                  print(label,[(r['variant'],round(r['completed_rate']),r['writer_batches'],r['writer_batched_items'],r['writer_eager_writes'],r['gc_gen0'],r['cpu_freq_start_khz'],r['cpu_freq_end_khz']) for r in group])
          PY

      - name: Final cooldown and strict preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/mosquitto.pid" ]; then kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true; fi
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 2
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-final-$attempt.json"
            if [ -x "$VENV/bin/python" ] && "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight-final.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload regime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-regime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/writer-regime/*.json
            ${{ runner.temp }}/writer-regime/*.log
            ${{ runner.temp }}/writer-regime/*.conf
          if-no-files-found: warn
          retention-days: 30
