name: TEMP ARM64 isolate QoS1 writer-capacity regression

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  isolate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 180
    steps:
      - name: Define evidence root
        shell: bash
        run: echo "ROOT=$RUNNER_TEMP/qos1-isolation" >> "$GITHUB_ENV"

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout single candidates
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR283_SHA }}
          path: pr283
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PR284_SHA }}
          path: pr284
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PR285_SHA }}
          path: pr285
          persist-credentials: false

      - name: Checkout baseline workspaces for pairs
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: p283284
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: p283285
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: p284285
          persist-credentials: false

      - name: Build pair 283+284 with audited writer resolution
        shell: bash
        working-directory: p283284
        run: |
          set -euo pipefail
          git config user.name pair-probe
          git config user.email pair-probe@example.invalid
          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"
          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path='docs/reports/README.md'
          ours=subprocess.check_output(['git','show',f':2:{path}'],text=True)
          theirs=subprocess.check_output(['git','show',f':3:{path}'],text=True)
          lines=ours.splitlines()
          incoming=[l for l in theirs.splitlines() if l.startswith('| 2026-08-') and 'SCHEDULER-' in l and l not in lines]
          heading=lines.index('## Hot-path decisions')
          i=heading
          while i>0 and lines[i-1]=='': i-=1
          lines[i:i]=incoming
          Path(path).write_text('\n'.join(lines)+'\n')
          PY
          git checkout --ours src/mqttium/api/_writer.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mqttium/api/_writer.py')
          text=p.read_text()
          def one(old,new):
              global text
              n=text.count(old)
              if n!=1: raise SystemExit(f'expected 1 match, got {n}: {old!r}')
              text=text.replace(old,new)
          one(
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                finally:\n                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                except asyncio.CancelledError:\n                    # notify(n) is consumed by whoever is waiting. A waiter\n                    # cancelled after being selected must hand the wakeup on,\n                    # or the remaining producers stay parked with free slots.\n                    if self.waiters > 1:\n                        self.space.notify(1)\n                    raise\n                finally:\n                    self.waiters -= 1\n',
          )
          one(
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        writer_task = asyncio.current_task()\n        assert writer_task is not None\n        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          one(
              '                self._writing = True\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n                batch_completed = False\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          one(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                    batch_completed = True\n                finally:\n',
          )
          one(
              '                        self._release_resident(n_batch)\n                        if self.waiters:\n                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n                        if batch_completed and self.waiters and not writer_task.cancelling():\n                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          p.write_text(text)
          PY
          git add docs/reports/README.md src/mqttium/api/_writer.py
          git diff --check
          git commit --no-edit

      - name: Build pair 283+285
        shell: bash
        working-directory: p283285
        run: |
          set -euo pipefail
          git config user.name pair-probe
          git config user.email pair-probe@example.invalid
          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"
          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            python - <<'PY'
          from pathlib import Path
          import subprocess
          path='docs/reports/README.md'
          ours=subprocess.check_output(['git','show',f':2:{path}'],text=True)
          theirs=subprocess.check_output(['git','show',f':3:{path}'],text=True)
          lines=ours.splitlines()
          incoming=[l for l in theirs.splitlines() if l.startswith('| 2026-08-') and 'SCHEDULER-' in l and l not in lines]
          heading=lines.index('## Hot-path decisions')
          i=heading
          while i>0 and lines[i-1]=='': i-=1
          lines[i:i]=incoming
          Path(path).write_text('\n'.join(lines)+'\n')
          PY
            git add docs/reports/README.md
            git diff --check
            git commit --no-edit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Build pair 284+285
        shell: bash
        working-directory: p284285
        run: |
          set -euo pipefail
          git config user.name pair-probe
          git config user.email pair-probe@example.invalid
          git fetch --no-tags origin "$PR284_SHA"
          git merge --no-ff --no-edit "$PR284_SHA"
          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            python - <<'PY'
          from pathlib import Path
          import subprocess
          path='docs/reports/README.md'
          ours=subprocess.check_output(['git','show',f':2:{path}'],text=True)
          theirs=subprocess.check_output(['git','show',f':3:{path}'],text=True)
          lines=ours.splitlines()
          incoming=[l for l in theirs.splitlines() if l.startswith('| 2026-08-') and 'SCHEDULER-' in l and l not in lines]
          heading=lines.index('## Hot-path decisions')
          i=heading
          while i>0 and lines[i-1]=='': i-=1
          lines[i:i]=incoming
          Path(path).write_text('\n'.join(lines)+'\n')
          PY
            git add docs/reports/README.md
            git diff --check
            git commit --no-edit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Prepare Python environment and strict preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p "$ROOT"
          rm -rf "$RUNNER_TEMP/qos1-isolation-venv"
          python3 -m venv "$RUNNER_TEMP/qos1-isolation-venv"
          echo "$RUNNER_TEMP/qos1-isolation-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qos1-isolation-venv/bin/python" -m pip install -e "pr284[dev]" "psutil>=6,<8"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          for attempt in $(seq 1 60); do
            probe="$ROOT/preflight-attempt-$attempt.json"
            if python base/benchmarks/runner_probe.py --output "$probe" --require-temperature --enforce; then
              cp "$probe" "$ROOT/preflight.json"
              echo "strict eligibility reached on attempt $attempt"
              exit 0
            fi
            echo "strict preflight attempt $attempt/60 failed; cooling"
            sleep 15
          done
          echo "strict eligibility not reached; last probe follows" >&2
          cat "$ROOT/preflight-attempt-60.json" >&2 || true
          exit 1

      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .2
          done
          exit 1

      - name: Run all QoS1 isolation cells
        shell: bash
        run: |
          set -euo pipefail
          variants=(pr283 pr284 pr285 p283284 p283285 p284285)
          for variant in "${variants[@]}"; do
            echo "=== $variant ==="
            set +e
            python base/benchmarks/paired_writer_capacity.py \
              --base-root base --candidate-root "$variant" --host 127.0.0.1 --port 11883 \
              --protocol 311 --qos-values 1 --payload-bytes 64 \
              --inflight 20 --outstanding 20 --max-queued 200 \
              --warmup-count 5000 --count-qos1 40000 --repeat 8 --cpu 1 \
              --policy strict --preflight-report "$ROOT/preflight.json" \
              --max-baseline-cv .05 --min-completed-ratio .97 \
              --output "$ROOT/$variant.json" --summary-output "$ROOT/$variant.md" \
              >"$ROOT/$variant.stdout.log" 2>"$ROOT/$variant.stderr.log"
            rc=$?
            set -e
            echo "$rc" > "$ROOT/$variant.rc"
            cat "$ROOT/$variant.stdout.log"
            cat "$ROOT/$variant.stderr.log" >&2
          done

      - name: Summarize isolation matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          variants=['pr283','pr284','pr285','p283284','p283285','p284285']
          rows=[]
          for v in variants:
              d=json.loads((root/f'{v}.json').read_text())
              s=d['scenarios'][0]
              rows.append({
                  'variant':v,
                  'status':d['status'],
                  'ratio':s['median_candidate_over_base_completed'],
                  'base_cv':s['base_completed_cv'],
                  'candidate_cv':s['candidate_completed_cv'],
                  'base_rate':s['base_median_completed_rate'],
                  'candidate_rate':s['candidate_median_completed_rate'],
                  'regressions':d.get('regressions'),
                  'invalidations':d.get('invalidations'),
              })
          print(json.dumps(rows, indent=2))
          (root/'isolation-summary.json').write_text(json.dumps(rows, indent=2)+'\n')
          PY

      - name: Final strict preflight and cleanup broker
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          for attempt in $(seq 1 60); do
            probe="$ROOT/preflight-final-attempt-$attempt.json"
            if python base/benchmarks/runner_probe.py --output "$probe" --require-temperature --enforce; then
              cp "$probe" "$ROOT/preflight-final.json"
              exit 0
            fi
            sleep 15
          done
          cat "$ROOT/preflight-final-attempt-60.json" >&2 || true
          exit 1

      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qos1-isolation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qos1-isolation/**/*.json
            ${{ runner.temp }}/qos1-isolation/**/*.md
            ${{ runner.temp }}/qos1-isolation/**/*.log
            ${{ runner.temp }}/qos1-isolation/**/*.rc
            ${{ runner.temp }}/qos1-isolation/*.conf
          if-no-files-found: warn
          retention-days: 30
