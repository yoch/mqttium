name: Apply packet-id clear optimization

on:
  push:
    branches:
      - agent/packet-id-clear-paths

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/packet-id-clear-paths
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/apply_packet_id_clear.py
      - run: git checkout origin/main -- .github/workflows/ci.yml
      - run: rm -f .github/workflows/apply-packet-id-clear.yml tools/apply_packet_id_clear.py
      - run: python -m pip install -e ".[dev]"
      - run: ruff format src/mqttium/protocol/engine.py tests/unit/test_packet_id_clear_paths.py
      - run: ruff check src/mqttium/protocol/engine.py tests/unit/test_packet_id_clear_paths.py
      - run: python -m pytest -q tests/unit/test_packet_id_clear_paths.py tests/unit/test_packet_id_pool_accounting.py
      - run: git diff --check
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use clear for complete packet-id abandonment"
          git push origin HEAD:agent/packet-id-clear-paths
