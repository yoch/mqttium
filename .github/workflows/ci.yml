name: TEMP cleanup scheduler experiment branches

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Delete temporary branches except current
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            bench/tmp-final-arm64-284-285-20260819
            bench/tmp-final-arm64-284-285-run2-20260819
            bench/tmp-final-arm64-284-285-run3-20260819
            bench/tmp-quantum-screen-286-20260819
            bench/tmp-scheduler-284-286-20260819
            bench/tmp-wake-fairness-run-20260819
            bench/tmp-wake-frontier-284-285-20260819
            bench/tmp-wake-screening-run-20260819
            bench/tmp-wake-screening-v2-run-20260819
            bench/tmp-wake-screening-v3-run-20260819
            bench/tmp-wake-screening-v4-run-20260819
            bench/tmp-wake-spare1-screen-run-20260819
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
      - name: Close cleanup PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" -f state=closed >/dev/null
      - name: Delete own temporary branch last
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "bench/tmp-final-arm64-284-285-run4-20260819"
          git push origin --delete "$GITHUB_HEAD_REF"
