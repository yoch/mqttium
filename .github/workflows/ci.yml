name: TEMP stack merge probe 283-285

on:
  pull_request:

permissions:
  contents: read

jobs:
  merge-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
      PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
      PR284_SHA: 8d37248831b372004074acfa0018f34da51b54df
      PR285_SHA: b76feedc8832e8a4662c61d342c51c79f4be50d4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge exact accepted heads in proposed order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          for sha in "$PR283_SHA" "$PR284_SHA" "$PR285_SHA"; do
            git fetch --no-tags origin "$sha"
            echo "=== merging $sha ==="
            set +e
            git merge --no-ff --no-edit "$sha" > /tmp/merge.out 2>&1
            rc=$?
            set -e
            cat /tmp/merge.out
            if [ "$rc" -ne 0 ]; then
              echo "UNMERGED FILES:"
              git diff --name-only --diff-filter=U | tee /tmp/unmerged.txt
              echo "CONFLICT DIFF:"
              git diff --cc || true
              exit "$rc"
            fi
          done
          echo "STACK_HEAD=$(git rev-parse HEAD)"
          git log --oneline --decorate -8
          git diff --check "$BASE_SHA"..HEAD
