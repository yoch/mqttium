name: TEMP cleanup scheduler benchmark infrastructure

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close this cleanup PR and delete all temporary refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_HEAD_REF:-}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          pr="${{ github.event.pull_request.number }}"

          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/pulls/${pr}" \
            -d '{"state":"closed"}' >/tmp/cleanup-pr-close.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cleanup-pr-close.json'))
          assert d['state'] == 'closed' and not d['merged']
          print(f"cleanup PR #{d['number']} closed unmerged")
          PY

          work="$RUNNER_TEMP/cleanup-repo"
          git init -q "$work"
          cd "$work"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$remote"

          for branch in \
            bench/tmp-qos1-isolation-hosted-20260819 \
            bench/tmp-qos1-singles-mini-broker-20260819 \
            bench/tmp-stack-283-285-20260819
          do
            git push origin --delete "$branch"
          done

          # Self-delete after all older temporary refs are gone.
          git push origin --delete "$GITHUB_HEAD_REF"
