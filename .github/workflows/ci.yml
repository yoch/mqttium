name: TEMP PR284 ARM64 network stability confirmation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-final-arm64-pr284-285
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
      PR284_SHA: 8d37248831b372004074acfa0018f34da51b54df
    steps:
      - name: Define runtime root
        shell: bash
        run: echo "ROOT=$RUNNER_TEMP/pr284-network-confirm" >> "$GITHUB_ENV"

      - name: Checkout immutable baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Checkout immutable PR284
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR284_SHA }}
          path: pr284
          persist-credentials: false

      - name: Verify refs and clean broker state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C pr284 rev-parse HEAD)" = "$PR284_SHA"
          test "$(uname -m)" = aarch64
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected Python 3.13, got {sys.version}")
          PY
          mkdir -p "$ROOT"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          ! pgrep -a mosquitto

      - name: Create venv and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pr284-network-confirm-venv"
          python3 -m venv "$RUNNER_TEMP/pr284-network-confirm-venv"
          echo "$RUNNER_TEMP/pr284-network-confirm-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pr284-network-confirm-venv/bin/python" -m pip install -e "pr284[dev]" "psutil>=6,<8"

      - name: Strict preflight replicate 1
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-1.json" --require-temperature --enforce; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Start isolated broker replicate 1
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/mosquitto-1.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c "$ROOT/mosquitto-1.conf" > "$ROOT/mosquitto-1.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .2
          done
          exit 1

      - name: Network confirmation replicate 1
        shell: bash
        run: |
          set +e
          python base/benchmarks/paired_network.py \
            --base-root base --candidate-root pr284 --host 127.0.0.1 --port 11883 \
            --protocols 311 --completions receipt --payloads 64 --windows 20 \
            --repeat 8 --count-small 1500 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-1.json" \
            --max-baseline-cv .05 --min-ack-ratio .97 \
            --output "$ROOT/network-1.json" --summary-output "$ROOT/network-1.md" \
            >"$ROOT/network-1.stdout.log" 2>"$ROOT/network-1.stderr.log"
          rc=$?
          echo "$rc" > "$ROOT/network-1.rc"
          cat "$ROOT/network-1.stdout.log"
          cat "$ROOT/network-1.stderr.log" >&2
          exit 0

      - name: Reset broker and strict preflight replicate 2
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/mosquitto.pid" ]; then kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true; fi
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-2.json" --require-temperature --enforce; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Start isolated broker replicate 2
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/mosquitto-2.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c "$ROOT/mosquitto-2.conf" > "$ROOT/mosquitto-2.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .2
          done
          exit 1

      - name: Network confirmation replicate 2
        shell: bash
        run: |
          set +e
          python base/benchmarks/paired_network.py \
            --base-root base --candidate-root pr284 --host 127.0.0.1 --port 11883 \
            --protocols 311 --completions receipt --payloads 64 --windows 20 \
            --repeat 8 --count-small 1500 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-2.json" \
            --max-baseline-cv .05 --min-ack-ratio .97 \
            --output "$ROOT/network-2.json" --summary-output "$ROOT/network-2.md" \
            >"$ROOT/network-2.stdout.log" 2>"$ROOT/network-2.stderr.log"
          rc=$?
          echo "$rc" > "$ROOT/network-2.rc"
          cat "$ROOT/network-2.stdout.log"
          cat "$ROOT/network-2.stderr.log" >&2
          exit 0

      - name: Final strict eligibility and evaluation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/mosquitto.pid" ]; then kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true; fi
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-final.json" --require-temperature --enforce; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then exit 1; fi
            sleep 15
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          lines = ['# PR284 network stability confirmation', '']
          failures = []
          for i in (1, 2):
              rc = int((root / f'network-{i}.rc').read_text().strip())
              data = json.loads((root / f'network-{i}.json').read_text())
              s = data['scenarios'][0] if data.get('scenarios') else {}
              lines += [
                  f'## replicate {i}',
                  f'- rc: {rc}',
                  f'- status: {data.get("status")}',
                  f'- ratio: {s.get("median_candidate_over_base_ack")}',
                  f'- base_cv: {s.get("base_ack_cv")}',
                  f'- candidate_cv: {s.get("candidate_ack_cv")}',
                  f'- invalidations: {data.get("invalidations")}',
                  f'- regressions: {data.get("regressions")}',
                  '',
              ]
              if rc != 0 or data.get('invalidations') or data.get('regressions'):
                  failures.append(f'replicate {i}')
          (root / 'confirmation-summary.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          if failures:
              raise SystemExit('failed confirmation: ' + ', '.join(failures))
          PY

      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr284-network-confirm-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr284-network-confirm/**/*.json
            ${{ runner.temp }}/pr284-network-confirm/**/*.md
            ${{ runner.temp }}/pr284-network-confirm/**/*.log
            ${{ runner.temp }}/pr284-network-confirm/**/*.rc
            ${{ runner.temp }}/pr284-network-confirm/*.conf
          if-no-files-found: error
          retention-days: 30
