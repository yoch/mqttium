name: TEMP cleanup PR282 branch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Close temporary PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" -f state=closed >/dev/null
      - name: Delete own temporary branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "bench/current-vs-rc6-rc7-temp"
          git push origin --delete "$GITHUB_HEAD_REF"
