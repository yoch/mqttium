name: TEMP ARM64 final cooldown requalification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

jobs:
  requalify:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e80618154bacefed5626d9eb9ba46edf560b54e7
          path: base
          persist-credentials: false
      - name: Strict post-campaign runner probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          VENV="$RUNNER_TEMP/final-requal-venv"
          ROOT="$RUNNER_TEMP/final-requal"
          rm -rf "$VENV" "$ROOT"
          mkdir -p "$ROOT"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install "psutil>=6,<8"
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-final-$attempt.json"
            if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight-final.json"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Upload requalification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-requalification-${{ github.run_id }}
          path: ${{ runner.temp }}/final-requal/*.json
          if-no-files-found: warn
          retention-days: 30
