name: TEMP combined ARM64 validation 283-285

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  arm64:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 180
    steps:
      - name: Define evidence root
        shell: bash
        run: echo "ROOT=$RUNNER_TEMP/combined-283-285" >> "$GITHUB_ENV"

      - name: Checkout immutable base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout immutable base into stack workspace
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: stack
          persist-credentials: false

      - name: Compose exact accepted heads with audited writer resolution
        shell: bash
        working-directory: stack
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid

          union_report_index() {
            python - <<'PY'
          from pathlib import Path
          import subprocess
          path = 'docs/reports/README.md'
          ours = subprocess.check_output(['git', 'show', f':2:{path}'], text=True)
          theirs = subprocess.check_output(['git', 'show', f':3:{path}'], text=True)
          lines = ours.splitlines()
          incoming = [
              line for line in theirs.splitlines()
              if line.startswith('| 2026-08-') and 'SCHEDULER-' in line and line not in lines
          ]
          if not incoming:
              raise SystemExit('no unique incoming scheduler report rows')
          heading = lines.index('## Hot-path decisions')
          insert_at = heading
          while insert_at > 0 and lines[insert_at - 1] == '':
              insert_at -= 1
          lines[insert_at:insert_at] = incoming
          Path(path).write_text('\n'.join(lines) + '\n')
          PY
          }

          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"

          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"
          union_report_index

          git checkout --ours src/mqttium/api/_writer.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mqttium/api/_writer.py')
          text = path.read_text()
          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'writer resolution expected one match, got {count}: {old!r}')
              text = text.replace(old, new)
          replace_once(
              '                self.enqueue_suspensions += 1\n'
              '                try:\n'
              '                    await self.space.wait()\n'
              '                finally:\n'
              '                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n'
              '                try:\n'
              '                    await self.space.wait()\n'
              '                except asyncio.CancelledError:\n'
              '                    # notify(n) is consumed by whoever is waiting. A waiter\n'
              '                    # cancelled after being selected must hand the wakeup on,\n'
              '                    # or the remaining producers stay parked with free slots.\n'
              '                    if self.waiters > 1:\n'
              '                        self.space.notify(1)\n'
              '                    raise\n'
              '                finally:\n'
              '                    self.waiters -= 1\n',
          )
          replace_once(
              '        transport = self.transport\n'
              '        if transport is None:\n'
              '            raise RuntimeError("WritePump started without a transport")\n'
              '        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n'
              '        if transport is None:\n'
              '            raise RuntimeError("WritePump started without a transport")\n'
              '        writer_task = asyncio.current_task()\n'
              '        assert writer_task is not None\n'
              '        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          replace_once(
              '                self._writing = True\n'
              '                try:\n'
              '                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n'
              '                batch_completed = False\n'
              '                try:\n'
              '                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          replace_once(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n'
              '                    self.last_outbound = time.monotonic()\n'
              '                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n'
              '                    self.last_outbound = time.monotonic()\n'
              '                    batch_completed = True\n'
              '                finally:\n',
          )
          replace_once(
              '                        self._release_resident(n_batch)\n'
              '                        if self.waiters:\n'
              '                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n'
              '                        if batch_completed and self.waiters and not writer_task.cancelling():\n'
              '                            # Resident accounting is released even on lifecycle\n'
              '                            # cancellation/failure, but only a successfully written\n'
              '                            # batch releases usable admission capacity.\n'
              '                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          path.write_text(text)
          PY
          git add docs/reports/README.md src/mqttium/api/_writer.py
          git diff --check
          git commit --no-edit

          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            union_report_index
            git add docs/reports/README.md
            git diff --check
            git commit --no-edit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check "$BASE_SHA"..HEAD
          git rev-parse HEAD | tee /tmp/combined-head.txt

      - name: Verify ARM64 runtime and clean broker state
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f'expected Python 3.13, got {sys.version}')
          PY
          mkdir -p "$ROOT"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          ! pgrep -a mosquitto

      - name: Prepare combined Python environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/combined-283-285-venv"
          python3 -m venv "$RUNNER_TEMP/combined-283-285-venv"
          echo "$RUNNER_TEMP/combined-283-285-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/combined-283-285-venv/bin/python" -m pip install -e "stack[dev]" "psutil>=6,<8"

      - name: Strict initial preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-initial.json" --require-temperature --enforce; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Combined focused correctness
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=stack/src python -m pytest -q \
            stack/tests/unit/test_write_pump_resident.py \
            stack/tests/unit/test_write_pump_targeted_wake.py \
            stack/tests/unit/test_write_pump.py \
            stack/tests/unit/test_write_pump_eager.py \
            stack/tests/unit/test_publish_targeted_wake.py \
            stack/tests/unit/test_async_publish_admission.py

      - name: Writer targeted-wake combined A/B
        shell: bash
        run: |
          python stack/benchmarks/paired_writer_waiter_contention.py \
            --base-root base --candidate-root stack \
            --producer-values 1,4,64,256 --max-messages 8 --payload-bytes 64 \
            --warmup-count 2000 --count 16000 --repeat 8 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-initial.json" \
            --max-baseline-cv .05 --min-completed-ratio .97 \
            --output "$ROOT/writer-target.json" \
            --summary-output "$ROOT/writer-target.md"

      - name: Start isolated Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .2
          done
          cat "$ROOT/mosquitto.log"
          exit 1

      - name: Corrected publish true-completion A/A
        shell: bash
        run: |
          python stack/benchmarks/paired_publish_admission_contention.py \
            --base-root base --candidate-root base --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos 1 --payload-bytes 64 \
            --publisher-values 16,32,64 --inflight-values 1,4 \
            --warmup-count 200 --count 4000 --repeat 6 --timeout 120 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-initial.json" \
            --max-baseline-cv .05 --max-aa-ratio-deviation .02 \
            --output "$ROOT/publish-aa.json" \
            --summary-output "$ROOT/publish-aa.md"

      - name: Combined publish true-completion A/B
        shell: bash
        run: |
          python stack/benchmarks/paired_publish_admission_contention.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos 1 --payload-bytes 64 \
            --publisher-values 16,32,64 --inflight-values 1,4 \
            --warmup-count 200 --count 4000 --repeat 6 --timeout 120 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-initial.json" \
            --max-baseline-cv .05 --min-completed-ratio .97 \
            --output "$ROOT/publish-ab.json" \
            --summary-output "$ROOT/publish-ab.md"

      - name: Refresh strict preflight before non-targeted guards
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-guards.json" --require-temperature --enforce; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Combined writer-capacity guard
        shell: bash
        run: |
          python base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 0,1 --payload-bytes 64 \
            --inflight 20 --outstanding 20 --max-queued 200 \
            --warmup-count 5000 --count-qos0 100000 --count-qos1 40000 \
            --repeat 6 --cpu 1 --policy strict \
            --preflight-report "$ROOT/preflight-guards.json" \
            --max-baseline-cv .05 --min-completed-ratio .97 \
            --output "$ROOT/writer-capacity.json" \
            --summary-output "$ROOT/writer-capacity.md"

      - name: Combined stable open-loop guard
        shell: bash
        run: |
          python base/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root stack \
            --protocols 311 --payloads 64 --completions callback --windows 20 \
            --target-rates 5000,7500 --count-small 5000 --repeat 6 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-guards.json" \
            --max-baseline-cv .05 --min-completed-ratio .97 --max-loop-lag-ratio 1.05 \
            --output "$ROOT/open-loop.json" \
            --summary-output "$ROOT/open-loop.md"

      - name: Combined network guard
        shell: bash
        run: |
          python base/benchmarks/paired_network.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocols 311 --completions receipt --payloads 64,4096 --windows 20,64 \
            --repeat 6 --count-small 1500 --count-large 750 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-guards.json" \
            --max-baseline-cv .05 --min-ack-ratio .97 \
            --output "$ROOT/network.json" \
            --summary-output "$ROOT/network.md"

      - name: Final strict eligibility check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/mosquitto.pid" ]; then
            kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true
          fi
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1
          for attempt in $(seq 1 24); do
            if python base/benchmarks/runner_probe.py --output "$ROOT/preflight-final.json" --require-temperature --enforce; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-283-285-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/combined-283-285/**/*.json
            ${{ runner.temp }}/combined-283-285/**/*.md
            ${{ runner.temp }}/combined-283-285/**/*.log
            ${{ runner.temp }}/combined-283-285/*.conf
            /tmp/combined-head.txt
          if-no-files-found: warn
          retention-days: 30
