name: TEMP PR284-285 spare-wake screening

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-pr284-285-spare1-screen
  cancel-in-progress: true

jobs:
  screening:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR284_SHA: 8d37248831b372004074acfa0018f34da51b54df
      PR285_SHA: 505c385c59670b2fb095728b5095f5039c53d675
      SUPPORT_REF: 50122fc2012a326409733207297b9c775311ee01
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PR284_SHA }}
          path: pr284
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PR285_SHA }}
          path: pr285
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUPPORT_REF }}
          path: support
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e "pr284[dev]" "psutil>=6,<8"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto

      - name: Create +1 wake variants
        shell: bash
        run: |
          set -euo pipefail
          cp -a pr284 pr284-spare1
          cp -a pr285 pr285-spare1
          python - <<'PY'
          from pathlib import Path
          def repl(path, old, new):
              p=Path(path); text=p.read_text()
              assert text.count(old)==1, (path,text.count(old))
              p.write_text(text.replace(old,new))
          repl('pr284-spare1/src/mqttium/api/_writer.py',
               'self.space.notify(min(self.waiters, len(batch)))',
               'self.space.notify(min(self.waiters, len(batch) + 1))')
          repl('pr285-spare1/src/mqttium/api/async_client.py',
               'self._wake_publish_waiters(1)\n\n    def _register_publish_waiter',
               'self._wake_publish_waiters(2)\n\n    def _register_publish_waiter')
          PY
          python -m compileall -q pr284-spare1/src pr285-spare1/src

      - name: Start isolated broker
        shell: bash
        run: |
          cat >/tmp/mosq-screen.conf <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          mosquitto -c /tmp/mosq-screen.conf >/tmp/mosq-screen.log 2>&1 &
          echo $! >/tmp/mosq-screen.pid
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .1
          done
          cat /tmp/mosq-screen.log
          exit 1

      - name: Writer current vs +1 wake
        run: |
          python support/benchmarks/temp_scheduler_supplement.py writer-hetero-parent \
            --base-root pr284 --candidate-root pr284-spare1 \
            --producer-values 8,12,16,20,32,64 --repeat 4 --count 6000 \
            --max-messages 8 --max-bytes 16384 --small-bytes 64 --large-bytes 4096 \
            --output /tmp/writer-spare1.json

      - name: Publish current vs +1 wake
        run: |
          python support/benchmarks/temp_scheduler_supplement.py publish-parent \
            --base-root pr285 --candidate-root pr285-spare1 \
            --host 127.0.0.1 --port 11883 \
            --publisher-values 8,12,16,20,32,64 --inflight-values 4,20 \
            --count 1600 --repeat 4 --timeout 120 \
            --output /tmp/publish-spare1.json

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('writer-spare1','publish-spare1'):
              p=Path('/tmp')/(name+'.json')
              print('\n###',name)
              if not p.exists():
                  print('MISSING'); continue
              d=json.loads(p.read_text())
              for r in d.get('scenarios',d.get('rows',[])):
                  print({k:v for k,v in r.items() if k in {'producers','publishers','inflight'} or k.endswith('_ratio')})
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wake-spare1-screen-${{ github.run_id }}
          path: |
            /tmp/writer-spare1.json
            /tmp/publish-spare1.json
            /tmp/mosq-screen.log
          if-no-files-found: warn
          retention-days: 7
