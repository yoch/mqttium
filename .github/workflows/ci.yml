name: TEMP ARM64 writer phase stabilization probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  stabilize:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 120
    steps:
      - name: Define paths
        shell: bash
        run: |
          echo "ROOT=$RUNNER_TEMP/writer-phase-stabilize" >> "$GITHUB_ENV"
          echo "VENV=$RUNNER_TEMP/writer-phase-stabilize-venv" >> "$GITHUB_ENV"

      - name: Checkout immutable base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout immutable base into stack workspace
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: stack
          persist-credentials: false

      - name: Compose exact candidate runtime
        working-directory: stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid
          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"
          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"
          git checkout --ours docs/reports/README.md src/mqttium/api/_writer.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/mqttium/api/_writer.py')
          text=p.read_text()
          def one(old,new):
              global text
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one writer match, got {n}: {old!r}')
              text=text.replace(old,new)
          one(
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                finally:\n                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                except asyncio.CancelledError:\n                    if self.waiters > 1:\n                        self.space.notify(1)\n                    raise\n                finally:\n                    self.waiters -= 1\n',
          )
          one(
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        writer_task = asyncio.current_task()\n        assert writer_task is not None\n        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          one(
              '                self._writing = True\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n                batch_completed = False\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          one(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                    batch_completed = True\n                finally:\n',
          )
          one(
              '                        self._release_resident(n_batch)\n                        if self.waiters:\n                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n                        if batch_completed and self.waiters and not writer_task.cancelling():\n                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          p.write_text(text)
          PY
          git add docs/reports/README.md src/mqttium/api/_writer.py
          git commit --no-edit
          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            git checkout --ours docs/reports/README.md
            git add docs/reports/README.md
            git commit --no-edit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check "$BASE_SHA"..HEAD

      - name: Patch temporary benchmark with settle modes and writer counters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('base/benchmarks/paired_writer_capacity.py')
          text=p.read_text()
          old='''    sync_rejected: int\n    drain_seconds: float\n'''
          new='''    sync_rejected: int\n    drain_seconds: float\n    writer_batches: int = 0\n    writer_batched_items: int = 0\n    writer_eager_writes: int = 0\n    eager_armed_at_start: bool | None = None\n    writing_at_start: bool | None = None\n    queue_at_start: int | None = None\n'''
          if text.count(old)!=1: raise SystemExit('dataclass anchor mismatch')
          text=text.replace(old,new)

          old='''        result = await _run_phase(\n            client,\n            topic=topic,\n            payload=payload,\n            qos=args.qos,\n            count=args.count,\n            outstanding=args.outstanding,\n            timeout=args.timeout,\n        )\n        result.protocol = args.protocol\n        result.inflight = args.inflight\n        return result\n'''
          new='''        pump = client._write_pump\n        mode = os.environ.get("CAPACITY_SETTLE_MODE", "none")\n        if mode == "sleep0":\n            await asyncio.sleep(0)\n        elif mode == "sleep2":\n            await asyncio.sleep(0)\n            await asyncio.sleep(0)\n        elif mode == "idle2":\n            await asyncio.wait_for(pump.join(), timeout=args.timeout)\n            while pump._writing or not pump.queue.empty():\n                await asyncio.sleep(0)\n            await asyncio.sleep(0)\n            await asyncio.sleep(0)\n        elif mode == "sleep1ms":\n            await asyncio.sleep(0.001)\n        elif mode != "none":\n            raise RuntimeError(f"unknown CAPACITY_SETTLE_MODE={mode}")\n\n        before = pump.stats()\n        eager_at_start = pump._eager_armed\n        writing_at_start = pump._writing\n        queue_at_start = pump.queue.qsize()\n        result = await _run_phase(\n            client,\n            topic=topic,\n            payload=payload,\n            qos=args.qos,\n            count=args.count,\n            outstanding=args.outstanding,\n            timeout=args.timeout,\n        )\n        after = pump.stats()\n        result.protocol = args.protocol\n        result.inflight = args.inflight\n        result.writer_batches = after.batches - before.batches\n        result.writer_batched_items = after.batched_items - before.batched_items\n        result.writer_eager_writes = after.eager_writes - before.eager_writes\n        result.eager_armed_at_start = eager_at_start\n        result.writing_at_start = writing_at_start\n        result.queue_at_start = queue_at_start\n        return result\n'''
          if text.count(old)!=1: raise SystemExit('sample anchor mismatch')
          text=text.replace(old,new)
          p.write_text(text)
          PY
          python3 -m py_compile base/benchmarks/paired_writer_capacity.py

      - name: Prepare ARM64 runner and pin broker to CPU0
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rm -rf "$ROOT" "$VENV"
          mkdir -p "$ROOT"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install -e "stack[dev]" "psutil>=6,<8"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          cat > "$ROOT/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          taskset -c 0 mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto.log" 2>&1 &
          echo $! > "$ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && break
            sleep .2
          done
          test "$(awk '/Cpus_allowed_list/ {print $2}' /proc/$(cat "$ROOT/mosquitto.pid")/status)" = 0

      - name: Strict preflight
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-$attempt.json"
            if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Compare natural warmup-to-measure barriers with A/A
        shell: bash
        run: |
          set -euo pipefail
          for mode in none sleep0 sleep2 idle2 sleep1ms; do
            echo "=== settle=$mode ==="
            CAPACITY_SETTLE_MODE="$mode" "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
              --base-root base --candidate-root base --host 127.0.0.1 --port 11883 \
              --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
              --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 16 --cpu 1 \
              --policy advisory --preflight-report "$ROOT/preflight.json" --max-baseline-cv 1.0 \
              --min-completed-ratio 0.0 --output "$ROOT/aa-$mode.json"
          done

      - name: Select the most stationary natural barrier
        shell: bash
        run: |
          "$VENV/bin/python" - <<'PY'
          import json, os, statistics
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          modes=['none','sleep0','sleep2','idle2','sleep1ms']
          rows=[]
          for mode in modes:
              d=json.loads((root/f'aa-{mode}.json').read_text())
              s=d['scenarios'][0]
              samples=[]
              for pair in s['pairs']:
                  samples.extend((pair['base'],pair['candidate']))
              abnormal=sum(1 for x in samples if x['writer_batches'] > 3900)
              not_armed=sum(1 for x in samples if x['eager_armed_at_start'] is not True)
              rows.append({
                  'mode':mode,
                  'ratio':s['median_candidate_over_base_completed'],
                  'base_cv':s['base_completed_cv'],
                  'candidate_cv':s['candidate_completed_cv'],
                  'worst_cv':max(s['base_completed_cv'],s['candidate_completed_cv']),
                  'abnormal_writer_regimes':abnormal,
                  'not_eager_armed_at_start':not_armed,
                  'median_batches':statistics.median(x['writer_batches'] for x in samples),
                  'median_eager':statistics.median(x['writer_eager_writes'] for x in samples),
              })
          rows.sort(key=lambda r:(r['abnormal_writer_regimes'],r['worst_cv']))
          print(json.dumps(rows,indent=2))
          (root/'aa-barriers-summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          best=rows[0]
          if best['abnormal_writer_regimes'] != 0 or best['worst_cv'] > 0.03:
              raise SystemExit(f'no sufficiently stationary natural barrier: {best}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"BEST_MODE={best['mode']}\n")
          PY

      - name: Requalify before exact triple A/B
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-ab-$attempt.json"
            if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight-ab.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Triple A/B with selected stationary barrier
        shell: bash
        run: |
          set -euo pipefail
          echo "selected settle mode: $BEST_MODE"
          CAPACITY_SETTLE_MODE="$BEST_MODE" "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root stack --host 127.0.0.1 --port 11883 \
            --protocol 311 --qos-values 1 --payload-bytes 64 --inflight 20 --outstanding 20 \
            --max-queued 200 --warmup-count 5000 --count-qos1 40000 --repeat 20 --cpu 1 \
            --policy strict --preflight-report "$ROOT/preflight-ab.json" --max-baseline-cv .03 \
            --min-completed-ratio .97 --output "$ROOT/triple-ab.json" --summary-output "$ROOT/triple-ab.md"

      - name: Final cooldown and strict preflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/mosquitto.pid" ]; then kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true; fi
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 2
          for attempt in $(seq 1 24); do
            out="$ROOT/preflight-final-$attempt.json"
            if [ -x "$VENV/bin/python" ] && "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
              cp "$out" "$ROOT/preflight-final.json"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload stabilization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writer-phase-stabilize-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/writer-phase-stabilize/*.json
            ${{ runner.temp }}/writer-phase-stabilize/*.md
            ${{ runner.temp }}/writer-phase-stabilize/*.log
            ${{ runner.temp }}/writer-phase-stabilize/*.conf
          if-no-files-found: warn
          retention-days: 30
