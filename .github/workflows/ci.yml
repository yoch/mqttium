name: TEMP ARM64 broker CPU isolation probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  broker-isolation:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 120
    steps:
      - name: Define paths
        shell: bash
        run: |
          echo "ROOT=$RUNNER_TEMP/broker-cpu-isolation" >> "$GITHUB_ENV"
          echo "VENV=$RUNNER_TEMP/broker-cpu-isolation-venv" >> "$GITHUB_ENV"

      - name: Checkout immutable base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout immutable base into stack workspace
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: stack
          persist-credentials: false

      - name: Compose exact runtime heads with audited writer resolution
        working-directory: stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"

          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"
          git checkout --ours docs/reports/README.md src/mqttium/api/_writer.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/mqttium/api/_writer.py')
          text=p.read_text()
          def one(old,new):
              global text
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'expected one writer match, got {n}: {old!r}')
              text=text.replace(old,new)
          one(
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                finally:\n                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n                try:\n                    await self.space.wait()\n                except asyncio.CancelledError:\n                    # notify(n) is consumed by whoever is waiting. A waiter\n                    # cancelled after being selected must hand the wakeup on,\n                    # or the remaining producers stay parked with free slots.\n                    if self.waiters > 1:\n                        self.space.notify(1)\n                    raise\n                finally:\n                    self.waiters -= 1\n',
          )
          one(
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        writer_task = asyncio.current_task()\n        assert writer_task is not None\n        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          one(
              '                self._writing = True\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n                batch_completed = False\n                try:\n                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          one(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n                    self.last_outbound = time.monotonic()\n                    batch_completed = True\n                finally:\n',
          )
          one(
              '                        self._release_resident(n_batch)\n                        if self.waiters:\n                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n                        if batch_completed and self.waiters and not writer_task.cancelling():\n                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          p.write_text(text)
          PY
          git add docs/reports/README.md src/mqttium/api/_writer.py
          git diff --check
          git commit --no-edit

          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            git checkout --ours docs/reports/README.md
            git add docs/reports/README.md
            git commit --no-edit
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check "$BASE_SHA"..HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/broker-isolation-stack-head.txt"

      - name: Prepare ARM64 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(nproc)" -ge 4
          rm -rf "$ROOT" "$VENV"
          mkdir -p "$ROOT"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install -e "stack[dev]" "psutil>=6,<8"
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          sleep 1

      - name: Install helper functions
        shell: bash
        run: |
          cat > "$ROOT/helpers.sh" <<'SH'
          set -euo pipefail
          strict_probe() {
            label="$1"
            for attempt in $(seq 1 24); do
              out="$ROOT/preflight-${label}-${attempt}.json"
              if "$VENV/bin/python" base/benchmarks/runner_probe.py --output "$out" --require-temperature --enforce; then
                cp "$out" "$ROOT/preflight-${label}.json"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          start_broker() {
            mode="$1"
            cat > "$ROOT/mosquitto.conf" <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
            if [ "$mode" = pinned ]; then
              taskset -c 0 mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto-${mode}.log" 2>&1 &
            else
              mosquitto -c "$ROOT/mosquitto.conf" > "$ROOT/mosquitto-${mode}.log" 2>&1 &
            fi
            echo $! > "$ROOT/mosquitto.pid"
            pid="$(cat "$ROOT/mosquitto.pid")"
            for _ in $(seq 1 50); do
              if (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
                taskset -pc "$pid" > "$ROOT/broker-${mode}-affinity.txt"
                ps -o pid,psr,pcpu,comm -p "$pid" > "$ROOT/broker-${mode}-ps-start.txt"
                return 0
              fi
              sleep .2
            done
            cat "$ROOT/mosquitto-${mode}.log"
            return 1
          }
          start_sampler() {
            mode="$1"
            pid="$(cat "$ROOT/mosquitto.pid")"
            taskset -c 3 bash -c 'while kill -0 "$1" 2>/dev/null; do ps -o psr= -p "$1"; sleep .2; done' _ "$pid" > "$ROOT/broker-${mode}-psr.log" 2>/dev/null &
            echo $! > "$ROOT/sampler.pid"
          }
          stop_broker() {
            if [ -f "$ROOT/sampler.pid" ]; then kill "$(cat "$ROOT/sampler.pid")" 2>/dev/null || true; fi
            if [ -f "$ROOT/mosquitto.pid" ]; then kill "$(cat "$ROOT/mosquitto.pid")" 2>/dev/null || true; fi
            sudo pkill -x mosquitto 2>/dev/null || true
            sleep 2
          }
          run_pair() {
            mode="$1"; kind="$2"; candidate="$3"; repeat="$4"; count="$5"; preflight="$6"
            set +e
            "$VENV/bin/python" base/benchmarks/paired_writer_capacity.py \
              --base-root base --candidate-root "$candidate" --host 127.0.0.1 --port 11883 \
              --protocol 311 --qos-values 1 --payload-bytes 64 \
              --inflight 20 --outstanding 20 --max-queued 200 \
              --warmup-count 5000 --count-qos1 "$count" --repeat "$repeat" --cpu 1 \
              --policy strict --preflight-report "$preflight" \
              --max-baseline-cv .05 --min-completed-ratio .97 \
              --output "$ROOT/${mode}-${kind}.json" --summary-output "$ROOT/${mode}-${kind}.md"
            rc=$?
            set -e
            echo "$rc" > "$ROOT/${mode}-${kind}.rc"
          }
          SH

      - name: Unpinned broker A/A and A/B
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/helpers.sh"
          strict_probe unpinned-start
          start_broker unpinned
          start_sampler unpinned
          run_pair unpinned aa base 12 40000 "$ROOT/preflight-unpinned-start.json"
          strict_probe unpinned-ab
          run_pair unpinned ab stack 12 40000 "$ROOT/preflight-unpinned-ab.json"
          ps -o pid,psr,pcpu,comm -p "$(cat "$ROOT/mosquitto.pid")" > "$ROOT/broker-unpinned-ps-end.txt" || true
          stop_broker

      - name: Cooldown and strict requalification before pinned broker
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/helpers.sh"
          strict_probe pinned-start

      - name: Pinned CPU0 broker A/A and A/B
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/helpers.sh"
          start_broker pinned
          pid="$(cat "$ROOT/mosquitto.pid")"
          allowed="$(awk '/Cpus_allowed_list/ {print $2}' /proc/$pid/status)"
          test "$allowed" = "0"
          start_sampler pinned
          run_pair pinned aa base 12 40000 "$ROOT/preflight-pinned-start.json"
          strict_probe pinned-ab
          run_pair pinned ab stack 12 40000 "$ROOT/preflight-pinned-ab.json"
          ps -o pid,psr,pcpu,comm -p "$pid" > "$ROOT/broker-pinned-ps-end.txt" || true

          "$VENV/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          d=json.loads((root/'pinned-ab.json').read_text())
          s=d['scenarios'][0]
          ok=(d['status']=='passed' and s['candidate_completed_cv'] <= 0.05 and s['median_candidate_over_base_completed'] >= 0.97)
          (root/'run-long-pinned.flag').write_text('1\n' if ok else '0\n')
          print('pinned short A/B clean:', ok)
          PY

          if [ "$(cat "$ROOT/run-long-pinned.flag")" = 1 ]; then
            strict_probe pinned-long
            run_pair pinned ab-long stack 8 200000 "$ROOT/preflight-pinned-long.json"
          fi
          stop_broker

      - name: Final strict eligibility after cooldown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ROOT/helpers.sh" ]; then
            source "$ROOT/helpers.sh"
            stop_broker || true
            strict_probe final
          fi

      - name: Summarize broker-isolation evidence
        if: always()
        shell: bash
        run: |
          if [ -x "$VENV/bin/python" ]; then
            "$VENV/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          rows=[]
          for name in ('unpinned-aa','unpinned-ab','pinned-aa','pinned-ab','pinned-ab-long'):
              p=root/f'{name}.json'
              if not p.exists():
                  continue
              d=json.loads(p.read_text())
              s=d['scenarios'][0]
              rows.append({
                  'name': name,
                  'status': d['status'],
                  'ratio': s['median_candidate_over_base_completed'],
                  'base_cv': s['base_completed_cv'],
                  'candidate_cv': s['candidate_completed_cv'],
                  'base_rate': s['base_median_completed_rate'],
                  'candidate_rate': s['candidate_median_completed_rate'],
                  'regressions': d.get('regressions'),
                  'invalidations': d.get('invalidations'),
              })
          for mode in ('unpinned','pinned'):
              p=root/f'broker-{mode}-psr.log'
              if p.exists():
                  cpus=[int(x.strip()) for x in p.read_text().splitlines() if x.strip().isdigit()]
                  row={'name':f'broker-{mode}-observed-cpus','cpus':sorted(set(cpus)),'samples':len(cpus)}
                  rows.append(row)
          print(json.dumps(rows, indent=2))
          (root/'summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          fi

      - name: Upload broker-isolation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broker-cpu-isolation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/broker-cpu-isolation/*
            ${{ runner.temp }}/broker-isolation-stack-head.txt
          if-no-files-found: warn
          retention-days: 30
