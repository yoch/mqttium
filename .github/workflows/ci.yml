name: TEMP PR284-285 fairness progress

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-pr284-285-fairness-progress
  cancel-in-progress: true

jobs:
  fairness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
      PR284_SHA: 8d37248831b372004074acfa0018f34da51b54df
      PR285_SHA: 505c385c59670b2fb095728b5095f5039c53d675
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Checkout PR284
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR284_SHA }}
          path: pr284
          persist-credentials: false
      - name: Checkout PR285
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR285_SHA }}
          path: pr285
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e "pr284[dev]"
      - name: Install Mosquitto
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto
      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/mosq-fairness.conf <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          mosquitto -c /tmp/mosq-fairness.conf >/tmp/mosq-fairness.log 2>&1 &
          echo $! >/tmp/mosq-fairness.pid
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .1
          done
          cat /tmp/mosq-fairness.log
          exit 1

      - name: Writer fairness A/A
        run: |
          python harness/benchmarks/temp_fairness_progress.py parent \
            --kind writer --base-root base --candidate-root base \
            --producer-values 16,32,64 --ops 150 --repeat 4 \
            --max-messages 1 --max-bytes 1048576 --payload-bytes 64 \
            --output /tmp/writer-aa.json
      - name: Writer fairness A/B
        run: |
          python harness/benchmarks/temp_fairness_progress.py parent \
            --kind writer --base-root base --candidate-root pr284 \
            --producer-values 16,32,64 --ops 150 --repeat 4 \
            --max-messages 1 --max-bytes 1048576 --payload-bytes 64 \
            --output /tmp/writer-ab.json
      - name: Publish fairness A/A
        run: |
          python harness/benchmarks/temp_fairness_progress.py parent \
            --kind publish --base-root base --candidate-root base \
            --host 127.0.0.1 --port 11883 \
            --producer-values 16,32,64 --inflight-values 1,4 \
            --ops 60 --repeat 4 --payload-bytes 64 --timeout 120 \
            --output /tmp/publish-aa.json
      - name: Publish fairness A/B
        run: |
          python harness/benchmarks/temp_fairness_progress.py parent \
            --kind publish --base-root base --candidate-root pr285 \
            --host 127.0.0.1 --port 11883 \
            --producer-values 16,32,64 --inflight-values 1,4 \
            --ops 60 --repeat 4 --payload-bytes 64 --timeout 120 \
            --output /tmp/publish-ab.json

      - name: Summarize fairness evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('writer-aa','writer-ab','publish-aa','publish-ab'):
              path=Path('/tmp')/(name+'.json')
              print('\n###',name)
              if not path.exists():
                  print('MISSING'); continue
              data=json.loads(path.read_text())
              for row in data['rows']:
                  print({k:v for k,v in row.items() if k != 'pairs'})
          PY
      - name: Upload fairness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fairness-progress-${{ github.run_id }}
          path: |
            /tmp/writer-aa.json
            /tmp/writer-ab.json
            /tmp/publish-aa.json
            /tmp/publish-ab.json
            /tmp/mosq-fairness.log
          if-no-files-found: warn
          retention-days: 14
