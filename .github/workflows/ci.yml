name: TEMP PR286 quantum mixed-tail screen

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-pr286-quantum-screen
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
      CANDIDATE_SHA: 8362d50072ce5a09bbf564fff1368c62a06e88fc
      SUPPORT_SHA: 50122fc2012a326409733207297b9c775311ee01
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Checkout PR286
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Checkout supplemental harness
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUPPORT_SHA }}
          path: support
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e "candidate[dev]" "psutil>=6,<8"
      - name: Install Mosquitto
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto
      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C support rev-parse HEAD)" = "$SUPPORT_SHA"
      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo pkill -x mosquitto 2>/dev/null || true
          cat >/tmp/mosq-quantum.conf <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          mosquitto -c /tmp/mosq-quantum.conf >/tmp/mosq-quantum.log 2>&1 &
          echo $! >/tmp/mosq-quantum.pid
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep .1
          done
          cat /tmp/mosq-quantum.log
          exit 1
      - name: ABBA mixed-tail frontier
        shell: bash
        run: |
          python support/benchmarks/temp_scheduler_supplement.py quantum-tail-parent \
            --base-root base --candidate-root candidate \
            --host 127.0.0.1 --port 11883 \
            --quantum-values 32768,65536,131072,262144 \
            --flood-count 1500 --flood-bytes 32768 --probes 200 \
            --repeat 8 --timeout 120 --cpu 1 \
            --output /tmp/quantum-tail.json
      - name: Summarize frontier
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/quantum-tail.json'))
          for r in d['scenarios']:
              print({k:r[k] for k in ('quantum','flood_rate_ratio','cpu_ratio','p50_ratio','p95_ratio','p99_ratio','p999_ratio','max_ratio')})
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: pr286-quantum-screen-${{ github.run_id }}
          path: |
            /tmp/quantum-tail.json
            /tmp/mosq-quantum.log
          if-no-files-found: error
          retention-days: 30
