name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Keep this job name until branch protection has migrated to "CI required".
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,security,docs]"
      - name: Repository hygiene
        run: |
          set -euo pipefail
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|dist|build|.*\.egg-info)(/|$)|(^|/)\.coverage($|\.)|\.py[co]$|\.(patch|diff)$' || true)"
          test -z "$(grep -RIl --exclude-dir=.git -E 'mqttnext|MQTTNext|MQTTNEXT' src tests examples benchmarks || true)"
      - run: ruff format --check src tests benchmarks tools
      - run: ruff check src tests benchmarks tools
      - run: mypy src/mqttium
      - run: bandit -q -ll -r src
      - name: Build documentation with strict links and navigation
        run: mkdocs build --strict
      - name: Validate GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actionlint -color
          zizmor .
      - name: Unit coverage
        run: python -m pytest -q -W error --strict-config --strict-markers tests/unit tests/project --cov=mqttium --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=89
      - name: Retain coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    name: Coverage report (Codecov)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-${{ github.sha }}
      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ./coverage.xml
          use_oidc: true
          version: v11.3.1

  # Keep the generated contexts test (3.11) ... test (3.14) during migration.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Require OpenSSL for TLS tests
        run: python -c "import shutil; assert shutil.which('openssl'), 'OpenSSL is required for TLS tests'"
      - name: Unit tests
        run: python -m pytest -q -W error --strict-config --strict-markers tests/unit
      - name: Install Mosquitto
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Start Mosquitto
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\n' > "$RUNNER_TEMP/mosquitto.conf"
          mosquitto -c "$RUNNER_TEMP/mosquitto.conf" > "$RUNNER_TEMP/mosquitto.log" 2>&1 &
          python tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:11883
      - name: Mandatory Mosquitto integration tests
        env:
          MQTTIUM_REQUIRE_BROKER: "1"
        run: python -m pytest -q -W error --strict-config --strict-markers tests/integration

  resilience:
    name: Resilience
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -W error --strict-config --strict-markers tests/resilience

  cross-platform:
    name: Cross-platform (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Require OpenSSL for TLS tests
        run: python -c "import shutil; assert shutil.which('openssl'), 'OpenSSL is required for TLS tests'"
      - name: Unit and socket-resilience tests
        run: python -m pytest -q -W error --strict-config --strict-markers tests/unit tests/resilience

  # Keep this job name until branch protection has migrated to "CI required".
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[fuzz]"
      - name: Seeded fuzz smoke
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            PYTHONPATH=src python tests/fuzz/fuzz.py --seed "$seed" --iterations 20000
          done
      - name: Hypothesis and short stateful fuzz
        env:
          MQTTIUM_FUZZ_SEEDS: "2"
          MQTTIUM_FUZZ_STEPS: "50"
        run: python -m pytest -q -W error --strict-config --strict-markers tests/fuzz/test_hypothesis_fuzz.py tests/fuzz/test_stateful_invariants.py

  # Keep this job name until branch protection has migrated to "CI required".
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[release]"
      - run: validate-pyproject pyproject.toml
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - run: python tools/ci/validate_distribution.py
      - name: Install and import the built wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mqttium-wheel"
          "$RUNNER_TEMP/mqttium-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mqttium-wheel/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata
          import pkgutil
          import mqttium

          assert mqttium.__version__ == importlib.metadata.version("mqttium")
          for module in pkgutil.walk_packages(mqttium.__path__, mqttium.__name__ + "."):
              importlib.import_module(module.name)
          PY
          "$RUNNER_TEMP/mqttium-wheel/bin/python" -m pip check
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [quality, test, resilience, cross-platform, fuzz, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failed = {
              name: value["result"]
              for name, value in results.items()
              if value["result"] != "success"
          }
          if failed:
              raise SystemExit(f"blocking CI jobs did not succeed: {failed}")
          PY
