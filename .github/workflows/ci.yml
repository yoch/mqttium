name: TEMP combined hosted validation 283-285

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

env:
  BASE_SHA: e80618154bacefed5626d9eb9ba46edf560b54e7
  PR283_SHA: b603337e96a869f266f85e89a5c04a2c238c8ba2
  PR284_SHA: 440c45487ce4ab7212581d49b8073416c899a82b
  PR285_SHA: fbd11e1f71c623919c5029ec512dfb0e05f85307
  PYTHONUNBUFFERED: "1"

jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: stack
          persist-credentials: false

      - name: Compose exact accepted heads with audited conflict resolution
        shell: bash
        working-directory: stack
        run: |
          set -euo pipefail
          git config user.name stack-probe
          git config user.email stack-probe@example.invalid

          union_report_index() {
            python - <<'PY'
          from pathlib import Path
          import subprocess
          path = 'docs/reports/README.md'
          ours = subprocess.check_output(['git', 'show', f':2:{path}'], text=True)
          theirs = subprocess.check_output(['git', 'show', f':3:{path}'], text=True)
          lines = ours.splitlines()
          incoming = [
              line for line in theirs.splitlines()
              if line.startswith('| 2026-08-') and 'SCHEDULER-' in line and line not in lines
          ]
          if not incoming:
              raise SystemExit('no unique incoming scheduler report rows')
          heading = lines.index('## Hot-path decisions')
          insert_at = heading
          while insert_at > 0 and lines[insert_at - 1] == '':
              insert_at -= 1
          lines[insert_at:insert_at] = incoming
          Path(path).write_text('\n'.join(lines) + '\n')
          print('unioned report rows:', *incoming, sep='\n')
          PY
          }

          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          git fetch --no-tags origin "$PR283_SHA"
          git merge --no-ff --no-edit "$PR283_SHA"

          git fetch --no-tags origin "$PR284_SHA"
          set +e
          git merge --no-ff --no-edit "$PR284_SHA"
          rc=$?
          set -e
          test "$rc" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          printf 'PR284 conflicts: %s\n' "${conflicts[*]}"
          test "${#conflicts[@]}" -eq 2
          test "${conflicts[0]}" = "docs/reports/README.md"
          test "${conflicts[1]}" = "src/mqttium/api/_writer.py"

          union_report_index

          git checkout --ours src/mqttium/api/_writer.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mqttium/api/_writer.py')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'writer resolution expected one match, got {count}: {old!r}')
              text = text.replace(old, new)

          replace_once(
              '                self.enqueue_suspensions += 1\n'
              '                try:\n'
              '                    await self.space.wait()\n'
              '                finally:\n'
              '                    self.waiters -= 1\n',
              '                self.enqueue_suspensions += 1\n'
              '                try:\n'
              '                    await self.space.wait()\n'
              '                except asyncio.CancelledError:\n'
              '                    # notify(n) is consumed by whoever is waiting. A waiter\n'
              '                    # cancelled after being selected must hand the wakeup on,\n'
              '                    # or the remaining producers stay parked with free slots.\n'
              '                    if self.waiters > 1:\n'
              '                        self.space.notify(1)\n'
              '                    raise\n'
              '                finally:\n'
              '                    self.waiters -= 1\n',
          )
          replace_once(
              '        transport = self.transport\n'
              '        if transport is None:\n'
              '            raise RuntimeError("WritePump started without a transport")\n'
              '        # Resolved once per writer task rather than per batch. The local dies\n',
              '        transport = self.transport\n'
              '        if transport is None:\n'
              '            raise RuntimeError("WritePump started without a transport")\n'
              '        writer_task = asyncio.current_task()\n'
              '        assert writer_task is not None\n'
              '        # Resolved once per writer task rather than per batch. The local dies\n',
          )
          replace_once(
              '                self._writing = True\n'
              '                try:\n'
              '                    # Coalesce contiguous small frames into one writelines call.\n',
              '                self._writing = True\n'
              '                batch_completed = False\n'
              '                try:\n'
              '                    # Coalesce contiguous small frames into one writelines call.\n',
          )
          replace_once(
              '                    await self._write_contiguous(transport, write_many, contiguous)\n'
              '                    self.last_outbound = time.monotonic()\n'
              '                finally:\n',
              '                    await self._write_contiguous(transport, write_many, contiguous)\n'
              '                    self.last_outbound = time.monotonic()\n'
              '                    batch_completed = True\n'
              '                finally:\n',
          )
          replace_once(
              '                        self._release_resident(n_batch)\n'
              '                        if self.waiters:\n'
              '                            self.space.notify_all()\n',
              '                        self._release_resident(n_batch)\n'
              '                        if batch_completed and self.waiters and not writer_task.cancelling():\n'
              '                            # Resident accounting is released even on lifecycle\n'
              '                            # cancellation/failure, but only a successfully written\n'
              '                            # batch releases usable admission capacity.\n'
              '                            self.space.notify(min(self.waiters, n_batch))\n',
          )
          path.write_text(text)
          PY

          git add docs/reports/README.md src/mqttium/api/_writer.py
          git diff --check
          git commit --no-edit

          git fetch --no-tags origin "$PR285_SHA"
          set +e
          git merge --no-ff --no-edit "$PR285_SHA"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'PR285 conflicts: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = "docs/reports/README.md"
            union_report_index
            git add docs/reports/README.md
            git diff --check
            git commit --no-edit
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check "$BASE_SHA"..HEAD
          echo "combined head: $(git rev-parse HEAD)"
          git log --oneline --decorate -12

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install combined tree
        working-directory: stack
        run: python -m pip install -e ".[dev,security]"

      - name: Full quality and unit suite
        working-directory: stack
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit --cov=mqttium --cov-report=term-missing --cov-fail-under=80
