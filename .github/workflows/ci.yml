name: TEMP cleanup scheduler benchmark infrastructure

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temp-combined-283-285
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close temporary PR and delete temporary refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/pulls/300" \
            -d '{"state":"closed"}' >/tmp/pr300-close.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pr300-close.json'))
          assert d['number'] == 300 and d['state'] == 'closed' and not d['merged']
          print('PR #300 closed unmerged')
          PY

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in \
            bench/tmp-qos1-isolation-hosted-20260819 \
            bench/tmp-qos1-singles-mini-broker-20260819
          do
            git push "$remote" --delete "$branch"
          done

          # Self-delete last: the already-running job continues after ref removal.
          git push "$remote" --delete bench/tmp-stack-283-285-20260819
