name: Apply MQTT 3.1 publish regression fix

on:
  push:
    branches:
      - fix/mqtt31-publish-fastpath-regression

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mqtt31-publish-fastpath-regression
      - name: Apply validated patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/mqtt31-publish-regression.patch
          git apply tools/mqtt31-publish-regression.patch
          rm tools/mqtt31-publish-regression.patch .github/workflows/apply-mqtt31-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MQTT 3.1 PUBLISH fast-path regression'
          git push origin HEAD:fix/mqtt31-publish-fastpath-regression
