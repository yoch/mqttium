name: First-inline exact-source qualification
on:
  push:
    branches: [bench/first-inline-pi-smoke-9ad1f018]
    paths: [.github/first-inline-candidate.part1, .github/first-inline-candidate.part2, .github/first-inline-materialize.py, .github/workflows/first-inline-materialize.yml]
permissions:
  contents: write
concurrency:
  group: first-inline-materialize
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'yoch/mqttium'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_ROOT: ${{ runner.temp }}/first-inline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: ${{ runner.temp }}/first-inline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Reconstruct exact locally-tested input
        run: python .github/first-inline-materialize.py prepare
      - name: Install qualification dependencies
        run: python -m pip install -e "$CANDIDATE_ROOT[dev,fuzz,security,docs]"
      - name: Format only changed Python files and freeze the tested tree
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest=json.loads((Path(os.environ['GITHUB_WORKSPACE'])/'.github/first-inline-manifest.json').read_text())
          subprocess.run(['ruff','format',*manifest['ast_sha256']],check=True)
          PY
          python "$GITHUB_WORKSPACE/.github/first-inline-materialize.py" freeze
      - name: Run unweakened quality and correctness gates
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          failed=0
          gate() {
            local name="$1"; shift
            set +e
            "$@" > "$EVIDENCE_ROOT/$name.log" 2>&1
            local rc=$?
            set -e
            cat "$EVIDENCE_ROOT/$name.log"
            echo "$rc" > "$EVIDENCE_ROOT/$name.exitcode"
            [ "$rc" -eq 0 ] || failed=1
          }
          gate format ruff format --check src tests benchmarks tools
          gate lint ruff check src tests benchmarks tools
          gate types mypy src/mqttium
          gate security bandit -q -ll -r src
          gate docs mkdocs build --strict
          gate unit python -m pytest -q tests/unit tests/project tests/resilience -W error --cov=mqttium
          gate fuzz python -m pytest -q tests/fuzz -W error
          gate seeded python tests/fuzz/fuzz.py --seed 1 --iterations 20000
          exit "$failed"
      - name: Create exact tested immutable Git objects (never move a ref)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/first-inline-materialize.py publish
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-inline-qualified-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean isolated worktree
        if: always()
        run: |
          git worktree remove --force "$CANDIDATE_ROOT" || true
