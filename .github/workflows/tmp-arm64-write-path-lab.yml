name: TEMP ARM64 Write Path Lab

on:
  pull_request:
    branches: [main]
    paths:
      - src/sitecustomize.py
      - benchmarks/experimental_write_paths.py
      - .github/workflows/tmp-linux-write-path-lab.yml
      - .github/workflows/tmp-arm64-write-path-lab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-arm64-write-path-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out rc7
        uses: actions/checkout@v7
        with:
          ref: v1.0.0rc7
          path: base
          persist-credentials: false

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.13"
          command -v taskset
          command -v mosquitto
          test -z "$(pgrep mosquitto || true)"
          mkdir -p "$RUNNER_TEMP/mqttium-write-lab"

      - name: Primitive comparison
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-write-lab"
          cat > "$out/sink.py" <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", 11885))
              server.listen()
              while True:
                  conn, _ = server.accept()
                  with conn:
                      while conn.recv(1024 * 1024):
                          pass
          PY
          taskset -c 0 python3 -u "$out/sink.py" > "$out/sink.log" 2>&1 &
          sink=$!
          trap 'kill $sink 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11885) >/dev/null 2>&1 && break
            sleep 0.05
          done
          taskset -c 2 python3 candidate/benchmarks/experimental_write_paths.py \
            --host 127.0.0.1 --port 11885 \
            --output "$out/write-paths.json" \
            --summary-output "$out/write-paths.md"
          cat "$out/write-paths.md" >> "$GITHUB_STEP_SUMMARY"
          kill "$sink" 2>/dev/null || true
          trap - EXIT

      - name: Start Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-write-lab"
          cat > "$out/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11884 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "$!" > "$out/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11884) >/dev/null 2>&1 && exit 0
            sleep 0.05
          done
          exit 1

      - name: Awaited microbatch sweep
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-write-lab"
          for batch in 2 4 8 16; do
            echo "=== batch $batch ==="
            MQTTIUM_EXPERIMENT_BATCH_ITEMS="$batch" \
              python3 candidate/benchmarks/paired_network.py \
                --base-root base --candidate-root candidate \
                --host 127.0.0.1 --port 11884 \
                --policy advisory --repeat 4 --cpu 2 \
                --windows 32,64,128 --protocols 311 --payloads 64,4096 \
                --count-small 2500 --count-large 1200 \
                --target-sample-seconds 0.4 --max-count 15000 \
                --output "$out/batch-$batch.json" \
                --summary-output "$out/batch-$batch.md"
          done

      - name: Summarize sweep
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/mqttium-write-lab" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          print("\n## ARM64 awaited microbatch sweep\n")
          print("| batch | payload | window | throughput vs rc7 | delivery p50 vs rc7 | delivery p95 vs rc7 |")
          print("|---:|---:|---:|---:|---:|---:|")
          for batch in (2, 4, 8, 16):
              payload = json.loads((root / f"batch-{batch}.json").read_text())
              for scenario in payload["scenarios"]:
                  p50 = scenario["candidate_median_p50_ms"] / scenario["base_median_p50_ms"]
                  p95 = scenario["candidate_median_p95_ms"] / scenario["base_median_p95_ms"]
                  print(f"| {batch} | {scenario['payload_bytes']} | {scenario['window']} | {scenario['median_candidate_over_base_ack']:.4f}× | {p50:.4f}× | {p95:.4f}× |")
          PY

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-arm64-write-path-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-write-lab/*.json
            ${{ runner.temp }}/mqttium-write-lab/*.md
          retention-days: 7
          if-no-files-found: warn

      - name: Stop Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-write-lab/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            kill "$(cat "$pidfile")" 2>/dev/null || true
          fi
