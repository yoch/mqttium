name: Repair external accounting memory profile

on:
  push:
    branches:
      - agent/external-delivery-accounting
    paths:
      - .github/workflows/repair-external-accounting-memory-profile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/external-delivery-accounting
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update queue-owned reservation measurement
        run: |
          echo '' | base64 --decode > /tmp/patch_memory_profile.py
          python /tmp/patch_memory_profile.py
      - name: Validate focused profile
        run: |
          python -m pip install -e ".[dev]" "psutil>=6"
          ruff format benchmarks/memory_profile.py
          ruff check benchmarks/memory_profile.py
          python benchmarks/memory_profile.py --child shared_delivery_both_4k --count 1500 --payload-size 4096 --output /tmp/shared-delivery-both.json
          python -c 'import json; d=json.load(open("/tmp/shared-delivery-both.json")); x=next(s for s in d["snapshots"] if s["phase"]=="loaded")["logical"]; assert x["shared_references"]==3000 and x["pending_logical_bytes"]>0'
      - name: Commit benchmark repair
        run: |
          rm .github/workflows/repair-external-accounting-memory-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/memory_profile.py .github
          git commit -m "Measure queue-owned delivery reservations"
          git push origin HEAD:agent/external-delivery-accounting
