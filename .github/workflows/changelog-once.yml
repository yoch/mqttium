name: changelog once

on:
  push:
    branches: [perf/buffered-tcp-recv]
    paths: [.github/workflows/changelog-once.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/buffered-tcp-recv
      - name: Insert Unreleased entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n"
          entry = (
              "### Fixed\n\n"
              "- Use a reusable 64 KiB `asyncio.BufferedProtocol` receive buffer for "
              "cleartext TCP instead of the selector transport's allocation-heavy "
              "256 KiB `socket.recv()` path. This removes an ASLR-dependent "
              "allocator/page-fault latency regime observed on Linux/ARM64 while "
              "preserving the public transport API and existing read/write "
              "backpressure. TLS remains on asyncio's existing buffered SSL "
              "transport.\n\n"
          )
          if "allocator/page-fault latency regime" in text:
              raise SystemExit("changelog entry already present")
          if text.count(marker) != 1:
              raise SystemExit("unexpected Unreleased marker count")
          path.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- CHANGELOG.md
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add CHANGELOG.md
          git commit -m 'docs: record allocation-stable TCP receive path'
          git push origin HEAD:perf/buffered-tcp-recv
