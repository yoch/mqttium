name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release source and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          tree = ast.parse(Path("src/mqttium/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected_tag!r}"
              )

          is_prerelease = re.search(r"(?:a|b|rc)\d+|\.dev\d+", version) is not None
          release_is_prerelease = os.environ["RELEASE_PRERELEASE"].lower() == "true"
          if is_prerelease != release_is_prerelease:
              raise SystemExit(
                  "GitHub pre-release flag does not match the package version"
              )
          PY
      - run: python -m pip install ".[release]"
      - run: validate-pyproject pyproject.toml
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Install and import the built wheel
        run: |
          python -m venv /tmp/mqttium-release-wheel
          /tmp/mqttium-release-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/mqttium-release-wheel/bin/python -I - <<'PY'
          import importlib
          import importlib.metadata
          import pkgutil
          import mqttium

          assert mqttium.__version__ == importlib.metadata.version("mqttium")
          for module in pkgutil.walk_packages(mqttium.__path__, mqttium.__name__ + "."):
              importlib.import_module(module.name)
          PY
          /tmp/mqttium-release-wheel/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/mqttium
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
