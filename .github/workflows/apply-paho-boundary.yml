name: Apply native publish boundary

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply refactor
        run: |
          python .github/fix_apply_paho_boundary.py
          python .github/apply_paho_boundary.py
          rm -f .github/fix_apply_paho_boundary.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format src tests benchmarks
      - name: Lint and typecheck
        run: |
          ruff check src tests benchmarks
          mypy src
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/unit
      - name: Compatibility submission benchmark
        run: |
          python benchmarks/compat_qosn_submit_ab.py \
            --count 800 --repeat 3 --warmup 100 --workers 8 \
            --output /tmp/compat-qosn-submit.json
      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native publish boundary for compatibility adapters"
          git push origin HEAD:agent/paho-native-publish-boundary
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-publish-boundary-${{ github.run_id }}
          path: /tmp/compat-qosn-submit.json
          if-no-files-found: warn
          retention-days: 30
