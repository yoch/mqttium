name: Apply native publish boundary

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fix patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_paho_boundary.py')
          text = path.read_text()
          text = text.replace(
              '    def _commit_qosn_publish_on_loop(\\n',
              '    def _commit_qosn_publish_on_loop(self, request: _PendingPublish) -> MQTTMessageInfo:\\n',
          )
          text = text.replace(
              '    def _finalize_publish_effects(\\n',
              '    def _finalize_publish_effects(self) -> None:\\n',
          )
          text = text.replace(
              '    def _drain_publish_requests(\\n',
              '    def _drain_publish_requests(self) -> None:\\n',
          )
          old_end = '    "        if requested_qos is QoS.AT_MOST_ONCE:\\n",\n'
          new_end = (
              '    "        if requested_qos is QoS.AT_MOST_ONCE:\\n'
              '            info = MQTTMessageInfo(\\n",\n'
          )
          if text.count(old_end) != 1:
              raise SystemExit(f'expected one publish end anchor, found {text.count(old_end)}')
          text = text.replace(old_end, new_end, 1)
          marker = 'paho_text = Path(paho_path).read_text()\n'
          fix = '''paho_file = Path(paho_path)
          paho_source = paho_file.read_text()
          old_qos0 = """                    self._async._engine.queue_publish(
                                      topic,
                                      data,
                                      qos=requested_qos,
                                      retain=retain,
                                  )
          """
          new_qos0 = """                    self._async._queue_publish_on_loop(
                                      topic,
                                      data,
                                      qos=requested_qos,
                                      retain=retain,
                                      create_qos0_receipt=False,
                                  )
          """
          if old_qos0 in paho_source:
              paho_file.write_text(paho_source.replace(old_qos0, new_qos0, 1))

          '''
          if marker not in text:
              raise SystemExit('Paho assertion marker missing')
          text = text.replace(marker, fix + marker, 1)
          path.write_text(text)
          PY
      - name: Apply refactor
        run: python .github/apply_paho_boundary.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format src tests benchmarks
      - name: Lint and typecheck
        run: |
          ruff check src tests benchmarks
          mypy src
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Compatibility submission benchmark
        run: |
          python benchmarks/compat_qosn_submit_ab.py \
            --count 800 --repeat 3 --warmup 100 --workers 8 \
            --output /tmp/compat-qosn-submit.json
      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native publish boundary for compatibility adapters"
          git push origin HEAD:agent/paho-native-publish-boundary
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-publish-boundary-${{ github.run_id }}
          path: /tmp/compat-qosn-submit.json
          if-no-files-found: warn
          retention-days: 30
