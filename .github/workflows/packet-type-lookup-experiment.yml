name: Packet type lookup experiment

on:
  push:
    branches:
      - agent/packet-type-lookup-experiment

permissions:
  contents: read

concurrency:
  group: packet-type-lookup-experiment
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: agent/packet-type-lookup-experiment
          path: candidate
      - name: Check out approved baseline
        uses: actions/checkout@v7
        with:
          ref: c2e9d21ca68193aa94598e95b9cd13d0a9252cd3
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e "candidate[dev]"
      - name: Validate candidate
        run: |
          cd candidate
          ruff check src/mqttium/enums.py
          mypy src/mqttium/enums.py
          pytest -q tests/unit
      - name: Write paired decoder benchmark
        run: |
          cat > /tmp/packet_type_lookup.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import os
          import statistics
          import subprocess
          import sys
          import time
          from pathlib import Path

          SCENARIOS = (
              "lookup_valid",
              "decoder_qos0_p0",
              "decoder_qos0_p256",
              "decoder_qos0_p4096",
              "engine_qos0_p256",
          )

          def worker(scenario: str) -> dict[str, float | int | str]:
              from mqttium.codec.buffer import IncrementalDecoder
              from mqttium.codec.primitives import pack_utf8
              from mqttium.enums import ConnectionState, MQTTProtocolVersion, PacketType
              from mqttium.protocol.engine import EngineConfig, ProtocolEngine

              if scenario == "lookup_valid":
                  operations = 4_000_000
                  for _ in range(50_000):
                      PacketType.from_byte(0x30)
                  started = time.perf_counter_ns()
                  for _ in range(operations):
                      PacketType.from_byte(0x30)
                  elapsed_ns = time.perf_counter_ns() - started
                  return {
                      "scenario": scenario,
                      "operations": operations,
                      "elapsed_ns": elapsed_ns,
                      "ops_per_s": operations * 1_000_000_000 / elapsed_ns,
                  }

              payload_size = int(scenario.rsplit("p", 1)[1])
              topic = "bench/exact/telemetry"
              body = pack_utf8(topic) + b"x" * payload_size
              remaining = len(body)
              encoded_length = bytearray()
              value = remaining
              while True:
                  digit = value % 128
                  value //= 128
                  if value:
                      digit |= 0x80
                  encoded_length.append(digit)
                  if not value:
                      break
              wire = bytes((0x30,)) + bytes(encoded_length) + body
              batch = 128 if payload_size <= 256 else 32
              batches = 5_000 if payload_size <= 256 else 1_500
              operations = batch * batches
              decoder = IncrementalDecoder()

              if scenario.startswith("decoder_"):
                  callback = lambda _packet: None
              else:
                  engine = ProtocolEngine(
                      EngineConfig(
                          client_id="packet-type-lookup",
                          protocol=MQTTProtocolVersion.MQTTv311,
                      )
                  )
                  engine.state = ConnectionState.CONNECTED

                  def callback(packet):
                      engine.handle_raw(packet)

              for _ in range(50):
                  decoder.feed(wire * batch)
                  handled = decoder.process_packets(callback, limit=batch)
                  if handled != batch:
                      raise RuntimeError(f"warmup handled {handled}, expected {batch}")
                  if not scenario.startswith("decoder_"):
                      engine.take_effects()

              started = time.perf_counter_ns()
              for _ in range(batches):
                  decoder.feed(wire * batch)
                  handled = decoder.process_packets(callback, limit=batch)
                  if handled != batch:
                      raise RuntimeError(f"handled {handled}, expected {batch}")
                  if not scenario.startswith("decoder_"):
                      engine.take_effects()
              elapsed_ns = time.perf_counter_ns() - started
              return {
                  "scenario": scenario,
                  "operations": operations,
                  "elapsed_ns": elapsed_ns,
                  "ops_per_s": operations * 1_000_000_000 / elapsed_ns,
              }

          def run_variant(script: Path, root: Path, scenario: str) -> dict[str, object]:
              env = os.environ.copy()
              env["PYTHONPATH"] = str(root / "src")
              completed = subprocess.run(
                  [sys.executable, str(script), "--worker", "--scenario", scenario],
                  env=env,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          def parent(args: argparse.Namespace) -> None:
              script = Path(__file__).resolve()
              result: dict[str, object] = {
                  "base": str(args.base_root.resolve()),
                  "candidate": str(args.candidate_root.resolve()),
                  "repeat": args.repeat,
                  "python": sys.version,
                  "scenarios": [],
              }
              for scenario in SCENARIOS:
                  pairs = []
                  ratios = []
                  for index in range(args.repeat):
                      order = ("base", "candidate") if index % 2 == 0 else ("candidate", "base")
                      measured = {}
                      for variant in order:
                          root = args.base_root if variant == "base" else args.candidate_root
                          measured[variant] = run_variant(script, root, scenario)
                      ratio = measured["candidate"]["ops_per_s"] / measured["base"]["ops_per_s"]
                      ratios.append(ratio)
                      pairs.append(
                          {
                              "order": list(order),
                              "base_ops_per_s": measured["base"]["ops_per_s"],
                              "candidate_ops_per_s": measured["candidate"]["ops_per_s"],
                              "candidate_over_base": ratio,
                          }
                      )
                  row = {
                      "name": scenario,
                      "median_candidate_over_base": statistics.median(ratios),
                      "min_candidate_over_base": min(ratios),
                      "max_candidate_over_base": max(ratios),
                      "positive_pairs": sum(ratio > 1.0 for ratio in ratios),
                      "pairs": pairs,
                  }
                  result["scenarios"].append(row)
                  print(
                      f"{scenario:24s} candidate/base={row['median_candidate_over_base']:.4f} "
                      f"positive={row['positive_pairs']}/{args.repeat}"
                  )
              args.output.write_text(json.dumps(result, indent=2) + "\n")

          parser = argparse.ArgumentParser()
          parser.add_argument("--worker", action="store_true")
          parser.add_argument("--scenario", choices=SCENARIOS)
          parser.add_argument("--base-root", type=Path)
          parser.add_argument("--candidate-root", type=Path)
          parser.add_argument("--repeat", type=int, default=15)
          parser.add_argument("--output", type=Path, default=Path("/tmp/packet-type-lookup.json"))
          args = parser.parse_args()
          if args.worker:
              print(json.dumps(worker(args.scenario)))
          else:
              parent(args)
          PY
      - name: Paired lookup and direct decoder matrix
        run: |
          mkdir -p /tmp/packet-type-results
          python /tmp/packet_type_lookup.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 15 \
            --output /tmp/packet-type-results/direct.json
      - name: Install broker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          cat > /tmp/packet-type-results/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/packet-type-results/mosquitto.conf \
            > /tmp/packet-type-results/mosquitto.log 2>&1 &
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          cat /tmp/packet-type-results/mosquitto.log
          exit 1
      - name: Independent paired network sweep
        run: |
          python candidate/benchmarks/paired_network.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 5 \
            --windows 1,5,20,100 \
            --payloads 64,4096 \
            --output /tmp/packet-type-results/network.json
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packet-type-lookup-${{ github.run_id }}
          path: /tmp/packet-type-results
          if-no-files-found: warn
          retention-days: 30
