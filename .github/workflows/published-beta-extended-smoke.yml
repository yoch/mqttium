name: Published beta extended smoke

on:
  pull_request:
    paths:
      - .github/workflows/published-beta-extended-smoke.yml
      - tests/installed_distribution_extended_smoke.py
      - tests/unit/test_public_api_surface.py
  workflow_dispatch:
    inputs:
      version:
        description: Published MQTTium version to validate
        required: true
        default: 1.0.0rc1
        type: string
  schedule:
    - cron: "43 5 1 * *"

permissions:
  contents: read

concurrency:
  group: published-beta-extended-${{ github.event.inputs.version || '1.0.0rc1' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  transports-compat-shutdown:
    runs-on: ubuntu-24.04
    env:
      MQTTIUM_VERSION: ${{ github.event.inputs.version || '1.0.0rc1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install published wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --only-binary=mqttium \
            "mqttium==$MQTTIUM_VERSION"
          python -m pip check
      - name: Start TCP, WebSocket, and Unix Mosquitto listeners
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          cat > /tmp/mqttium-beta-extended.conf <<'EOF'
          listener 11886 127.0.0.1
          protocol mqtt
          allow_anonymous true

          listener 18083 127.0.0.1
          protocol websockets
          socket_domain ipv4
          allow_anonymous true

          listener 0 /tmp/mqttium-beta.sock
          protocol mqtt
          allow_anonymous true
          EOF
          mosquitto -c /tmp/mqttium-beta-extended.conf -d
          for _ in $(seq 1 50); do
            tcp=0
            ws=0
            unix=0
            (echo > /dev/tcp/127.0.0.1/11886) >/dev/null 2>&1 && tcp=1
            (echo > /dev/tcp/127.0.0.1/18083) >/dev/null 2>&1 && ws=1
            [ -S /tmp/mqttium-beta.sock ] && unix=1
            if [ "$tcp" = 1 ] && [ "$ws" = 1 ] && [ "$unix" = 1 ]; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - name: Exercise installed WebSocket transport
        run: |
          python -I tests/installed_distribution_extended_smoke.py websocket \
            --expected-version "$MQTTIUM_VERSION" \
            --url ws://127.0.0.1:18083/mqtt
      - name: Exercise installed Unix transport
        run: |
          python -I tests/installed_distribution_extended_smoke.py unix \
            --expected-version "$MQTTIUM_VERSION" \
            --socket /tmp/mqttium-beta.sock
      - name: Exercise installed Paho VERSION2 migration subset
        run: |
          python -I tests/installed_distribution_extended_smoke.py paho \
            --expected-version "$MQTTIUM_VERSION" \
            --host 127.0.0.1 \
            --port 11886
      - name: Exercise cancellation and clean shutdown
        run: |
          python -I tests/installed_distribution_extended_smoke.py shutdown \
            --expected-version "$MQTTIUM_VERSION" \
            --host 127.0.0.1 \
            --port 11886
