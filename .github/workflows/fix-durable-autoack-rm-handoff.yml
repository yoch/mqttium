name: Fix durable auto-ACK RM handoff

on:
  push:
    branches:
      - fix/durable-autoack-rm-handoff

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/durable-autoack-rm-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mqttium/protocol/inbound.py')
          text = path.read_text()
          old = '''                self._engine._send(_encode_puback_success(mid))\n                self._release_slot(recovered_logical_size)\n                return\n'''
          new = '''                self._engine._send(_encode_puback_success(mid))\n                # The restored Receive Maximum slot remains owned until this\n                # PUBACK leaves the engine effect batch, exactly like a fresh\n                # automatic QoS 1 acknowledgement. The persisted record is\n                # already complete, so its byte reservation can be released\n                # immediately without freeing the protocol slot early.\n                self._release_pending_bytes(recovered_logical_size)\n                self._pending_auto_qos1_mids.add(mid)\n                return\n'''
          if old not in text:
              raise SystemExit('target recovered auto-ACK block not found')
          text = text.replace(old, new, 1)

          old_release = '''    def _release_slot(self, logical_size: int | None = None) -> None:\n        if self._inflight > 0:\n            self._inflight -= 1\n        if logical_size is None:\n            return\n        if logical_size <= 0 or logical_size > self._pending_bytes:\n            raise AssertionError(\n                "inbound byte reservation underflow: "\n                f"release={logical_size}, pending={self._pending_bytes}"\n            )\n        self._pending_bytes -= logical_size\n'''
          new_release = '''    def _release_slot(self, logical_size: int | None = None) -> None:\n        if self._inflight > 0:\n            self._inflight -= 1\n        self._release_pending_bytes(logical_size)\n\n    def _release_pending_bytes(self, logical_size: int | None) -> None:\n        if logical_size is None:\n            return\n        if logical_size <= 0 or logical_size > self._pending_bytes:\n            raise AssertionError(\n                "inbound byte reservation underflow: "\n                f"release={logical_size}, pending={self._pending_bytes}"\n            )\n        self._pending_bytes -= logical_size\n'''
          if old_release not in text:
              raise SystemExit('target _release_slot block not found')
          path.write_text(text.replace(old_release, new_release, 1))

          test = Path('tests/unit/test_recovered_autoack_receive_maximum_handoff.py')
          test.write_text('''"""Recovered auto-QoS1 PUBACKs retain Receive Maximum ownership until handoff."""\n\nfrom __future__ import annotations\n\nfrom mqttium.codec.buffer import IncrementalDecoder\nfrom mqttium.codec.properties import CONNACK, encode_properties\nfrom mqttium.enums import (\n    ConnectionState,\n    InboundQoSState,\n    MQTTProtocolVersion,\n    PacketType,\n    QoS,\n)\nfrom mqttium.packets import PublishPacket, encode_frame\nfrom mqttium.persistence.memory import MemoryInflightStore\nfrom mqttium.protocol.config import EngineConfig\nfrom mqttium.protocol.effects import EffectKind\nfrom mqttium.protocol.engine import ProtocolEngine\nfrom mqttium.types import InboundMessage\n\n\ndef _feed(engine: ProtocolEngine, wire: bytes) -> None:\n    decoder = IncrementalDecoder()\n    decoder.feed(wire)\n    raw = decoder.next_packet()\n    assert raw is not None\n    engine.handle_raw(raw)\n\n\ndef _publish(mid: int, *, qos: QoS = QoS.AT_LEAST_ONCE, dup: bool = False) -> bytes:\n    return PublishPacket(\n        topic="recover/window",\n        payload=bytes((mid,)),\n        qos=qos,\n        retain=False,\n        dup=dup,\n        mid=mid,\n    ).encode(MQTTProtocolVersion.MQTTv5)\n\n\ndef _recovered_engine(receive_maximum: int) -> ProtocolEngine:\n    store = MemoryInflightStore()\n    store.put_in(\n        InboundMessage(\n            mid=7,\n            topic="recover/window",\n            payload=b"old",\n            qos=QoS.AT_LEAST_ONCE,\n            retain=False,\n            state=InboundQoSState.WAIT_PUBACK,\n            delivered=True,\n        )\n    )\n    engine = ProtocolEngine(\n        EngineConfig(\n            client_id="recovered-autoack-window",\n            protocol=MQTTProtocolVersion.MQTTv5,\n            clean_start=False,\n            manual_ack=False,\n            local_receive_maximum=receive_maximum,\n        ),\n        store=store,\n    )\n    engine.begin_connect()\n    engine.take_effects()\n    body = bytearray((1, 0))\n    body.extend(encode_properties(None, CONNACK))\n    _feed(engine, encode_frame(PacketType.CONNACK, 0, body))\n    engine.take_effects()\n    assert engine.state is ConnectionState.CONNECTED\n    assert engine._inbound_inflight == 1\n    return engine\n\n\ndef test_recovered_autoack_puback_holds_receive_maximum_slot_until_handoff() -> None:\n    engine = _recovered_engine(receive_maximum=1)\n\n    _feed(engine, _publish(7, dup=True))\n    assert engine._inbound_inflight == 1\n    assert engine.store.get_in(7) is None\n\n    _feed(engine, _publish(8))\n    effects = engine.take_effects()\n\n    assert engine.state is ConnectionState.DISCONNECTED\n    assert not [effect for effect in effects if effect.kind is EffectKind.MESSAGE]\n    error = next(effect.data for effect in effects if effect.kind is EffectKind.PROTOCOL_ERROR)\n    assert "Receive Maximum exceeded" in error\n\n\ndef test_recovered_autoack_mid_cannot_be_reused_by_qos2_before_handoff() -> None:\n    engine = _recovered_engine(receive_maximum=2)\n\n    _feed(engine, _publish(7, dup=True))\n    _feed(engine, _publish(7, qos=QoS.EXACTLY_ONCE))\n    effects = engine.take_effects()\n\n    assert engine.state is ConnectionState.DISCONNECTED\n    error = next(effect.data for effect in effects if effect.kind is EffectKind.PROTOCOL_ERROR)\n    assert "reused by QoS 2 while QoS 1 PUBACK is pending" in error\n\n\ndef test_recovered_autoack_slot_is_released_at_effect_handoff() -> None:\n    engine = _recovered_engine(receive_maximum=1)\n\n    _feed(engine, _publish(7, dup=True))\n    first = engine.take_effects()\n\n    assert any(effect.kind is EffectKind.SEND for effect in first)\n    assert engine._inbound_inflight == 0\n    assert engine.state is ConnectionState.CONNECTED\n\n    _feed(engine, _publish(8))\n    second = engine.take_effects()\n\n    assert engine.state is ConnectionState.CONNECTED\n    assert [effect.data.payload for effect in second if effect.kind is EffectKind.MESSAGE] == [\n        b"\\x08"\n    ]\n    assert not any(effect.kind is EffectKind.PROTOCOL_ERROR for effect in second)\n''')
          PY
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/unit/test_recovered_autoack_receive_maximum_handoff.py tests/unit/test_autoack_receive_maximum_handoff.py tests/unit/test_inbound_recovery.py
          ruff format --check src tests
          ruff check src tests
          mypy src/mqttium
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mqttium/protocol/inbound.py tests/unit/test_recovered_autoack_receive_maximum_handoff.py
          git commit -m 'Fix recovered auto-ACK Receive Maximum handoff'
          git push origin HEAD:fix/durable-autoack-rm-handoff
