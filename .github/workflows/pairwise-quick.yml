name: Quick pairwise RTT ARM64

on:
  push:
    branches: [bench/pairwise-quick]
    paths: [.github/workflows/pairwise-quick.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-benchmark-arm64
  cancel-in-progress: false

jobs:
  quick:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 90
    env:
      BENCH_SHA: 718966e3385e134cac08d836af509c5f0002825d
      MQTTIUM_VER: "1.0.0rc13"
      GMQTT_VER: "0.7.0"
      PAHO_VER: "2.1.0"
      PROFILE: smoke
      PACER_MODE: external
      RUN_LOAD_MATRIX: "0"
      RUN_AA: "0"
      AA_CONTROL_ENFORCE: "0"
      AA_BLOCKS: "4"
      AA_VARIANT_INDEXES: "4"
      RUN_ABBA: "1"
      ABBA_BLOCKS: "2"
      MATRIX_RUNS: "2"
      RUN_ASYNCIO_PAIR: "1"
      RUN_SYNC_REFERENCE_PAIR: "1"

    steps:
      - name: Set run-specific paths
        shell: bash
        run: |
          echo "RESULTS_DIR=$RUNNER_TEMP/mqtt-client-bench-quick-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BENCH_BROKER=127.0.0.1:11883" >> "$GITHUB_ENV"

      - name: Verify dedicated ARM runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected Python 3.14, got {sys.version}")
          PY
          command -v mosquitto
          command -v taskset
          gov="$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true)"
          echo "governor=$gov"
          test "$gov" = performance
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate the quick run" >&2
            exit 1
          fi

      - name: Checkout exact benchmark measurement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: bench
          persist-credentials: false

      - name: Verify immutable harness provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bench rev-parse HEAD)" = "$BENCH_SHA"
          test -z "$(git -C bench status --porcelain --untracked-files=no)"

      - name: Create isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev,paho,gmqtt,mqttium]"
          pip install --force-reinstall --no-cache-dir \
            "mqttium==$MQTTIUM_VER" \
            "gmqtt==$GMQTT_VER" \
            "paho-mqtt==$PAHO_VER"
          python - <<'PY'
          from importlib.metadata import version
          assert version("mqttium") == "1.0.0rc13", version("mqttium")
          assert version("gmqtt") == "0.7.0", version("gmqtt")
          assert version("paho-mqtt") == "2.1.0", version("paho-mqtt")
          PY

      - name: Validate quick benchmark invariants
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m unittest -v \
            tests.test_finalization \
            tests.test_quick_campaign \
            tests.test_quality \
            tests.test_version_compare \
            tests.test_unit.CrossClientLoadTests \
            tests.test_unit.NativeRttDriveTests \
            tests.test_unit.PairwiseCapacityGateTests \
            tests.test_unit.ExternalBrokerTelemetryTests \
            tests.test_unit.RttResponderValidityTests \
            tests.test_unit.AbbaCounterbalanceTests \
            tests.test_rtt_initiator \
            tests.test_pacing

      - name: Calibrate ARM host
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m mqtt_client_bench.run calibrate-host \
            --profile smoke \
            --role runner \
            --skip-ceilings

      - name: Start isolated Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mosquitto-bench.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          broker_cpuset="$(cd bench && . .venv/bin/activate && PYTHONPATH=src python - <<'PY'
          from mqtt_client_bench.telemetry import allocate_cpuset
          print(allocate_cpuset(["sut", "broker", "loadgen", "orch"], profile="standard")["broker"])
          PY
          )"
          echo "broker_cpuset=$broker_cpuset"
          taskset -c "$broker_cpuset" mosquitto -c "$RUNNER_TEMP/mosquitto-bench.conf" > "$RUNNER_TEMP/mosquitto-bench.log" 2>&1 &
          pid=$!
          echo "BROKER_PID=$pid" >> "$GITHUB_ENV"
          echo "BENCH_BROKER_PID=$pid" >> "$GITHUB_ENV"
          mkdir -p "$RESULTS_DIR"
          sleep 1
          kill -0 "$pid"

      - name: Run quick pairwise campaign
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          bash scripts/run_pairwise_rtt_quick.sh

      - name: Stop broker
        if: always()
        shell: bash
        run: |
          if [ -n "${BROKER_PID:-}" ]; then
            kill "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

      - name: Upload quick evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pairwise-native-rtt-quick-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}
            bench/hosts/*.json
            ${{ runner.temp }}/mosquitto-bench.conf
            ${{ runner.temp }}/mosquitto-bench.log
          if-no-files-found: warn
          retention-days: 14
