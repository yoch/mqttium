name: ARM64 Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact reviewed capacity-baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      latency_base_ref:
        description: Exact reviewed latency-baseline commit SHA
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that every input commit was reviewed and is trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  paired:
    if: inputs.confirm_trusted_code && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: harness
          persist-credentials: false
      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          LATENCY_BASE_REF: ${{ inputs.latency_base_ref }}
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF" "$LATENCY_BASE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "all refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Check out capacity baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Check out latency baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.latency_base_ref }}
          path: latency-base
          persist-credentials: false

      - name: Verify dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected system Python 3.14, got {sys.version}")
          PY
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate paired evidence." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce dedicated-runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$JOB_ROOT"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Paired microbenchmarks
        env:
          PYTHONPATH: harness/src
        run: |
          python harness/benchmarks/paired_regression.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 11 \
            --output "$JOB_ROOT/micro.json"

      - name: Advisory paired network sweep
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base \
            --candidate-root candidate \
            --policy advisory \
            --preflight-report "$JOB_ROOT/runner.json" \
            --repeat 8 \
            --cpu 2 \
            --windows 1,8,32,64,128 \
            --protocols 311,5 \
            --payloads 64,4096 \
            --count-small 20000 \
            --count-large 8000 \
            --output "$JOB_ROOT/network.json" \
            --summary-output "$JOB_ROOT/network.md"

      - name: Advisory native QoS 1 receipt/callback diagnostic
        run: |
          python harness/benchmarks/paired_network.py \
            --base-root base --candidate-root candidate \
            --policy advisory \
            --preflight-report "$JOB_ROOT/runner.json" \
            --repeat 4 --cpu 2 --windows 64 --protocols 311 \
            --payloads 64 --completions receipt,callback \
            --count-small 5000 \
            --output "$JOB_ROOT/qos1-completion.json" \
            --summary-output "$JOB_ROOT/qos1-completion.md"

      - name: Strict closed-loop writer-capacity A/A control
        id: writer_gate
        shell: bash
        run: |
          set -euo pipefail
          script="candidate/benchmarks/paired_writer_capacity.py"
          if [ ! -f "$script" ]; then
            echo "candidate does not provide paired_writer_capacity.py; writer-specific gates skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          python "$script" \
            --base-root base --candidate-root base \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 \
            --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/writer-capacity-aa.json" \
            --summary-output "$JOB_ROOT/writer-capacity-aa.md"

      - name: Strict closed-loop writer-capacity A/B gate
        if: steps.writer_gate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python candidate/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 \
            --policy strict \
            --preflight-report "$JOB_ROOT/runner.json" \
            --output "$JOB_ROOT/writer-capacity-ab.json" \
            --summary-output "$JOB_ROOT/writer-capacity-ab.md"

      - name: Strict paced writer-latency A/A control
        if: steps.writer_gate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$JOB_ROOT"
          run_control() {
            local attempt="$1"
            python harness/benchmarks/paired_open_loop.py \
              --base-root latency-base --candidate-root latency-base \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,10000 --completions callback \
              --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
              --policy strict \
              --preflight-report "$root/runner.json" \
              --output "$root/writer-latency-aa-attempt-${attempt}.json" \
              --summary-output "$root/writer-latency-aa-attempt-${attempt}.md"
          }

          set +e
          run_control 1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            echo "A/A control failed operationally with exit code $rc; not retrying." >&2
            exit "$rc"
          fi

          echo "A/A control was statistically invalid; retrying exactly once. Both attempts are retained."
          python harness/benchmarks/runner_probe.py \
            --output "$root/runner-latency-retry.json" \
            --require-temperature \
            --enforce
          python harness/benchmarks/paired_open_loop.py \
            --base-root latency-base --candidate-root latency-base \
            --protocols 311 --payloads 256 --windows 64 \
            --target-rates 2500,10000 --completions callback \
            --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
            --policy strict \
            --preflight-report "$root/runner-latency-retry.json" \
            --output "$root/writer-latency-aa-attempt-2.json" \
            --summary-output "$root/writer-latency-aa-attempt-2.md"

      - name: Strict paced writer-latency A/B gate
        if: steps.writer_gate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          preflight="$JOB_ROOT/runner.json"
          if [ -f "$JOB_ROOT/runner-latency-retry.json" ]; then
            preflight="$JOB_ROOT/runner-latency-retry.json"
          fi
          python harness/benchmarks/paired_open_loop.py \
            --base-root latency-base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 \
            --target-rates 2500,10000 --completions callback \
            --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
            --policy strict \
            --preflight-report "$preflight" \
            --output "$JOB_ROOT/writer-latency-ab.json" \
            --summary-output "$JOB_ROOT/writer-latency-ab.md"

      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-paired-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/*.md
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$JOB_ROOT/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
