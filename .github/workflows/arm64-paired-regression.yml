name: ARM64 Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact delivery-scaling baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      latency_base_ref:
        description: Exact EffectPump baseline commit SHA
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that every input commit was reviewed and is trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  paired-micro-audit:
    if: inputs.confirm_trusted_code && github.ref == 'refs/heads/codex/lean-native-experiment'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Validate immutable trusted commits
        env:
          DELIVERY_BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EFFECT_BASE_REF: ${{ inputs.latency_base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$DELIVERY_BASE_REF" "$CANDIDATE_REF" "$EFFECT_BASE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: harness
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Check out delivery baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: delivery-base
          persist-credentials: false

      - name: Check out EffectPump baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.latency_base_ref }}
          path: effect-base
          persist-credentials: false

      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-micro-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v taskset
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected system Python 3.14, got {sys.version}")
          PY

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce dedicated-runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Measure restored delivery sizing paths
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 2 python harness/benchmarks/paired_delivery_profile.py \
            --base-root delivery-base \
            --candidate-root candidate \
            --cpu 2 \
            --repeat 7 \
            --warmup 3000 \
            --operations 50000 \
            --profile-operations 10000 \
            --output "$JOB_ROOT/delivery-sizing.json"

      - name: Measure EffectPump micro changes
        shell: bash
        run: |
          set -euo pipefail
          for scenario in effect_send_inline effect_batch_inline effect_batch_ordered effect_batch_reordered; do
            echo "### $scenario A/A"
            taskset -c 2 python harness/benchmarks/paired_regression.py \
              --base-root effect-base --candidate-root effect-base \
              --scenario "$scenario" --repeat 11 --cpu 2 \
              --output "$JOB_ROOT/${scenario}-aa.json"
            echo "### $scenario A/B"
            taskset -c 2 python harness/benchmarks/paired_regression.py \
              --base-root effect-base --candidate-root candidate \
              --scenario "$scenario" --repeat 11 --cpu 2 \
              --output "$JOB_ROOT/${scenario}-ab.json"
          done

      - name: Upload micro-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-micro-audit-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "$JOB_ROOT"
