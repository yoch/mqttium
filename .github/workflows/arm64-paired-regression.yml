name: ARM64 Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact reviewed capacity-baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      latency_base_ref:
        description: Exact reviewed latency-baseline commit SHA (unused by targeted iterator diagnostic)
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that every input commit was reviewed and is trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  bounded-iterator-network:
    if: inputs.confirm_trusted_code && github.ref == 'refs/heads/codex/lean-native-experiment'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: harness

    steps:
      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: harness
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Check out RC14 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-iterator-network-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected system Python 3.14, got {sys.version}")
          PY
          command -v mosquitto
          command -v taskset
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process would contaminate paired evidence." >&2
            exit 1
          fi

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce dedicated-runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$JOB_ROOT/mosquitto.log" 2>&1 &
          echo "$!" > "$JOB_ROOT/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$JOB_ROOT/mosquitto.pid")" 2>/dev/null; then
              cat "$JOB_ROOT/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$JOB_ROOT/mosquitto.log"
          exit 1

      - name: Paired bounded iterator self-pub/sub diagnostic
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 2 python harness/benchmarks/lean_native_compare.py \
            --base-root base \
            --candidate-root candidate \
            --output "$JOB_ROOT/iterator-network.json" \
            --host 127.0.0.1 \
            --port 11883 \
            --protocols 311,5 \
            --qos-values 0 \
            --stores memory \
            --modes iterator \
            --bursts 1,long \
            --aa-cycles 1 \
            --cycles 2 \
            --target-seconds 0.35 \
            --cpu 2

      - name: Summarize paired result
        shell: bash
        run: |
          python - "$JOB_ROOT/iterator-network.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          for cell in data["cells"]:
              spec = cell["spec"]
              summary = cell["summary_AB"]
              aa = cell["summary_AA"]
              print(
                  f"protocol={spec['protocol']} burst={spec['burst']} n={cell['count']} "
                  f"rate={summary['delivered_per_s']['cycle_ratio_geomean']:.4f} "
                  f"cpu={summary['cpu_us_per_message']['cycle_ratio_geomean']:.4f} "
                  f"p50={summary['latency_p50_us']['cycle_ratio_geomean']:.4f} "
                  f"p95={summary['latency_p95_us']['cycle_ratio_geomean']:.4f} "
                  f"AA-rate={aa['delivered_per_s']['cycle_ratio_geomean']:.4f} "
                  f"AA-CV={aa['delivered_per_s']['A_cv']:.4f}"
              )
          PY

      - name: Upload bounded iterator diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-bounded-iterator-network-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/runner.json
            ${{ env.JOB_ROOT }}/iterator-network.json
            ${{ env.JOB_ROOT }}/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto and clean workspace
        if: always()
        shell: bash
        run: |
          if [ -f "$JOB_ROOT/mosquitto.pid" ]; then
            pid="$(cat "$JOB_ROOT/mosquitto.pid")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
