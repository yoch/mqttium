name: ARM64 Paired Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact reviewed capacity-baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      latency_base_ref:
        description: Exact reviewed latency-baseline commit SHA (unused by delivery profile)
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that every input commit was reviewed and is trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  delivery-profile:
    if: inputs.confirm_trusted_code && github.ref == 'refs/heads/codex/lean-native-experiment'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: harness
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Check out RC14 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-delivery-profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify dedicated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected system Python 3.14, got {sys.version}")
          PY
          command -v taskset

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce dedicated-runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Profile paired application delivery
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 2 python harness/benchmarks/paired_delivery_profile.py \
            --base-root base \
            --candidate-root candidate \
            --cpu 2 \
            --repeat 7 \
            --warmup 3000 \
            --operations 50000 \
            --profile-operations 10000 \
            --output "$JOB_ROOT/delivery-profile.json"

      - name: Upload delivery profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-delivery-profile-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-delivery-profile-${{ github.run_id }}-${{ github.run_attempt }}/runner.json
            ${{ runner.temp }}/mqttium-delivery-profile-${{ github.run_id }}-${{ github.run_attempt }}/delivery-profile.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf "$JOB_ROOT"
