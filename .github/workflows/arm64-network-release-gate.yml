name: ARM64 Network Release Gate
run-name: "Network gate: ${{ inputs.base_ref }} -> ${{ inputs.candidate_ref }}"

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact reviewed baseline commit SHA
        required: true
        type: string
      candidate_ref:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      confirm_trusted_code:
        description: I confirm that both commits were reviewed and are trusted on the persistent runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  release-gate:
    name: Deep network gate (manual only)
    if: inputs.confirm_trusted_code
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Set run-specific workspace
        run: echo "JOB_ROOT=$RUNNER_TEMP/mqttium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Validate immutable trusted commits
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          for value in "$BASE_REF" "$CANDIDATE_REF"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "all refs must be exact commit SHAs" >&2; exit 2; }
          done

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3.14
          python3.14 --version
          command -v perf
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate release evidence" >&2
            exit 1
          fi
          for cpu in 0 1 2 3; do
            root="/sys/devices/system/cpu/cpu${cpu}/cpufreq"
            test "$(cat "$root/scaling_governor")" = performance
          done

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3.14 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$JOB_ROOT"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Probe page-fault tracing support
        if: false
        shell: bash
        run: |
          {
            command -v perf || true
            perf --version 2>&1 || true
            printf 'perf_event_paranoid='
            cat /proc/sys/kernel/perf_event_paranoid
            perf stat -e page-faults:u true 2>&1 || true
          } > "$JOB_ROOT/perf-capability.log"
          cat "$JOB_ROOT/perf-capability.log"
          {
            printf '%s\n' '=== libc dynamic symbols around allocator ==='
            nm -D -n /usr/lib/aarch64-linux-gnu/libc.so.6 | \
              sed -n '/^000000000009/p'
            printf '%s\n' '=== Python dynamic symbols around socket recv ==='
            nm -D -n /usr/bin/python3.14 | \
              sed -n '/^00000000006[de]/p'
          } > "$JOB_ROOT/allocator-symbols.log" 2>&1 || true

      - name: Profile page-fault modes with ASLR
        if: false
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 3 python3.14 harness/benchmarks/runner_network_diagnosis.py \
            --root base \
            --engine harness/benchmarks/paired_network.py \
            --iterations 16 \
            --count 13000 \
            --window 1 \
            --protocol 311 \
            --completion callback \
            --publisher-cpu 2 \
            --support-cpu 1 \
            --perf-output-dir "$JOB_ROOT/perf-aslr" \
            --perf-period 100 \
            --output "$JOB_ROOT/runner-diagnosis-aslr.json" | \
            tee "$JOB_ROOT/runner-diagnosis-aslr.log"

      - name: Run focused runner diagnosis without ASLR
        if: false
        shell: bash
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          if ! setarch "$architecture" -R true; then
            printf '%s\n' '{"available": false, "reason": "setarch -R denied"}' \
              > "$JOB_ROOT/runner-diagnosis-no-aslr.json"
            exit 0
          fi
          setarch "$architecture" -R taskset -c 3 \
            python3.14 harness/benchmarks/runner_network_diagnosis.py \
            --root base \
            --engine harness/benchmarks/paired_network.py \
            --iterations 4 \
            --count 13000 \
            --window 1 \
            --protocol 311 \
            --completion callback \
            --publisher-cpu 2 \
            --support-cpu 1 \
            --perf-output-dir "$JOB_ROOT/perf-no-aslr" \
            --perf-period 100 \
            --output "$JOB_ROOT/runner-diagnosis-no-aslr.json" | \
            tee "$JOB_ROOT/runner-diagnosis-no-aslr.log"

      - name: Prove glibc mmap threshold causality
        if: false
        shell: bash
        run: |
          set -euo pipefail
          for threshold in 131072 1048576; do
            MALLOC_MMAP_THRESHOLD_="$threshold" taskset -c 3 \
              python3.14 harness/benchmarks/runner_network_diagnosis.py \
              --root base \
              --engine harness/benchmarks/paired_network.py \
              --iterations 12 \
              --count 13000 \
              --window 1 \
              --protocol 311 \
              --completion callback \
              --publisher-cpu 2 \
              --support-cpu 1 \
              --output "$JOB_ROOT/runner-diagnosis-mmap-$threshold.json" | \
              tee "$JOB_ROOT/runner-diagnosis-mmap-$threshold.log"
          done

      - name: Compare deterministic glibc controls
        if: false
        shell: bash
        run: |
          set -euo pipefail
          for control in top-pad no-mmap; do
            case "$control" in
              top-pad) tunables='glibc.malloc.top_pad=1048576' ;;
              no-mmap) tunables='glibc.malloc.mmap_max=0' ;;
            esac
            GLIBC_TUNABLES="$tunables" taskset -c 3 \
              python3.14 harness/benchmarks/runner_network_diagnosis.py \
              --root base \
              --engine harness/benchmarks/paired_network.py \
              --iterations 24 \
              --count 13000 \
              --window 1 \
              --protocol 311 \
              --completion callback \
              --publisher-cpu 2 \
              --support-cpu 1 \
              --output "$JOB_ROOT/runner-diagnosis-$control.json" | \
              tee "$JOB_ROOT/runner-diagnosis-$control.log"
          done

      - name: Decode perf evidence
        if: false
        shell: bash
        run: |
          set -uo pipefail
          for directory in "$JOB_ROOT"/perf-*; do
            test -d "$directory" || continue
            for data in "$directory"/*.data; do
              test -f "$data" || continue
              perf report --stdio --no-children --input "$data" \
                > "${data%.data}.report.txt" 2>&1 || true
              perf script --input "$data" \
                > "${data%.data}.script.txt" 2>&1 || true
            done
          done

      - name: Run strict network release gate
        shell: bash
        run: |
          set -euo pipefail
          setarch "$(uname -m)" -R taskset -c 1,3 \
            python harness/benchmarks/network_release_gate.py \
            --base-root base \
            --candidate-root candidate \
            --engine harness/benchmarks/paired_network.py \
            --runner-probe harness/benchmarks/runner_probe.py \
            --protocols 311 \
            --completions callback \
            --payloads 64 \
            --windows 1 \
            --control-blocks 2 \
            --control-cycle-seeds 0,1,2 \
            --ab-blocks 2 \
            --cycle-seeds 0,1,2,3,4,5 \
            --target-sample-seconds 2.0 \
            --max-count 60000 \
            --timeout 60 \
            --cpu 2 \
            --inter-phase-quiet-seconds 0 \
            --policy strict \
            --output "$JOB_ROOT/result.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-network-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/*.md
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/*-raw/*
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/mosquitto.log
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/perf-capability.log
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/allocator-symbols.log
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/runner-diagnosis-*.json
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/runner-diagnosis-*.log
            ${{ runner.temp }}/mqttium-${{ github.run_id }}-${{ github.run_attempt }}/perf-*/*
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$JOB_ROOT/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -rf "$JOB_ROOT"
