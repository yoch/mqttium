name: ARM64 Network Release Gate
run-name: "Network gate: ${{ inputs.base_ref }} -> ${{ inputs.candidate_ref }}"

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Exact trusted baseline commit, branch, or tag
        required: true
        type: string
      candidate_ref:
        description: Exact trusted candidate commit, branch, or tag
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: arm64-network-release-gate
  cancel-in-progress: false

jobs:
  release-gate:
    name: Deep network gate (manual only)
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(nproc)" -ge 4
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate release evidence" >&2
            exit 1
          fi
          for cpu in 0 1 2 3; do
            root="/sys/devices/system/cpu/cpu${cpu}/cpufreq"
            test "$(cat "$root/scaling_governor")" = performance
          done

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-network-release-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install probe dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Start isolated broker on CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-network-release"
          rm -rf "$root"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Run strict network release gate
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 1,3 python harness/benchmarks/network_release_gate.py \
            --base-root base \
            --candidate-root candidate \
            --engine harness/benchmarks/paired_network.py \
            --runner-probe harness/benchmarks/runner_probe.py \
            --protocols 311 \
            --completions callback \
            --payloads 64 \
            --windows 1,20,64 \
            --control-blocks 1 \
            --control-cycle-seeds 0,1,2 \
            --ab-blocks 2 \
            --cycle-seeds 0,1,2,3,4,5 \
            --target-sample-seconds 2.0 \
            --max-count 60000 \
            --timeout 60 \
            --cpu 2 \
            --inter-phase-quiet-seconds 60 \
            --policy strict \
            --output "$RUNNER_TEMP/mqttium-network-release/result.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-network-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-network-release/*.json
            ${{ runner.temp }}/mqttium-network-release/*.md
            ${{ runner.temp }}/mqttium-network-release/*-raw/*
            ${{ runner.temp }}/mqttium-network-release/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-network-release/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
