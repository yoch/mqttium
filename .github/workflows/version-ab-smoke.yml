name: MQTTium PR433 pair-inline causal isolation

on:
  push:
    branches: [bench/version-ab-smoke]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  version-ab-smoke:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 240
    env:
      BENCH_SHA: ec332e25003a6484727697c3018ce632a025a7f2
      BASE_SHA: 7d917547b491c8e521d1d82960b1e10810e4bd80
      TARGET_RATE: "3942"

    steps:
      - name: Set run-specific path
        shell: bash
        run: |
          echo "RESULTS_DIR=$RUNNER_TEMP/mqttium-version-ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mqttium-version-ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Verify dedicated ARM runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"expected Python 3.14, got {sys.version}")
          PY
          command -v mosquitto
          command -v taskset
          gov="$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true)"
          echo "governor=$gov"
          test "$gov" = performance
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate the run" >&2
            exit 1
          fi

      - name: Checkout exact benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Checkout exact PR433 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.BASE_SHA }}
          path: old
          persist-credentials: false

      - name: Checkout exact PR433 source for isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.BASE_SHA }}
          path: new
          persist-credentials: false

      - name: Verify immutable source provenance before patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(git -C old rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C new rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C old status --porcelain)"
          test -z "$(git -C new status --porcelain)"

      - name: Build deterministic pair-inline-disabled candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("new/src/mqttium/api/_delivery.py")
          text = path.read_text()
          old = "                    self._dispatch_sync_message_pair_inline(callback, messages)\n"
          new = "                    self._enqueue_message_batch(callback, messages, iterator_delivery=False)\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one pair-inline dispatch, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          git -C new diff --check
          git -C new diff -- src/mqttium/api/_delivery.py | tee "$RESULTS_DIR/pair-inline-disabled-working.patch"
          test "$(git -C new diff --numstat -- src/mqttium/api/_delivery.py)" = $'1\t1\tsrc/mqttium/api/_delivery.py'
          test "$(git -C new diff --name-only)" = "src/mqttium/api/_delivery.py"
          grep -F -- '-                    self._dispatch_sync_message_pair_inline(callback, messages)' "$RESULTS_DIR/pair-inline-disabled-working.patch"
          grep -F -- '+                    self._enqueue_message_batch(callback, messages, iterator_delivery=False)' "$RESULTS_DIR/pair-inline-disabled-working.patch"

          git -C new config user.name "mqttium benchmark"
          git -C new config user.email "benchmark@localhost"
          export GIT_AUTHOR_DATE="2026-09-07T12:00:00+00:00"
          export GIT_COMMITTER_DATE="2026-09-07T12:00:00+00:00"
          git -C new add src/mqttium/api/_delivery.py
          git -C new commit -m "bench: disable PR433 sync pair-inline dispatch"

          candidate_sha="$(git -C new rev-parse HEAD)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "$candidate_sha" | tee "$RESULTS_DIR/candidate-sha.txt"
          test "$(git -C new rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git -C new status --porcelain)"
          test "$(git -C new diff --name-only "$BASE_SHA"..HEAD)" = "src/mqttium/api/_delivery.py"
          test "$(git -C new diff --numstat "$BASE_SHA"..HEAD)" = $'1\t1\tsrc/mqttium/api/_delivery.py'
          git -C new diff "$BASE_SHA"..HEAD -- src/mqttium/api/_delivery.py | tee "$RESULTS_DIR/pair-inline-disabled.patch"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/version-ab-venv"
          echo "$RUNNER_TEMP/version-ab-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/version-ab-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/version-ab-venv/bin/python" -m pip install -e "./harness[paho,mqttium]" "psutil>=6,<8"

      - name: Re-run focused harness tests on ARM
        shell: bash
        working-directory: harness
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest -v \
            tests.test_quality \
            tests.test_version_compare \
            tests.test_pacing \
            tests.test_rtt_initiator

      - name: Verify isolated candidate uses worker for eligible pair
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=new/src python - <<'PY'
          import asyncio
          from collections import deque

          from mqttium.api import AsyncClient
          from mqttium.protocol.effects import EffectKind, EngineEffect
          from mqttium.types import Message

          def effect(value: bytes) -> EngineEffect:
              return EngineEffect(
                  EffectKind.MESSAGE,
                  Message(topic="bench/pair", payload=value),
                  requires_delivery_mark=False,
              )

          async def main() -> None:
              client = AsyncClient(message_delivery="callback")
              seen: list[bytes] = []
              client.on_message = lambda message: seen.append(message.payload)
              applied = client._apply_message_effect_batch_inline(
                  deque([effect(b"0"), effect(b"1")]),
                  client._connection_epoch,
              )
              assert applied == 2
              assert seen == [], seen
              assert client._callback_worker_task is not None
              await client._callback_queue.join()
              assert seen == [b"0", b"1"], seen
              await client._shutdown_callback_worker(drain=False)

          asyncio.run(main())
          PY

      - name: Calibrate host identity and harness cost
        shell: bash
        working-directory: harness
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m mqtt_client_bench.run calibrate-host \
            --profile standard \
            --role runner \
            --skip-ceilings \
            --output "$RESULTS_DIR/host.json"

      - name: Start isolated native Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RESULTS_DIR/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          broker_cpuset="$(PYTHONPATH=harness/src python - <<'PY'
          from mqtt_client_bench.telemetry import allocate_cpuset
          print(allocate_cpuset(["sut", "broker", "loadgen", "orch"], profile="standard")["broker"])
          PY
          )"
          echo "broker_cpuset=$broker_cpuset"
          taskset -c "$broker_cpuset" mosquitto -c "$RESULTS_DIR/mosquitto.conf" > "$RESULTS_DIR/mosquitto.log" 2>&1 &
          pid=$!
          echo "BROKER_PID=$pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$pid" 2>/dev/null || { cat "$RESULTS_DIR/mosquitto.log"; exit 1; }
            sleep 0.2
          done
          exit 1

      - name: Twelve-block PR433 pair-inline causal probe
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=harness/src python -m mqtt_client_bench.version_compare \
            --client mqttium \
            --baseline-path old \
            --candidate-path new \
            --scenario application_rtt_fixed_rate \
            --variant-index 0 \
            --target-rate "$TARGET_RATE" \
            --pacer-mode external \
            --blocks 12 \
            --max-block-retries 1 \
            --profile standard \
            --broker 127.0.0.1:11883 \
            --broker-pid "$BROKER_PID" \
            --host-profile "$RESULTS_DIR/host.json" \
            --output "$RESULTS_DIR/pr433-vs-pair-inline-disabled-12blocks.json" \
            | tee "$RESULTS_DIR/version-ab-summary.txt"

      - name: Summarize raw slow-regime evidence
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULTS_DIR/pr433-vs-pair-inline-disabled-12blocks.json" ]; then
            PYTHONPATH=harness/src python - <<'PY'
          import json
          import math
          import os
          import statistics

          path = os.path.join(os.environ["RESULTS_DIR"], "pr433-vs-pair-inline-disabled-12blocks.json")
          data = json.load(open(path))
          selected = [run for run in data.get("runs", []) if run.get("active_for_verdict")]

          def worker(run, role):
              return next(item for item in run["workers"] if item.get("role") == role)

          def snapshot(run):
              responder = worker(run, "responder")
              initiator = worker(run, "rtt_initiator")
              rlib = responder["runtime"]["library"]
              ilib = initiator["runtime"]["library"]
              return {
                  "execution_slot": run["execution_slot"],
                  "logical_block": run["logical_block"],
                  "logical_slot": run["logical_slot"],
                  "label": run["ab_label"],
                  "p50_ms": run["comparison_value"],
                  "p95_ms": initiator["latency_summary"]["p95_ms"],
                  "p99_ms": initiator["latency_summary"]["p99_ms"],
                  "responder_effect_batches": rlib["effects"]["batches"],
                  "responder_reordered_batches": rlib["effects"]["reordered_batches"],
                  "responder_writer_batches": rlib["writer"]["batches"],
                  "responder_batched_items": rlib["writer"]["batched_items"],
                  "responder_eager_writes": rlib["writer"]["eager_writes"],
                  "responder_nvcsw": responder["runtime"]["process_end"]["ru_nvcsw"],
                  "responder_stime_s": responder["runtime"]["process_end"]["ru_stime_s"],
                  "initiator_effect_batches": ilib["effects"]["batches"],
                  "initiator_reordered_batches": ilib["effects"]["reordered_batches"],
                  "initiator_writer_batches": ilib["writer"]["batches"],
                  "initiator_batched_items": ilib["writer"]["batched_items"],
                  "initiator_eager_writes": ilib["writer"]["eager_writes"],
                  "initiator_nvcsw": initiator["runtime"]["measure_delta"]["ru_nvcsw"],
                  "initiator_stime_s": initiator["runtime"]["measure_delta"]["ru_stime_s"],
                  "pacer_lateness_p95_ns": run["pacing"]["pacer_lateness"]["p95"],
                  "pacer_catch_up_events": run["pacing"]["catch_up"]["events"],
              }

          rows = [snapshot(run) for run in selected]
          result = {
              "baseline": (data.get("baseline_source") or {}).get("git_sha"),
              "candidate": (data.get("candidate_source") or {}).get("git_sha"),
              "selected_slots": len(rows),
              "arms": {},
              "slow_slots": [],
          }
          for label in ("A", "B"):
              arm = [row for row in rows if row["label"] == label]
              p50 = [row["p50_ms"] for row in arm]
              slow = [row for row in arm if row["p50_ms"] >= 0.285]
              result["arms"][label] = {
                  "n": len(arm),
                  "slow_ge_0_285_ms": len(slow),
                  "p50_mean_ms": statistics.fmean(p50) if p50 else None,
                  "p50_median_ms": statistics.median(p50) if p50 else None,
                  "p50_min_ms": min(p50) if p50 else None,
                  "p50_max_ms": max(p50) if p50 else None,
                  "p50_values_ms": p50,
              }
              result["slow_slots"].extend(slow)
          print(json.dumps(result, indent=2, sort_keys=True))
          with open(os.path.join(os.environ["RESULTS_DIR"], "raw-slow-regime-summary.json"), "w") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
          PY
          fi

      - name: Stop native broker
        if: always()
        shell: bash
        run: |
          if [ -n "${BROKER_PID:-}" ]; then
            kill "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

      - name: Upload causal A/B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mqttium-pr433-pair-inline-causal-${{ github.run_id }}
          path: ${{ runner.temp }}/mqttium-version-ab-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
