name: PR454 production hardening qualification
on:
  push:
    branches: [work/pr454-v3-hardening]
permissions:
  contents: read
concurrency:
  group: pr454-v3-hardening
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: arm-a
          ref: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: arm-b
          ref: 2753a1e13c5da0bfc5ed4639117c8d8d3755b95b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: historical-harness
          ref: 3919ec806d78462b0ab7905f3362268fdc707b1f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply hash-verified candidate on exact PR HEAD
        run: |
          set -euo pipefail
          mkdir results
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          p = pathlib.Path
          assert subprocess.check_output(['git','-C','arm-a','rev-parse','HEAD'],text=True).strip() == '9ad1f01857306ac5079ffb1d073a59fdb60e1931'
          assert subprocess.check_output(['git','-C','arm-b','rev-parse','HEAD'],text=True).strip() == '2753a1e13c5da0bfc5ed4639117c8d8d3755b95b'
          # Correct one transport transcription before checking the canonical payload.
          encoded = p('tooling/.github/pr454-v3.b64').read_text().replace('TN1WmtrxVs','TN1WtrxVs')
          assert hashlib.sha256(encoded.encode()).hexdigest() == '41519899d13e6e21c9c665322a95ebb0201f4617696064f639e77f1029064c9c'
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '32d63f9ef5594ae474a5a2b5b59e8112216f6953b9ddcb63477370dac2613e52'
          patchfile = p(os.environ['RUNNER_TEMP'])/'candidate.patch'; patchfile.write_bytes(patch)
          subprocess.run(['git','-C','arm-b','apply','--check',str(patchfile)],check=True)
          subprocess.run(['git','-C','arm-b','apply',str(patchfile)],check=True)
          p('results/input.patch').write_bytes(patch)
          probe = p('historical-harness/tools/pr454_perf_probe.py').read_text()
          assert hashlib.sha256(probe.encode()).hexdigest() == '305373f69b25710227904b3d49b2d91b0bc125e9bbae01c901306a2d227378e5'
          probe = probe.replace("HEAD='a27a5f7942c86d24495f375ced1c72f440e6982b'", "HEAD=os.environ.get('CANDIDATE_TREE','unpublished-tree')")
          probe = probe.replace("'B':'0f55ffb86a2565af012e751e45155d36096f6dca'", "'B':os.environ['CANDIDATE_SRC_TREE']")
          assert hashlib.sha256(probe.encode()).hexdigest() == '7f132613eb3cb42d1b0b83b57e81c4dc68ddbde77ac813409f6570933164b7da'
          p('results/probe.py').write_text(probe)
          cores = {}
          for row in subprocess.check_output(['lscpu','-p=CPU,CORE,SOCKET'],text=True).splitlines():
              if row.startswith('#'): continue
              cpu,core,sock=map(int,row.split(','))
              if cpu in os.sched_getaffinity(0): cores.setdefault((sock,core),cpu)
          cpus=list(cores.values()); assert len(cpus)>=2
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'SUT_CPU={cpus[0]}\nBROKER_CPU={cpus[1]}\n')
          PY
          git -C tooling rev-parse HEAD > results/tooling-sha.txt
          uname -a > results/machine.txt
          lscpu >> results/machine.txt
          python -V >> results/machine.txt
      - name: Install validation tools
        working-directory: arm-b
        run: python -m pip install -e '.[dev,fuzz,security,docs]'
      - name: Quality and full correctness
        working-directory: arm-b
        run: |
          set -euo pipefail
          ruff format tests/unit/test_callback_route_handoff.py tests/unit/test_callback_route_lifecycle.py
          ruff format --check src tests benchmarks tools
          ruff check src tests benchmarks tools
          mypy src/mqttium
          bandit -q -ll -r src
          mkdocs build --strict
          git diff --check
          python -m pytest -q -W error tests/unit tests/project tests/resilience --cov=mqttium --cov-report=xml:../results/coverage.xml | tee ../results/tests.txt
          python -m pytest -q tests/fuzz | tee ../results/fuzz.txt
          PYTHONPATH=src python tests/fuzz/fuzz.py --seed 1 --iterations 20000 --quiet | tee ../results/seeded.txt
      - name: Save tested content-addressed candidate (no ref writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          p=pathlib.Path; files=['CHANGELOG.md','docs/reference/async-client.md','src/mqttium/api/_delivery.py','tests/unit/test_callback_route_handoff.py','tests/unit/test_callback_route_lifecycle.py']
          subprocess.run(['git','-C','arm-b','add','--',*files],check=True)
          tree=subprocess.check_output(['git','-C','arm-b','write-tree'],text=True).strip()
          src_tree=subprocess.check_output(['git','-C','arm-b','rev-parse',tree+':src/mqttium'],text=True).strip()
          manifest={'parent':'2753a1e13c5da0bfc5ed4639117c8d8d3755b95b','tree':tree,'src_tree':src_tree,'files':[]}
          for name in files:
              data=(p('arm-b')/name).read_bytes(); target=p('results/candidate')/name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/yoch/mqttium/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as res: result=json.load(res)
              assert result['sha']==sha
              manifest['files'].append({'path':name,'sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
          p('results/candidate/manifest.json').write_text(json.dumps(manifest,indent=2))
          p('results/candidate/candidate.diff').write_bytes(subprocess.check_output(['git','-C','arm-b','diff','--cached']))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'CANDIDATE_TREE={tree}\nCANDIDATE_SRC_TREE={src_tree}\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr454-v3-candidate-${{ matrix.platform }}
          path: results/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Real broker and mandatory integration
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          dpkg-query -W mosquitto > results/broker-version.txt
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\nset_tcp_nodelay true\nlog_type error\n' > results/broker.conf
          taskset -c "$BROKER_CPU" mosquitto -c "$PWD/results/broker.conf" > results/broker.log 2>&1 &
          echo $! > results/broker.pid
          python arm-b/tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:11883
          (cd arm-b && MQTTIUM_REQUIRE_BROKER=1 python -m pytest -q tests/integration) | tee results/integration.txt
      - name: Fixed A/A then A/B delivery matrix
        run: python results/probe.py campaign --base arm-a --candidate arm-b --kind micro --count 8000 --repeats 8 --cpu "$SUT_CPU" --output results/micro
      - name: Fixed A/A then A/B real QoS1 matrix
        run: python results/probe.py campaign --base arm-a --candidate arm-b --kind network --count 800 --repeats 8 --cpu "$SUT_CPU" --port 11883 --output results/network
      - name: Final identity readback and broker cleanup
        if: always()
        run: |
          if test -f results/broker.pid; then kill "$(cat results/broker.pid)" || true; fi
          git -C arm-a status --short > results/final-a.txt
          git -C arm-b diff --exit-code > results/unstaged-b.txt
          git -C arm-b write-tree > results/final-tree-b.txt
          test "$(cat results/final-tree-b.txt)" = "$CANDIDATE_TREE"
          echo 'Same neutral probe; 8 balanced pairs per phase, all completed samples retained. Practical threshold 3%, metric-specific A/A. Separate hosts. Network closed-loop, not fixed offered rate. No ref or main writes by this workflow.' > results/policy.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr454-v3-results-${{ matrix.platform }}
          path: results/
          if-no-files-found: error
          retention-days: 14
