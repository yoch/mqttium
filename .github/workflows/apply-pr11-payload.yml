name: Apply final PR 11 payload

on:
  push:
    branches:
      - fix/compat-qosn-coalesced-mid-queue
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct validated changes
        shell: bash
        run: |
          set -euo pipefail
          echo '58852a00d48cd9e2f05df25e5916d57087cb16ebbaf31bbf7e4220d267e7a2d1  .mqttium-upload/part-00' | sha256sum --check
          echo '76b69f904fd8f32419fb4cbbb527d18bc260a70c66693ff4836fba6927df3eac  .mqttium-upload/part-01' | sha256sum --check
          echo 'bd467422e780944e745df79b2dcbcf012dacf67a76894e7bb3f79018103a3d52  .mqttium-upload/part-02a' | sha256sum --check
          echo '54d1787a439aeb43d604a715f5a81065e3fbb670003cfd949085adb2e244cd11  .mqttium-upload/part-02b' | sha256sum --check
          echo '9b2653ed6b41f324df674bfdd3500ea8e162d64faffa4ce8c9afa3cb85d76f77  .mqttium-upload/part-02c' | sha256sum --check
          echo 'ce6928aaee7d2d44d15c775156e8edb03824362d28a308bc5ca6e3f0843a030d  .mqttium-upload/part-02d' | sha256sum --check
          echo '730eba78393d68d2340ee36ce5f6d2be289d837c1e8d25224d68f7a329673354  .mqttium-upload/part-03a' | sha256sum --check
          echo 'f1f2960ee7ff65830b2ccd46ae7e68ad846642adba591aad01108eeb3d65eb6e  .mqttium-upload/part-03b' | sha256sum --check
          echo 'c26d79932cbc6f9de14a1eeade2c09e33b2effabc5924b921da9cd92f9fedf50  .mqttium-upload/part-03c' | sha256sum --check
          echo '08d7c48431d4cfa9a31cc631d651f159c524fc2c42f68dc7870f0d0dd41e156c  .mqttium-upload/part-03d' | sha256sum --check
          echo '97d500610a1a0241b136de21ed26cc676068a7cb24cbc2e8a178a7a49156ef0d  .mqttium-upload/part-04' | sha256sum --check
          echo 'd7fae189aff9a06e463f6a86abcef59daae134c1701b78b6c036649c4a32fbdb  .mqttium-upload/part-05' | sha256sum --check
          echo '3c15e7ef76a41c9ea2f02b9c78e9c380ddd88f7a1a5e716e11513ce53b6bdf8e  .mqttium-upload/part-06' | sha256sum --check
          cat .mqttium-upload/part-* | base64 --decode > /tmp/mqttium-pr11-final.tar.gz
          echo '04f5635693c2ed04825d067974e5162109264a435fbe451819c64c775bd1ad8d  /tmp/mqttium-pr11-final.tar.gz' | sha256sum --check
          git fetch origin main
          git reset --hard origin/main
          tar -xzf /tmp/mqttium-pr11-final.tar.gz
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate final tree
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,security]"
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit --cov=mqttium --cov-report=term-missing --cov-fail-under=80
      - name: Publish clean rebased commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/benchmarks.yml \
            CHANGELOG.md \
            benchmarks/compat_qosn_submit_ab.py \
            docs/COMPAT.md \
            src/mqttium/compat/paho.py \
            tests/integration/test_compat_publish_perf.py \
            tests/unit/test_compat_publish_perf.py
          git commit \
            -m "Coalesce compat publish admission on the network loop" \
            -m "Unify QoS 0/1/2 cross-thread submission, bound loop-side batches, preserve atomic Paho admission, and make timeout cancellation unambiguous."
          final_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse origin/main)"
          test "${final_sha}" != "${base_sha}"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "${final_sha}" | sort)
          expected=(
            .github/workflows/benchmarks.yml
            CHANGELOG.md
            benchmarks/compat_qosn_submit_ab.py
            docs/COMPAT.md
            src/mqttium/compat/paho.py
            tests/integration/test_compat_publish_perf.py
            tests/unit/test_compat_publish_perf.py
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected[*]}"
          git push \
            --force-with-lease=refs/heads/fix/compat-qosn-coalesced-mid-queue:${GITHUB_SHA} \
            origin "+${final_sha}:refs/heads/fix/compat-qosn-coalesced-mid-queue"
