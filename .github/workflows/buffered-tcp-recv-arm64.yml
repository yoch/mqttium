name: buffered TCP recv ARM64 short segment

on:
  push:
    branches: [perf/buffered-tcp-recv]
    paths: [.github/workflows/buffered-tcp-recv-arm64.yml]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
      BASELINE_SHA: c509bcb44cd686dd53c20e25f735e2e0a5783fc8
      CANDIDATE_SHA: cbb7b26bc1655a51a19c426cf37407e2db17d81c
      TARGET_RATE: "3942"
      REQUIRED_MOSQUITTO: "2.1.2"

    steps:
      - name: Set run workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/buffered-tcp-recv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root"
          echo "RESULTS_DIR=$root" >> "$GITHUB_ENV"

      - name: Verify representative ARM environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /proc/sys/kernel/randomize_va_space)" != 0
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          command -v taskset >/dev/null
          command -v mosquitto >/dev/null
          {
            python3 --version
            echo "aslr=$(cat /proc/sys/kernel/randomize_va_space)"
            echo "personality=$(cat /proc/$$/personality)"
            echo "governor=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)"
            echo "freq=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq)"
            echo "temp=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || true)"
          } | tee "$RESULTS_DIR/environment.txt"

      - name: Checkout exact harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Checkout buffered candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Verify immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'harness=%s\nbaseline=%s\ncandidate=%s\nworker_aslr=system\nblocks=2\nmax_block_retries=0\n' \
            "$BENCH_SHA" "$BASELINE_SHA" "$CANDIDATE_SHA" | tee "$RESULTS_DIR/provenance.txt"

      - name: Build benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RESULTS_DIR/venv"
          . "$RESULTS_DIR/venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './harness[dev,mqttium]' 'psutil>=6,<8' 'pytest-asyncio>=0.24'
          python -c 'import pytest_asyncio; print(pytest_asyncio.__version__)'
          PYTHONPATH=candidate/src python -m pytest -q -o addopts='' \
            candidate/tests/unit/test_buffered_tcp_transport.py

      - name: Resolve CPU isolation
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          PYTHONPATH=harness/src python - <<'PY' | tee "$RESULTS_DIR/cpuset.json"
          import json
          from mqtt_client_bench.telemetry import allocate_cpuset, physical_cpu_groups
          print(json.dumps({
              'physical_groups': physical_cpu_groups(),
              'mapping': allocate_cpuset(['sut','broker','loadgen','orch'], profile='standard'),
          }, indent=2, sort_keys=True))
          PY

      - name: Start native Mosquitto 2.1.2
        shell: bash
        run: |
          set -euo pipefail
          broker_bin="$(command -v mosquitto)"
          { "$broker_bin" -h 2>&1 || true; } | head -n 6 > "$RESULTS_DIR/broker-version.txt"
          version="$(python3 - "$RESULTS_DIR/broker-version.txt" <<'PY'
          import re, sys
          text=open(sys.argv[1], encoding='utf-8').read()
          m=re.search(r'mosquitto version\s+([0-9]+(?:\.[0-9]+)+)', text, re.I)
          if not m: raise SystemExit('could not parse mosquitto version')
          print(m.group(1))
          PY
          )"
          test "$version" = "$REQUIRED_MOSQUITTO"
          if ss -ltn | grep -q ':11883 '; then echo 'port 11883 occupied' >&2; exit 1; fi
          cat > "$RESULTS_DIR/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          broker_cpuset="$(python3 - <<'PY'
          import json, os
          print(json.load(open(os.path.join(os.environ['RESULTS_DIR'],'cpuset.json')))['mapping']['broker'])
          PY
          )"
          taskset -c "$broker_cpuset" "$broker_bin" -c "$RESULTS_DIR/mosquitto.conf" > "$RESULTS_DIR/mosquitto.log" 2>&1 &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1

      - name: Run two-block interleaved comparison under normal ASLR
        shell: bash
        run: |
          set -euo pipefail
          . "$RESULTS_DIR/venv/bin/activate"
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system \
            --entrypoint version_compare -- \
            --client mqttium \
            --baseline-path baseline \
            --candidate-path candidate \
            --scenario application_rtt_fixed_rate \
            --variant-index 0 \
            --target-rate "$TARGET_RATE" \
            --pacer-mode external \
            --blocks 2 \
            --max-block-retries 0 \
            --profile standard \
            --broker 127.0.0.1:11883 \
            --broker-pid "$BROKER_PID" \
            --output "$RESULTS_DIR/main-vs-buffered.json" \
            | tee "$RESULTS_DIR/main-vs-buffered.txt"

      - name: Reduce fault and latency evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, os, statistics
          root=os.environ['RESULTS_DIR']; path=os.path.join(root,'main-vs-buffered.json')
          if not os.path.exists(path): raise SystemExit(0)
          data=json.load(open(path))
          rows=[]
          for r in data.get('runs',[]):
              workers={w.get('role'):w for w in (r.get('workers') or [])}
              init=workers.get('rtt_initiator') or {}
              delta=((init.get('runtime') or {}).get('measure_delta') or {})
              lat=init.get('latency_summary') or {}
              rows.append({
                  'execution_slot':r.get('execution_slot'),
                  'block':r.get('logical_block'),
                  'slot':r.get('block_slot'),
                  'arm':r.get('ab_label'),
                  'active':r.get('active_for_verdict'),
                  'temporal_ok':((r.get('temporal_quality') or {}).get('ok')),
                  'p50_ms':lat.get('p50_ms'),
                  'p95_ms':lat.get('p95_ms'),
                  'p99_ms':lat.get('p99_ms'),
                  'ru_minflt':delta.get('ru_minflt'),
                  'ru_stime_s':delta.get('ru_stime_s'),
                  'ru_nvcsw':delta.get('ru_nvcsw'),
                  'sent':init.get('sent_in_window'),
              })
          with open(os.path.join(root,'slots.csv'),'w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          out={}
          for arm in ('A','B'):
              rr=[x for x in rows if x['arm']==arm]
              out[arm]={
                  'n':len(rr),
                  'temporal_ok':sum(bool(x['temporal_ok']) for x in rr),
                  'minflt_median':statistics.median(x['ru_minflt'] for x in rr if x['ru_minflt'] is not None),
                  'minflt_max':max(x['ru_minflt'] for x in rr if x['ru_minflt'] is not None),
                  'p50_median_ms':statistics.median(x['p50_ms'] for x in rr if x['p50_ms'] is not None),
                  'p50_max_ms':max(x['p50_ms'] for x in rr if x['p50_ms'] is not None),
              }
          json.dump(out,open(os.path.join(root,'summary.json'),'w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          cat "$RESULTS_DIR/slots.csv" 2>/dev/null || true

      - name: Stop broker
        if: always()
        shell: bash
        run: |
          if [ -n "${BROKER_PID:-}" ]; then
            kill "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

      - name: Upload short ARM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buffered-tcp-recv-arm64-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14
