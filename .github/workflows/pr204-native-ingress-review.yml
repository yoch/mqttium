name: PR204 native ingress review

on:
  push:
    branches:
      - cursor/rm-slot-until-handoff-6aff

permissions:
  contents: read

jobs:
  paired-native-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: cursor/rm-slot-until-handoff-6aff
          path: candidate
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: 1925145662af7b524ad25d60c86933c6067ee7f6
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install benchmark dependencies
        run: |
          python -m pip install -q paho-mqtt
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          cat >/tmp/pr204-mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 64
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/pr204-mosquitto.conf >/tmp/pr204-mosquitto.log 2>&1 &
          for i in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          cat /tmp/pr204-mosquitto.log
          exit 1
      - name: Run rotated paired native QoS1 ingress
        run: |
          python candidate/benchmarks/_pr204_native_ingress_review.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 7 \
            --output /tmp/pr204-native-ingress.json
      - name: Show report
        if: always()
        run: cat /tmp/pr204-native-ingress.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr204-native-ingress
          path: |
            /tmp/pr204-native-ingress.json
            /tmp/pr204-mosquitto.log
          if-no-files-found: warn
          retention-days: 7
