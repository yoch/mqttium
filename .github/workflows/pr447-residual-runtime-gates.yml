name: PR447 residual runtime gates

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/pr447-residual-runtime-gates.yml

permissions:
  contents: read

concurrency:
  group: pr447-residual-runtime-gates
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 7b9f9fa6fe6f408ea734f341a35a5b6cc166acaf
  BASE_SHA: 1b52cbdf642d7b1ebe89db24ca754e949cb23322
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
  BENCHTOOLS_SHA: 3369317e64bb164b672bdc4b634952fb904bdbf4
  PAYLOAD_SIZE: "65536"
  OFFER_MSGS_S: "14000"

jobs:
  qualify:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BENCHTOOLS_SHA }}
          path: benchtools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - name: Verify exact environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != '0'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          version="$({ mosquitto -h 2>&1 || true; } | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"mosquitto version\s+([0-9]+(?:\.[0-9]+)+)",t,re.I); print(m.group(1) if m else "")')"
          test "$version" = '2.1.2'
          out="$RUNNER_TEMP/pr447-residual-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out/saturated" "$out/rtt"
          echo "FINAL_OUT=$out" >> "$GITHUB_ENV"
          cc -O3 -pthread harness/scripts/mqtt_hammer.c -o "$out/mqtt_hammer"
      - name: Start saturated broker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$FINAL_OUT/saturated/mosquitto.conf" <<'EOF'
          listener 11893 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$FINAL_OUT/saturated/mosquitto.conf" > "$FINAL_OUT/saturated/mosquitto.log" 2>&1 &
          echo "SAT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/11893) >/dev/null 2>&1 && exit 0; sleep 0.1; done
          exit 1
      - name: Run six balanced saturated pairs
        shell: bash
        run: |
          set -euo pipefail
          root="$FINAL_OUT/saturated"; : > "$root/completed.tsv"
          for block in $(seq 0 5); do
            if (( block % 2 == 0 )); then arms=(base candidate); else arms=(candidate base); fi
            pos=0
            for arm in "${arms[@]}"; do
              idx=$((block * 2 + pos)); pos=$((pos + 1))
              [ "$arm" = base ] && src="$PWD/base/src" || src="$PWD/candidate/src"
              topic="bench/pr447-residual/${GITHUB_RUN_ID}/${idx}"; ready="$root/ready-$idx"
              taskset -c 0 env PYTHONPATH="$src" python3 benchtools/tools/mqtt_saturated_finalists_probe.py \
                subscriber --arm "$arm" --host 127.0.0.1 --port 11893 --topic "$topic" \
                --payload-size "$PAYLOAD_SIZE" --warmup-s 0.5 --duration-s 1.5 \
                --broker-pid "$SAT_BROKER_PID" --ready-file "$ready" --output "$root/sub-$idx.json" \
                > "$root/sub-$idx.log" 2>&1 &
              subpid=$!
              for _ in $(seq 1 100); do [ -f "$ready" ] && break; kill -0 "$subpid" 2>/dev/null || { cat "$root/sub-$idx.log"; exit 1; }; sleep 0.05; done
              test -f "$ready"
              taskset -c 2 "$FINAL_OUT/mqtt_hammer" pub --host 127.0.0.1 --port 11893 \
                --topic "$topic" --clients 2 --payload "$PAYLOAD_SIZE" --duration 3 --rate "$OFFER_MSGS_S" \
                > "$root/pub-$idx.json" 2> "$root/pub-$idx.log" &
              pubpid=$!; wait "$subpid"; wait "$pubpid"
              printf '%s\t%s\t%s\n' "$idx" "$block" "$arm" >> "$root/completed.tsv"
              sleep 0.1
            done
          done
      - name: Qualify saturated physical bottleneck
        shell: bash
        run: |
          set -euo pipefail
          FINAL_OUT="$FINAL_OUT" python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path
          root=Path(os.environ['FINAL_OUT'])/'saturated'; payload=float(os.environ['PAYLOAD_SIZE'])
          rows=[]
          for line in (root/'completed.tsv').read_text().splitlines():
              idx_s,block_s,arm=line.split('\t'); idx=int(idx_s); block=int(block_s)
              r=json.loads((root/f'sub-{idx}.json').read_text()); p=json.loads((root/f'pub-{idx}.json').read_text())
              offer_msgs=float(p['msgs_per_s']); offer_mib=offer_msgs*payload/(1024*1024); mib=r['payload_bytes']/(1024*1024)
              r.update(idx=idx,block=block,arm=arm,offer_msgs_s=offer_msgs,offer_mib_s=offer_mib)
              r['publisher_margin']=offer_mib/r['payload_mib_s']; r['cpu_per_mib']=r['ru_cpu_s']/mib; r['stime_per_mib']=r['ru_stime_s']/mib
              r['qualified']=(r['publisher_margin']>=1.02 and r['sut_cpu_pct']>=90.0 and (r['broker_cpu_pct'] or 0.0)<90.0 and r['ru_majflt']==0 and (r['broker_majflt'] or 0)==0)
              rows.append(r)
          def gm(xs): return math.exp(statistics.mean(math.log(x) for x in xs))
          pairs=[]
          for block in range(6):
              rs={r['arm']:r for r in rows if r['block']==block}; b,c=rs['base'],rs['candidate']
              pairs.append({'block':block,'qualified':b['qualified'] and c['qualified'],'throughput_ratio':c['payload_mib_s']/b['payload_mib_s'],'cpu_per_mib_ratio':c['cpu_per_mib']/b['cpu_per_mib'],'stime_per_mib_ratio':c['stime_per_mib']/b['stime_per_mib']})
          summary={'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['CANDIDATE_SHA'],'bench_sha':os.environ['BENCH_SHA'],'gate':'publisher_margin>=1.02; sut_cpu>=90%; broker_cpu<90%; zero major faults','all_cells_qualified':all(r['qualified'] for r in rows),'throughput_geomean_ratio':gm([p['throughput_ratio'] for p in pairs]),'cpu_per_mib_geomean_ratio':gm([p['cpu_per_mib_ratio'] for p in pairs]),'stime_per_mib_geomean_ratio':gm([p['stime_per_mib_ratio'] for p in pairs]),'pairs':pairs,'cells':rows}
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n'); print(json.dumps(summary,indent=2,sort_keys=True)); assert summary['all_cells_qualified']
          PY
      - name: Stop saturated broker
        if: always()
        shell: bash
        run: |
          [ -n "${SAT_BROKER_PID:-}" ] && kill "$SAT_BROKER_PID" 2>/dev/null || true
      - name: Prepare RTT broker and environment
        shell: bash
        run: |
          set -euo pipefail
          out="$FINAL_OUT/rtt"; python3 -m venv "$out/venv"; . "$out/venv/bin/activate"
          python -m pip install --upgrade pip >/dev/null; python -m pip install -e './harness[dev,mqttium]' 'psutil>=6,<8' >/dev/null
          cat > "$out/mosquitto.conf" <<'EOF'
          listener 11894 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "RTT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/11894) >/dev/null 2>&1 && exit 0; sleep 0.1; done
          exit 1
      - name: Run exact-runtime four-block RTT gate
        shell: bash
        run: |
          set -euo pipefail
          . "$FINAL_OUT/rtt/venv/bin/activate"
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path base --candidate-path candidate \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 4 --max-block-retries 1 --profile standard \
            --broker 127.0.0.1:11894 --broker-pid "$RTT_BROKER_PID" \
            --output "$FINAL_OUT/rtt/base-vs-candidate.json" | tee "$FINAL_OUT/rtt/base-vs-candidate.txt"
      - name: Stop RTT broker
        if: always()
        shell: bash
        run: |
          [ -n "${RTT_BROKER_PID:-}" ] && kill "$RTT_BROKER_PID" 2>/dev/null || true
      - name: Upload residual gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr447-residual-runtime-gates-${{ github.run_id }}
          path: ${{ env.FINAL_OUT }}
          if-no-files-found: error
          retention-days: 30
