name: Temporary decoded-message kind microbenchmark
on:
  push:
    branches: [agent/f45-sized-effect-eval]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f45-sized-effect-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and benchmark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mqttium/protocol/effects.py'); s=p.read_text()
          s=s.replace('    MESSAGE = auto()\n    CONNACK = auto()\n','    MESSAGE = auto()\n    DECODED_MESSAGE = auto()\n    CONNACK = auto()\n',1); p.write_text(s)
          p=Path('src/mqttium/api/async_client.py'); s=p.read_text()
          old='''        elif kind is EffectKind.MESSAGE:\n            message: Message = effect.data\n            property_wire_size = effect.decoded_property_wire_size\n            if property_wire_size is None:\n                pending_delivery = self._accept_message(message, self.on_message)\n            else:\n                pending_delivery = self._accept_decoded_message(\n                    message, self.on_message, property_wire_size\n                )\n            if pending_delivery is not None:\n                await pending_delivery\n            if effect.requires_delivery_mark is not False and message.mid is not None:\n                async with self._engine_lock:\n                    self._engine.mark_inbound_delivered(message.mid)\n'''
          new='''        elif kind is EffectKind.MESSAGE:\n            message: Message = effect.data\n            pending_delivery = self._accept_message(message, self.on_message)\n            if pending_delivery is not None:\n                await pending_delivery\n            if effect.requires_delivery_mark is not False and message.mid is not None:\n                async with self._engine_lock:\n                    self._engine.mark_inbound_delivered(message.mid)\n        elif kind is EffectKind.DECODED_MESSAGE:\n            message = effect.data\n            property_wire_size = effect.decoded_property_wire_size\n            assert property_wire_size is not None\n            pending_delivery = self._accept_decoded_message(\n                message, self.on_message, property_wire_size\n            )\n            if pending_delivery is not None:\n                await pending_delivery\n            if effect.requires_delivery_mark is not False and message.mid is not None:\n                async with self._engine_lock:\n                    self._engine.mark_inbound_delivered(message.mid)\n'''
          if s.count(old)!=1: raise SystemExit('MESSAGE block mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          python -m pip install -e ".[dev]" >/dev/null
          ruff format src/mqttium/protocol/effects.py src/mqttium/api/async_client.py
          ruff check src/mqttium/protocol/effects.py src/mqttium/api/async_client.py
          mypy src/mqttium >/dev/null
          git worktree add /tmp/main 4962b8b92e7c1a24658ddb1898cdeb205854c58e >/dev/null
          cat >/tmp/bench.py <<'PY'
          import asyncio,statistics,time
          from mqttium.api.async_client import AsyncClient
          from mqttium.codec.properties import PUBLISH,encode_properties
          from mqttium.enums import MQTTProtocolVersion
          from mqttium.protocol.effects import EffectKind,EngineEffect
          from mqttium.types import Message,Properties
          N=50000; W=5000; T=11
          def iot():
              p=Properties(); p.set('content_type','application/octet-stream'); p.set('payload_format_indicator',1); p.set('message_expiry_interval',60); p.add_user_property('device','probe'); p.add_user_property('site','lab'); return p
          async def case(name,props,decoded=False,proto=MQTTProtocolVersion.MQTTv5):
              m=Message(topic='sensors/t',payload=b'hello',properties=props); kw={}; kind=EffectKind.MESSAGE
              if decoded and hasattr(EffectKind,'DECODED_MESSAGE'):
                  kind=EffectKind.DECODED_MESSAGE; kw['decoded_property_wire_size']=len(encode_properties(props,PUBLISH))
              e=EngineEffect(kind,m,requires_delivery_mark=False,**kw); c=AsyncClient(message_delivery='iterator',protocol=proto,client_id='b')
              async def one():
                  await c._apply_effect(e,nowait=False); x=c._messages.get_nowait()
                  if isinstance(x,tuple): c._delivery.release_nowait(x[1])
              for _ in range(W): await one()
              xs=[]
              for _ in range(T):
                  t=time.perf_counter_ns()
                  for _ in range(N): await one()
                  xs.append((time.perf_counter_ns()-t)/N/1000)
              print(name,round(statistics.median(xs),4),[round(x,4) for x in xs])
          async def main():
              await case('v5-none',None); await case('v311-none',None,proto=MQTTProtocolVersion.MQTTv311)
              await case('app-props',iot()); await case('decoded-props',iot(),True)
          asyncio.run(main())
          PY
          echo MAIN; PYTHONPATH=/tmp/main/src python /tmp/bench.py
          echo KIND; PYTHONPATH=$GITHUB_WORKSPACE/src python /tmp/bench.py
