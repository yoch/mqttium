name: Optimize Paho admission boundary

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: bccbf9fcd449329a96bf0b92786a481ab487995e
          path: base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply specialized boundary
        run: |
          cp candidate/.github/compat_boundary_ab.py /tmp/compat_boundary_ab.py
          cd candidate
          python .github/optimize_paho_boundary.py
      - name: Validate source and tests
        working-directory: candidate
        run: |
          python -m pip install -e '.[dev]'
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src
          PYTHONPATH=. pytest -q tests/unit
      - name: Run deterministic Paho boundary A/B
        run: |
          python /tmp/compat_boundary_ab.py \
            --base-root base \
            --candidate-root candidate \
            --repeat 21 \
            --cpu 0 \
            --output /tmp/compat-boundary-optimized.json
      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: compat-boundary-optimized-${{ github.run_id }}
          path: /tmp/compat-boundary-optimized.json
          retention-days: 30
      - name: Commit clean optimized branch
        working-directory: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Specialize the hot Paho publish boundary"
          git push origin HEAD:agent/paho-native-publish-boundary
