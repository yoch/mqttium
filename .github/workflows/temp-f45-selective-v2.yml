name: Temporary Finding 4/5 selective runner v2

on:
  push:
    branches:
      - agent/small-delivery-decoded-properties

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-delivery-decoded-properties
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply selective design and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temp-f45-selective.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')

          # The v1 runner restores these two files from main before its Python
          # transform. Reproduce that prerequisite here, then execute only its
          # transformation script.
          import subprocess
          main = '4962b8b92e7c1a24658ddb1898cdeb205854c58e'
          for path in ('src/mqttium/api/_delivery.py', 'src/mqttium/api/async_client.py'):
              content = subprocess.check_output(['git', 'show', f'{main}:{path}'])
              Path(path).write_bytes(content)

          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end]
          )
          exec(compile(script, 'f45-selective-transform', 'exec'), {})

          # Keep accept() under the project's complexity limit without a noqa.
          # Generic fast acceptors are still byte-for-byte main; this helper is
          # reached only by the async fallback path.
          p = Path('src/mqttium/api/_delivery.py')
          text = p.read_text()
          anchor = '''def _fits_small_limit(message: Message, limit: int | None, property_wire_size: int) -> bool:\n    if limit is None:\n        return True\n    return (\n        limit > 0\n        and len(message.payload) + 4 * len(message.topic) + property_wire_size <= limit\n    )\n\n\nclass ApplicationDelivery:\n'''
          replacement = '''def _fits_small_limit(message: Message, limit: int | None, property_wire_size: int) -> bool:\n    if limit is None:\n        return True\n    return (\n        limit > 0\n        and len(message.payload) + 4 * len(message.topic) + property_wire_size <= limit\n    )\n\n\ndef _is_small_delivery(\n    message: Message,\n    references: int,\n    limit: int | None,\n    decoded_property_wire_size: int | None,\n) -> bool:\n    if not references:\n        return False\n    if decoded_property_wire_size is not None:\n        return _fits_small_limit(message, limit, decoded_property_wire_size)\n    return limit is None or (\n        limit > 0\n        and not message.properties\n        and len(message.payload) + 4 * len(message.topic) <= limit\n    )\n\n\nclass ApplicationDelivery:\n'''
          if text.count(anchor) != 1:
              raise SystemExit('delivery helper anchor mismatch')
          text = text.replace(anchor, replacement, 1)
          old = '''        small_limit = self.small_message_limit\n        if decoded_property_wire_size is None:\n            small_delivery = references and (\n                small_limit is None\n                or (\n                    small_limit > 0\n                    and not message.properties\n                    and len(message.payload) + 4 * len(message.topic) <= small_limit\n                )\n            )\n        else:\n            small_delivery = references and _fits_small_limit(\n                message, small_limit, decoded_property_wire_size\n            )\n'''
          new = '''        small_delivery = _is_small_delivery(\n            message,\n            references,\n            self.small_message_limit,\n            decoded_property_wire_size,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('accept small-delivery block mismatch')
          p.write_text(text.replace(old, new, 1))
          PY

          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          ruff check src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          mypy src/mqttium
          python -m pytest -q tests/unit/test_small_delivery_properties.py tests/unit/test_delivery_byte_budget.py tests/unit/test_batched_message_effects.py tests/unit/test_inbound_byte_budget.py tests/unit/test_inbound_replay_streaming.py
          python -m pytest -q tests/unit

          git rm .github/workflows/temp-f45-selective.yml .github/workflows/temp-f45-selective-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Scope decoded property sizing to fresh effects"
          git push origin HEAD:agent/small-delivery-decoded-properties
