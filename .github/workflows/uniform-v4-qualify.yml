name: Uniform worker v4 generation qualification
on:
  push:
    branches: [work/uniform-v4-stage]
    paths: [.github/uniform-v4.patch, .github/uniform-v4-doc.patch, .github/workflows/uniform-v4-qualify.yml]
permissions:
  contents: write
concurrency:
  group: mqttium-uniform-v4-stage
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'yoch/mqttium'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 587a17a7399796342481314847b43310c77fefe1
      PRODUCT_BRANCH: experiment/uniform-message-worker
    steps:
      - name: Isolated root
        run: echo "JOB_ROOT=$RUNNER_TEMP/uniform-v4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Freeze current product ref and reconstruct exact v2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$BASE_SHA"
          git worktree add --detach "$JOB_ROOT/candidate" "$BASE_SHA"
          cd "$JOB_ROOT/candidate"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Demonstrate the stale iterator byte waiter on v2
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT/candidate"
          PYTHONPATH=src python - <<'PY' | tee "$JOB_ROOT/red-before.txt"
          import asyncio
          from mqttium.api import AsyncClient
          from mqttium.types import Message

          async def main():
              client = AsyncClient(
                  message_delivery='iterator',
                  max_pending_messages=1,
                  max_pending_delivery_bytes=8192,
              )
              d = client._delivery
              first = Message(topic='x', payload=b'a' * 5000)
              stale_message = Message(topic='x', payload=b'b' * 5000)
              await d.accept(first, None)
              assert d.pending_bytes == 5001
              stale = asyncio.create_task(d.accept(stale_message, None))
              for _ in range(5):
                  await asyncio.sleep(0)
              assert d.waiters == 1 and not stale.done()
              old_generation = d._delivery_generation
              await client._reset_message_stream()
              assert d._delivery_generation == old_generation + 1
              # This is the defect: iterator-only reserve_slow in v2 has no
              # generation guard, so the retired producer is admitted after reset.
              await asyncio.wait_for(stale, 1)
              assert d.messages_queue.qsize() == 1
              message = await asyncio.wait_for(anext(client.messages()), 1)
              assert message is stale_message
              assert d.pending_bytes == 0
              print('REPRODUCED: retired byte waiter crossed into the replacement delivery generation')

          asyncio.run(main())
          PY
      - name: Apply v4 source, tests and changelog cleanup
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT/candidate"
          git apply --check "$GITHUB_WORKSPACE/.github/uniform-v4.patch"
          git apply "$GITHUB_WORKSPACE/.github/uniform-v4.patch"
          git apply --check "$GITHUB_WORKSPACE/.github/uniform-v4-doc.patch"
          git apply "$GITHUB_WORKSPACE/.github/uniform-v4-doc.patch"
          test "$(git diff --name-only | sort)" = $'CHANGELOG.md\nsrc/mqttium/api/_delivery.py\ntests/unit/test_uniform_callbacks.py'
          ruff format src/mqttium/api/_delivery.py tests/unit/test_uniform_callbacks.py
          git diff --check
      - name: Install complete qualification dependencies
        run: python -m pip install -e "$JOB_ROOT/candidate[dev,fuzz,security,docs]"
      - name: Focused red-to-green and lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT/candidate"
          ruff format --check src/mqttium/api/_delivery.py tests/unit/test_uniform_callbacks.py
          ruff check src/mqttium/api/_delivery.py tests/unit/test_uniform_callbacks.py
          python -m pytest -q \
            tests/unit/test_uniform_callbacks.py \
            tests/unit/test_sync_callback_contract.py \
            tests/unit/test_topic_callback_dispatch_contract.py \
            tests/unit/test_topic_callbacks.py \
            tests/unit/test_callback_message_batches.py \
            tests/unit/test_effect_pump.py \
            tests/unit/test_direct_qos0_capture.py \
            tests/unit/test_delivery_reconnect_races.py \
            -W error
      - name: Full hosted correctness qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT/candidate"
          ruff format --check src tests benchmarks tools
          ruff check src tests benchmarks tools
          mypy src/mqttium
          bandit -q -ll -r src
          mkdocs build --strict
          python -m pytest -q tests/unit tests/project tests/resilience -W error --cov=mqttium
          python -m pytest -q tests/fuzz -W error
          python tests/fuzz/fuzz.py --seed 1 --iterations 20000
      - name: Commit exact tested tree and advance product branch conditionally
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$JOB_ROOT/candidate"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$BASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md src/mqttium/api/_delivery.py tests/unit/test_uniform_callbacks.py
          git commit -m 'fix: reject retired iterator admissions on delivery reset' -m 'Use one controller-owned delivery generation and one shared capacity event for iterator bytes, iterator slots and callback slots. Keep iterator queue/event identity stable across explicit takeover, wake every blocked producer and reject stale generations before they can enqueue. Remove the separate callback-space event. Add red-before/green-after queue and byte-waiter regressions. No public option, new queue or task.'
          tested=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          src=$(git rev-parse 'HEAD:src')
          printf '{"base":"%s","tested":"%s","tree":"%s","src_tree":"%s","run":"%s"}\n' "$BASE_SHA" "$tested" "$tree" "$src" "$GITHUB_RUN_ID" | tee "$JOB_ROOT/provenance.json"
          git push "https://x-access-token:${GH_TOKEN}@github.com/yoch/mqttium.git" HEAD:"refs/heads/$PRODUCT_BRANCH"
      - name: Retain proof and exact staging patches
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uniform-v4-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/red-before.txt
            ${{ env.JOB_ROOT }}/provenance.json
            .github/uniform-v4.patch
            .github/uniform-v4-doc.patch
          retention-days: 30
          if-no-files-found: warn
      - name: Clean isolated worktree
        if: always()
        run: git worktree remove --force "$JOB_ROOT/candidate" || true
