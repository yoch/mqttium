name: Bootstrap strict sync burst2 contract

on:
  push:
    branches:
      - perf/strict-sync-inline-burst2
    paths:
      - .github/scripts/bootstrap_strict_sync_burst2_contract.py
      - .github/workflows/bootstrap-strict-sync-burst2-contract.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/strict-sync-inline-burst2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,docs]'

      - name: Apply contract pass
        run: python .github/scripts/bootstrap_strict_sync_burst2_contract.py

      - name: Validate contract pass
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests/unit/test_strict_sync_inline_burst.py
          ruff format --check tests/unit/test_strict_sync_inline_burst.py tests/project/test_public_api_surface.py
          ruff check tests/unit/test_strict_sync_inline_burst.py tests/project/test_public_api_surface.py
          python -m pytest -q -W error \
            tests/unit/test_strict_sync_inline_burst.py \
            tests/unit/test_callback_message_batches.py \
            tests/unit/test_topic_callback_dispatch_contract.py \
            tests/project/test_public_api_surface.py
          mkdocs build --strict
          git diff --check
          git diff --exit-code HEAD -- src/mqttium/api/_delivery.py src/mqttium/api/async_client.py

      - name: Commit validated contract pass
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/bootstrap_strict_sync_burst2_contract.py
          rm .github/workflows/bootstrap-strict-sync-burst2-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: define strict sync callback burst contract'
          git push origin HEAD:perf/strict-sync-inline-burst2
