name: Publish minimal QoS0 batch PR

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - .github/scripts/build_minimal_qos0_batch_pr.py
      - .github/workflows/publish-minimal-qos0-batch.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out study harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Check out validated QoS1 stack
        uses: actions/checkout@v7
        with:
          ref: agent/v311-qos1-direct-message-decode
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build minimal candidate
        run: python harness/.github/scripts/build_minimal_qos0_batch_pr.py candidate
      - name: Validate exact tree
        working-directory: candidate
        run: |
          python -m pip install -e ".[dev,security,fuzz]"
          ruff format \
            src/mqttium/api/_effects.py \
            src/mqttium/api/async_client.py \
            tests/unit/test_batched_message_effects.py
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
          PYTHONPATH=src python -m pytest -q tests/fuzz/test_hypothesis_fuzz.py
          git diff --check
      - name: Publish one-commit temporary branch
        working-directory: candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            src/mqttium/api/_effects.py \
            src/mqttium/api/async_client.py \
            tests/unit/test_batched_message_effects.py \
            docs/QOS0-MESSAGE-BATCH-DELIVERY.md
          git commit -m "Batch small QoS 0 message delivery"
          git push --force origin HEAD:agent/qos0-batch-minimal-export
