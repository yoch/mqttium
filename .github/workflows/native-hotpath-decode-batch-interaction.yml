name: Native hotpath decode-batch interaction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-hotpath-architecture-study
    paths:
      - .github/workflows/native-hotpath-decode-batch-interaction.yml

permissions:
  contents: read

jobs:
  interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out study harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Check out decode base
        uses: actions/checkout@v7
        with:
          ref: main
          path: base
      - name: Check out decode plus batch candidate
        uses: actions/checkout@v7
        with:
          ref: main
          path: candidate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install shared dependencies and broker
        run: |
          python -m pip install gmqtt==0.7.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
      - name: Apply candidates
        run: |
          python harness/.github/scripts/apply_qos0_v311_decode_candidate.py base
          python harness/.github/scripts/apply_qos0_v311_decode_candidate.py candidate
          python harness/.github/scripts/apply_qos0_effect_batch_candidate.py candidate
          git -C base diff --check
          git -C candidate diff --check
      - name: Validate effect-batch candidate
        working-directory: candidate
        run: |
          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/protocol/inbound.py src/mqttium/api/_effects.py src/mqttium/api/async_client.py
          ruff check src/mqttium/protocol/inbound.py src/mqttium/api/_effects.py src/mqttium/api/async_client.py
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q \
            tests/unit/test_effect_pump.py \
            tests/unit/test_delivery_byte_backpressure.py \
            tests/unit/test_message_delivery_both.py \
            tests/unit/test_callback_isolation.py
      - name: Start isolated Mosquitto
        run: |
          mkdir -p /tmp/mqttium-decode-batch
          cat > /tmp/mqttium-decode-batch/mosquitto.conf <<'MOSQ'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 1000000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          MOSQ
          mosquitto -c /tmp/mqttium-decode-batch/mosquitto.conf \
            > /tmp/mqttium-decode-batch/mosquitto.log 2>&1 &
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Recover corrected native harness
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          workflow = Path('harness/.github/workflows/native-hotpath-study.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "cat > /tmp/native-hotpath.b64" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "B64")
          payload = "".join(line.strip() for line in workflow[start:end])
          source = gzip.decompress(base64.b64decode(payload)).decode()
          source = source.replace("max_pending_callbacks=max(65_536, count),", "max_pending_callbacks=8_192,")
          source = source.replace("max_pending_callbacks=65_536,", "max_pending_callbacks=8_192,")
          Path('/tmp/native_hotpath_matrix.py').write_text(source)
          PY
      - name: Rotated decode versus decode plus batch A/B
        run: |
          python harness/benchmarks/experimental/paired_qos0_decode_candidate.py \
            --base-root base \
            --candidate-root candidate \
            --harness /tmp/native_hotpath_matrix.py \
            --cycles 7 \
            --messages 180000 \
            --output /tmp/mqttium-decode-batch/interaction.json
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-hotpath-decode-batch-${{ github.run_id }}
          path: |
            /tmp/mqttium-decode-batch/interaction.json
            /tmp/mqttium-decode-batch/mosquitto.log
          if-no-files-found: warn
          retention-days: 30
