name: Apply QoS0 Topic Name byte handoff

on:
  push:
    branches:
      - perf/qos0-topic-bytes-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/qos0-topic-bytes-handoff
      - name: Apply validated patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/qos0-topic-bytes.patch
          git apply tools/qos0-topic-bytes.patch
          rm tools/qos0-topic-bytes.patch .github/workflows/apply-qos0-topic-bytes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reuse validated QoS0 Topic Name bytes'
          git push origin HEAD:perf/qos0-topic-bytes-handoff
