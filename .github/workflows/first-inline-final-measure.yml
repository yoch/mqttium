name: Retire unstarted first-inline counter recovery
on:
  push:
    branches: [bench/first-inline-final-b0440f5a]
    paths: [.github/workflows/first-inline-final-measure.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    if: github.repository == 'yoch/mqttium' && github.ref == 'refs/heads/bench/first-inline-final-b0440f5a'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only our identified optional counter run if it has not started
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          url='https://api.github.com/repos/yoch/mqttium/actions/runs/34456892905'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              run=json.load(r)
          assert run['head_sha']=='3e21dff89d8d64454f62a9b041e7754abfcce036'
          assert run['head_branch']=='bench/first-inline-final-b0440f5a'
          print(json.dumps({k:run[k] for k in ['id','head_sha','status','conclusion']}))
          if run['status'] in ['pending','queued','waiting','requested']:
              request=urllib.request.Request(url+'/cancel',data=b'',headers=headers,method='POST')
              with urllib.request.urlopen(request,timeout=30) as r:
                  print('Cancellation requested:',r.status)
          elif run['status']=='completed':
              print('Already complete; no action.')
          else:
              raise SystemExit('Counter run has started; left untouched.')
