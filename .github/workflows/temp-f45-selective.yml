name: Temporary Finding 4/5 selective runner

on:
  push:
    branches:
      - agent/small-delivery-decoded-properties

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-delivery-decoded-properties
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build selective decoded-size handoff
        shell: bash
        run: |
          git show 4962b8b92e7c1a24658ddb1898cdeb205854c58e:src/mqttium/api/_delivery.py > src/mqttium/api/_delivery.py
          git show 4962b8b92e7c1a24658ddb1898cdeb205854c58e:src/mqttium/api/async_client.py > src/mqttium/api/async_client.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Delivery: keep the generic acceptors byte-for-byte identical and add
          # a separate mode-specialized path used only when decode supplied a
          # trustworthy property-table length for this fresh effect.
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''MessageAcceptor = Callable[[Message, Callable[[Message], Any] | None], Awaitable[None] | None]\n''',
              '''MessageAcceptor = Callable[[Message, Callable[[Message], Any] | None], Awaitable[None] | None]\nDecodedMessageAcceptor = Callable[\n    [Message, Callable[[Message], Any] | None, int], Awaitable[None] | None\n]\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''    return small_budget, small_limit, accounted_limit\n\n\nclass ApplicationDelivery:\n''',
              '''    return small_budget, small_limit, accounted_limit\n\n\ndef _fits_small_limit(message: Message, limit: int | None, property_wire_size: int) -> bool:\n    if limit is None:\n        return True\n    return (\n        limit > 0\n        and len(message.payload) + 4 * len(message.topic) + property_wire_size <= limit\n    )\n\n\nclass ApplicationDelivery:\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''        return {\n            "auto": self._accept_auto_fast,\n            "iterator": self._accept_iterator_fast,\n            "callback": self._accept_callback_fast,\n            "both": self._accept_both_fast,\n        }[self.mode]\n\n    def _accept_iterator_unaccounted(\n''',
              '''        return {\n            "auto": self._accept_auto_fast,\n            "iterator": self._accept_iterator_fast,\n            "callback": self._accept_callback_fast,\n            "both": self._accept_both_fast,\n        }[self.mode]\n\n    def decoded_acceptor(self) -> DecodedMessageAcceptor:\n        """Return the mode-specialized admission path for a fresh decoded table."""\n        return {\n            "auto": self._accept_auto_decoded,\n            "iterator": self._accept_iterator_decoded,\n            "callback": self._accept_callback_decoded,\n            "both": self._accept_both_decoded,\n        }[self.mode]\n\n    def _accept_iterator_unaccounted(\n''',
          )
          marker = '''    def _accept_auto_fast(\n        self, message: Message, callback: Callable[[Message], Any] | None\n    ) -> Awaitable[None] | None:\n'''
          decoded_methods = '''    def _accept_iterator_decoded(\n        self,\n        message: Message,\n        _callback: Callable[[Message], Any] | None,\n        property_wire_size: int,\n    ) -> Awaitable[None] | None:\n        if (\n            not _fits_small_limit(message, self.small_message_limit, property_wire_size)\n            or self.messages_queue.full()\n        ):\n            return self.accept(\n                message, None, decoded_property_wire_size=property_wire_size\n            )\n        self.messages_queue.put_nowait(message)\n        self.message_ready.set()\n        return None\n\n    def _accept_callback_decoded(\n        self,\n        message: Message,\n        callback: Callable[[Message], Any] | None,\n        property_wire_size: int,\n    ) -> Awaitable[None] | None:\n        if callback is None:\n            return None\n        if (\n            not _fits_small_limit(message, self.small_message_limit, property_wire_size)\n            or self.callback_queue.full()\n        ):\n            return self.accept(\n                message, callback, decoded_property_wire_size=property_wire_size\n            )\n        self.ensure_callback_worker()\n        self.callback_queue.put_nowait((callback, (message,), None))\n        return None\n\n    def _accept_both_decoded(\n        self,\n        message: Message,\n        callback: Callable[[Message], Any] | None,\n        property_wire_size: int,\n    ) -> Awaitable[None] | None:\n        if callback is None:\n            return self.accept(\n                message, callback, decoded_property_wire_size=property_wire_size\n            )\n        if (\n            not _fits_small_limit(message, self.small_message_limit, property_wire_size)\n            or self.messages_queue.full()\n            or self.callback_queue.full()\n        ):\n            return self.accept(\n                message, callback, decoded_property_wire_size=property_wire_size\n            )\n        self.messages_queue.put_nowait(message)\n        self.message_ready.set()\n        self.ensure_callback_worker()\n        self.callback_queue.put_nowait((callback, (message,), None))\n        return None\n\n    def _accept_auto_decoded(\n        self,\n        message: Message,\n        callback: Callable[[Message], Any] | None,\n        property_wire_size: int,\n    ) -> Awaitable[None] | None:\n        if callback is None:\n            return self._accept_iterator_decoded(message, None, property_wire_size)\n        return self._accept_callback_decoded(message, callback, property_wire_size)\n\n'''
          replace_once("src/mqttium/api/_delivery.py", marker, decoded_methods + marker)
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''    async def accept(\n        self,\n        message: Message,\n        callback: Callable[[Message], Any] | None,\n    ) -> None:\n''',
              '''    async def accept(\n        self,\n        message: Message,\n        callback: Callable[[Message], Any] | None,\n        *,\n        decoded_property_wire_size: int | None = None,\n    ) -> None:\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''        small_limit = self.small_message_limit\n        small_delivery = references and (\n            small_limit is None\n            or (\n                small_limit > 0\n                and not message.properties\n                and len(message.payload) + 4 * len(message.topic) <= small_limit\n            )\n        )\n''',
              '''        small_limit = self.small_message_limit\n        if decoded_property_wire_size is None:\n            small_delivery = references and (\n                small_limit is None\n                or (\n                    small_limit > 0\n                    and not message.properties\n                    and len(message.payload) + 4 * len(message.topic) <= small_limit\n                )\n            )\n        else:\n            small_delivery = references and _fits_small_limit(\n                message, small_limit, decoded_property_wire_size\n            )\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''            logical_bytes = self._reservable_size(message)\n''',
              '''            logical_bytes = self._reservable_size(\n                message, decoded_property_wire_size=decoded_property_wire_size\n            )\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''    def _is_small(self, message: Message, references: int) -> bool:\n        limit = self.small_message_limit\n        return bool(\n            references\n            and (\n                limit is None\n                or (\n                    limit > 0\n                    and not message.properties\n                    and len(message.payload) + 4 * len(message.topic) <= limit\n                )\n            )\n        )\n\n    def deliver_batch_inline(\n''',
              '''    def _is_small(self, message: Message, references: int) -> bool:\n        limit = self.small_message_limit\n        return bool(\n            references\n            and (\n                limit is None\n                or (\n                    limit > 0\n                    and not message.properties\n                    and len(message.payload) + 4 * len(message.topic) <= limit\n                )\n            )\n        )\n\n    def _is_small_decoded(\n        self, message: Message, references: int, property_wire_size: int\n    ) -> bool:\n        return bool(\n            references\n            and _fits_small_limit(message, self.small_message_limit, property_wire_size)\n        )\n\n    def deliver_batch_inline(\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''            message: Message = effect.data\n            if effect.requires_delivery_mark is not False or not self._is_small(message, 1):\n                break\n''',
              '''            message: Message = effect.data\n            if effect.requires_delivery_mark is not False:\n                break\n            property_wire_size = effect.decoded_property_wire_size\n            if property_wire_size is None:\n                if not self._is_small(message, 1):\n                    break\n            elif not self._is_small_decoded(message, 1, property_wire_size):\n                break\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''    def logical_size(self, message: Message) -> int:\n        property_bytes = 0\n        if self.protocol == MQTTProtocolVersion.MQTTv5 and message.properties:\n            property_bytes = len(encode_properties(message.properties, PUBLISH))\n''',
              '''    def logical_size(\n        self, message: Message, *, decoded_property_wire_size: int | None = None\n    ) -> int:\n        property_bytes = 0\n        if self.protocol == MQTTProtocolVersion.MQTTv5 and message.properties:\n            if decoded_property_wire_size is None:\n                property_bytes = len(encode_properties(message.properties, PUBLISH))\n            else:\n                property_bytes = decoded_property_wire_size\n''',
          )
          replace_once(
              "src/mqttium/api/_delivery.py",
              '''    def _reservable_size(self, message: Message) -> int:\n        logical_bytes = self.logical_size(message)\n''',
              '''    def _reservable_size(\n        self, message: Message, *, decoded_property_wire_size: int | None = None\n    ) -> int:\n        logical_bytes = self.logical_size(\n            message, decoded_property_wire_size=decoded_property_wire_size\n        )\n''',
          )

          # Async runtime selects the historical acceptor whenever no fresh
          # decoded property length is attached to the effect.
          replace_once(
              "src/mqttium/api/async_client.py",
              '''        self._accept_message = self._delivery.acceptor()\n''',
              '''        self._accept_message = self._delivery.acceptor()\n        self._accept_decoded_message = self._delivery.decoded_acceptor()\n''',
          )
          replace_once(
              "src/mqttium/api/async_client.py",
              '''        elif kind is EffectKind.MESSAGE:\n            message: Message = effect.data\n            pending_delivery = self._accept_message(message, self.on_message)\n''',
              '''        elif kind is EffectKind.MESSAGE:\n            message: Message = effect.data\n            property_wire_size = effect.decoded_property_wire_size\n            if property_wire_size is None:\n                pending_delivery = self._accept_message(message, self.on_message)\n            else:\n                pending_delivery = self._accept_decoded_message(\n                    message, self.on_message, property_wire_size\n                )\n''',
          )

          # Inbound: make the decoder hint non-empty-table only, and reuse it
          # for initial durable byte sizing as well as runtime delivery. Replay
          # effects never carry it.
          replace_once(
              "src/mqttium/protocol/inbound.py",
              '''        topic = self._resolve_topic_fields(topic, properties)\n        if qos is QoS.AT_MOST_ONCE:\n''',
              '''        topic = self._resolve_topic_fields(topic, properties)\n        decoded_property_wire_size = property_wire_size if properties.values else None\n        if qos is QoS.AT_MOST_ONCE:\n''',
          )
          p = Path("src/mqttium/protocol/inbound.py")
          text = p.read_text()
          text = text.replace(
              "decoded_property_wire_size=property_wire_size,",
              "decoded_property_wire_size=decoded_property_wire_size,",
          )
          if text.count("decoded_property_wire_size=decoded_property_wire_size,") != 3:
              raise SystemExit("inbound: expected exactly three fresh hint forwards")
          p.write_text(text)
          replace_once(
              "src/mqttium/protocol/inbound.py",
              '''        logical_size = self.logical_size(topic, payload, properties)\n        self._acquire_slot(logical_size)\n''',
              '''        logical_size = self.logical_size(\n            topic, payload, properties, decoded_property_wire_size\n        )\n        self._acquire_slot(logical_size)\n''',
          )
          replace_once(
              "src/mqttium/protocol/inbound.py",
              '''        logical_size = self.logical_size(topic, payload, properties) if config.manual_ack else None\n''',
              '''        logical_size = (\n            self.logical_size(topic, payload, properties, decoded_property_wire_size)\n            if config.manual_ack\n            else None\n        )\n''',
          )
          replace_once(
              "src/mqttium/protocol/inbound.py",
              '''    def logical_size(\n        self,\n        topic: str,\n        payload: bytes,\n        properties: Properties | None,\n    ) -> int:\n''',
              '''    def logical_size(\n        self,\n        topic: str,\n        payload: bytes,\n        properties: Properties | None,\n        decoded_property_wire_size: int | None = None,\n    ) -> int:\n''',
          )
          replace_once(
              "src/mqttium/protocol/inbound.py",
              '''        ):\n            property_bytes = len(encode_properties(properties, PUBLISH))\n        topic_bytes = len(topic) if topic.isascii() else len(topic.encode("utf-8"))\n''',
              '''        ):\n            if decoded_property_wire_size is None:\n                property_bytes = len(encode_properties(properties, PUBLISH))\n            else:\n                property_bytes = decoded_property_wire_size\n        topic_bytes = len(topic) if topic.isascii() else len(topic.encode("utf-8"))\n''',
          )

          # Strengthen the existing regression file with F5 and empty-table
          # lifetime checks.
          test = Path("tests/unit/test_small_delivery_properties.py")
          text = test.read_text()
          text = text.replace(
              '''async def test_decoded_oversized_properties_stay_accounted() -> None:\n''',
              '''async def test_decoded_oversized_properties_stay_accounted(monkeypatch) -> None:\n''',
              1,
          )
          old = '''    client = AsyncClient(\n        message_delivery="iterator",\n        protocol=MQTTProtocolVersion.MQTTv5,\n        client_id="probe",\n    )\n    await client._apply_effect(effect, nowait=False)\n\n    item = client._messages.get_nowait()\n    assert isinstance(item, tuple)\n    assert client.pending_delivery_bytes > 0\n\n\ndef test_decoded_property_size_honors_small_limit_boundary() -> None:\n'''
          new = '''    def fail_encode(*_args: object, **_kwargs: object) -> bytes:\n        raise AssertionError("fresh decoded accounted delivery must reuse the known table size")\n\n    monkeypatch.setattr(delivery_module, "encode_properties", fail_encode)\n    client = AsyncClient(\n        message_delivery="iterator",\n        protocol=MQTTProtocolVersion.MQTTv5,\n        client_id="probe",\n    )\n    await client._apply_effect(effect, nowait=False)\n\n    item = client._messages.get_nowait()\n    assert isinstance(item, tuple)\n    assert client.pending_delivery_bytes > 0\n\n\ndef test_inbound_logical_size_reuses_fresh_decoded_table(monkeypatch) -> None:\n    engine, effect = _fresh_message_effect(_iot_properties())\n    message = effect.data\n    assert isinstance(message, Message)\n    assert message.properties is not None\n    property_wire_size = effect.decoded_property_wire_size\n    assert property_wire_size is not None\n\n    def fail_encode(*_args: object, **_kwargs: object) -> bytes:\n        raise AssertionError("fresh inbound sizing must reuse the decoded table size")\n\n    monkeypatch.setattr("mqttium.protocol.inbound.encode_properties", fail_encode)\n    size = engine.inbound.logical_size(\n        message.topic, message.payload, message.properties, property_wire_size\n    )\n    assert size == len(message.payload) + len(message.topic) + property_wire_size\n\n\ndef test_empty_decoded_property_table_keeps_generic_path() -> None:\n    _engine, effect = _fresh_message_effect(Properties())\n    assert effect.decoded_property_wire_size is None\n\n\ndef test_decoded_property_size_honors_small_limit_boundary() -> None:\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"tests: oversized block match count {count}")
          test.write_text(text.replace(old, new, 1))
          PY
          python -m pip install -e ".[dev,security]"
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          ruff check src/mqttium/api/_delivery.py src/mqttium/api/async_client.py src/mqttium/packets/_publish.py src/mqttium/protocol/effects.py src/mqttium/protocol/engine.py src/mqttium/protocol/inbound.py tests/unit/test_small_delivery_properties.py
          mypy src/mqttium
          python -m pytest -q tests/unit/test_small_delivery_properties.py tests/unit/test_delivery_byte_budget.py tests/unit/test_batched_message_effects.py tests/unit/test_inbound_byte_budget.py tests/unit/test_inbound_replay_streaming.py
          python -m pytest -q tests/unit
          git rm .github/workflows/temp-f45-selective.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Scope decoded property sizing to fresh effects"
          git push origin HEAD:agent/small-delivery-decoded-properties
