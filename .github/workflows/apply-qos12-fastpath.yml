name: Apply QoS1/2 fast-path patch

on:
  push:
    branches:
      - perf/mqtt5-qos12-direct-decode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/mqtt5-qos12-direct-decode
      - name: Apply validated patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/qos12-fastpath.patch
          git apply tools/qos12-fastpath.patch
          rm tools/qos12-fastpath.patch .github/workflows/apply-qos12-fastpath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Direct-decode MQTT 5 QoS1/2 publishes'
          git push origin HEAD:perf/mqtt5-qos12-direct-decode
