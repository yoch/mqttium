name: PR446 StreamReader backlog ARM64

on:
  push:
    branches: [bench/pr445-adversarial-validation]
    paths:
      - .github/workflows/pr446-streamreader-backlog-arm64.yml
      - tools/pr446_streamreader_backlog_probe.py

permissions:
  contents: read

concurrency:
  group: pr445-adversarial-rpi5
  cancel-in-progress: false

jobs:
  backlog:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PR445_SHA: e85f2217faff2a75c9a86199663e8134837ac73c
      PR446_RUNTIME_SHA: 975954a48ce56f394502db0669e50926a18883e6
      PORT: "11990"
    steps:
      - name: Verify representative ARM environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /proc/sys/kernel/randomize_va_space)" != 0
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          command -v taskset >/dev/null
          root="$RUNNER_TEMP/pr446-backlog-$GITHUB_RUN_ID"
          mkdir -p "$root"
          echo "RESULTS_DIR=$root" >> "$GITHUB_ENV"
          {
            python3 --version
            echo "aslr=$(cat /proc/sys/kernel/randomize_va_space)"
            echo "governor=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)"
            echo "temp=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || true)"
          } | tee "$root/environment.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.PR445_SHA }}
          persist-credentials: false
          path: pr445

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqttium
          ref: ${{ env.PR446_RUNTIME_SHA }}
          persist-credentials: false
          path: pr446

      - name: Verify immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pr445 rev-parse HEAD)" = "$PR445_SHA"
          test "$(git -C pr446 rev-parse HEAD)" = "$PR446_RUNTIME_SHA"
          grep -q '_READ_CHUNK = 80 \* 1024' pr445/src/mqttium/transport/_buffered.py
          grep -q '_RECEIVE_BUFFER_SIZE = 80 \* 1024' pr446/src/mqttium/transport/tcp.py
          printf 'pr445=%s\npr446=%s\nworker_aslr=system\nburst_bytes=163840\n' \
            "$PR445_SHA" "$PR446_RUNTIME_SHA" | tee "$RESULTS_DIR/provenance.txt"

      - name: Start isolated burst server
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 1 python3 probe/tools/pr446_streamreader_backlog_probe.py \
            --server --port "$PORT" > "$RESULTS_DIR/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 0.3
          kill -0 "$!"

      - name: Run fresh-process forced-backlog distribution
        shell: bash
        run: |
          set -euo pipefail
          taskset -c 3 python3 - <<'PY' | tee "$RESULTS_DIR/summary.json"
          import json, os, random, statistics, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          script = root / 'probe/tools/pr446_streamreader_backlog_probe.py'
          port = os.environ['PORT']
          plan = ['pr446'] * 24 + ['pr445'] * 8
          random.Random(446160).shuffle(plan)
          rows = []
          for index, arm in enumerate(plan, 1):
              env = os.environ.copy()
              env['PYTHONPATH'] = str((root / arm / 'src').resolve())
              cmd = [
                  'taskset', '-c', '0', sys.executable, str(script),
                  '--client', '--port', port, '--warmup', '5', '--cycles', '100',
              ]
              proc = subprocess.run(cmd, check=True, capture_output=True, text=True, env=env)
              row = json.loads(proc.stdout)
              row['arm'] = arm
              row['execution_index'] = index
              rows.append(row)
              print(
                  f"{index:02d}/{len(plan)} {arm} impl={row['implementation']} "
                  f"max={row['max_buffered_bytes']} minflt/cycle={row['minflt_per_cycle']:.3f} "
                  f"stime_us/cycle={row['stime_us_per_cycle']:.2f}",
                  file=sys.stderr,
                  flush=True,
              )

          if not all(r['forced_backlog_proven'] for r in rows):
              raise SystemExit('probe invalid: at least one sample never proved >=160 KiB backlog')

          def summarize(arm):
              subset = [r for r in rows if r['arm'] == arm]
              minflt = [float(r['minflt_per_cycle']) for r in subset]
              stime = [float(r['stime_us_per_cycle']) for r in subset]
              return {
                  'n': len(subset),
                  'implementation': sorted({r['implementation'] for r in subset}),
                  'max_buffered_bytes_min': min(int(r['max_buffered_bytes']) for r in subset),
                  'max_buffered_bytes_max': max(int(r['max_buffered_bytes']) for r in subset),
                  'minflt_per_cycle_median': statistics.median(minflt),
                  'minflt_per_cycle_max': max(minflt),
                  'fault_heavy_ge_1_per_cycle': sum(v >= 1.0 for v in minflt),
                  'stime_us_per_cycle_median': statistics.median(stime),
                  'stime_us_per_cycle_max': max(stime),
              }

          result = {
              'schema_version': 1,
              'probe': 'forced_streamreader_160k_backlog_fresh_process',
              'representative_aslr': True,
              'diagnostic_only': True,
              'pr445_sha': os.environ['PR445_SHA'],
              'pr446_runtime_sha': os.environ['PR446_RUNTIME_SHA'],
              'summary': {arm: summarize(arm) for arm in ('pr445', 'pr446')},
              'rows': rows,
          }
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Stop server
        if: always()
        shell: bash
        run: |
          [ -n "${SERVER_PID:-}" ] && kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr446-streamreader-backlog-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14
