name: Restore async publish fast path

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply fast-path restoration
        run: python .github/restore_async_publish_fast_path.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate source and tests
        run: |
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src
          PYTHONPATH=. pytest -q tests/unit
      - name: Run focused paired controls
        run: |
          git worktree add /tmp/mqttium-base bccbf9fcd449329a96bf0b92786a481ab487995e
          python benchmarks/paired_regression.py \
            --base-root /tmp/mqttium-base \
            --candidate-root . \
            --repeat 11 \
            --output /tmp/fast-path-paired.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/fast-path-paired.json').read_text())
          ratios = {item['name']: item['median_candidate_over_base'] for item in data['scenarios']}
          required = (
              'async_publish_nowait_qos0',
              'native_publish_nowait_qos0',
              'compat_publish_qos1',
              'compat_publish_qos0_batch',
          )
          for name in required:
              print(f'{name}={ratios[name]:.4f}')
          if ratios['async_publish_nowait_qos0'] < 0.98:
              raise SystemExit('native async publish regression exceeds 2%')
          if ratios['compat_publish_qos1'] < 0.98:
              raise SystemExit('Paho QoS1 regression exceeds 2%')
          if ratios['compat_publish_qos0_batch'] < 0.98:
              raise SystemExit('Paho QoS0 batch regression exceeds 2%')
          PY
      - name: Commit validated restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve the native async publish fast path"
          git push origin HEAD:agent/paho-native-publish-boundary
