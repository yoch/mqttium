name: ARM64 Callback Batch2 Inline Head Experiment

on:
  push:
    branches: [perf/callback-batch2-inline-head]

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      BASE_SHA: 4fe90af36660bce06c12e9a8c57cb9a6223abe5a
      HARNESS_SHA: 22731e60c01f00f4f0dfb125bf664893d21537af
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out experiment harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check out candidate workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Environment and preflight
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/t3-inline-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "JOB_ROOT=$root" >> "$GITHUB_ENV"
          rm -rf "$root" && mkdir -p "$root"
          python3 -m venv "$root/venv"
          echo "$root/venv/bin" >> "$GITHUB_PATH"
          "$root/venv/bin/python" -m pip install -e 'candidate[dev]' 'psutil>=6,<8'
          "$root/venv/bin/python" harness/benchmarks/runner_probe.py \
            --output "$root/runner.json" --require-temperature --enforce

      - name: Apply batch2 inline-head candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('candidate/src/mqttium/api/_delivery.py')
          text = path.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
          '''class _CallbackMessageBatchToken:
              __slots__ = ()


          _CALLBACK_MESSAGE_BATCH = _CallbackMessageBatchToken()
          CallbackQueueToken = DeliveryToken | _CallbackMessageBatchToken
          ''',
          '''class _CallbackMessageBatchToken:
              __slots__ = ()


          class _CallbackInlineBatchTailToken:
              __slots__ = ()


          class _InlineBatchHeadState:
              __slots__ = ("awaitable", "skip")

              def __init__(self) -> None:
                  self.awaitable: Awaitable[Any] | None = None
                  self.skip = False


          _CALLBACK_MESSAGE_BATCH = _CallbackMessageBatchToken()
          _CALLBACK_INLINE_BATCH_TAIL = _CallbackInlineBatchTailToken()
          CallbackQueueToken = (
              DeliveryToken | _CallbackMessageBatchToken | _CallbackInlineBatchTailToken
          )
          '''))

          replacements.append((
          '''            if len(messages) > 1:
                          self._enqueue_message_batch(callback, messages, iterator_delivery=iterator_delivery)
                          return len(messages)
          ''',
          '''            if len(messages) > 1:
                          if (
                              len(messages) == 2
                              and not iterator_delivery
                              and self.can_dispatch_callback_inline(callback)
                          ):
                              self._dispatch_callback_batch_head_inline(
                                  callback, messages[0], messages[1]
                              )
                              return 2
                          self._enqueue_message_batch(callback, messages, iterator_delivery=iterator_delivery)
                          return len(messages)
          '''))

          marker = '''    def _enqueue_inline_continuation(
          '''
          addition = '''    def _dispatch_callback_batch_head_inline(
              self,
              callback: Callable[..., Any],
              first: Message,
              second: Message,
          ) -> None:
              """Run one batch head inline while the tail owns FIFO in the queue."""
              state = _InlineBatchHeadState()
              self.ensure_callback_worker()
              self.callback_queue.put_nowait(
                  (callback, (second, state), _CALLBACK_INLINE_BATCH_TAIL)
              )
              self._callback_active = True
              try:
                  try:
                      result = callback(first)
                  except asyncio.CancelledError as exc:
                      try:
                          self._propagate_callback_cancellation(callback, exc)
                      except asyncio.CancelledError:
                          state.skip = True
                          raise
                  except Exception as exc:
                      self.report_callback_error(callback, exc)
                  except BaseException:
                      state.skip = True
                      raise
                  else:
                      if inspect.isawaitable(result):
                          state.awaitable = result
              finally:
                  self._callback_active = False

          '''
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected inline continuation marker count: {text.count(marker)}')
          text = text.replace(marker, addition + marker, 1)

          replacements.append((
          '''            if token is _CALLBACK_MESSAGE_BATCH:
                          self._release_callback_batch(len(args[0]))
                      elif token is not None:
                          self.release_nowait(cast(AccountedDeliveryToken, token))
          ''',
          '''            if token is _CALLBACK_INLINE_BATCH_TAIL:
                          _message, state = args
                          pending = state.awaitable
                          if pending is not None and inspect.iscoroutine(pending):
                              pending.close()
                      elif token is _CALLBACK_MESSAGE_BATCH:
                          self._release_callback_batch(len(args[0]))
                      elif token is not None:
                          self.release_nowait(cast(AccountedDeliveryToken, token))
          '''))

          replacements.append((
          '''            self._callback_active = True
                      try:
                          if token is _CALLBACK_MESSAGE_BATCH:
          ''',
          '''            self._callback_active = True
                      try:
                          if token is _CALLBACK_INLINE_BATCH_TAIL:
                              message, state = args
                              self._reserve_callback_batch(2)
                              try:
                                  if not state.skip:
                                      pending = state.awaitable
                                      if pending is not None:
                                          try:
                                              await pending
                                          except asyncio.CancelledError as exc:
                                              self._propagate_callback_cancellation(callback, exc)
                                          except Exception as exc:
                                              self.report_callback_error(callback, exc)
                                      try:
                                          await self.invoke(callback, message)
                                      except asyncio.CancelledError as exc:
                                          self._propagate_callback_cancellation(callback, exc)
                                      except Exception as exc:
                                          self.report_callback_error(callback, exc)
                              finally:
                                  self._release_callback_batch(2)
                          elif token is _CALLBACK_MESSAGE_BATCH:
          '''))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected replacement target count {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile candidate/src/mqttium/api/_delivery.py
          git -C candidate diff --check
          git -C candidate diff -- src/mqttium/api/_delivery.py

      - name: Add experiment-only semantic guards
        shell: bash
        run: |
          set -euo pipefail
          cat > candidate/tests/unit/test_callback_batch2_inline_head_experiment.py <<'PY'
          from __future__ import annotations

          import asyncio
          import inspect
          from collections import deque

          from mqttium.api import AsyncClient
          from mqttium.protocol.effects import EffectKind, EngineEffect
          from mqttium.types import Message


          def effect(i: int) -> EngineEffect:
              return EngineEffect(
                  EffectKind.MESSAGE,
                  Message(topic="batch2/test", payload=str(i).encode()),
                  requires_delivery_mark=False,
              )


          async def test_sync_head_only_is_inline_and_tail_precedes_reentrant_work() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=3)
              seen: list[str] = []

              def callback(message: Message) -> None:
                  value = message.payload.decode()
                  seen.append(value)
                  if value == "0":
                      assert client._delivery.try_enqueue_callback(
                          lambda: seen.append("reentrant")
                      )

              client.on_message = callback
              applied = client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              )

              assert applied == 2
              assert seen == ["0"]
              assert client.stats().delivery.callback_queued == 2
              await client._callback_queue.join()
              assert seen == ["0", "1", "reentrant"]
              assert client.stats().delivery.callback_queued == 0
              await client._shutdown_callback_worker(drain=False)


          async def test_sync_head_awaitable_completes_before_tail_and_reentrant_work() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=4)
              seen: list[str] = []

              def callback(message: Message):
                  value = message.payload.decode()
                  seen.append(f"call:{value}")
                  if value != "0":
                      return None
                  assert client._delivery.try_enqueue_callback(
                      lambda: seen.append("reentrant:sync")
                  )

                  async def finish():
                      seen.append("await:start")
                      assert client._delivery.try_enqueue_callback(
                          lambda: seen.append("reentrant:async")
                      )
                      await asyncio.sleep(0)
                      seen.append("await:end")

                  return finish()

              client.on_message = callback
              applied = client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              )
              assert applied == 2
              assert seen == ["call:0"]

              await client._callback_queue.join()
              assert seen == [
                  "call:0",
                  "await:start",
                  "await:end",
                  "call:1",
                  "reentrant:sync",
                  "reentrant:async",
              ]
              await client._shutdown_callback_worker(drain=False)


          async def test_tail_converts_physical_slot_to_logical_reservation() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=2)
              seen: list[str] = []
              snapshots: list[tuple[str, int, int]] = []

              def callback(message: Message) -> None:
                  value = message.payload.decode()
                  seen.append(value)
                  snapshots.append(
                      (
                          value,
                          client.stats().delivery.callback_queued,
                          client._callback_queue.maxsize,
                      )
                  )
                  if value == "0":
                      assert snapshots[-1] == ("0", 1, 2)
                      assert client._delivery.try_enqueue_callback(
                          lambda: seen.append("reentrant")
                      )
                      assert client.stats().delivery.callback_queued == 2
                      assert not client._delivery.try_enqueue_callback(lambda: None)
                  else:
                      assert snapshots[-1] == ("1", 2, 1)
                      assert not client._delivery.try_enqueue_callback(lambda: None)

              client.on_message = callback
              assert client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              ) == 2
              assert client.stats().delivery.callback_queued == 2
              assert client._callback_queue.maxsize == 2

              await client._callback_queue.join()
              assert seen == ["0", "1", "reentrant"]
              assert client.stats().delivery.callback_queued == 0
              assert client._callback_queue.maxsize == 2
              await client._shutdown_callback_worker(drain=False)


          async def test_shutdown_discards_unstarted_head_awaitable_and_tail() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=2)
              seen: list[str] = []
              returned: list[object] = []

              def callback(message: Message):
                  value = message.payload.decode()
                  seen.append(value)
                  if value != "0":
                      return None

                  async def pending() -> None:
                      seen.append("awaited")

                  result = pending()
                  returned.append(result)
                  return result

              client.on_message = callback
              assert client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              ) == 2
              assert seen == ["0"]
              assert len(returned) == 1
              assert inspect.getcoroutinestate(returned[0]) == inspect.CORO_CREATED

              await client._shutdown_callback_worker(drain=False)
              assert seen == ["0"]
              assert inspect.getcoroutinestate(returned[0]) == inspect.CORO_CLOSED
              assert client.stats().delivery.callback_queued == 0
              assert client._callback_queue.maxsize == 2


          async def test_async_callback_keeps_existing_batch_worker_path() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=3)
              seen: list[str] = []

              async def callback(message: Message) -> None:
                  seen.append(message.payload.decode())

              client.on_message = callback
              assert client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              ) == 2
              assert seen == []
              assert client.stats().delivery.callback_queued == 2
              await client._callback_queue.join()
              assert seen == ["0", "1"]
              await client._shutdown_callback_worker(drain=False)
          PY

          PYTHONPATH=candidate/src python -m pytest -q \
            candidate/tests/unit/test_callback_batch2_inline_head_experiment.py \
            candidate/tests/unit/test_callback_message_batches.py \
            candidate/tests/unit/test_topic_callback_dispatch_contract.py \
            candidate/tests/unit/test_compat_callback_publish.py

      - name: Probe A/A
        shell: bash
        run: |
          set -euo pipefail
          python harness/benchmarks/callback_coalesced_inline_probe.py \
            --base-root base --candidate-root base \
            --repeat 12 --batches 8000 --warmup-batches 500 --cpu 2 \
            --output "$JOB_ROOT/aa.json" | tee "$JOB_ROOT/aa.txt"
          python - <<'PY'
          import json, os
          data=json.load(open(os.environ['JOB_ROOT']+'/aa.json'))
          for size, cell in data['cells'].items():
              for field in ('operations_per_second','callback_p50_ns','batch_rtt_p50_ns'):
                  s=cell['summary'][field]
                  drift=abs(s['median_candidate_over_base']-1.0)
                  if drift > 0.03 or s['base_cv'] > 0.03 or s['candidate_cv'] > 0.03:
                      raise SystemExit(f'A/A invalid batch={size} field={field}: {s}')
          PY

      - name: Probe A/B
        shell: bash
        run: |
          set -euo pipefail
          python harness/benchmarks/callback_coalesced_inline_probe.py \
            --base-root base --candidate-root candidate \
            --repeat 12 --batches 8000 --warmup-batches 500 --cpu 2 \
            --output "$JOB_ROOT/ab.json" | tee "$JOB_ROOT/ab.txt"

      - name: Decision summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          root=os.environ['JOB_ROOT']
          ab=json.load(open(root+'/ab.json'))['cells']
          b2=ab['2']['summary']; b8=ab['8']['summary']
          for field in (
              'callback_p50_ns', 'first_callback_p50_ns', 'second_callback_p50_ns',
              'batch_rtt_p50_ns', 'operations_per_second'
          ):
              print(f'batch2 {field} candidate/base={b2[field]["median_candidate_over_base"]:.5f}')
          print(f'batch8 callback p50 control candidate/base={b8["callback_p50_ns"]["median_candidate_over_base"]:.5f}')
          print(f'batch8 throughput control candidate/base={b8["operations_per_second"]["median_candidate_over_base"]:.5f}')
          cb2=b2['callback_p50_ns']['median_candidate_over_base']
          rtt2=b2['batch_rtt_p50_ns']['median_candidate_over_base']
          rate2=b2['operations_per_second']['median_candidate_over_base']
          cb8=b8['callback_p50_ns']['median_candidate_over_base']
          rate8=b8['operations_per_second']['median_candidate_over_base']
          if cb8 > 1.03 or rate8 < 0.97:
              print('DECISION: REJECT — larger batch control regressed')
          elif cb2 <= 0.97 or rtt2 <= 0.98 or rate2 >= 1.02:
              print('DECISION: KEEP — correctness-preserving head-inline design retains material signal')
          else:
              print('DECISION: REJECT — semantics-preserving design loses the material T3 signal')
          PY

      - name: Upload experiment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callback-batch2-inline-head-${{ github.run_id }}
          path: |
            ${{ env.JOB_ROOT }}/*.json
            ${{ env.JOB_ROOT }}/*.txt
            ${{ env.JOB_ROOT }}/runner.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$JOB_ROOT"
