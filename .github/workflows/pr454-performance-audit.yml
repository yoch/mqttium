name: PR454 neutral performance audit
on:
  push:
    branches: [work/pr454-performance-audit]
permissions:
  contents: read
concurrency:
  group: pr454-neutral-audit
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: neutral
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
          path: arm-a
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a27a5f7942c86d24495f375ced1c72f440e6982b
          path: arm-b
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Qualify identity and machine
        run: |
          set -euo pipefail
          test "$(git -C arm-a rev-parse HEAD)" = 9ad1f01857306ac5079ffb1d073a59fdb60e1931
          test "$(git -C arm-b rev-parse HEAD)" = a27a5f7942c86d24495f375ced1c72f440e6982b
          mkdir results
          git -C neutral rev-parse HEAD > results/tooling-sha.txt
          sha256sum neutral/tools/pr454_perf_probe.py > results/harness-sha256.txt
          uname -a > results/machine.txt
          lscpu >> results/machine.txt
          cat /proc/sys/kernel/randomize_va_space >> results/machine.txt
          python - <<'PY'
          import os, subprocess
          rows=subprocess.check_output(['lscpu','-p=CPU,CORE,SOCKET'],text=True).splitlines()
          cores={}
          for line in rows:
              if line.startswith('#'): continue
              cpu,core,socket=map(int,line.split(','))
              if cpu in os.sched_getaffinity(0): cores.setdefault((socket,core),cpu)
          cpus=list(cores.values())
          assert len(cpus)>=2, 'Need separate physical cores for SUT and broker'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SUT_CPU={cpus[0]}\nBROKER_CPU={cpus[1]}\n')
          print('selected physical core representatives',cpus)
          PY
      - name: Start fixed broker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          dpkg-query -W -f='${Version}\n' mosquitto > results/broker-version.txt
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\nlog_type error\n' > "$RUNNER_TEMP/pr454-mosquitto.conf"
          taskset -c "$BROKER_CPU" mosquitto -c "$RUNNER_TEMP/pr454-mosquitto.conf" > results/broker.log 2>&1 &
          echo $! > results/broker.pid
          python neutral/tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:11883
      - name: A/A then A/B callback mechanism matrix
        run: python neutral/tools/pr454_perf_probe.py campaign --base arm-a --candidate arm-b --kind micro --count 8000 --repeats 8 --cpu "$SUT_CPU" --output results/micro
      - name: A/A then A/B real MQTT QoS1 application RTT
        run: python neutral/tools/pr454_perf_probe.py campaign --base arm-a --candidate arm-b --kind network --count 800 --repeats 8 --cpu "$SUT_CPU" --port 11883 --output results/network
      - name: Final source readback
        if: always()
        run: |
          git -C arm-a status --short > results/final-status-a.txt
          git -C arm-b status --short > results/final-status-b.txt
          cp neutral/tools/pr454_perf_probe.py results/
          echo 'Fixed 8 repeats; no retries or cell exclusions. Primary practical threshold 3%; compare each metric with its own A/A distribution. Network is closed-loop, not fixed-rate.' > results/interpretation-policy.txt
          if test -f results/broker.pid; then kill "$(cat results/broker.pid)" || true; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr454-neutral-audit
          path: results/
          retention-days: 7
          if-no-files-found: error
