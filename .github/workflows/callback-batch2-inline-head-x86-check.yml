name: Callback Batch2 Inline Head x86 Check

on:
  push:
    branches: [perf/callback-batch2-inline-head-x86-check]

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4fe90af36660bce06c12e9a8c57cb9a6223abe5a
          path: candidate
          persist-credentials: false

      - name: Check out exact experiment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79b5e48b32900f8e12bc2c6854acc089d820fbe6
          path: source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Materialize exact candidate and original guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('source/.github/workflows/arm64-callback-batch2-inline-head-experiment.yml').read_text(encoding='utf-8')

          apply_anchor = workflow.index('      - name: Apply batch2 inline-head candidate')
          apply_marker = "          python - <<'PY'\n"
          apply_start = workflow.index(apply_marker, apply_anchor) + len(apply_marker)
          apply_end = workflow.index("\n          PY\n", apply_start)
          Path('/tmp/apply_candidate.py').write_text(
              textwrap.dedent(workflow[apply_start:apply_end]), encoding='utf-8'
          )

          test_anchor = workflow.index('      - name: Add experiment-only semantic guards')
          test_marker = "          cat > candidate/tests/unit/test_callback_batch2_inline_head_experiment.py <<'PY'\n"
          test_start = workflow.index(test_marker, test_anchor) + len(test_marker)
          test_end = workflow.index("\n          PY\n", test_start)
          Path('candidate/tests/unit/test_callback_batch2_inline_head_experiment.py').write_text(
              textwrap.dedent(workflow[test_start:test_end]), encoding='utf-8'
          )
          PY
          python /tmp/apply_candidate.py
          python - <<'PY'
          from pathlib import Path

          path = Path('candidate/src/mqttium/api/_delivery.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def _dispatch_callback_batch_head_inline(')
          end = text.index('    def _enqueue_inline_continuation(', start)
          region = text[start:end]
          lines = region.splitlines(keepends=True)
          fixed = lines[0] + ''.join(
              line if not line.strip() else '    ' + line
              for line in lines[1:]
          )
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile candidate/src/mqttium/api/_delivery.py
          git -C candidate diff --check

      - name: Add adversarial T3 guards
        shell: bash
        run: |
          set -euo pipefail
          cat >> candidate/tests/unit/test_callback_batch2_inline_head_experiment.py <<'PY'


          async def test_head_callback_mutation_does_not_rebind_reserved_tail() -> None:
              client = AsyncClient(message_delivery="callback", max_pending_callbacks=3)
              seen: list[str] = []

              def replacement(message: Message) -> None:
                  seen.append(f"new:{message.payload.decode()}")

              def original(message: Message) -> None:
                  value = message.payload.decode()
                  seen.append(f"old:{value}")
                  if value == "0":
                      client.on_message = replacement

              client.on_message = original
              assert client._apply_message_effect_batch_inline(
                  deque([effect(0), effect(1)]), client._connection_epoch
              ) == 2
              assert seen == ["old:0"]
              await client._callback_queue.join()
              assert seen == ["old:0", "old:1"]
              assert client.on_message is replacement
              await client._shutdown_callback_worker(drain=False)
          PY

          cat >> candidate/tests/unit/test_compat_callback_publish.py <<'PY'


          async def test_batch2_inline_head_can_publish_qos1_reentrantly_without_overtaking_tail() -> None:
              from collections import deque

              from mqttium.protocol.effects import EffectKind, EngineEffect
              from mqttium.types import Message

              fake = FakeBrokerTransport(auto_ack=True)
              client = AsyncClient(
                  client_id="batch2-reentrant-publish",
                  message_delivery="callback",
                  max_pending_callbacks=4,
              )

              async def factory(host: str, port: int, *, ssl: object = None) -> FakeBrokerTransport:
                  return fake

              client._transport_factory = factory  # type: ignore[assignment]
              seen: list[str] = []
              receipts = []

              def inbound(i: int) -> EngineEffect:
                  return EngineEffect(
                      EffectKind.MESSAGE,
                      Message(topic="in/batch", payload=str(i).encode()),
                      requires_delivery_mark=False,
                  )

              def on_message(message: Message) -> None:
                  value = message.payload.decode()
                  seen.append(value)
                  if value == "0":
                      receipts.append(
                          client.publish_nowait("out/echo", b"reply", qos=QoS.AT_LEAST_ONCE)
                      )

              client.on_message = on_message
              await client.connect("fake", 1883)
              try:
                  assert client._apply_message_effect_batch_inline(
                      deque([inbound(0), inbound(1)]), client._connection_epoch
                  ) == 2
                  assert seen == ["0"]
                  await client._callback_queue.join()
                  assert seen == ["0", "1"]
                  assert len(receipts) == 1
                  await asyncio.wait_for(receipts[0].wait(), timeout=1.0)
                  assert [packet.payload for packet in fake.published] == [b"reply"]
              finally:
                  await client.disconnect()
          PY

      - name: Run focused correctness set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e 'candidate[dev]'
          PYTHONPATH=candidate/src python -m pytest -q -W error \
            candidate/tests/unit/test_callback_batch2_inline_head_experiment.py \
            candidate/tests/unit/test_callback_message_batches.py \
            candidate/tests/unit/test_topic_callback_dispatch_contract.py \
            candidate/tests/unit/test_compat_callback_publish.py
