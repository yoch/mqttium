name: Callback Batch2 Inline Head x86 Check

on:
  push:
    branches: [perf/callback-batch2-inline-head-x86-check]

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4fe90af36660bce06c12e9a8c57cb9a6223abe5a
          path: candidate
          persist-credentials: false

      - name: Check out exact A/B baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4fe90af36660bce06c12e9a8c57cb9a6223abe5a
          path: base
          persist-credentials: false

      - name: Check out exact experiment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79b5e48b32900f8e12bc2c6854acc089d820fbe6
          path: source
          persist-credentials: false

      - name: Check out exact benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 22731e60c01f00f4f0dfb125bf664893d21537af
          path: harness
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml

      - name: Materialize exact candidate and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('source/.github/workflows/arm64-callback-batch2-inline-head-experiment.yml').read_text(encoding='utf-8')

          apply_anchor = workflow.index('      - name: Apply batch2 inline-head candidate')
          apply_start_marker = "          python - <<'PY'\n"
          apply_start = workflow.index(apply_start_marker, apply_anchor) + len(apply_start_marker)
          apply_end = workflow.index("\n          PY\n", apply_start)
          apply_script = textwrap.dedent(workflow[apply_start:apply_end])
          Path('/tmp/apply_candidate.py').write_text(apply_script, encoding='utf-8')

          test_anchor = workflow.index('      - name: Add experiment-only semantic guards')
          test_start_marker = "          cat > candidate/tests/unit/test_callback_batch2_inline_head_experiment.py <<'PY'\n"
          test_start = workflow.index(test_start_marker, test_anchor) + len(test_start_marker)
          test_end = workflow.index("\n          PY\n", test_start)
          tests = textwrap.dedent(workflow[test_start:test_end])
          Path('candidate/tests/unit/test_callback_batch2_inline_head_experiment.py').write_text(tests, encoding='utf-8')
          PY
          python /tmp/apply_candidate.py
          python - <<'PY'
          from pathlib import Path

          path = Path('candidate/src/mqttium/api/_delivery.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def _dispatch_callback_batch_head_inline(')
          end = text.index('    def _enqueue_inline_continuation(', start)
          region = text[start:end]
          lines = region.splitlines(keepends=True)
          fixed = lines[0] + ''.join(
              line if not line.strip() else '    ' + line
              for line in lines[1:]
          )
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile candidate/src/mqttium/api/_delivery.py
          git -C candidate diff --check

      - name: Run focused correctness set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e 'candidate[dev]'
          PYTHONPATH=candidate/src python -m pytest -q -W error \
            candidate/tests/unit/test_callback_batch2_inline_head_experiment.py \
            candidate/tests/unit/test_callback_message_batches.py \
            candidate/tests/unit/test_topic_callback_dispatch_contract.py \
            candidate/tests/unit/test_compat_callback_publish.py

      - name: Hosted A/A directionality control
        shell: bash
        run: |
          set -euo pipefail
          python harness/benchmarks/callback_coalesced_inline_probe.py \
            --base-root base --candidate-root base \
            --repeat 10 --batches 5000 --warmup-batches 500 --cpu 2 \
            --output /tmp/aa.json | tee /tmp/aa.txt

      - name: Hosted A/B directionality probe
        shell: bash
        run: |
          set -euo pipefail
          python harness/benchmarks/callback_coalesced_inline_probe.py \
            --base-root base --candidate-root candidate \
            --repeat 10 --batches 5000 --warmup-batches 500 --cpu 2 \
            --output /tmp/ab.json | tee /tmp/ab.txt
          python - <<'PY'
          import json
          aa=json.load(open('/tmp/aa.json'))['cells']
          ab=json.load(open('/tmp/ab.json'))['cells']
          for size in ('2','8'):
              print(f'BATCH {size}')
              for field in ('callback_p50_ns','first_callback_p50_ns','second_callback_p50_ns','batch_rtt_p50_ns','operations_per_second'):
                  a=aa[size]['summary'][field]
                  b=ab[size]['summary'][field]
                  print(
                      field,
                      f'AA={a["median_candidate_over_base"]:.5f}',
                      f'AB={b["median_candidate_over_base"]:.5f}',
                      f'AA_cv=({a["base_cv"]:.4f},{a["candidate_cv"]:.4f})',
                      f'AB_cv=({b["base_cv"]:.4f},{b["candidate_cv"]:.4f})',
                  )
          PY
