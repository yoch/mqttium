name: ARM64 Paired-Network MID Generation Probe

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: fd750be3012e3878b12449624bce2c71747623ba
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = performance
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          command -v timeout
          if pgrep -a mosquitto; then exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact endpoints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          test "$(git -C base hash-object benchmarks/paired_network.py)" = "$(git -C candidate hash-object benchmarks/paired_network.py)"
          test -z "$(git -C base status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"

      - name: Create benchmark venv
        shell: bash
        run: |
          v="$RUNNER_TEMP/m252-mid-v"
          rm -rf "$v"
          python3 -m venv "$v"
          echo "$v/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Fresh strict preflight
        working-directory: base
        run: |
          r="$RUNNER_TEMP/m252-mid"
          rm -rf "$r"
          mkdir -p "$r"
          python benchmarks/runner_probe.py --output "$r/runner.json" --require-temperature --enforce

      - name: Start pinned broker
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-mid"
          cat >"$r/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$r/mosquitto.conf" >"$r/mosquitto.log" 2>&1 & echo $! >"$r/pid"
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$r/pid")" 2>/dev/null || exit 1
            sleep .1
          done
          exit 1

      - name: Build temporary FIFO-by-MID-generation harness
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-mid"
          cp candidate/benchmarks/paired_network.py "$r/paired_network_fifo.py"
          HARNESS="$r/paired_network_fifo.py" python - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["HARNESS"])
          text = p.read_text()
          replacements = [
              (
                  '''    completed: asyncio.Queue[tuple[int, int]] = asyncio.Queue()\n    publish_started: dict[int, int] = {}\n    early_completion: dict[int, int] = {}\n''',
                  '''    # Completion queue carries the generation's start timestamp, not only MID.\n    completed: asyncio.Queue[tuple[int, int]] = asyncio.Queue()\n    publish_started: dict[int, deque[int]] = {}\n    early_completion: dict[int, deque[int]] = {}\n''',
              ),
              (
                  '''            if mid in publish_started:\n                completed.put_nowait((mid, finished))\n            else:\n                early_completion[mid] = finished\n''',
                  '''            starts = publish_started.get(mid)\n            if starts:\n                sent_ns = starts.popleft()\n                if not starts:\n                    publish_started.pop(mid, None)\n                completed.put_nowait((sent_ns, finished))\n            else:\n                early_completion.setdefault(mid, deque()).append(finished)\n''',
              ),
              (
                  '''            assert receipt.mid is not None\n            publish_started[receipt.mid] = published_ns\n            if receipt.mid in early_completion:\n                completed.put_nowait((receipt.mid, early_completion.pop(receipt.mid)))\n            outstanding += 1\n            if outstanding >= window:\n                mid, finished = await completed.get()\n                ack_latencies.append((finished - publish_started.pop(mid)) / 1_000_000)\n                outstanding -= 1\n''',
                  '''            assert receipt.mid is not None\n            starts = publish_started.setdefault(receipt.mid, deque())\n            starts.append(published_ns)\n            early = early_completion.get(receipt.mid)\n            if early:\n                finished = early.popleft()\n                sent_ns = starts.popleft()\n                if not starts:\n                    publish_started.pop(receipt.mid, None)\n                if not early:\n                    early_completion.pop(receipt.mid, None)\n                completed.put_nowait((sent_ns, finished))\n            outstanding += 1\n            if outstanding >= window:\n                sent_ns, finished = await completed.get()\n                ack_latencies.append((finished - sent_ns) / 1_000_000)\n                outstanding -= 1\n''',
              ),
              (
                  '''    else:\n        for _ in range(outstanding):\n            mid, finished = await completed.get()\n            ack_latencies.append((finished - publish_started.pop(mid)) / 1_000_000)\n    elapsed = time.perf_counter() - started\n''',
                  '''    else:\n        for _ in range(outstanding):\n            sent_ns, finished = await completed.get()\n            ack_latencies.append((finished - sent_ns) / 1_000_000)\n        if publish_started or early_completion:\n            raise RuntimeError(\n                f"callback generation accounting leaked starts={sum(map(len, publish_started.values()))} "\n                f"early={sum(map(len, early_completion.values()))}"\n            )\n    elapsed = time.perf_counter() - started\n''',
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          p.write_text(text)
          PY
          python -m py_compile "$r/paired_network_fifo.py"
          echo "Temporary harness patched; exact source trees remain untouched"
          test -z "$(git -C base status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"

      - name: Main window=8 with FIFO generation tracking
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-mid"
          echo "[$(date -Is)] START main A/A window=8"
          timeout --signal=TERM --kill-after=5s 90s \
            python "$r/paired_network_fifo.py" --base-root base --candidate-root base \
              --protocols 311 --payloads 256 --windows 8 --completions callback \
              --repeat 4 --count-small 4000 --target-sample-seconds 0.1 --max-count 4000 \
              --timeout 20 --cpu 2 --policy strict --preflight-report "$r/runner.json" \
              --output "$r/main-aa.json" --summary-output "$r/main-aa.md"
          echo "[$(date -Is)] DONE main A/A window=8"

      - name: PR252 window=8 with FIFO generation tracking
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-mid"
          echo "[$(date -Is)] START PR252 A/A window=8"
          timeout --signal=TERM --kill-after=5s 90s \
            python "$r/paired_network_fifo.py" --base-root candidate --candidate-root candidate \
              --protocols 311 --payloads 256 --windows 8 --completions callback \
              --repeat 4 --count-small 4000 --target-sample-seconds 0.1 --max-count 4000 \
              --timeout 20 --cpu 2 --policy strict --preflight-report "$r/runner.json" \
              --output "$r/candidate-aa.json" --summary-output "$r/candidate-aa.md"
          echo "[$(date -Is)] DONE PR252 A/A window=8"

      - name: Summarize fixed-harness controls
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/m252-mid" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          for name in ("main-aa", "candidate-aa"):
              data = json.loads((root / f"{name}.json").read_text())
              s = data["scenarios"][0]
              print(
                  f"{name}: status={data['status']} ratio={s['median_candidate_over_base_ack']:.4f} "
                  f"base_cv={s['base_ack_cv']:.2%} candidate_cv={s['candidate_ack_cv']:.2%} "
                  f"p50_base={s['base_median_p50_ms']:.6f}ms p50_candidate={s['candidate_median_p50_ms']:.6f}ms"
              )
          PY

      - name: Stop broker
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/m252-mid/pid"
          [ ! -f "$f" ] || { p=$(cat "$f"); kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-mid-generation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m252-mid/*.json
            ${{ runner.temp }}/m252-mid/*.md
            ${{ runner.temp }}/m252-mid/paired_network_fifo.py
            ${{ runner.temp }}/m252-mid/mosquitto.log
          if-no-files-found: error
          retention-days: 30
