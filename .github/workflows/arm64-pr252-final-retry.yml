name: ARM64 PR252 Publish-Completion Final

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: fd750be3012e3878b12449624bce2c71747623ba
      HARNESS_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7

    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = performance
          command -v python3
          if pgrep -a mosquitto; then exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C candidate merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          test -z "$(git -C base status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C harness status --porcelain)"
          test "$(git -C harness hash-object benchmarks/paired_regression.py)" = 126cf66b63f0ba32a928a3f75c2066762ae72cca
          test "$(git -C harness hash-object benchmarks/_paired_scenarios.py)" = 11063c3007ef3cb42181843f6fd6f8cba915dacd

      - name: Create benchmark venv
        shell: bash
        run: |
          v="$RUNNER_TEMP/m252-publish-complete-v"
          rm -rf "$v"
          python3 -m venv "$v"
          echo "$v/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Fresh strict preflight
        working-directory: base
        run: |
          r="$RUNNER_TEMP/m252-publish-complete"
          rm -rf "$r"
          mkdir -p "$r"
          python benchmarks/runner_probe.py --output "$r/runner.json" --require-temperature --enforce

      - name: Main A/A publish_complete_callback
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-publish-complete"
          echo "[$(date -Is)] START main A/A callback"
          python harness/benchmarks/paired_regression.py \
            --base-root base --candidate-root base \
            --scenario publish_complete_callback --repeat 20 --cpu 2 \
            --output "$r/main-aa-callback.json"
          echo "[$(date -Is)] DONE main A/A callback"

      - name: PR252 A/A publish_complete_callback
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-publish-complete"
          echo "[$(date -Is)] START PR252 A/A callback"
          python harness/benchmarks/paired_regression.py \
            --base-root candidate --candidate-root candidate \
            --scenario publish_complete_callback --repeat 20 --cpu 2 \
            --output "$r/candidate-aa-callback.json"
          echo "[$(date -Is)] DONE PR252 A/A callback"

      - name: Gate A/A paired estimator stability
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m252-publish-complete" python - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          report = {}
          failures = []

          def cv(values):
              mean = statistics.fmean(values)
              return statistics.stdev(values) / mean if len(values) > 1 and mean else 0.0

          for filename in ("main-aa-callback.json", "candidate-aa-callback.json"):
              data = json.loads((root / filename).read_text())
              scenario = data["scenarios"][0]
              ratios = [pair["candidate_over_base"] for pair in scenario["pairs"]]
              median = statistics.median(ratios)
              ratio_cv = cv(ratios)
              within_10 = sum(0.90 <= value <= 1.10 for value in ratios)
              report[filename] = {
                  "median_ratio": median,
                  "pair_ratio_cv": ratio_cv,
                  "pairs_within_10pct": within_10,
                  "base_cv": scenario["base_cv"],
                  "candidate_cv": scenario["candidate_cv"],
                  "ratios": ratios,
              }
              print(
                  f"{filename}: median={median:.4f} pair_cv={ratio_cv:.2%} "
                  f"within10={within_10}/20 raw_cv={scenario['base_cv']:.2%}/{scenario['candidate_cv']:.2%}"
              )
              if not 0.95 <= median <= 1.05:
                  failures.append(f"{filename}: A/A median ratio {median:.4f} outside [0.95,1.05]")
              if ratio_cv > 0.05:
                  failures.append(f"{filename}: paired-ratio CV {ratio_cv:.2%} > 5%")
              if within_10 < 18:
                  failures.append(f"{filename}: only {within_10}/20 pairs within +/-10%")

          (root / "aa-gate.json").write_text(json.dumps(report, indent=2) + "\n")
          if failures:
              raise SystemExit("A/A paired estimator invalid:\n" + "\n".join(failures))
          PY

      - name: Main vs PR252 publish_complete_callback
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-publish-complete"
          echo "[$(date -Is)] START A/B callback"
          python harness/benchmarks/paired_regression.py \
            --base-root base --candidate-root candidate \
            --scenario publish_complete_callback --repeat 20 --cpu 2 \
            --output "$r/ab-callback.json"
          echo "[$(date -Is)] DONE A/B callback"

      - name: A/B control publish_complete_receipt
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-publish-complete"
          python harness/benchmarks/paired_regression.py \
            --base-root base --candidate-root candidate \
            --scenario publish_complete_receipt --repeat 20 --cpu 2 \
            --output "$r/ab-receipt.json"

      - name: A/B control effect_batch_ordered
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-publish-complete"
          python harness/benchmarks/paired_regression.py \
            --base-root base --candidate-root candidate \
            --scenario effect_batch_ordered --repeat 20 --cpu 2 \
            --output "$r/ab-effect-batch.json"

      - name: Gate final direct-path evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m252-publish-complete" python - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          specs = [
              ("publish_complete_callback", "ab-callback.json", 0.95),
              ("publish_complete_receipt", "ab-receipt.json", 0.95),
              ("effect_batch_ordered", "ab-effect-batch.json", 0.95),
          ]
          failures = []
          rows = []

          def cv(values):
              mean = statistics.fmean(values)
              return statistics.stdev(values) / mean if len(values) > 1 and mean else 0.0

          for name, filename, floor in specs:
              data = json.loads((root / filename).read_text())
              scenario = data["scenarios"][0]
              ratios = [pair["candidate_over_base"] for pair in scenario["pairs"]]
              median = statistics.median(ratios)
              ratio_cv = cv(ratios)
              row = {
                  "scenario": name,
                  "median_candidate_over_base": median,
                  "pair_ratio_cv": ratio_cv,
                  "min_candidate_over_base": min(ratios),
                  "max_candidate_over_base": max(ratios),
                  "pairs_favouring_candidate": sum(value > 1.0 for value in ratios),
                  "base_cv": scenario["base_cv"],
                  "candidate_cv": scenario["candidate_cv"],
                  "ratios": ratios,
              }
              rows.append(row)
              print(
                  f"{name}: candidate/base={median:.4f} pair_cv={ratio_cv:.2%} "
                  f"range=[{min(ratios):.4f},{max(ratios):.4f}] favour={row['pairs_favouring_candidate']}/20"
              )
              if median < floor:
                  failures.append(f"{name}: candidate/base median {median:.4f} < {floor:.2f}")
              if ratio_cv > 0.05:
                  failures.append(f"{name}: paired-ratio CV {ratio_cv:.2%} > 5%")

          result = {"status": "failed" if failures else "passed", "rows": rows, "failures": failures}
          (root / "final-gate.json").write_text(json.dumps(result, indent=2) + "\n")
          lines = ["# PR252 direct publish-completion evidence", "", f"Status: **{result['status']}**", ""]
          for row in rows:
              lines.append(
                  f"- {row['scenario']}: candidate/base={row['median_candidate_over_base']:.4f}, "
                  f"paired CV={row['pair_ratio_cv']:.2%}, range="
                  f"[{row['min_candidate_over_base']:.4f}, {row['max_candidate_over_base']:.4f}], "
                  f"candidate faster in {row['pairs_favouring_candidate']}/20 pairs"
              )
          if failures:
              lines += ["", "## Failures"] + [f"- {failure}" for failure in failures]
          (root / "final-gate.md").write_text("\n".join(lines) + "\n")
          if failures:
              raise SystemExit("direct-path gate failed:\n" + "\n".join(failures))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-publish-complete-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m252-publish-complete/*.json
            ${{ runner.temp }}/m252-publish-complete/*.md
          if-no-files-found: error
          retention-days: 30
