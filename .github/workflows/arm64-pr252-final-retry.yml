name: ARM64 PR252 Yielding-Pacer Evaluation

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: fd750be3012e3878b12449624bce2c71747623ba
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = performance
          if pgrep -a mosquitto; then exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact endpoints and patch only the harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/benchmarks/paired_open_loop.py')
          t=p.read_text()
          old='''            if paced:\n                delay = deadline - loop.time()\n                if delay > 0:\n                    await asyncio.sleep(delay)\n'''
          new='''            if paced:\n                delay = deadline - loop.time()\n                await asyncio.sleep(max(0.0, delay))\n'''
          assert t.count(old) == 1
          p.write_text(t.replace(old,new))
          PY
          git -C candidate diff --check
          test "$(git -C candidate diff --name-only)" = "benchmarks/paired_open_loop.py"

      - name: Create benchmark venv
        shell: bash
        run: |
          v="$RUNNER_TEMP/m252-yield-v"; rm -rf "$v"; python3 -m venv "$v"; echo "$v/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Fresh strict preflight
        working-directory: base
        run: |
          r="$RUNNER_TEMP/m252-yield"; rm -rf "$r"; mkdir -p "$r"
          python benchmarks/runner_probe.py --output "$r/runner.json" --require-temperature --enforce

      - name: Start pinned broker
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-yield"
          cat >"$r/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$r/mosquitto.conf" >"$r/mosquitto.log" 2>&1 & echo $! >"$r/pid"
          for _ in $(seq 1 50); do
            (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$r/pid")" 2>/dev/null || exit 1
            sleep .1
          done
          exit 1

      - name: Main A/A with yielding pacer
        run: |
          r="$RUNNER_TEMP/m252-yield"
          python candidate/benchmarks/paired_open_loop.py --base-root base --candidate-root base \
            --protocols 311 --payloads 256 --windows 64 --target-rates 2500,5000,10000 --completions callback \
            --repeat 8 --count-small 4000 --target-sample-seconds 1.5 --max-count 4000 \
            --timeout 120 --cpu 2 --policy strict --preflight-report "$r/runner.json" \
            --output "$r/main-aa.json" --summary-output "$r/main-aa.md"

      - name: Candidate A/A with yielding pacer
        run: |
          r="$RUNNER_TEMP/m252-yield"
          python candidate/benchmarks/paired_open_loop.py --base-root candidate --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 --target-rates 2500,5000,10000 --completions callback \
            --repeat 8 --count-small 4000 --target-sample-seconds 1.5 --max-count 4000 \
            --timeout 120 --cpu 2 --policy strict --preflight-report "$r/runner.json" \
            --output "$r/candidate-aa.json" --summary-output "$r/candidate-aa.md"

      - name: A/B with yielding pacer
        run: |
          r="$RUNNER_TEMP/m252-yield"
          python candidate/benchmarks/paired_open_loop.py --base-root base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 --target-rates 2500,5000,10000 --completions callback \
            --repeat 8 --count-small 4000 --target-sample-seconds 1.5 --max-count 4000 \
            --timeout 120 --cpu 2 --policy strict --preflight-report "$r/runner.json" \
            --output "$r/ab.json" --summary-output "$r/ab.md"

      - name: Summarize p50 ratios
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/m252-yield" python - <<'PY'
          import json, os, statistics
          from pathlib import Path
          d=json.loads((Path(os.environ['ROOT'])/'ab.json').read_text())
          for s in d['scenarios']:
              ratios=[float(p['candidate']['ack_latency_p50_ms'])/float(p['base']['ack_latency_p50_ms']) for p in s['pairs']]
              print(f"rate={int(s['target_rate'])} p50_ratio={statistics.median(ratios):.4f} wins={s['pairs_favouring_candidate_latency']}/8")
          PY

      - name: Stop broker
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/m252-yield/pid"; [ ! -f "$f" ] || { p=$(cat "$f"); kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-yielding-pacer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m252-yield/*.json
            ${{ runner.temp }}/m252-yield/*.md
            ${{ runner.temp }}/m252-yield/mosquitto.log
          if-no-files-found: error
          retention-days: 30
