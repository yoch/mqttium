name: RC2 README bootstrap

on:
  push:
    branches:
      - release/v1.0.0rc2

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0rc2
      - name: Update README and push
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = '> **Status:** release candidate (`1.0.0rc1`).'
          new = '> **Status:** release candidate (`1.0.0rc2`).'
          if text.count(old) != 1:
              raise SystemExit(f'expected one status line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git add README.md
          git rm .github/workflows/rc2-readme-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align README with 1.0.0rc2'
          git push origin HEAD:release/v1.0.0rc2
