name: TEMP Current vs rc6 rc7

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e80618154bacefed5626d9eb9ba46edf560b54e7
          path: current
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v1.0.0rc7
          path: rc7
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: v1.0.0rc6
          path: rc6
          persist-credentials: false
      - name: Install Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          out="$RUNNER_TEMP/current-compare"
          mkdir -p "$out"
          printf '%s\n' '{"eligible": true, "failures": []}' > "$out/preflight.json"
          cat > "$out/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11886 127.0.0.1
          EOF
          mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "$!" > "$out/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11886) >/dev/null 2>&1 && exit 0
            sleep 0.05
          done
          exit 1
      - name: Compare current vs rc7 and rc6
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/current-compare"
          for base in rc7 rc6; do
            python3 current/benchmarks/paired_network.py \
              --base-root "$base" --candidate-root current \
              --host 127.0.0.1 --port 11886 \
              --policy advisory --preflight-report "$out/preflight.json" \
              --max-baseline-cv 1.0 --min-ack-ratio 0.0 \
              --repeat 8 \
              --windows 20,64,128 --protocols 311 --payloads 64,4096 \
              --count-small 2400 --count-large 2400 \
              --target-sample-seconds 0.8 --max-count 30000 \
              --output "$out/${base}.json" --summary-output "$out/${base}.md"
          done
          python3 - "$out/rc7.json" "$out/rc6.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          for label, path in [('rc7', sys.argv[1]), ('rc6', sys.argv[2])]:
              p = json.load(open(path))
              print(f'## current vs {label}')
              print('| payload | window | throughput | p50 base | p50 current | p95 base | p95 current |')
              print('|---:|---:|---:|---:|---:|---:|---:|')
              for s in p['scenarios']:
                  print(f"| {s['payload_bytes']} | {s['window']} | {s['median_candidate_over_base_ack']:.4f} | {s['base_median_p50_ms']:.3f} | {s['candidate_median_p50_ms']:.3f} | {s['base_median_p95_ms']:.3f} | {s['candidate_median_p95_ms']:.3f} |")
              print()
          PY
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-current-vs-rc6-rc7-${{ github.run_id }}
          path: ${{ runner.temp }}/current-compare/*
          retention-days: 3
      - name: Stop broker
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/current-compare/mosquitto.pid"
          [ ! -f "$f" ] || kill "$(cat "$f")" 2>/dev/null || true
