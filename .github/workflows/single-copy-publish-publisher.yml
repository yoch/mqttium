name: Publish single-copy inbound PUBLISH

on:
  push:
    branches:
      - agent/single-copy-inbound-publish
    paths:
      - .github/workflows/single-copy-publish-publisher.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/single-copy-inbound-publish
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,security]"
      - run: python .github/scripts/apply_single_copy_publish.py
      - name: Validate implementation
        run: |
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src
          bandit -q -ll -r src
          python -m pytest -q tests/unit/test_single_copy_publish_decode.py tests/unit/test_codec.py tests/unit/test_engine.py
          python -m pytest -q tests/unit
      - name: Profile allocations
        run: |
          python benchmarks/codec_allocations.py --repeat 3 --output /tmp/codec-allocations.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/codec-allocations.json'))
          large = [sample for sample in data['samples'] if sample['payload_bytes'] >= 1024 * 1024]
          direct = [sample for sample in large if sample['mode'] == 'direct']
          legacy = [sample for sample in large if sample['mode'] == 'legacy']
          assert direct and legacy
          assert max(sample['copies_of_payload'] for sample in direct) < 1.35
          assert min(sample['copies_of_payload'] for sample in legacy) > 1.75
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: single-copy-publish-profile-${{ github.run_id }}
          path: /tmp/codec-allocations.json
          retention-days: 30
      - name: Commit final tree
        run: |
          rm .github/workflows/single-copy-publish-publisher.yml
          rm .github/scripts/apply_single_copy_publish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode large inbound PUBLISH payloads once"
          git push origin HEAD:agent/single-copy-inbound-publish
