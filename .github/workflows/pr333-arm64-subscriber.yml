name: PR333 ARM64 Subscriber Validation

on:
  push:
    branches:
      - validation/pr333-arm64

permissions:
  contents: read

concurrency:
  group: mqttium-arm64-runner
  cancel-in-progress: false

jobs:
  paired:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 60
    env:
      BASE_REF: f43d6b11f29306eab1f055f89f0ae26edde5e2bf
      CANDIDATE_REF: ad5b64ec0714b398fbd19bfc0cc12953295021a9
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out trusted baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false

      - name: Check out trusted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          persist-credentials: false

      - name: Verify dedicated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected Python 3.13, got {sys.version}")
          PY
          command -v taskset
          echo "JOB_ROOT=$RUNNER_TEMP/pr333-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Prepare isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$JOB_ROOT"
          mkdir -p "$JOB_ROOT"
          python3 -m venv "$JOB_ROOT/venv"
          echo "$JOB_ROOT/venv/bin" >> "$GITHUB_PATH"
          "$JOB_ROOT/venv/bin/python" -m pip install "psutil>=6,<8"

      - name: Strict runner preflight
        shell: bash
        run: |
          set -euo pipefail
          "$JOB_ROOT/venv/bin/python" base/benchmarks/runner_probe.py \
            --output "$JOB_ROOT/runner.json" \
            --require-temperature \
            --enforce

      - name: Write production-shaped subscriber harness
        shell: bash
        run: |
          cat > "$JOB_ROOT/worker.py" <<'PY'
          from __future__ import annotations
          import argparse, asyncio, json, sys, time
          from pathlib import Path

          p = argparse.ArgumentParser()
          p.add_argument("--root", required=True)
          p.add_argument("--protocol", choices=["311", "5"], required=True)
          p.add_argument("--batch", type=int, required=True)
          p.add_argument("--count", type=int, required=True)
          p.add_argument("--payload", type=int, required=True)
          p.add_argument("--props", action="store_true")
          p.add_argument("--compat", action="store_true")
          a = p.parse_args()
          sys.path.insert(0, str(Path(a.root) / "src"))

          from mqttium.api import AsyncClient
          from mqttium.enums import ConnectionState, MQTTProtocolVersion, QoS
          from mqttium.packets import PublishPacket
          from mqttium.types import Properties

          proto = MQTTProtocolVersion.MQTTv311 if a.protocol == "311" else MQTTProtocolVersion.MQTTv5
          props = None
          if a.props:
              props = Properties()
              props.set("content_type", "application/json")
              props.set("user_property", [("schema", "telemetry.v1"), ("source", "arm64")])
          frame = PublishPacket(
              topic="bench/org/site/device/telemetry/temp",
              payload=b"x" * a.payload,
              qos=QoS.AT_MOST_ONCE,
              retain=False,
              dup=False,
              properties=props,
          ).encode(proto)

          class Transport:
              def __init__(self) -> None:
                  self.left = a.count
                  self.closed = False
                  self.full = frame * a.batch
              async def read(self, _n: int = 65536) -> bytes:
                  if self.left <= 0:
                      self.closed = True
                      return b""
                  n = min(a.batch, self.left)
                  self.left -= n
                  await asyncio.sleep(0)
                  return self.full if n == a.batch else frame * n
              def is_closing(self) -> bool:
                  return self.closed
              async def close(self) -> None:
                  self.closed = True

          async def run() -> None:
              seen = 0
              if a.compat:
                  from mqttium.compat.paho import CallbackAPIVersion, Client
                  facade = Client(callback_api_version=CallbackAPIVersion.VERSION2, protocol=proto)
                  def callback(_client, _userdata, _message) -> None:
                      nonlocal seen
                      seen += 1
                  facade.on_message = callback
                  client = facade._async
              else:
                  client = AsyncClient(
                      protocol=proto,
                      message_delivery="callback",
                      max_pending_callbacks=max(1024, a.batch * 8),
                  )
                  def callback(_message) -> None:
                      nonlocal seen
                      seen += 1
                  client.on_message = callback
              client._engine.state = ConnectionState.CONNECTED
              client._transport = Transport()
              t0 = time.perf_counter()
              c0 = time.process_time()
              await client._read_loop()
              wall = time.perf_counter() - t0
              cpu = time.process_time() - c0
              if seen != a.count:
                  raise RuntimeError(f"delivery mismatch {seen}/{a.count}")
              print(json.dumps({
                  "rate": a.count / wall,
                  "cpu_us": cpu / a.count * 1e6,
                  "wall": wall,
                  "seen": seen,
                  "frame_bytes": len(frame),
              }))
          asyncio.run(run())
          PY

          cat > "$JOB_ROOT/pairs.py" <<'PY'
          from __future__ import annotations
          import argparse, json, statistics, subprocess
          from pathlib import Path

          p = argparse.ArgumentParser()
          p.add_argument("--base", required=True)
          p.add_argument("--candidate", required=True)
          p.add_argument("--protocol", choices=["311", "5"], required=True)
          p.add_argument("--batch", type=int, required=True)
          p.add_argument("--count", type=int, required=True)
          p.add_argument("--payload", type=int, required=True)
          p.add_argument("--repeat", type=int, default=11)
          p.add_argument("--props", action="store_true")
          p.add_argument("--compat", action="store_true")
          p.add_argument("--output", required=True)
          p.add_argument("--worker", required=True)
          p.add_argument("--python", required=True)
          a = p.parse_args()
          vals = {"base": [], "candidate": []}
          cpus = {"base": [], "candidate": []}
          ratios = []
          roots = {"base": a.base, "candidate": a.candidate}
          for i in range(a.repeat):
              order = ["base", "candidate"] if i % 2 == 0 else ["candidate", "base"]
              pair = {}
              for side in order:
                  cmd = [
                      "taskset", "-c", "2", a.python, a.worker,
                      "--root", roots[side], "--protocol", a.protocol,
                      "--batch", str(a.batch), "--count", str(a.count),
                      "--payload", str(a.payload),
                  ]
                  if a.props:
                      cmd.append("--props")
                  if a.compat:
                      cmd.append("--compat")
                  proc = subprocess.run(cmd, text=True, capture_output=True, check=True)
                  data = json.loads(proc.stdout.strip().splitlines()[-1])
                  pair[side] = data
                  vals[side].append(data["rate"])
                  cpus[side].append(data["cpu_us"])
              ratios.append(pair["candidate"]["rate"] / pair["base"]["rate"])
          def cv(items):
              return statistics.stdev(items) / statistics.mean(items) * 100 if len(items) > 1 else 0.0
          out = {
              "base_median": statistics.median(vals["base"]),
              "candidate_median": statistics.median(vals["candidate"]),
              "base_cv_pct": cv(vals["base"]),
              "candidate_cv_pct": cv(vals["candidate"]),
              "ratio_median": statistics.median(ratios),
              "ratio_min": min(ratios),
              "ratio_max": max(ratios),
              "wins": sum(r > 1.0 for r in ratios),
              "repeat": len(ratios),
              "cpu_ratio_median": statistics.median(cpus["candidate"]) / statistics.median(cpus["base"]),
              "ratios": ratios,
          }
          Path(a.output).write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Strict A/A noise control
        shell: bash
        run: |
          set -euo pipefail
          valid=0
          for attempt in 1 2; do
            python "$JOB_ROOT/pairs.py" \
              --base base --candidate base --protocol 311 --batch 32 \
              --count 80000 --payload 256 --repeat 9 \
              --worker "$JOB_ROOT/worker.py" --python "$JOB_ROOT/venv/bin/python" \
              --output "$JOB_ROOT/aa-$attempt.json"
            if python - "$JOB_ROOT/aa-$attempt.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          ok=(0.97 <= d['ratio_median'] <= 1.03 and d['base_cv_pct'] <= 5.0 and d['candidate_cv_pct'] <= 5.0)
          print('A/A valid:', ok, d)
          raise SystemExit(0 if ok else 2)
          PY
            then
              cp "$JOB_ROOT/aa-$attempt.json" "$JOB_ROOT/aa.json"
              valid=1
              break
            fi
            "$JOB_ROOT/venv/bin/python" base/benchmarks/runner_probe.py --output "$JOB_ROOT/runner-retry.json" --require-temperature --enforce
          done
          test "$valid" -eq 1

      - name: Paired A/B subscriber matrix
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            name="$1"; shift
            python "$JOB_ROOT/pairs.py" \
              --base base --candidate candidate --repeat 11 \
              --worker "$JOB_ROOT/worker.py" --python "$JOB_ROOT/venv/bin/python" \
              --output "$JOB_ROOT/$name.json" "$@"
          }
          run_case v311-b32 --protocol 311 --batch 32 --count 100000 --payload 256
          run_case v311-b256 --protocol 311 --batch 256 --count 100000 --payload 256
          run_case v5-b32 --protocol 5 --batch 32 --count 70000 --payload 256
          run_case v5-props-b32 --protocol 5 --batch 32 --count 50000 --payload 256 --props
          run_case v311-16k --protocol 311 --batch 32 --count 10000 --payload 16384
          run_case v5-16k --protocol 5 --batch 32 --count 8000 --payload 16384
          run_case compat-v311 --protocol 311 --batch 32 --count 70000 --payload 256 --compat
          run_case compat-v5-props --protocol 5 --batch 32 --count 40000 --payload 256 --props --compat

      - name: Evaluate candidate gates
        shell: bash
        run: |
          python - "$JOB_ROOT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          gates={
              'v311-b32': (1.10, 9),
              'v311-b256': (1.10, 9),
              'v5-b32': (1.08, 9),
              'v5-props-b32': (1.05, 9),
              'v311-16k': (0.98, 7),
              'v5-16k': (0.98, 7),
              'compat-v311': (1.08, 9),
              'compat-v5-props': (1.03, 8),
          }
          failed=[]
          lines=[]
          for name,(minimum,wins) in gates.items():
              d=json.loads((root/f'{name}.json').read_text())
              ok=d['ratio_median'] >= minimum and d['wins'] >= wins
              lines.append(f"{name}: ratio={d['ratio_median']:.4f}, wins={d['wins']}/{d['repeat']}, cpu={d['cpu_ratio_median']:.4f}, CV={d['base_cv_pct']:.2f}%/{d['candidate_cv_pct']:.2f}% -> {'PASS' if ok else 'FAIL'}")
              if not ok:
                  failed.append(name)
          summary='\n'.join(lines)+'\n'
          (root/'summary.txt').write_text(summary)
          print(summary)
          if failed:
              raise SystemExit('failed gates: '+', '.join(failed))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr333-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.JOB_ROOT }}/*.json
            ${{ env.JOB_ROOT }}/summary.txt
          if-no-files-found: warn
