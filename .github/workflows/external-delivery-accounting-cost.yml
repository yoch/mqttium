name: External delivery accounting cost

on:
  push:
    branches:
      - agent/external-delivery-accounting
    paths:
      - .github/workflows/external-delivery-accounting-cost.yml

permissions:
  contents: read

jobs:
  cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9207c6cebccbb0a7eb80476619a8ef0b016e14a6
          path: main
      - uses: actions/checkout@v7
        with:
          ref: e51d4218d0d1cfd6e1fa9f692f148ce125ab11a9
          path: prototype
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: refined
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run rotated fixed-work matrix
        run: |
          mkdir -p /tmp/external-accounting-cost
          cat > /tmp/external-accounting-cost/bench.py <<'PY'
          from __future__ import annotations

          import argparse
          import gc
          import json
          import os
          import statistics
          import subprocess
          import sys
          import time
          from pathlib import Path

          VARIANTS = ("main", "prototype", "refined")
          MODES = ("callback", "iterator", "both")
          STAGES = ("full", "reservation")

          def worker(args: argparse.Namespace) -> None:
              from mqttium.api import AsyncClient
              from mqttium.types import Message

              payload = b"p" * 65_536
              topic = "bench/native-hotpath/telemetry"
              client = AsyncClient(
                  max_pending_delivery_bytes=1 << 40,
                  message_delivery="both" if args.mode == "both" else args.mode,
              )
              logical_bytes = client._delivery_logical_size(
                  Message(topic=topic, payload=payload)
              )
              references = 2 if args.mode == "both" else 1
              callback_delivery = args.mode in {"callback", "both"}
              reused = Message(topic=topic, payload=payload)

              def reserve(message: Message):
                  if args.variant == "refined":
                      return client._try_reserve_delivery(logical_bytes, references)
                  return client._try_reserve_delivery(
                      message,
                      references,
                      logical_bytes,
                      callback_delivery=callback_delivery,
                  )

              for _ in range(20_000):
                  message = (
                      Message(topic=topic, payload=payload)
                      if args.stage == "full"
                      else reused
                  )
                  token = reserve(message)
                  if token is None:
                      raise RuntimeError("unexpected reservation failure")
                  for _ in range(references):
                      client._release_delivery_reference_nowait(token)

              gc.collect()
              started = time.perf_counter_ns()
              for _ in range(args.iterations):
                  message = (
                      Message(topic=topic, payload=payload)
                      if args.stage == "full"
                      else reused
                  )
                  token = reserve(message)
                  if token is None:
                      raise RuntimeError("unexpected reservation failure")
                  for _ in range(references):
                      client._release_delivery_reference_nowait(token)
              elapsed_ns = time.perf_counter_ns() - started
              if client.pending_delivery_bytes != 0:
                  raise RuntimeError(
                      f"delivery accounting leaked {client.pending_delivery_bytes} bytes"
                  )
              print(
                  json.dumps(
                      {
                          "variant": args.variant,
                          "mode": args.mode,
                          "stage": args.stage,
                          "iterations": args.iterations,
                          "ns_per_operation": elapsed_ns / args.iterations,
                      }
                  )
              )

          def parent(args: argparse.Namespace) -> None:
              roots = {variant: Path(variant).resolve() for variant in VARIANTS}
              samples = []
              for cycle in range(args.cycles):
                  order = list(VARIANTS[cycle % 3 :] + VARIANTS[: cycle % 3])
                  if cycle % 2:
                      order.reverse()
                  for stage in STAGES:
                      for mode in MODES:
                          for variant in order:
                              env = os.environ.copy()
                              env["PYTHONPATH"] = str(roots[variant] / "src")
                              completed = subprocess.run(
                                  [
                                      sys.executable,
                                      __file__,
                                      "--worker",
                                      "--variant",
                                      variant,
                                      "--mode",
                                      mode,
                                      "--stage",
                                      stage,
                                      "--iterations",
                                      str(args.iterations),
                                  ],
                                  check=True,
                                  capture_output=True,
                                  text=True,
                                  env=env,
                              )
                              sample = json.loads(completed.stdout.splitlines()[-1])
                              sample["cycle"] = cycle
                              sample["order"] = order
                              samples.append(sample)
                              print(
                                  f"{cycle=} {stage=} {mode=} {variant=} "
                                  f"ns={sample['ns_per_operation']:.1f}",
                                  flush=True,
                              )

              summaries = []
              for stage in STAGES:
                  for mode in MODES:
                      selected = [
                          sample
                          for sample in samples
                          if sample["stage"] == stage and sample["mode"] == mode
                      ]
                      medians = {
                          variant: statistics.median(
                              sample["ns_per_operation"]
                              for sample in selected
                              if sample["variant"] == variant
                          )
                          for variant in VARIANTS
                      }
                      paired = {}
                      for numerator, denominator in (
                          ("prototype", "main"),
                          ("refined", "main"),
                          ("refined", "prototype"),
                      ):
                          deltas = []
                          for cycle in range(args.cycles):
                              num = next(
                                  sample["ns_per_operation"]
                                  for sample in selected
                                  if sample["cycle"] == cycle
                                  and sample["variant"] == numerator
                              )
                              den = next(
                                  sample["ns_per_operation"]
                                  for sample in selected
                                  if sample["cycle"] == cycle
                                  and sample["variant"] == denominator
                              )
                              deltas.append((num / den - 1.0) * 100.0)
                          paired[f"{numerator}_vs_{denominator}"] = {
                              "median_pct": statistics.median(deltas),
                              "cycle_deltas_pct": deltas,
                              "faster_cycles": sum(delta < 0 for delta in deltas),
                          }
                      summaries.append(
                          {
                              "stage": stage,
                              "mode": mode,
                              "median_ns": medians,
                              "comparisons": paired,
                          }
                      )

              payload = {
                  "cycles": args.cycles,
                  "iterations": args.iterations,
                  "summaries": summaries,
                  "samples": samples,
              }
              Path(args.output).write_text(json.dumps(payload, indent=2) + "\n")
              print(json.dumps(summaries, indent=2))

          parser = argparse.ArgumentParser()
          parser.add_argument("--worker", action="store_true")
          parser.add_argument("--variant", choices=VARIANTS)
          parser.add_argument("--mode", choices=MODES)
          parser.add_argument("--stage", choices=STAGES)
          parser.add_argument("--iterations", type=int, default=300_000)
          parser.add_argument("--cycles", type=int, default=9)
          parser.add_argument(
              "--output", default="/tmp/external-accounting-cost/cost.json"
          )
          parsed = parser.parse_args()
          worker(parsed) if parsed.worker else parent(parsed)
          PY
          python /tmp/external-accounting-cost/bench.py \
            --cycles 9 \
            --iterations 300000 \
            --output /tmp/external-accounting-cost/cost.json \
            | tee /tmp/external-accounting-cost/cost.txt
      - uses: actions/upload-artifact@v7
        with:
          name: external-delivery-accounting-cost-${{ github.run_id }}
          path: /tmp/external-accounting-cost/cost.*
          retention-days: 30
