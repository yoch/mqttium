name: Published beta resilience smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published MQTTium version to validate
        required: true
        default: 1.0.0rc1
        type: string
  schedule:
    - cron: "31 5 1 * *"

permissions:
  contents: read

concurrency:
  group: published-beta-resilience-${{ github.event.inputs.version || '1.0.0rc1' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tls-and-sqlite:
    runs-on: ubuntu-24.04
    env:
      MQTTIUM_VERSION: ${{ github.event.inputs.version || '1.0.0rc1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install published wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --only-binary=mqttium \
            "mqttium==$MQTTIUM_VERSION"
          python -m pip check
      - name: Start TLS Mosquitto listener
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto openssl
          mkdir -p /tmp/mqttium-beta-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=MQTTium Beta Test CA' \
            -keyout /tmp/mqttium-beta-tls/ca.key \
            -out /tmp/mqttium-beta-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes \
            -subj '/CN=localhost' \
            -keyout /tmp/mqttium-beta-tls/server.key \
            -out /tmp/mqttium-beta-tls/server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' \
            > /tmp/mqttium-beta-tls/server.ext
          openssl x509 -req -days 1 \
            -in /tmp/mqttium-beta-tls/server.csr \
            -CA /tmp/mqttium-beta-tls/ca.crt \
            -CAkey /tmp/mqttium-beta-tls/ca.key \
            -CAcreateserial \
            -extfile /tmp/mqttium-beta-tls/server.ext \
            -out /tmp/mqttium-beta-tls/server.crt
          chmod 644 /tmp/mqttium-beta-tls/server.key
          cat > /tmp/mqttium-beta-tls/mosquitto.conf <<'EOF'
          listener 18884 127.0.0.1
          allow_anonymous true
          persistence false
          cafile /tmp/mqttium-beta-tls/ca.crt
          certfile /tmp/mqttium-beta-tls/server.crt
          keyfile /tmp/mqttium-beta-tls/server.key
          EOF
          mosquitto -c /tmp/mqttium-beta-tls/mosquitto.conf -d
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/18884) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Exercise installed TLS client
        run: |
          python -I tests/installed_distribution_resilience_smoke.py tls \
            --expected-version "$MQTTIUM_VERSION" \
            --host localhost \
            --port 18884 \
            --ca-file /tmp/mqttium-beta-tls/ca.crt
      - name: Write SQLite state in one process
        run: |
          python -I tests/installed_distribution_resilience_smoke.py sqlite-write \
            --expected-version "$MQTTIUM_VERSION" \
            --database /tmp/mqttium-beta-inflight.sqlite
      - name: Reopen and settle SQLite state in a new process
        run: |
          python -I tests/installed_distribution_resilience_smoke.py sqlite-read \
            --expected-version "$MQTTIUM_VERSION" \
            --database /tmp/mqttium-beta-inflight.sqlite
