name: Temporary PR436 replay

on:
  push:
    branches: [mission/internal-test-seam-cleanup]

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replay validated final diff onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 114ed2429703ec7e8f34bf24b815b1f7aa0ca006 a5f693224f511c4f5330b5336a2e1504adb907ab
          git diff --binary 114ed2429703ec7e8f34bf24b815b1f7aa0ca006 a5f693224f511c4f5330b5336a2e1504adb907ab > /tmp/pr436.patch
          git apply --3way --index /tmp/pr436.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/reports/MISSION-INTERNAL-TEST-SEAM-CLEANUP.md')
          text = p.read_text()
          text = text.replace(
              'Base: `main@114ed2429703ec7e8f34bf24b815b1f7aa0ca006`',
              'Base: `main@95786d44cc45054b8b813951e90df92390e0338b`',
          )
          p.write_text(text)
          PY
          python -m pip install 'ruff>=0.16'
          ruff format src tests benchmarks tools
          ruff check --fix src tests benchmarks tools
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests benchmarks docs/reports/MISSION-INTERNAL-TEST-SEAM-CLEANUP.md
          git commit -m 'refactor: remove obsolete internal test seams'
          git push origin HEAD:mission/internal-test-seam-cleanup
