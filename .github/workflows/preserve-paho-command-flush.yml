name: Preserve Paho command flush semantics

on:
  push:
    branches:
      - agent/paho-native-publish-boundary

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CGW_PUSH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore awaited off-thread flush
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mqttium/compat/paho.py')
          text = path.read_text()
          old = '''                if flush_effects:
                              self._async._finalize_loop_commands()
          '''
          new = '''                if flush_effects:
                              await self._async._flush_effects()
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one handoff flush, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/preserve-paho-command-flush.yml').unlink()
          PY
      - name: Validate
        run: |
          python -m pip install -e '.[dev]'
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src
          PYTHONPATH=. pytest -q tests/unit/test_compat_confinement.py tests/unit/test_compat_paho.py tests/unit/test_native_publish_nowait.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve awaited Paho command flush semantics"
          git push origin HEAD:agent/paho-native-publish-boundary
