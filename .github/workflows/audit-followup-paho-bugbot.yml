name: Audit follow-up Paho Bugbot findings

on:
  push:
    branches:
      - agent/harden-paho-compat-audit
    paths:
      - .github/workflows/audit-followup-paho-bugbot.yml

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-paho-compat-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated lifecycle follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/mqttium/compat/paho.py')
          s = p.read_text()
          old = '''    def loop_start(self) -> None:\n        with self._loop_state_lock:\n            if self._thread is not None and self._thread.is_alive():\n                return\n            self._started.clear()\n            self._stopping.clear()\n            thread = threading.Thread(target=self._run_loop, name="mqttium-paho-loop", daemon=True)\n            self._thread = thread\n            try:\n                thread.start()\n            except BaseException:\n                if self._thread is thread:\n                    self._thread = None\n                raise\n        if not self._started.wait(timeout=5.0):\n            raise RuntimeError("Failed to start background loop")\n'''
          new = '''    def loop_start(self) -> None:\n        while True:\n            stopping_thread: threading.Thread | None = None\n            with self._loop_state_lock:\n                thread = self._thread\n                if thread is not None and thread.is_alive():\n                    if self._stopping.is_set():\n                        stopping_thread = thread\n                    else:\n                        started = self._started\n                        break\n                else:\n                    self._started.clear()\n                    self._stopping.clear()\n                    thread = threading.Thread(\n                        target=self._run_loop, name="mqttium-paho-loop", daemon=True\n                    )\n                    self._thread = thread\n                    try:\n                        thread.start()\n                    except BaseException:\n                        if self._thread is thread:\n                            self._thread = None\n                        raise\n                    started = self._started\n                    break\n\n            assert stopping_thread is not None\n            if stopping_thread is threading.current_thread():\n                raise RuntimeError("Cannot restart a stopping network loop from its own thread")\n            stopping_thread.join(timeout=5.0)\n            if stopping_thread.is_alive():\n                raise RuntimeError("Previous background loop did not stop")\n\n        if not started.wait(timeout=5.0):\n            raise RuntimeError("Failed to start background loop")\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''            if pending:\n                loop.run_until_complete(asyncio.gather(*pending, return_exceptions=True))\n            loop.close()\n\n    def _submit(\n'''
          new = '''            if pending:\n                loop.run_until_complete(asyncio.gather(*pending, return_exceptions=True))\n            loop.close()\n            with self._loop_state_lock:\n                if self._loop is loop:\n                    self._loop = None\n                if self._thread is threading.current_thread():\n                    self._thread = None\n\n    def _submit(\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/unit/test_compat_paho_audit_regressions.py')
          s = p.read_text()
          anchor = '''\n\n@pytest.mark.asyncio\nasync def test_wait_for_publish_rejects_network_event_loop() -> None:\n'''
          inserted = '''\n\ndef test_concurrent_loop_start_waits_for_existing_thread_readiness(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    """A caller that loses the creation race must still wait for loop readiness."""\n    client = Client()\n    real_thread = threading.Thread\n    fake_started = threading.Event()\n\n    class DelayedNetworkThread:\n        def __init__(self) -> None:\n            self._alive = False\n\n        def start(self) -> None:\n            self._alive = True\n            fake_started.set()\n\n        def is_alive(self) -> bool:\n            return self._alive\n\n        def join(self, timeout: float | None = None) -> None:\n            del timeout\n            self._alive = False\n\n    monkeypatch.setattr(\n        paho.threading,\n        "Thread",\n        lambda *args, **kwargs: DelayedNetworkThread(),\n    )\n\n    returned = [threading.Event(), threading.Event()]\n\n    def call_start(index: int) -> None:\n        client.loop_start()\n        returned[index].set()\n\n    first = real_thread(target=call_start, args=(0,))\n    first.start()\n    assert fake_started.wait(timeout=1.0)\n\n    second = real_thread(target=call_start, args=(1,))\n    second.start()\n    time.sleep(0.05)\n    assert not returned[0].is_set()\n    assert not returned[1].is_set()\n\n    client._started.set()\n    first.join(timeout=1.0)\n    second.join(timeout=1.0)\n    assert returned[0].is_set()\n    assert returned[1].is_set()\n    client._thread = None\n'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, inserted + anchor, 1)
          old = '''    assert errors == []\n\n    # Clear the now-stale references left by the self-stop path.\n    client.loop_stop()\n'''
          new = '''    assert errors == []\n    assert client._thread is None\n    assert client._loop is None\n\n    client.loop_start()\n    restarted_loop = client._loop\n    restarted_thread = client._thread\n    assert restarted_loop is not None and restarted_loop.is_running()\n    assert restarted_thread is not None and restarted_thread.is_alive()\n    client.loop_stop()\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/audit-followup-paho-bugbot.yml
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,security]'
      - name: Format exact follow-up and validate tree
        shell: bash
        run: |
          set -euo pipefail
          ruff format src/mqttium/compat/paho.py tests/unit/test_compat_paho_audit_regressions.py
          git add src/mqttium/compat/paho.py tests/unit/test_compat_paho_audit_regressions.py
          git diff --cached --check
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
      - name: Commit validated follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close Paho loop lifecycle races found in review'
          git push origin HEAD:agent/harden-paho-compat-audit
