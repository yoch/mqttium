name: ARM64 Finalization Soak

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Reconnect/publish cycles per protocol
        required: false
        default: "20"
      messages_per_cycle:
        description: QoS 1 messages per cycle
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: arm64-finalization
  cancel-in-progress: false

jobs:
  soak:
    name: ARM64 soak / MQTT ${{ matrix.protocol }}
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        protocol: ["311", "5"]
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify ARM64 host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v mosquitto

      - name: Create isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-soak-venv"
          rm -rf "$venv"
          python -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install -e ".[benchmark]"

      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-soak"
          rm -rf "$root"
          mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          allow_anonymous true
          persistence false
          EOF
          mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.2
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Run reconnect and backpressure soak
        run: |
          python benchmarks/soak.py \
            --port 11883 \
            --protocol "${{ matrix.protocol }}" \
            --cycles "${{ inputs.cycles }}" \
            --messages-per-cycle "${{ inputs.messages_per_cycle }}" \
            --output "$RUNNER_TEMP/mqttium-soak/result-${{ matrix.protocol }}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-soak-${{ matrix.protocol }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-soak/*.json
            ${{ runner.temp }}/mqttium-soak/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-soak/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
