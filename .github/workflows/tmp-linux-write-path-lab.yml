name: TEMP Linux Write Path Lab

on:
  pull_request:
    branches: [main]
    paths:
      - src/sitecustomize.py
      - benchmarks/experimental_write_paths.py
      - .github/workflows/tmp-linux-write-path-lab.yml
      - .github/workflows/tmp-arm64-write-path-lab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-linux-write-path-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out experimental candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start raw TCP sink
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mqttium-linux-write-lab"
          cat > "$RUNNER_TEMP/mqttium-linux-write-lab/sink.py" <<'PY'
          import socket

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", 11885))
              server.listen()
              while True:
                  conn, _ = server.accept()
                  with conn:
                      while conn.recv(1024 * 1024):
                          pass
          PY
          python -u "$RUNNER_TEMP/mqttium-linux-write-lab/sink.py" > "$RUNNER_TEMP/mqttium-linux-write-lab/sink.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/mqttium-linux-write-lab/sink.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11885) >/dev/null 2>&1 && exit 0
            sleep 0.05
          done
          exit 1

      - name: Compare write primitives
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-linux-write-lab"
          python benchmarks/experimental_write_paths.py \
            --host 127.0.0.1 --port 11885 \
            --output "$out/write-paths-${{ matrix.python-version }}.json" \
            --summary-output "$out/write-paths-${{ matrix.python-version }}.md"
          cat "$out/write-paths-${{ matrix.python-version }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload primitive measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-linux-write-primitives-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-linux-write-lab/*.json
            ${{ runner.temp }}/mqttium-linux-write-lab/*.md
            ${{ runner.temp }}/mqttium-linux-write-lab/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Stop raw TCP sink
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-linux-write-lab/sink.pid"
          if [ -f "$pidfile" ]; then
            kill "$(cat "$pidfile")" 2>/dev/null || true
          fi

  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out experimental candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out rc7 baseline
        uses: actions/checkout@v7
        with:
          ref: v1.0.0rc7
          path: base
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Mosquitto
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get install -y mosquitto mosquitto-clients

      - name: Start isolated Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-linux-write-lab"
          mkdir -p "$out"
          cat > "$out/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11884 127.0.0.1
          EOF
          mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "$!" > "$out/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11884) >/dev/null 2>&1 && exit 0
            sleep 0.05
          done
          cat "$out/mosquitto.log"
          exit 1

      - name: Short cooperative-handoff sweep
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mqttium-linux-write-lab"
          for threshold in 3 7 15 31; do
            echo "=== queued threshold $threshold ==="
            MQTTIUM_EXPERIMENT_HANDOFF_QUEUED="$threshold" \
              python candidate/benchmarks/paired_network.py \
                --base-root base --candidate-root candidate \
                --host 127.0.0.1 --port 11884 \
                --policy advisory --repeat 4 \
                --windows 64,128 --protocols 311 --payloads 64,4096 \
                --count-small 2500 --count-large 1200 \
                --target-sample-seconds 0.35 --max-count 12000 \
                --output "$out/handoff-$threshold.json" \
                --summary-output "$out/handoff-$threshold.md"
          done

      - name: Summarize hosted handoff sweep
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/mqttium-linux-write-lab" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          print("\n## Hosted Linux cooperative handoff sweep\n")
          print("| queued threshold | payload | window | throughput vs rc7 | delivery p50 vs rc7 | delivery p95 vs rc7 |")
          print("|---:|---:|---:|---:|---:|---:|")
          for threshold in (3, 7, 15, 31):
              payload = json.loads((root / f"handoff-{threshold}.json").read_text())
              for scenario in payload["scenarios"]:
                  p50 = scenario["candidate_median_p50_ms"] / scenario["base_median_p50_ms"]
                  p95 = scenario["candidate_median_p95_ms"] / scenario["base_median_p95_ms"]
                  print(
                      f"| {threshold} | {scenario['payload_bytes']} | {scenario['window']} | "
                      f"{scenario['median_candidate_over_base_ack']:.4f}× | {p50:.4f}× | {p95:.4f}× |"
                  )
          PY

      - name: Upload hosted measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-linux-write-path-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-linux-write-lab/*.json
            ${{ runner.temp }}/mqttium-linux-write-lab/*.md
            ${{ runner.temp }}/mqttium-linux-write-lab/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-linux-write-lab/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
