name: Direct ingress final performance and RTT

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/direct-ingress-final-perf-rtt.yml

permissions:
  contents: read

concurrency:
  group: direct-ingress-final-perf-rtt
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 1a2c8e52efebee845e507a35e1048d994f1b074a
  BASE_SHA: 1b52cbdf642d7b1ebe89db24ca754e949cb23322
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
  BENCHTOOLS_SHA: 3369317e64bb164b672bdc4b634952fb904bdbf4
  PAYLOAD_SIZE: "65536"
  OFFER_MSGS_S: "14000"

jobs:
  qualify:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BENCHTOOLS_SHA }}
          path: benchtools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - name: Verify exact environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C benchtools rev-parse HEAD)" = "$BENCHTOOLS_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(cat /proc/sys/kernel/randomize_va_space)" != '0'
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          version="$({ mosquitto -h 2>&1 || true; } | python3 -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"mosquitto version\s+([0-9]+(?:\.[0-9]+)+)",t,re.I); print(m.group(1) if m else "")')"
          test "$version" = '2.1.2'
          out="$RUNNER_TEMP/direct-ingress-final-perf-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out/saturated" "$out/rtt"
          echo "FINAL_OUT=$out" >> "$GITHUB_ENV"
          cc -O3 -pthread harness/scripts/mqtt_hammer.c -o "$out/mqtt_hammer"
      - name: Start saturated broker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$FINAL_OUT/saturated/mosquitto.conf" <<'EOF'
          listener 11891 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$FINAL_OUT/saturated/mosquitto.conf" > "$FINAL_OUT/saturated/mosquitto.log" 2>&1 &
          echo "SAT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11891) >/dev/null 2>&1; then exit 0; fi
            sleep 0.1
          done
          exit 1
      - name: Run eight balanced saturated pairs
        shell: bash
        run: |
          set -euo pipefail
          root="$FINAL_OUT/saturated"
          : > "$root/completed.tsv"
          for block in $(seq 0 7); do
            if (( block % 2 == 0 )); then
              arms=(base candidate)
            else
              arms=(candidate base)
            fi
            pos=0
            for arm in "${arms[@]}"; do
              idx=$((block * 2 + pos)); pos=$((pos + 1))
              if [ "$arm" = base ]; then src="$PWD/base/src"; else src="$PWD/candidate/src"; fi
              topic="bench/direct-final/${GITHUB_RUN_ID}/${idx}"
              ready="$root/ready-$idx"
              sub="$root/sub-$idx.json"
              pub="$root/pub-$idx.json"
              rm -f "$ready" "$sub" "$pub"
              taskset -c 0 env PYTHONPATH="$src" python3 benchtools/tools/mqtt_saturated_finalists_probe.py \
                subscriber --arm "$arm" --host 127.0.0.1 --port 11891 --topic "$topic" \
                --payload-size "$PAYLOAD_SIZE" --warmup-s 0.5 --duration-s 1.5 \
                --broker-pid "$SAT_BROKER_PID" --ready-file "$ready" --output "$sub" \
                > "$root/sub-$idx.log" 2>&1 &
              subpid=$!
              for _ in $(seq 1 100); do
                [ -f "$ready" ] && break
                kill -0 "$subpid" 2>/dev/null || { cat "$root/sub-$idx.log"; exit 1; }
                sleep 0.05
              done
              test -f "$ready"
              taskset -c 2 "$FINAL_OUT/mqtt_hammer" pub --host 127.0.0.1 --port 11891 \
                --topic "$topic" --clients 2 --payload "$PAYLOAD_SIZE" --duration 3 --rate "$OFFER_MSGS_S" \
                > "$pub" 2> "$root/pub-$idx.log" &
              pubpid=$!
              if ! wait "$subpid"; then
                cat "$root/sub-$idx.log"
                kill "$pubpid" 2>/dev/null || true
                exit 1
              fi
              if ! wait "$pubpid"; then cat "$root/pub-$idx.log"; exit 1; fi
              printf '%s\t%s\t%s\n' "$idx" "$block" "$arm" >> "$root/completed.tsv"
              sleep 0.10
            done
          done
      - name: Qualify saturated matrix
        shell: bash
        run: |
          set -euo pipefail
          FINAL_OUT="$FINAL_OUT" python3 - <<'PY'
          import json, math, os, statistics
          from pathlib import Path
          root=Path(os.environ['FINAL_OUT'])/'saturated'
          target=float(os.environ['OFFER_MSGS_S']); payload=float(os.environ['PAYLOAD_SIZE'])
          rows=[]
          for line in (root/'completed.tsv').read_text().splitlines():
              idx_s,block_s,arm=line.split('\t'); idx=int(idx_s); block=int(block_s)
              r=json.loads((root/f'sub-{idx}.json').read_text())
              p=json.loads((root/f'pub-{idx}.json').read_text())
              offer_msgs=float(p['msgs_per_s']); offer_mib=offer_msgs*payload/(1024*1024)
              mib=r['payload_bytes']/(1024*1024)
              r.update(idx=idx,block=block,arm=arm,offer_msgs_s=offer_msgs,offer_mib_s=offer_mib)
              r['publisher_margin']=offer_mib/r['payload_mib_s']
              r['cpu_per_mib']=r['ru_cpu_s']/mib
              r['stime_per_mib']=r['ru_stime_s']/mib
              r['qualified']=(
                  offer_msgs >= target*0.97
                  and r['publisher_margin'] >= 1.02
                  and r['sut_cpu_pct'] >= 90.0
                  and (r['broker_cpu_pct'] or 0.0) < 90.0
                  and r['ru_majflt'] == 0
                  and (r['broker_majflt'] or 0) == 0
              )
              rows.append(r)
          def gm(xs): return math.exp(statistics.mean(math.log(x) for x in xs))
          pairs=[]
          for block in range(8):
              rs={r['arm']:r for r in rows if r['block']==block}; assert set(rs)=={'base','candidate'}
              b,c=rs['base'],rs['candidate']
              sr=None if b['stime_per_mib']<=0 or c['stime_per_mib']<=0 else c['stime_per_mib']/b['stime_per_mib']
              pairs.append({
                  'block':block,
                  'qualified':b['qualified'] and c['qualified'],
                  'throughput_ratio':c['payload_mib_s']/b['payload_mib_s'],
                  'cpu_per_mib_ratio':c['cpu_per_mib']/b['cpu_per_mib'],
                  'stime_per_mib_ratio':sr,
              })
          def med(arm,key): return statistics.median(r[key] for r in rows if r['arm']==arm)
          st=[p['stime_per_mib_ratio'] for p in pairs if p['stime_per_mib_ratio'] is not None]
          summary={
              'base_sha':os.environ['BASE_SHA'],'candidate_sha':os.environ['CANDIDATE_SHA'],
              'bench_sha':os.environ['BENCH_SHA'],'offer_target_msgs_s':target,
              'offer_target_mib_s':target*payload/(1024*1024),
              'all_cells_qualified':all(r['qualified'] for r in rows),
              'pairs':pairs,
              'throughput_geomean_ratio':gm([p['throughput_ratio'] for p in pairs]),
              'cpu_per_mib_geomean_ratio':gm([p['cpu_per_mib_ratio'] for p in pairs]),
              'stime_per_mib_geomean_ratio':gm(st) if st else None,
              'base':{k:med('base',k) for k in ('payload_mib_s','sut_cpu_pct','broker_cpu_pct','ru_cpu_s','ru_stime_s','ru_minflt','publisher_margin','offer_mib_s')},
              'candidate':{k:med('candidate',k) for k in ('payload_mib_s','sut_cpu_pct','broker_cpu_pct','ru_cpu_s','ru_stime_s','ru_minflt','publisher_margin','offer_mib_s')},
              'cells':rows,
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          assert summary['all_cells_qualified']
          PY
      - name: Stop saturated broker
        if: always()
        shell: bash
        run: |
          [ -n "${SAT_BROKER_PID:-}" ] && kill "$SAT_BROKER_PID" 2>/dev/null || true
      - name: Prepare RTT environment
        shell: bash
        run: |
          set -euo pipefail
          out="$FINAL_OUT/rtt"
          python3 -m venv "$out/venv"
          . "$out/venv/bin/activate"
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e './harness[dev,mqttium]' 'psutil>=6,<8' >/dev/null
          cat > "$out/mosquitto.conf" <<'EOF'
          listener 11892 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "RTT_BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/11892) >/dev/null 2>&1; then exit 0; fi
            sleep 0.1
          done
          exit 1
      - name: Run exact four-block RTT gate
        shell: bash
        run: |
          set -euo pipefail
          . "$FINAL_OUT/rtt/venv/bin/activate"
          PYTHONPATH=harness/src python -m mqtt_client_bench.layout_runner \
            --worker-aslr system --entrypoint version_compare -- \
            --client mqttium --baseline-path base --candidate-path candidate \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate 3942 \
            --pacer-mode external --blocks 4 --max-block-retries 0 --profile standard \
            --broker 127.0.0.1:11892 --broker-pid "$RTT_BROKER_PID" \
            --output "$FINAL_OUT/rtt/base-vs-candidate.json" | tee "$FINAL_OUT/rtt/base-vs-candidate.txt"
      - name: Stop RTT broker
        if: always()
        shell: bash
        run: |
          [ -n "${RTT_BROKER_PID:-}" ] && kill "$RTT_BROKER_PID" 2>/dev/null || true
      - name: Upload final performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-final-perf-rtt-${{ github.run_id }}
          path: ${{ env.FINAL_OUT }}
          if-no-files-found: error
          retention-days: 30
