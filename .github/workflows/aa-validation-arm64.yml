name: Targeted A/A validation ARM64

on:
  push:
    branches: [bench/matched-load-arm64-rc13]
    paths:
      - .github/workflows/aa-validation-arm64.yml

permissions:
  contents: read

concurrency:
  group: mqttium-benchmark-arm64
  cancel-in-progress: false

jobs:
  aa-validation:
    name: targeted A/A validation
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 240
    env:
      BENCH_SHA: 8732eddd5e072e24996ba0a3ae37338cb2ddc6fb
      MQTTIUM_VER: "1.0.0rc13"
      GMQTT_VER: "0.7.0"
      PAHO_VER: "2.1.0"
      PROFILE: smoke
      MATRIX_RUNS: "1"
      RUN_LOAD_MATRIX: "0"
      RUN_ABBA: "0"
      RUN_AA: "1"
      AA_BLOCKS: "4"
      AA_VARIANT_INDEXES: "0,4"
      AA_CONTROL_ENFORCE: "1"
      RUN_ASYNCIO_PAIR: "1"
      RUN_SYNC_REFERENCE_PAIR: "0"
    steps:
      - name: Set run-specific paths
        shell: bash
        run: |
          echo "RESULTS_DIR=$RUNNER_TEMP/mqtt-client-bench-aa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BENCH_BROKER=127.0.0.1:11883" >> "$GITHUB_ENV"

      - name: Checkout exact benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yoch/mqtt-python-client-bench
          ref: 8732eddd5e072e24996ba0a3ae37338cb2ddc6fb
          path: bench
          persist-credentials: false

      - name: Verify runner and harness provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64" || { echo "expected aarch64, got $(uname -m)"; exit 1; }
          command -v mosquitto
          command -v taskset
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process makes the runner unsafe for this benchmark." >&2
            exit 1
          fi
          cd bench
          test "$(git rev-parse HEAD)" = "$BENCH_SHA"
          git status --short

      - name: Create isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev,paho,gmqtt,mqttium]"
          pip install --force-reinstall --no-cache-dir \
            "mqttium==$MQTTIUM_VER" \
            "gmqtt==$GMQTT_VER" \
            "paho-mqtt==$PAHO_VER"
          python - <<'PY'
          from importlib.metadata import version
          assert version("mqttium") == "1.0.0rc13", version("mqttium")
          assert version("gmqtt") == "0.7.0", version("gmqtt")
          assert version("paho-mqtt") == "2.1.0", version("paho-mqtt")
          PY

      - name: Validate A/A invariants
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m unittest -v \
            tests.test_unit.CrossClientLoadTests \
            tests.test_unit.NativeRttDriveTests \
            tests.test_unit.PairwiseCapacityGateTests \
            tests.test_unit.ExternalBrokerTelemetryTests \
            tests.test_unit.RttResponderValidityTests \
            tests.test_unit.AbbaCounterbalanceTests \
            tests.test_unit.AaControlGateTests \
            tests.test_rtt_initiator

      - name: Calibrate ARM64 host identity
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m mqtt_client_bench.run calibrate-host \
            --profile standard \
            --role runner \
            --skip-ceilings

      - name: Start isolated native Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mosquitto-aa.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          broker_cpuset="$(cd bench && . .venv/bin/activate && PYTHONPATH=src python - <<'PY'
          from mqtt_client_bench.telemetry import allocate_cpuset
          print(allocate_cpuset(["sut", "broker", "loadgen", "orch"], profile="standard")["broker"])
          PY
          )"
          taskset -c "$broker_cpuset" mosquitto -c "$RUNNER_TEMP/mosquitto-aa.conf" > "$RUNNER_TEMP/mosquitto-aa.log" 2>&1 &
          pid=$!
          echo "BROKER_PID=$pid" >> "$GITHUB_ENV"
          echo "BENCH_BROKER_PID=$pid" >> "$GITHUB_ENV"
          mkdir -p "$RESULTS_DIR"
          echo "$pid" > "$RESULTS_DIR/broker.pid"
          sleep 1
          kill -0 "$pid"

      - name: Run targeted A/A validation
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          bash scripts/run_targeted_aa_validation.sh

      - name: Stop native broker
        if: always()
        shell: bash
        run: |
          if [ -n "${BROKER_PID:-}" ]; then
            kill "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

      - name: Upload A/A evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pairwise-native-rtt-aa-validation-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}
            bench/hosts/*.json
            ${{ runner.temp }}/mosquitto-aa.conf
            ${{ runner.temp }}/mosquitto-aa.log
          if-no-files-found: warn
          retention-days: 14
