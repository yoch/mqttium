name: Audit bootstrap Paho

on:
  push:
    branches:
      - agent/harden-paho-compat-audit
    paths:
      - .github/workflows/audit-bootstrap-paho.yml

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-paho-compat-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin chatgpt-workbench-jobs
          git show FETCH_HEAD:.cgw/jobs/audit-paho-20260813.b64 > /tmp/job-full.b64
          : > /tmp/job-chunks.b64
          for n in 0 1 2 3; do
            git show "FETCH_HEAD:.cgw/jobs/audit-paho-20260813.part${n}" >> /tmp/job-chunks.b64
          done
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          full = Path('/tmp/job-full.b64').read_text().strip()
          chunks = Path('/tmp/job-chunks.b64').read_text().strip()
          assert len(full) == 9082, len(full)
          assert len(chunks) == 9081, len(chunks)
          candidates = [i for i in range(len(full)) if full[:i] == chunks[:i] and full[i + 1:] == chunks[i:]]
          assert len(candidates) == 1, candidates
          i = candidates[0]
          encoded = chunks[:i] + full[i] + chunks[i:]
          assert encoded == full
          encoded += '=' * (-len(encoded) % 4)
          raw = base64.urlsafe_b64decode(encoded)
          job = json.loads(gzip.decompress(raw))
          assert 'stop_error = RuntimeError' in job['patch']
          Path('/tmp/audit.patch').write_text(job['patch'])
          PY
          git apply --check --whitespace=error-all /tmp/audit.patch
          git apply --index --whitespace=error-all /tmp/audit.patch
          git rm .github/workflows/audit-bootstrap-paho.yml
          git diff --cached --check
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,security]'
      - name: Quality and unit gates
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttium
          bandit -q -ll -r src
          python -m pytest -q tests/unit
      - name: Commit exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden Paho facade lifecycle and publish completion semantics'
          git push origin HEAD:agent/harden-paho-compat-audit
