name: ARM64 254 Direct Structural Comparison

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  direct-comparison:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Verify strict-performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          test "$governors" = "performance"
          if pgrep -a mosquitto; then
            echo 'A pre-existing mosquitto process is running; refusing benchmark host.' >&2
            exit 1
          fi

      - name: Check out exact current 254 HEAD
        uses: actions/checkout@v7
        with:
          ref: dd64ed16dfb48e2b1cd1b50ac0d5290547627916
          path: current
          persist-credentials: false

      - name: Check out experiment tree
        uses: actions/checkout@v7
        with:
          ref: dd64ed16dfb48e2b1cd1b50ac0d5290547627916
          path: variant
          persist-credentials: false

      - name: Apply delayed idle rearm variant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("variant/src/mqttium/api/_writer.py")
          text = path.read_text()
          old = """                # Reaching the idle queue wait is an independent re-arm point:\n                # it covers a batch that just drained even when no eager write\n                # scheduled the producer-side next-turn callback.\n                if queue.empty() and self._write_nowait is not None:\n                    self._eager_armed = True\n                first = await queue.get()\n"""
          new = """                # After a batch drains, defer eager re-arming by one loop turn.\n                # Already-runnable producers therefore stay on the batching path;\n                # genuine idle time restores eager before the next paced write.\n                if (\n                    queue.empty()\n                    and self._write_nowait is not None\n                    and not self._eager_armed\n                ):\n                    generation = self._eager_generation\n                    asyncio.get_running_loop().call_soon(\n                        self._rearm_eager_if_idle, generation\n                    )\n                first = await queue.get()\n"""
          if old not in text:
              raise SystemExit("expected writer block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git -C variant diff --check

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-direct-variant-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install preflight dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Strict runner preflight
        working-directory: current
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-direct-variant"
          rm -rf "$root"
          mkdir -p "$root"
          python benchmarks/runner_probe.py \
            --output "$root/preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated Mosquitto pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-direct-variant"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Compare current 254 with structural variant
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-direct-variant"
          python current/benchmarks/paired_writer_capacity.py \
            --base-root current --candidate-root variant \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 \
            --policy strict --preflight-report "$root/preflight.json" \
            --output "$root/direct.json" \
            --summary-output "$root/direct.md"

      - name: Upload direct comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-direct-variant-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-direct-variant/direct.json
            ${{ runner.temp }}/mqttium-direct-variant/direct.md
            ${{ runner.temp }}/mqttium-direct-variant/preflight.json
            ${{ runner.temp }}/mqttium-direct-variant/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-direct-variant/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
