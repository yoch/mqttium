name: ARM64 Runner Probe

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify prepared host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v openssl
          python3 --version
          mosquitto -h 2>&1 | head -n 2
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          printf 'governors=%s\n' "$governors"
          test "$governors" = "performance"
          printf 'temperature='; cat /sys/class/thermal/thermal_zone0/temp
          uptime
          if pgrep -a mosquitto; then
            echo 'A pre-existing mosquitto process is running; refusing benchmark host.' >&2
            exit 1
          fi

      - name: Check out exact benchmark harness
        uses: actions/checkout@v7
        with:
          ref: 5008d69a889d9100f7f3fb2623e6b08a72126524
          path: harness
          persist-credentials: false

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-perf-probe-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install preflight dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Strict benchmark preflight
        working-directory: harness
        run: |
          mkdir -p "$RUNNER_TEMP/mqttium-perf-probe"
          python benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/mqttium-perf-probe/preflight.json" \
            --require-temperature \
            --enforce

      - name: Upload preflight
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-perf-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/mqttium-perf-probe/preflight.json
          if-no-files-found: warn
          retention-days: 7
