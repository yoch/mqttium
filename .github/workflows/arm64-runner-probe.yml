name: ARM64 Simplification Component Isolation

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  isolate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      PRE_SHA: e443448981c56709a935332769a9e95216e3f660
      CHANGE_SHA: 832f808e413dd47fd922469110316751ba205906

    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          test "$governors" = "performance"
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate evidence" >&2
            exit 1
          fi

      - name: Check out current main benchmark harness
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_SHA }}
          path: harness
          persist-credentials: false

      - name: Check out candidate history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHANGE_SHA }}
          path: history
          fetch-depth: 0
          persist-credentials: false

      - name: Create source-isolated component variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-isolate"
          rm -rf "$root"
          mkdir -p "$root/variants/pre" "$root/results"
          git -C history archive "$PRE_SHA" | tar -x -C "$root/variants/pre"
          for name in writer engine inbound outbound full; do
            cp -a "$root/variants/pre" "$root/variants/$name"
          done
          git -C history show "$CHANGE_SHA:src/mqttium/api/_writer.py" > "$root/variants/writer/src/mqttium/api/_writer.py"
          git -C history show "$CHANGE_SHA:src/mqttium/protocol/engine.py" > "$root/variants/engine/src/mqttium/protocol/engine.py"
          git -C history show "$CHANGE_SHA:src/mqttium/protocol/inbound.py" > "$root/variants/inbound/src/mqttium/protocol/inbound.py"
          git -C history show "$CHANGE_SHA:src/mqttium/protocol/outbound.py" > "$root/variants/outbound/src/mqttium/protocol/outbound.py"
          rm -rf "$root/variants/full"
          mkdir -p "$root/variants/full"
          git -C history archive "$CHANGE_SHA" | tar -x -C "$root/variants/full"

          # Prove each single-component variant differs from predecessor only in
          # the intended source file before measuring it.
          python - <<'PY'
          import filecmp, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "mqttium-252-isolate" / "variants"
          expected = {
              "writer": "src/mqttium/api/_writer.py",
              "engine": "src/mqttium/protocol/engine.py",
              "inbound": "src/mqttium/protocol/inbound.py",
              "outbound": "src/mqttium/protocol/outbound.py",
          }
          def files(tree):
              return {str(p.relative_to(tree)) for p in tree.rglob("*") if p.is_file()}
          base_files = files(root / "pre")
          for name, changed in expected.items():
              other = root / name
              assert files(other) == base_files
              different = {
                  rel for rel in base_files
                  if not filecmp.cmp(root / "pre" / rel, other / rel, shallow=False)
              }
              assert different == {changed}, (name, different)
          PY

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-isolate-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/mqttium-252-isolate/runner.json" \
            --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-isolate"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          exit 1

      - name: Measure each component independently
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-isolate"
          printf 'variant,p50_ratio,base_p50_ms,candidate_p50_ms,completed_ratio,loop_lag_ratio,cpu_ratio\n' > "$root/isolation.csv"
          for variant in writer engine inbound outbound full; do
            out="$root/results/${variant}.json"
            python harness/benchmarks/paired_open_loop.py \
              --base-root "$root/variants/pre" \
              --candidate-root "$root/variants/$variant" \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500 --completions callback \
              --repeat 4 --count-small 4000 --target-sample-seconds 1.5 --max-count 4000 \
              --timeout 120 --cpu 2 --policy advisory \
              --preflight-report "$root/runner.json" \
              --output "$out" >/dev/null
            VARIANT="$variant" OUT="$out" python - <<'PY' >> "$root/isolation.csv"
          import csv, json, os, statistics, sys
          s = json.load(open(os.environ["OUT"]))["scenarios"][0]
          pairs = s["pairs"]
          def med(key, side):
              return statistics.median(float(p[side][key]) for p in pairs)
          p50_ratio = statistics.median(
              float(p["candidate"]["ack_latency_p50_ms"]) / float(p["base"]["ack_latency_p50_ms"])
              for p in pairs
          )
          completed_ratio = statistics.median(
              float(p["candidate"]["completed_rate"]) / float(p["base"]["completed_rate"])
              for p in pairs
          )
          lag_ratio = statistics.median(
              float(p["candidate"]["loop_lag_p95_ms"]) / max(float(p["base"]["loop_lag_p95_ms"]), 1e-9)
              for p in pairs
          )
          cpu_ratio = statistics.median(
              float(p["candidate"]["cpu_seconds"]) / float(p["base"]["cpu_seconds"])
              for p in pairs
          )
          csv.writer(sys.stdout).writerow([
              os.environ["VARIANT"], f"{p50_ratio:.6f}", f"{med('ack_latency_p50_ms','base'):.6f}",
              f"{med('ack_latency_p50_ms','candidate'):.6f}", f"{completed_ratio:.6f}",
              f"{lag_ratio:.6f}", f"{cpu_ratio:.6f}"
          ])
          PY
          done
          cat "$root/isolation.csv"

      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-component-isolation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-isolate/isolation.csv
            ${{ runner.temp }}/mqttium-252-isolate/results/*.json
            ${{ runner.temp }}/mqttium-252-isolate/runner.json
            ${{ runner.temp }}/mqttium-252-isolate/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-isolate/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
