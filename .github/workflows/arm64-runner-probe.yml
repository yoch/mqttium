name: ARM64 Simplification Scheduling Boundaries

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  isolate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      FINAL_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45

    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = "performance"
          if pgrep -a mosquitto; then exit 1; fi

      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_SHA }}
          path: base
          persist-credentials: false

      - name: Check out exact final PR 252
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FINAL_SHA }}
          path: final
          persist-credentials: false

      - name: Construct scheduling-boundary variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-boundaries"
          rm -rf "$root"
          mkdir -p "$root/results"
          for variant in launch engine engine_launch wrappers engine_wrappers; do
            cp -a final "$root/$variant"
          done

          ROOT="$root" python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])

          engine_old = '''        self._effects.append(\n            EngineEffect(kind, data, requires_delivery_mark, decoded_property_wire_size)\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        # Appends directly rather than delegating to _emit: SEND is the most\n        # frequent effect and this is one Python frame per outbound packet.\n        self._effects.append(EngineEffect(EffectKind.SEND, packet, False, None))\n'''
          engine_new = '''        self._effects.append(\n            EngineEffect(\n                kind=kind,\n                data=data,\n                requires_delivery_mark=requires_delivery_mark,\n                decoded_property_wire_size=decoded_property_wire_size,\n            )\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        self._emit(EffectKind.SEND, packet)\n'''

          launch_old = '''            if topic_bytes is not None and self.flow.try_acquire():\n                self._launch(msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes)\n                return PublishHandle(mid=mid, qos=qos)\n'''
          launch_new = '''            if self._engine.state == ConnectionState.CONNECTED and self._try_launch(\n                msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes\n            ):\n                return PublishHandle(mid=mid, qos=qos)\n'''
          launch_method = '''\n    def _try_launch(\n        self,\n        msg: OutboundMessage,\n        *,\n        _property_bytes: bytes | None = None,\n        _topic_bytes: bytes | None = None,\n    ) -> bool:\n        if not self.flow.try_acquire():\n            return False\n        try:\n            self._launch(msg, _property_bytes=_property_bytes, _topic_bytes=_topic_bytes)\n        except Exception:\n            self.flow.release()\n            raise\n        return True\n\n'''
          launch_anchor = '    def _retransmit(self, msg: OutboundMessage) -> None:\n'

          wrappers_anchor = '''    # rebinds the list, so the engine's `_effects` is the one sink. Emission\n    # calls `self._engine._emit` / `._send` directly, as InboundSession does;\n    # a forwarding wrapper here cost a Python frame per publish and per ACK.\n\n'''
          wrappers_block = '''    # rebinds the list, and `_emit` remains the single interception point for\n    # outbound effects.\n\n    def _emit(self, kind: EffectKind, data: object = None) -> None:\n        self._engine._emit(kind, data)\n\n    def _send(self, packet: WriteItem) -> None:\n        self._engine._send(packet)\n\n'''

          def rollback_engine(tree: Path) -> None:
              path = tree / 'src/mqttium/protocol/engine.py'
              text = path.read_text()
              assert text.count(engine_old) == 1
              path.write_text(text.replace(engine_old, engine_new))

          def rollback_launch(tree: Path) -> None:
              path = tree / 'src/mqttium/protocol/outbound.py'
              text = path.read_text()
              assert text.count(launch_old) == 1
              assert text.count(launch_anchor) == 1
              text = text.replace(launch_old, launch_new)
              text = text.replace(launch_anchor, launch_method + launch_anchor)
              path.write_text(text)

          def rollback_wrappers(tree: Path) -> None:
              path = tree / 'src/mqttium/protocol/outbound.py'
              text = path.read_text()
              assert text.count(wrappers_anchor) == 1
              text = text.replace(wrappers_anchor, wrappers_block)
              # Restore forwarding only at the effect/send sites changed by the
              # hotpath commit; validation/check helpers remain direct.
              replacements = {
                  '            self._engine._send(item)\n': '            self._send(item)\n',
                  '            self._engine._emit(EffectKind.PUBLISH_COMPLETE, None)\n': '            self._emit(EffectKind.PUBLISH_COMPLETE, None)\n',
                  '            self._engine._emit(EffectKind.PUBLISH_COMPLETE, mid)\n': '            self._emit(EffectKind.PUBLISH_COMPLETE, mid)\n',
                  '                self._engine._send(_encode_pubrel_success(mid))\n': '                self._send(_encode_pubrel_success(mid))\n',
                  '        self._engine._send(msg.encoded_pubrel)\n': '        self._send(msg.encoded_pubrel)\n',
                  '        self._engine._send(wire)\n': '        self._send(wire)\n',
                  '            self._engine._send(wire)\n': '            self._send(wire)\n',
                  '            self._engine._send(msg.encoded_pubrel)\n': '            self._send(msg.encoded_pubrel)\n',
              }
              for old, new in replacements.items():
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text)

          rollback_launch(root / 'launch')
          rollback_engine(root / 'engine')
          rollback_engine(root / 'engine_launch')
          rollback_launch(root / 'engine_launch')
          rollback_wrappers(root / 'wrappers')
          rollback_engine(root / 'engine_wrappers')
          rollback_wrappers(root / 'engine_wrappers')
          PY

          for variant in launch engine engine_launch wrappers engine_wrappers; do
            git -C "$root/$variant" diff --check
            grep -q 'self._eager_armed' "$root/$variant/src/mqttium/api/_writer.py"
          done
          grep -q 'def _try_launch' "$root/launch/src/mqttium/protocol/outbound.py"
          grep -q 'self._emit(EffectKind.SEND, packet)' "$root/engine/src/mqttium/protocol/engine.py"
          grep -q 'def _send(self, packet: WriteItem)' "$root/wrappers/src/mqttium/protocol/outbound.py"

      - name: Create venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-boundaries-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: base
        run: |
          python benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/mqttium-252-boundaries/runner.json" \
            --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-boundaries"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null || exit 1
            sleep 0.1
          done
          exit 1

      - name: Measure final-state variants at 2500 and 10000 msg/s
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-boundaries"
          printf 'variant,rate,p50_ratio,base_p50_ms,candidate_p50_ms,completed_ratio,loop_lag_ratio,cpu_ratio\n' > "$root/boundaries.csv"
          for variant in launch engine engine_launch wrappers engine_wrappers; do
            out="$root/results/${variant}.json"
            python base/benchmarks/paired_open_loop.py \
              --base-root base --candidate-root "$root/$variant" \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,10000 --completions callback \
              --repeat 4 --count-small 4000 --timeout 120 --cpu 2 \
              --policy advisory --preflight-report "$root/runner.json" \
              --output "$out" >/dev/null
            VARIANT="$variant" OUT="$out" python - <<'PY' >> "$root/boundaries.csv"
          import csv, json, os, statistics, sys
          for s in json.load(open(os.environ['OUT']))['scenarios']:
              pairs = s['pairs']
              ratio = lambda key: statistics.median(float(p['candidate'][key]) / max(float(p['base'][key]), 1e-9) for p in pairs)
              med = lambda side, key: statistics.median(float(p[side][key]) for p in pairs)
              csv.writer(sys.stdout).writerow([
                  os.environ['VARIANT'], int(s['target_rate']), f"{ratio('ack_latency_p50_ms'):.6f}",
                  f"{med('base','ack_latency_p50_ms'):.6f}", f"{med('candidate','ack_latency_p50_ms'):.6f}",
                  f"{ratio('completed_rate'):.6f}", f"{ratio('loop_lag_p95_ms'):.6f}", f"{ratio('cpu_seconds'):.6f}"
              ])
          PY
          done
          cat "$root/boundaries.csv"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-boundaries-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-boundaries/boundaries.csv
            ${{ runner.temp }}/mqttium-252-boundaries/results/*.json
            ${{ runner.temp }}/mqttium-252-boundaries/runner.json
            ${{ runner.temp }}/mqttium-252-boundaries/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-boundaries/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          fi
