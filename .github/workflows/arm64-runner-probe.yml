name: ARM64 Simplification Latency Scan

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45

    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          test "$governors" = "performance"
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate evidence" >&2
            exit 1
          fi

      - name: Check out exact base harness
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check out full candidate history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify endpoints and create venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          venv="$RUNNER_TEMP/mqttium-252-scan-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-scan"
          rm -rf "$root"
          mkdir -p "$root/results"
          python benchmarks/runner_probe.py \
            --output "$root/runner.json" \
            --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-scan"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          exit 1

      - name: Scan every rebased commit at the discriminating 2500 msg/s point
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-scan"
          printf 'index,sha,subject,p50_ratio,base_p50_ms,candidate_p50_ms,completed_ratio,loop_lag_ratio,cpu_ratio\n' > "$root/scan.csv"

          mapfile -t commits < <(git -C candidate rev-list --reverse "$BASE_SHA..$CANDIDATE_SHA")
          printf 'scanning %s commits\n' "${#commits[@]}"
          index=0
          for sha in "${commits[@]}"; do
            index=$((index + 1))
            git -C candidate checkout --detach --quiet "$sha"
            out="$root/results/$(printf '%02d' "$index")-${sha}.json"
            python base/benchmarks/paired_open_loop.py \
              --base-root base --candidate-root candidate \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500 --completions callback \
              --repeat 2 --count-small 2000 --target-sample-seconds 0.75 --max-count 2000 \
              --timeout 120 --cpu 2 --policy advisory \
              --preflight-report "$root/runner.json" \
              --output "$out" >/dev/null
            SHA="$sha" INDEX="$index" OUT="$out" python - <<'PY' >> "$root/scan.csv"
          import csv, json, os, statistics, subprocess, sys
          sha = os.environ["SHA"]
          index = int(os.environ["INDEX"])
          data = json.load(open(os.environ["OUT"]))
          scenario = data["scenarios"][0]
          pairs = scenario["pairs"]
          base_p50 = statistics.median(float(p["base"]["ack_latency_p50_ms"]) for p in pairs)
          cand_p50 = statistics.median(float(p["candidate"]["ack_latency_p50_ms"]) for p in pairs)
          p50_ratio = statistics.median(
              float(p["candidate"]["ack_latency_p50_ms"]) / float(p["base"]["ack_latency_p50_ms"])
              for p in pairs
          )
          completed_ratio = statistics.median(
              float(p["candidate"]["completed_rate"]) / float(p["base"]["completed_rate"])
              for p in pairs
          )
          lag_ratio = statistics.median(
              float(p["candidate"]["loop_lag_p95_ms"]) / max(float(p["base"]["loop_lag_p95_ms"]), 1e-9)
              for p in pairs
          )
          cpu_ratio = statistics.median(
              float(p["candidate"]["cpu_seconds"]) / float(p["base"]["cpu_seconds"])
              for p in pairs
          )
          subject = subprocess.check_output(
              ["git", "-C", "candidate", "show", "-s", "--format=%s", sha], text=True
          ).strip()
          csv.writer(sys.stdout).writerow([
              index, sha, subject, f"{p50_ratio:.6f}", f"{base_p50:.6f}", f"{cand_p50:.6f}",
              f"{completed_ratio:.6f}", f"{lag_ratio:.6f}", f"{cpu_ratio:.6f}"
          ])
          PY
          done
          cat "$root/scan.csv"

      - name: Upload scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-latency-scan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-scan/scan.csv
            ${{ runner.temp }}/mqttium-252-scan/results/*.json
            ${{ runner.temp }}/mqttium-252-scan/runner.json
            ${{ runner.temp }}/mqttium-252-scan/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-scan/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
