name: Rebase Simplification PR

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: write

jobs:
  rebase-252:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_MAIN: 0999d8abfe44a568209209403d7f215b18cc4eb7
      EXPECTED_HEAD: 79143941ce18fbe5b55a8a75ae9af8f5a507760d
      TARGET_BRANCH: refactor/simplification-audit-2026-08-16

    steps:
      - name: Check out trusted controller branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch and pin both rebase endpoints
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/target)" = "$EXPECTED_HEAD"
          git config user.name yoch
          git config user.email yoch.melka@gmail.com
          git checkout -B rebase-work refs/remotes/origin/target

      - name: Rebase with fail-closed writer resolution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          GIT_EDITOR=true git rebase refs/remotes/origin/main
          rc=$?
          set -e

          while [ "$rc" -ne 0 ]; do
            if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ]; then
              echo "rebase failed outside a resolvable conflict" >&2
              exit "$rc"
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "src/mqttium/api/_writer.py" ]; then
              printf 'unexpected rebase conflicts:\n' >&2
              printf '  %s\n' "${conflicts[@]}" >&2
              exit 1
            fi

            # During rebase, --ours is the already-rebased tree (new main plus
            # earlier replayed commits). Preserve #254 wholesale, then reapply
            # only #252's orthogonal write_many lookup caching change.
            git checkout --ours src/mqttium/api/_writer.py
            python - <<'PY'
          from pathlib import Path

          path = Path("src/mqttium/api/_writer.py")
          text = path.read_text()

          old = '''    async def _write_contiguous(self, transport: AsyncTransport, parts: list[bytes]) -> None:\n        if not parts:\n            return\n        write_many = getattr(transport, "write_many", None)\n        if write_many is not None:\n'''
          new = '''    async def _write_contiguous(\n        self,\n        transport: AsyncTransport,\n        write_many: Callable[[list[bytes]], Awaitable[None]] | None,\n        parts: list[bytes],\n    ) -> None:\n        if not parts:\n            return\n        if write_many is not None:\n'''
          assert text.count(old) == 1, "unexpected _write_contiguous shape"
          text = text.replace(old, new)

          old = '''        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        queue = self.queue\n'''
          new = '''        transport = self.transport\n        if transport is None:\n            raise RuntimeError("WritePump started without a transport")\n        # Resolved once per writer task rather than per batch. The local dies\n        # with the task, so unlike `_write_nowait` it needs no explicit\n        # clearing: it can never outlive the transport it was resolved from.\n        write_many = getattr(transport, "write_many", None)\n        queue = self.queue\n'''
          assert text.count(old) == 1, "unexpected _run prologue shape"
          text = text.replace(old, new)

          assert text.count("await self._write_contiguous(transport, contiguous)") == 2
          text = text.replace(
              "await self._write_contiguous(transport, contiguous)",
              "await self._write_contiguous(transport, write_many, contiguous)",
          )

          for required in (
              "self._eager_armed",
              "self._eager_generation",
              "def _rearm_eager_if_idle",
              "call_soon(self._rearm_eager_if_idle",
          ):
              assert required in text, f"lost #254 invariant: {required}"
          path.write_text(text)
          PY
            git add src/mqttium/api/_writer.py

            set +e
            GIT_EDITOR=true git rebase --continue
            rc=$?
            set -e
          done

      - name: Verify rebased tree and invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only refs/remotes/origin/main...HEAD | wc -l)" -eq 38
          python - <<'PY'
          from pathlib import Path

          expected = {
              "CHANGELOG.md",
              "benchmarks/_paired_scenarios.py",
              "docs/API-STABILITY.md",
              "docs/reports/README.md",
              "docs/reports/SIMPLIFICATION-AUDIT-2026-08-16.md",
              "src/mqttium/api/_delivery.py",
              "src/mqttium/api/_effects.py",
              "src/mqttium/api/_writer.py",
              "src/mqttium/api/async_client.py",
              "src/mqttium/api/stats.py",
              "src/mqttium/codec/buffer.py",
              "src/mqttium/codec/primitives.py",
              "src/mqttium/codec/properties.py",
              "src/mqttium/packets/_ack.py",
              "src/mqttium/packets/_bindings.py",
              "src/mqttium/packets/_common.py",
              "src/mqttium/packets/_connect.py",
              "src/mqttium/packets/_control.py",
              "src/mqttium/packets/_publish.py",
              "src/mqttium/packets/connect.py",
              "src/mqttium/packets/control.py",
              "src/mqttium/persistence/memory.py",
              "src/mqttium/persistence/sqlite.py",
              "src/mqttium/protocol/_sizing.py",
              "src/mqttium/protocol/engine.py",
              "src/mqttium/protocol/inbound.py",
              "src/mqttium/protocol/outbound.py",
              "src/mqttium/protocol/reconnect.py",
              "src/mqttium/types.py",
              "tests/unit/test_batch_receipt_progress.py",
              "tests/unit/test_client_stats.py",
              "tests/unit/test_outbound_transaction.py",
              "tests/unit/test_packet_strictness.py",
              "tests/unit/test_performance_contracts.py",
              "tests/unit/test_property_encoding_cache.py",
              "tests/unit/test_small_delivery_properties.py",
              "tests/unit/test_sqlite_migration.py",
              "tests/unit/test_store_transitions.py",
          }
          import subprocess
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "refs/remotes/origin/main...HEAD"],
              text=True,
          ).splitlines())
          assert actual == expected, (sorted(expected - actual), sorted(actual - expected))

          writer = Path("src/mqttium/api/_writer.py").read_text()
          for required in (
              "self._eager_armed",
              "self._eager_generation",
              "def _rearm_eager_if_idle",
              "call_soon(self._rearm_eager_if_idle",
              'write_many = getattr(transport, "write_many", None)',
              "_write_contiguous(transport, write_many, contiguous)",
          ):
              assert required in writer, required
          PY

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Targeted regression validation before branch rewrite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src/mqttium/api/_writer.py tests/unit/test_write_pump_eager.py tests/unit/test_batch_receipt_progress.py
          python -m pytest -q \
            tests/unit/test_write_pump_eager.py \
            tests/unit/test_batch_receipt_progress.py

      - name: Rewrite target branch with exact lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target-final"
          test "$(git rev-parse refs/remotes/origin/target-final)" = "$EXPECTED_HEAD"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
