name: ARM64 Final PR252 Validation

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: b0bbdfb21baeb7fb15f1428cf26d25ab492f731a

    steps:
      - name: Verify clean dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          python3 - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 13), sys.version
          PY
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          test "$governors" = "performance"
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate paired evidence" >&2
            exit 1
          fi

      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check out exact corrected PR252
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Verify exact endpoints and corrected invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          grep -q 'self._emit(EffectKind.SEND, packet)' candidate/src/mqttium/protocol/engine.py
          grep -q 'def _try_launch' candidate/src/mqttium/protocol/outbound.py
          grep -q 'self._eager_armed' candidate/src/mqttium/api/_writer.py
          grep -q 'write_many = getattr(transport, "write_many", None)' candidate/src/mqttium/api/_writer.py
          test -f candidate/docs/reports/SIMPLIFICATION-ARM64-REVALIDATION-2026-08-17.md

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-final-bench-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          rm -rf "$root"
          mkdir -p "$root"
          python benchmarks/runner_probe.py \
            --output "$root/runner.json" \
            --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Strict writer capacity A/A
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          python base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$root/runner.json" \
            --output "$root/capacity-aa.json" \
            --summary-output "$root/capacity-aa.md"

      - name: Strict writer capacity A/B current main vs PR252
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          python base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$root/runner.json" \
            --output "$root/capacity-ab.json" \
            --summary-output "$root/capacity-ab.md"

      - name: Strict paced latency A/A with one invalid-control retry
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          control() {
            local attempt="$1" report="$2"
            python base/benchmarks/paired_open_loop.py \
              --base-root base --candidate-root base \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,10000 --completions callback \
              --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
              --policy strict --preflight-report "$report" \
              --output "$root/latency-aa-${attempt}.json" \
              --summary-output "$root/latency-aa-${attempt}.md"
          }
          set +e
          control 1 "$root/runner.json"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          python base/benchmarks/runner_probe.py \
            --output "$root/runner-retry.json" \
            --require-temperature --enforce
          control 2 "$root/runner-retry.json"

      - name: Strict paced latency A/B current main vs PR252
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final"
          report="$root/runner.json"
          [ ! -f "$root/runner-retry.json" ] || report="$root/runner-retry.json"
          python base/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 \
            --target-rates 2500,10000 --completions callback \
            --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
            --policy strict --preflight-report "$report" \
            --output "$root/latency-ab.json" \
            --summary-output "$root/latency-ab.md"

      - name: Enforce explicit callback p50 regression ceiling
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mqttium-252-final" python - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          data = json.loads((root / "latency-ab.json").read_text())
          rows = []
          for scenario in data["scenarios"]:
              rate = int(scenario["target_rate"])
              ratios = [
                  float(pair["candidate"]["ack_latency_p50_ms"])
                  / float(pair["base"]["ack_latency_p50_ms"])
                  for pair in scenario["pairs"]
              ]
              ratio = statistics.median(ratios)
              base = statistics.median(
                  float(pair["base"]["ack_latency_p50_ms"]) for pair in scenario["pairs"]
              )
              candidate = statistics.median(
                  float(pair["candidate"]["ack_latency_p50_ms"])
                  for pair in scenario["pairs"]
              )
              rows.append((rate, ratio, base, candidate))
              if ratio > 1.50:
                  raise SystemExit(
                      f"rate={rate}: candidate/main callback p50 ratio {ratio:.4f} > 1.50"
                  )
          text = ["# Explicit PR252 callback-p50 gate", "", "| rate | main p50 | PR252 p50 | ratio |", "| ---: | ---: | ---: | ---: |"]
          for rate, ratio, base, candidate in rows:
              text.append(f"| {rate:,}/s | {base:.6f} ms | {candidate:.6f} ms | {ratio:.4f}x |")
          (root / "p50-gate.md").write_text("\n".join(text) + "\n")
          print((root / "p50-gate.md").read_text())
          PY

      - name: Stop performance broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-final/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi

      - name: Create isolated ARM64 functional venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-final-test-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install candidate test dependencies
        working-directory: candidate
        run: python -m pip install -e ".[dev]"

      - name: Candidate ARM64 unit tests
        working-directory: candidate
        run: python -m pytest -q -ra tests/unit

      - name: Start functional broker
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-final-functional"
          rm -rf "$root" && mkdir -p "$root"
          cat > "$root/mosquitto.conf" <<'EOF'
          listener 11883 127.0.0.1
          allow_anonymous true
          persistence false
          EOF
          mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          exit 1

      - name: Candidate ARM64 integration tests
        working-directory: candidate
        run: python -m pytest -q -ra tests/integration

      - name: Stop functional broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-final-functional/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-final-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-final/*.json
            ${{ runner.temp }}/mqttium-252-final/*.md
            ${{ runner.temp }}/mqttium-252-final/mosquitto.log
            ${{ runner.temp }}/mqttium-252-final-functional/mosquitto.log
          if-no-files-found: warn
          retention-days: 30
