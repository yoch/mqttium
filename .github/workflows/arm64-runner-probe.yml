name: ARM64 Simplification Engine Split

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  split:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      FINAL_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45
    steps:
      - name: Verify host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          command -v python3; command -v mosquitto; command -v taskset
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = performance
          if pgrep -a mosquitto; then exit 1; fi
      - uses: actions/checkout@v7
        with: {ref: "${{ env.MAIN_SHA }}", path: base, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: "${{ env.FINAL_SHA }}", path: final, persist-credentials: false}
      - name: Build send+launch and constructor+launch variants
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-split"; rm -rf "$r"; mkdir -p "$r/results"
          cp -a final "$r/send_launch"; cp -a final "$r/constructor_launch"
          ROOT="$r" python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          launch_old='''            if topic_bytes is not None and self.flow.try_acquire():\n                self._launch(msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes)\n                return PublishHandle(mid=mid, qos=qos)\n'''
          launch_new='''            if self._engine.state == ConnectionState.CONNECTED and self._try_launch(\n                msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes\n            ):\n                return PublishHandle(mid=mid, qos=qos)\n'''
          method='''    def _try_launch(\n        self, msg: OutboundMessage, *, _property_bytes: bytes | None = None,\n        _topic_bytes: bytes | None = None,\n    ) -> bool:\n        if not self.flow.try_acquire():\n            return False\n        try:\n            self._launch(msg, _property_bytes=_property_bytes, _topic_bytes=_topic_bytes)\n        except Exception:\n            self.flow.release()\n            raise\n        return True\n\n'''
          anchor='    def _retransmit(self, msg: OutboundMessage) -> None:\n'
          for name in ('send_launch','constructor_launch'):
              p=root/name/'src/mqttium/protocol/outbound.py'; t=p.read_text()
              assert t.count(launch_old)==1 and t.count(anchor)==1
              p.write_text(t.replace(launch_old,launch_new).replace(anchor,method+anchor))

          # send_launch: only restore _send delegation; keep positional EngineEffect construction.
          p=root/'send_launch/src/mqttium/protocol/engine.py'; t=p.read_text()
          old='''    def _send(self, packet: WriteItem) -> None:\n        # Appends directly rather than delegating to _emit: SEND is the most\n        # frequent effect and this is one Python frame per outbound packet.\n        self._effects.append(EngineEffect(EffectKind.SEND, packet, False, None))\n'''
          new='''    def _send(self, packet: WriteItem) -> None:\n        self._emit(EffectKind.SEND, packet)\n'''
          assert t.count(old)==1; p.write_text(t.replace(old,new))

          # constructor_launch: only restore keyword construction; keep direct _send append.
          p=root/'constructor_launch/src/mqttium/protocol/engine.py'; t=p.read_text()
          old='''        self._effects.append(\n            EngineEffect(kind, data, requires_delivery_mark, decoded_property_wire_size)\n        )\n'''
          new='''        self._effects.append(\n            EngineEffect(\n                kind=kind,\n                data=data,\n                requires_delivery_mark=requires_delivery_mark,\n                decoded_property_wire_size=decoded_property_wire_size,\n            )\n        )\n'''
          assert t.count(old)==1; p.write_text(t.replace(old,new))
          PY
      - name: Venv
        shell: bash
        run: |
          v="$RUNNER_TEMP/m252-split-v"; rm -rf "$v"; python3 -m venv "$v"; echo "$v/bin" >> "$GITHUB_PATH"
      - run: python -m pip install "psutil>=6,<8"
      - name: Preflight
        working-directory: base
        run: python benchmarks/runner_probe.py --output "$RUNNER_TEMP/m252-split/runner.json" --require-temperature --enforce
      - name: Broker
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-split"; cat >"$r/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$r/mosquitto.conf" >"$r/mosquitto.log" 2>&1 & echo $! >"$r/pid"
          for _ in $(seq 1 50); do (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0; sleep .1; done; exit 1
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252-split"
          for v in send_launch constructor_launch; do
            python base/benchmarks/paired_open_loop.py --base-root base --candidate-root "$r/$v" \
              --protocols 311 --payloads 256 --windows 64 --target-rates 2500,10000 \
              --completions callback --repeat 6 --count-small 4000 --timeout 120 --cpu 2 \
              --policy advisory --preflight-report "$r/runner.json" \
              --output "$r/results/$v.json" --summary-output "$r/results/$v.md"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-engine-split-${{ github.run_id }}
          path: ${{ runner.temp }}/m252-split/*
          retention-days: 30
      - if: always()
        shell: bash
        run: '[ ! -f "$RUNNER_TEMP/m252-split/pid" ] || { p=$(cat "$RUNNER_TEMP/m252-split/pid"); kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; }'
