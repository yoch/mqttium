name: ARM64 Simplification Engine Rollback

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      FINAL_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45

    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = "performance"
          if pgrep -a mosquitto; then exit 1; fi

      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_SHA }}
          path: base
          persist-credentials: false

      - name: Check out exact final PR 252
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FINAL_SHA }}
          path: candidate
          persist-credentials: false

      - name: Apply exact engine-only rollback in candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('candidate/src/mqttium/protocol/engine.py')
          text = path.read_text()
          old = '''        self._effects.append(\n            EngineEffect(kind, data, requires_delivery_mark, decoded_property_wire_size)\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        # Appends directly rather than delegating to _emit: SEND is the most\n        # frequent effect and this is one Python frame per outbound packet.\n        self._effects.append(EngineEffect(EffectKind.SEND, packet, False, None))\n'''
          new = '''        self._effects.append(\n            EngineEffect(\n                kind=kind,\n                data=data,\n                requires_delivery_mark=requires_delivery_mark,\n                decoded_property_wire_size=decoded_property_wire_size,\n            )\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        self._emit(EffectKind.SEND, packet)\n'''
          assert text.count(old) == 1, 'unexpected engine hotpath shape'
          path.write_text(text.replace(old, new))
          PY
          git -C candidate diff --check
          test "$(git -C candidate diff --name-only)" = "src/mqttium/protocol/engine.py"
          grep -q 'self._emit(EffectKind.SEND, packet)' candidate/src/mqttium/protocol/engine.py
          grep -q 'self._eager_armed' candidate/src/mqttium/api/_writer.py

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-engine-rollback-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: base
        run: |
          root="$RUNNER_TEMP/mqttium-252-engine-rollback"
          rm -rf "$root" && mkdir -p "$root"
          python benchmarks/runner_probe.py --output "$root/runner.json" --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-engine-rollback"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null || exit 1
            sleep 0.1
          done
          exit 1

      - name: Strict latency A/A control
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-engine-rollback"
          control() {
            local attempt="$1" report="$2"
            python base/benchmarks/paired_open_loop.py \
              --base-root base --candidate-root base \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,10000 --completions callback \
              --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
              --policy strict --preflight-report "$report" \
              --output "$root/aa-${attempt}.json" --summary-output "$root/aa-${attempt}.md"
          }
          set +e; control 1 "$root/runner.json"; rc=$?; set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python base/benchmarks/runner_probe.py --output "$root/runner-retry.json" --require-temperature --enforce
          control 2 "$root/runner-retry.json"

      - name: Strict latency A/B current main vs engine-rollback candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-engine-rollback"
          report="$root/runner.json"; [ ! -f "$root/runner-retry.json" ] || report="$root/runner-retry.json"
          python base/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 \
            --target-rates 2500,10000 --completions callback \
            --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
            --policy strict --preflight-report "$report" \
            --output "$root/ab.json" --summary-output "$root/ab.md"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-engine-rollback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-engine-rollback/*.json
            ${{ runner.temp }}/mqttium-252-engine-rollback/*.md
            ${{ runner.temp }}/mqttium-252-engine-rollback/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-engine-rollback/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          fi
