name: ARM64 Runner Probe

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Probe host without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner ==='
          printf 'name=%s\n' "${RUNNER_NAME:-}"
          printf 'os=%s arch=%s environment=%s\n' "${RUNNER_OS:-}" "${RUNNER_ARCH:-}" "${RUNNER_ENVIRONMENT:-}"
          echo '=== uname ==='
          uname -a
          echo '=== os-release ==='
          cat /etc/os-release
          echo '=== python ==='
          command -v python3
          python3 --version
          echo '=== broker/tooling ==='
          command -v mosquitto || true
          command -v mosquitto_sub || true
          command -v openssl
          openssl version
          echo '=== cpu ==='
          nproc
          grep -m1 -E '^(Model|model name|Hardware)' /proc/cpuinfo || true
          for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -r "$f" ] || continue
            printf '%s=%s writable=%s\n' "$f" "$(cat "$f")" "$([ -w "$f" ] && echo yes || echo no)"
          done
          echo '=== privilege ==='
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo 'passwordless_sudo=yes'
          else
            echo 'passwordless_sudo=no'
          fi
          echo '=== package availability ==='
          apt-cache policy mosquitto mosquitto-clients libmosquitto1 2>/dev/null || true
          echo '=== thermal ==='
          for f in /sys/class/thermal/thermal_zone*/temp; do
            [ -r "$f" ] || continue
            type="$(cat "${f%/temp}/type" 2>/dev/null || true)"
            printf '%s %s=%s\n' "$f" "$type" "$(cat "$f")"
          done
          echo '=== resources ==='
          free -h || true
          df -h "$RUNNER_TEMP" || true
          uptime || true

      - name: Validate native Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/arm64-probe-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" --version
          "$venv/bin/python" -m pip --version
          "$venv/bin/python" - <<'PY'
          import platform, sys
          print(sys.executable)
          print(platform.platform())
          print(platform.machine())
          PY
