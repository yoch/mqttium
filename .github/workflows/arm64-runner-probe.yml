name: ARM64 Paced Writer Evidence

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  paced:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Verify strict-performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          printf 'governors=%s\n' "$governors"
          test "$governors" = "performance"
          printf 'temperature='; cat /sys/class/thermal/thermal_zone0/temp
          uptime
          if pgrep -a mosquitto; then
            echo 'A pre-existing mosquitto process is running; refusing benchmark host.' >&2
            exit 1
          fi

      - name: Check out exact #254 benchmark harness
        uses: actions/checkout@v7
        with:
          ref: 5008d69a889d9100f7f3fb2623e6b08a72126524
          path: harness
          persist-credentials: false

      - name: Check out exact pre-eager baseline
        uses: actions/checkout@v7
        with:
          ref: 3962f328331b8414a755332aefc3b3d7c261dc6f
          path: base
          persist-credentials: false

      - name: Check out exact #254 candidate
        uses: actions/checkout@v7
        with:
          ref: 5008d69a889d9100f7f3fb2623e6b08a72126524
          path: candidate
          persist-credentials: false

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-paced-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install preflight dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Provide Mosquitto observer client without host mutation
        shell: bash
        run: |
          set -euo pipefail
          if command -v mosquitto_sub >/dev/null 2>&1; then
            mosquitto_sub -h 2>&1 | head -n 2
            exit 0
          fi
          root="$RUNNER_TEMP/mqttium-mosquitto-clients"
          rm -rf "$root"
          mkdir -p "$root/pkgs" "$root/root"
          cd "$root/pkgs"
          apt-get download mosquitto-clients
          dpkg-deb -x ./*.deb "$root/root"
          test -x "$root/root/usr/bin/mosquitto_sub"
          ldd "$root/root/usr/bin/mosquitto_sub" | tee "$root/ldd.txt"
          if grep -q 'not found' "$root/ldd.txt"; then
            echo 'temporary mosquitto_sub has unresolved libraries' >&2
            exit 1
          fi
          echo "$root/root/usr/bin" >> "$GITHUB_PATH"

      - name: Strict runner preflight
        working-directory: harness
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-paced"
          rm -rf "$root"
          mkdir -p "$root"
          python benchmarks/runner_probe.py \
            --output "$root/preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated Mosquitto pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-paced"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Run strict A/A then A/B paced acceptance cells
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/mqttium-paced"
          common=(
            --protocols 311
            --payloads 256
            --windows 64
            --target-rates 2500,7500
            --completions callback
            --repeat 8
            --count-small 4000
            --timeout 120
            --cpu 2
            --policy strict
            --preflight-report "$root/preflight.json"
          )

          echo '=== A/A: pre-eager 3962f32 versus itself ==='
          python harness/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root base \
            "${common[@]}" \
            --output "$root/aa.json" \
            --summary-output "$root/aa.md"
          aa_status=$?
          echo "A/A exit=$aa_status"

          echo '=== A/B: pre-eager 3962f32 versus #254 exact HEAD ==='
          python harness/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root candidate \
            "${common[@]}" \
            --output "$root/ab.json" \
            --summary-output "$root/ab.md"
          ab_status=$?
          echo "A/B exit=$ab_status"

          printf 'aa_status=%s\nab_status=%s\n' "$aa_status" "$ab_status" | tee "$root/status.txt"
          if [ "$aa_status" -ne 0 ] || [ "$ab_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-paced-writer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-paced/preflight.json
            ${{ runner.temp }}/mqttium-paced/aa.json
            ${{ runner.temp }}/mqttium-paced/aa.md
            ${{ runner.temp }}/mqttium-paced/ab.json
            ${{ runner.temp }}/mqttium-paced/ab.md
            ${{ runner.temp }}/mqttium-paced/status.txt
            ${{ runner.temp }}/mqttium-paced/mosquitto.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-paced/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
