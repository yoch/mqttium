name: ARM64 Simplification Interaction Isolation

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  isolate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      PRE_SHA: e443448981c56709a935332769a9e95216e3f660
      CHANGE_SHA: 832f808e413dd47fd922469110316751ba205906

    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = "performance"
          if pgrep -a mosquitto; then exit 1; fi

      - name: Check out current main benchmark harness
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_SHA }}
          path: harness
          persist-credentials: false

      - name: Check out candidate history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHANGE_SHA }}
          path: history
          fetch-depth: 0
          persist-credentials: false

      - name: Create interaction variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-interactions"
          rm -rf "$root"
          mkdir -p "$root/variants/pre" "$root/results"
          git -C history archive "$PRE_SHA" | tar -x -C "$root/variants/pre"
          for name in we wo eo weo full; do cp -a "$root/variants/pre" "$root/variants/$name"; done
          apply_file() {
            local variant="$1" path="$2"
            git -C history show "$CHANGE_SHA:$path" > "$root/variants/$variant/$path"
          }
          apply_file we src/mqttium/api/_writer.py
          apply_file we src/mqttium/protocol/engine.py
          apply_file wo src/mqttium/api/_writer.py
          apply_file wo src/mqttium/protocol/outbound.py
          apply_file eo src/mqttium/protocol/engine.py
          apply_file eo src/mqttium/protocol/outbound.py
          apply_file weo src/mqttium/api/_writer.py
          apply_file weo src/mqttium/protocol/engine.py
          apply_file weo src/mqttium/protocol/outbound.py
          rm -rf "$root/variants/full" && mkdir -p "$root/variants/full"
          git -C history archive "$CHANGE_SHA" | tar -x -C "$root/variants/full"

      - name: Create venv and preflight
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-interactions-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: harness
        run: |
          python benchmarks/runner_probe.py \
            --output "$RUNNER_TEMP/mqttium-252-interactions/runner.json" \
            --require-temperature --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-interactions"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null || exit 1
            sleep 0.1
          done
          exit 1

      - name: Measure interacting variants
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-interactions"
          printf 'variant,p50_ratio,base_p50_ms,candidate_p50_ms,completed_ratio,loop_lag_ratio,cpu_ratio\n' > "$root/interactions.csv"
          for variant in we wo eo weo full; do
            out="$root/results/${variant}.json"
            python harness/benchmarks/paired_open_loop.py \
              --base-root "$root/variants/pre" --candidate-root "$root/variants/$variant" \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500 --completions callback \
              --repeat 4 --count-small 4000 --target-sample-seconds 1.5 --max-count 4000 \
              --timeout 120 --cpu 2 --policy advisory \
              --preflight-report "$root/runner.json" --output "$out" >/dev/null
            VARIANT="$variant" OUT="$out" python - <<'PY' >> "$root/interactions.csv"
          import csv, json, os, statistics, sys
          pairs = json.load(open(os.environ["OUT"]))["scenarios"][0]["pairs"]
          ratio = lambda key: statistics.median(float(p["candidate"][key]) / max(float(p["base"][key]), 1e-9) for p in pairs)
          med = lambda side, key: statistics.median(float(p[side][key]) for p in pairs)
          csv.writer(sys.stdout).writerow([
              os.environ["VARIANT"], f"{ratio('ack_latency_p50_ms'):.6f}",
              f"{med('base','ack_latency_p50_ms'):.6f}", f"{med('candidate','ack_latency_p50_ms'):.6f}",
              f"{ratio('completed_rate'):.6f}", f"{ratio('loop_lag_p95_ms'):.6f}", f"{ratio('cpu_seconds'):.6f}"
          ])
          PY
          done
          cat "$root/interactions.csv"

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-interactions-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-interactions/interactions.csv
            ${{ runner.temp }}/mqttium-252-interactions/results/*.json
            ${{ runner.temp }}/mqttium-252-interactions/runner.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-interactions/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
