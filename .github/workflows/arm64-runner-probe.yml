name: ARM64 Eager Budget Screen

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  screen:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Verify strict-performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          printf 'governors=%s\n' "$governors"
          test "$governors" = "performance"
          printf 'temperature='; cat /sys/class/thermal/thermal_zone0/temp
          uptime
          if pgrep -a mosquitto; then
            echo 'A pre-existing mosquitto process is running; refusing benchmark host.' >&2
            exit 1
          fi

      - name: Check out exact #254 harness and template
        uses: actions/checkout@v7
        with:
          ref: 5008d69a889d9100f7f3fb2623e6b08a72126524
          path: harness
          persist-credentials: false

      - name: Check out rc5 capacity baseline
        uses: actions/checkout@v7
        with:
          ref: v1.0.0rc5
          path: base-cap
          persist-credentials: false

      - name: Check out exact pre-eager latency baseline
        uses: actions/checkout@v7
        with:
          ref: 3962f328331b8414a755332aefc3b3d7c261dc6f
          path: base-lat
          persist-credentials: false

      - name: Create eager-budget variants from exact #254
        shell: bash
        run: |
          set -euo pipefail
          for budget in 2 4 8; do
            cp -a harness "candidate-b${budget}"
            rm -rf "candidate-b${budget}/.git"
          done
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          for budget in (2, 4, 8):
              path = Path(f"candidate-b{budget}/src/mqttium/api/_writer.py")
              text = path.read_text()
              text = replace_once(
                  text,
                  "        self._eager_generation = 0\n",
                  "        self._eager_generation = 0\n"
                  "        # Experimental per-loop eager credit for #253 screening.\n"
                  "        self._eager_budget = 0\n",
                  "init budget",
              )
              text = replace_once(
                  text,
                  "        self._eager_armed = False\n"
                  "        generation = self._eager_generation\n"
                  "        asyncio.get_running_loop().call_soon(self._rearm_eager_if_idle, generation)\n"
                  "        self.eager_writes += 1\n",
                  "        self._eager_budget -= 1\n"
                  "        if self._eager_budget <= 0:\n"
                  "            self._eager_armed = False\n"
                  "        generation = self._eager_generation\n"
                  "        asyncio.get_running_loop().call_soon(self._rearm_eager_if_idle, generation)\n"
                  "        self.eager_writes += 1\n",
                  "successful eager",
              )
              text = replace_once(
                  text,
                  "            not self._eager_armed\n"
                  "            or write_nowait is None\n",
                  "            not self._eager_armed\n"
                  "            or self._eager_budget <= 0\n"
                  "            or write_nowait is None\n",
                  "eager gate",
              )
              text = replace_once(
                  text,
                  "            self._eager_armed = True\n\n"
                  "    def reset",
                  f"            self._eager_armed = True\n"
                  f"            self._eager_budget = {budget}\n\n"
                  "    def reset",
                  "callback rearm",
              )
              text = replace_once(
                  text,
                  "        self._eager_armed = self._write_nowait is not None\n"
                  "        self.task = asyncio.create_task",
                  f"        self._eager_armed = self._write_nowait is not None\n"
                  f"        self._eager_budget = {budget} if self._eager_armed else 0\n"
                  "        self.task = asyncio.create_task",
                  "start budget",
              )
              text = replace_once(
                  text,
                  "        self._eager_armed = False\n"
                  "        self._write_nowait = None\n",
                  "        self._eager_armed = False\n"
                  "        self._eager_budget = 0\n"
                  "        self._write_nowait = None\n",
                  "drop budget",
              )
              text = replace_once(
                  text,
                  "                if queue.empty() and self._write_nowait is not None:\n"
                  "                    self._eager_armed = True\n"
                  "                first = await queue.get()\n",
                  f"                if queue.empty() and self._write_nowait is not None:\n"
                  f"                    self._eager_armed = True\n"
                  f"                    self._eager_budget = {budget}\n"
                  "                first = await queue.get()\n",
                  "writer idle rearm",
              )
              path.write_text(text)
              compile(text, str(path), "exec")
              print(f"prepared budget={budget}: {path}")
          PY

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-budget-screen-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install preflight dependency
        run: python -m pip install "psutil>=6,<8"

      - name: Strict runner preflight
        working-directory: harness
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-budget-screen"
          rm -rf "$root"
          mkdir -p "$root"
          python benchmarks/runner_probe.py \
            --output "$root/preflight.json" \
            --require-temperature \
            --enforce

      - name: Start isolated Mosquitto pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-budget-screen"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Screen eager budgets 2, 4, 8
        shell: bash
        run: |
          set +e
          set -u -o pipefail
          root="$RUNNER_TEMP/mqttium-budget-screen"
          : > "$root/status.txt"
          overall=0
          for budget in 2 4 8; do
            echo "=== budget=$budget capacity rc5 -> candidate ==="
            python harness/benchmarks/paired_writer_capacity.py \
              --base-root base-cap --candidate-root "candidate-b${budget}" \
              --protocol 311 --qos-values 0,1 --payload-bytes 256 \
              --inflight 20 --outstanding 64 --max-queued 200 \
              --warmup-count 2000 --repeat 4 --count-qos0 50000 --count-qos1 20000 \
              --timeout 120 --cpu 2 --policy strict --preflight-report "$root/preflight.json" \
              --output "$root/b${budget}-capacity.json" \
              --summary-output "$root/b${budget}-capacity.md"
            cap=$?

            echo "=== budget=$budget paced pre-eager -> candidate ==="
            python harness/benchmarks/paired_open_loop.py \
              --base-root base-lat --candidate-root "candidate-b${budget}" \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,7500 --completions callback \
              --repeat 4 --count-small 4000 --timeout 120 --cpu 2 \
              --policy strict --preflight-report "$root/preflight.json" \
              --output "$root/b${budget}-paced.json" \
              --summary-output "$root/b${budget}-paced.md"
            paced=$?

            printf 'budget=%s capacity=%s paced=%s\n' "$budget" "$cap" "$paced" | tee -a "$root/status.txt"
            printf 'temperature_after_b%s=' "$budget"; cat /sys/class/thermal/thermal_zone0/temp
          done
          # Screening intentionally does not fail on a rejected variant.
          exit 0

      - name: Upload screening evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-eager-budget-screen-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-budget-screen/*.json
            ${{ runner.temp }}/mqttium-budget-screen/*.md
            ${{ runner.temp }}/mqttium-budget-screen/status.txt
            ${{ runner.temp }}/mqttium-budget-screen/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated Mosquitto
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-budget-screen/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
