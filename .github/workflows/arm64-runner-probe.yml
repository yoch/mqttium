name: ARM64 Runner Probe

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Probe host without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner ==='
          printf 'name=%s\n' "${RUNNER_NAME:-}"
          printf 'os=%s arch=%s environment=%s\n' "${RUNNER_OS:-}" "${RUNNER_ARCH:-}" "${RUNNER_ENVIRONMENT:-}"
          python3 --version
          echo '=== broker/tooling ==='
          command -v mosquitto || true
          command -v mosquitto_sub || true
          echo '=== cpu ==='
          nproc
          grep -m1 -E '^(Model|model name|Hardware)' /proc/cpuinfo || true
          for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -r "$f" ] || continue
            printf '%s=%s writable=%s\n' "$f" "$(cat "$f")" "$([ -w "$f" ] && echo yes || echo no)"
          done
          echo '=== thermal ==='
          for f in /sys/class/thermal/thermal_zone*/temp; do
            [ -r "$f" ] || continue
            type="$(cat "${f%/temp}/type" 2>/dev/null || true)"
            printf '%s %s=%s\n' "$f" "$type" "$(cat "$f")"
          done
          uptime || true

      - name: Validate native Python virtualenv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/arm64-probe-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" --version
          "$venv/bin/python" -m pip --version

      - name: Try unprivileged local Mosquitto extraction
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/arm64-local-mosquitto"
          rm -rf "$root"
          mkdir -p "$root/pkgs" "$root/root"
          cd "$root/pkgs"
          apt-get download \
            mosquitto mosquitto-clients libmosquitto1 \
            libdlt2 libwebsockets19
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root/root"
          done
          export PATH="$root/root/usr/bin:$root/root/usr/sbin:$PATH"
          libdirs="$(find "$root/root/usr/lib" -type f \( -name 'libmosquitto.so.*' -o -name 'libdlt.so.*' -o -name 'libwebsockets.so.*' \) -printf '%h\n' | sort -u | paste -sd: -)"
          export LD_LIBRARY_PATH="$libdirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          command -v mosquitto
          command -v mosquitto_sub
          ldd "$(command -v mosquitto)" | tee "$root/ldd.txt"
          if grep -q 'not found' "$root/ldd.txt"; then
            echo 'local Mosquitto has unresolved shared libraries'
            exit 2
          fi
          mosquitto -h 2>&1 | head -n 2
          mosquitto_sub -h 2>&1 | head -n 2
