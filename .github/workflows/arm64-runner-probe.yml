name: ARM64 Simplification Relevant Rollback

on:
  push:
    branches: [agent/arm64-runner-probe]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAIN_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      FINAL_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45
    steps:
      - name: Verify clean performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          command -v python3; command -v mosquitto; command -v taskset
          test "$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)" = performance
          if pgrep -a mosquitto; then exit 1; fi
      - uses: actions/checkout@v7
        with: {ref: "${{ env.MAIN_SHA }}", path: base, persist-credentials: false}
      - uses: actions/checkout@v7
        with: {ref: "${{ env.FINAL_SHA }}", path: candidate, persist-credentials: false}
      - name: Roll back only engine, launch boundary and writer lookup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('candidate/src/mqttium/protocol/engine.py'); t=p.read_text()
          old='''        self._effects.append(\n            EngineEffect(kind, data, requires_delivery_mark, decoded_property_wire_size)\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        # Appends directly rather than delegating to _emit: SEND is the most\n        # frequent effect and this is one Python frame per outbound packet.\n        self._effects.append(EngineEffect(EffectKind.SEND, packet, False, None))\n'''
          new='''        self._effects.append(\n            EngineEffect(\n                kind=kind, data=data, requires_delivery_mark=requires_delivery_mark,\n                decoded_property_wire_size=decoded_property_wire_size,\n            )\n        )\n\n    def _send(self, packet: WriteItem) -> None:\n        self._emit(EffectKind.SEND, packet)\n'''
          assert t.count(old)==1; p.write_text(t.replace(old,new))

          p=Path('candidate/src/mqttium/protocol/outbound.py'); t=p.read_text()
          old='''            if topic_bytes is not None and self.flow.try_acquire():\n                self._launch(msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes)\n                return PublishHandle(mid=mid, qos=qos)\n'''
          new='''            if self._engine.state == ConnectionState.CONNECTED and self._try_launch(\n                msg, _property_bytes=property_bytes, _topic_bytes=topic_bytes\n            ):\n                return PublishHandle(mid=mid, qos=qos)\n'''
          method='''    def _try_launch(\n        self, msg: OutboundMessage, *, _property_bytes: bytes | None = None,\n        _topic_bytes: bytes | None = None,\n    ) -> bool:\n        if not self.flow.try_acquire():\n            return False\n        try:\n            self._launch(msg, _property_bytes=_property_bytes, _topic_bytes=_topic_bytes)\n        except Exception:\n            self.flow.release()\n            raise\n        return True\n\n'''
          anchor='    def _retransmit(self, msg: OutboundMessage) -> None:\n'
          assert t.count(old)==1 and t.count(anchor)==1
          p.write_text(t.replace(old,new).replace(anchor,method+anchor))

          p=Path('candidate/src/mqttium/api/_writer.py'); t=p.read_text()
          old='''    async def _write_contiguous(\n        self,\n        transport: AsyncTransport,\n        write_many: Callable[[list[bytes]], Awaitable[None]] | None,\n        parts: list[bytes],\n    ) -> None:\n        if not parts:\n            return\n        if write_many is not None:\n'''
          new='''    async def _write_contiguous(self, transport: AsyncTransport, parts: list[bytes]) -> None:\n        if not parts:\n            return\n        write_many = getattr(transport, "write_many", None)\n        if write_many is not None:\n'''
          assert t.count(old)==1; t=t.replace(old,new)
          old='''        # Resolved once per writer task rather than per batch. The local dies\n        # with the task, so unlike `_write_nowait` it needs no explicit\n        # clearing: it can never outlive the transport it was resolved from.\n        write_many = getattr(transport, "write_many", None)\n'''
          assert t.count(old)==1; t=t.replace(old,'')
          assert t.count('await self._write_contiguous(transport, write_many, contiguous)')==2
          t=t.replace('await self._write_contiguous(transport, write_many, contiguous)', 'await self._write_contiguous(transport, contiguous)')
          p.write_text(t)
          PY
          git -C candidate diff --check
          grep -q 'self._eager_armed' candidate/src/mqttium/api/_writer.py
      - name: Create venv
        shell: bash
        run: |
          v="$RUNNER_TEMP/m252-v"; rm -rf "$v"; python3 -m venv "$v"; echo "$v/bin" >> "$GITHUB_PATH"
      - run: python -m pip install "psutil>=6,<8"
      - name: Preflight
        working-directory: base
        run: |
          mkdir -p "$RUNNER_TEMP/m252"; python benchmarks/runner_probe.py --output "$RUNNER_TEMP/m252/runner.json" --require-temperature --enforce
      - name: Broker
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/m252"; cat > "$r/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$r/mosquitto.conf" >"$r/mosquitto.log" 2>&1 & echo $! >"$r/pid"
          for _ in $(seq 1 50); do (echo >/dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0; sleep .1; done; exit 1
      - name: Paired screen
        run: |
          python base/benchmarks/paired_open_loop.py --base-root base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 --target-rates 2500,10000 \
            --completions callback --repeat 6 --count-small 4000 --timeout 120 --cpu 2 \
            --policy advisory --preflight-report "$RUNNER_TEMP/m252/runner.json" \
            --output "$RUNNER_TEMP/m252/ab.json" --summary-output "$RUNNER_TEMP/m252/ab.md"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-relevant-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/m252/*
          retention-days: 30
      - if: always()
        shell: bash
        run: |
          [ ! -f "$RUNNER_TEMP/m252/pid" ] || { p=$(cat "$RUNNER_TEMP/m252/pid"); kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; }
