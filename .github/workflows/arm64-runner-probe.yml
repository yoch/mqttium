name: ARM64 Simplification Rebase Validation

on:
  push:
    branches:
      - agent/arm64-runner-probe

permissions:
  contents: read

jobs:
  writer-regression:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASE_SHA: 0999d8abfe44a568209209403d7f215b18cc4eb7
      CANDIDATE_SHA: 3ee2a3c5a78b0ea487ddbdf7927665b519fddd45

    steps:
      - name: Verify clean dedicated host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          command -v python3
          command -v mosquitto
          command -v mosquitto_sub
          command -v taskset
          governors="$(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort -u)"
          test "$governors" = "performance"
          if pgrep -a mosquitto; then
            echo "pre-existing Mosquitto would contaminate paired evidence" >&2
            exit 1
          fi

      - name: Check out exact current main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check out exact rebased PR 252
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Verify exact trees and writer invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -q 'self._eager_armed' candidate/src/mqttium/api/_writer.py
          grep -q 'self._eager_generation' candidate/src/mqttium/api/_writer.py
          grep -q 'write_many = getattr(transport, "write_many", None)' candidate/src/mqttium/api/_writer.py
          grep -q '_write_contiguous(transport, write_many, contiguous)' candidate/src/mqttium/api/_writer.py

      - name: Create isolated benchmark venv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mqttium-252-writer-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install "psutil>=6,<8"

      - name: Enforce strict runner preflight
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          rm -rf "$root"
          mkdir -p "$root"
          python benchmarks/runner_probe.py \
            --output "$root/runner.json" \
            --require-temperature \
            --enforce

      - name: Start isolated broker pinned to CPU 0
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          cat > "$root/mosquitto.conf" <<'EOF'
          persistence false
          allow_anonymous true
          max_inflight_messages 1000
          max_queued_messages 100000
          max_queued_bytes 0
          connection_messages false
          log_type error
          listener 11883 127.0.0.1
          EOF
          taskset -c 0 mosquitto -c "$root/mosquitto.conf" > "$root/mosquitto.log" 2>&1 &
          echo "$!" > "$root/mosquitto.pid"
          for _ in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            if ! kill -0 "$(cat "$root/mosquitto.pid")" 2>/dev/null; then
              cat "$root/mosquitto.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$root/mosquitto.log"
          exit 1

      - name: Strict writer capacity A/A
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          python base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root base \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$root/runner.json" \
            --output "$root/capacity-aa.json" \
            --summary-output "$root/capacity-aa.md"

      - name: Strict writer capacity A/B current main vs PR 252
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          python base/benchmarks/paired_writer_capacity.py \
            --base-root base --candidate-root candidate \
            --protocol 311 --qos-values 0,1 --payload-bytes 256 \
            --inflight 20 --outstanding 64 --max-queued 200 \
            --warmup-count 5000 --repeat 8 \
            --count-qos0 100000 --count-qos1 40000 \
            --timeout 120 --cpu 2 --policy strict \
            --preflight-report "$root/runner.json" \
            --output "$root/capacity-ab.json" \
            --summary-output "$root/capacity-ab.md"

      - name: Strict writer latency A/A with one invalid-control retry
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          run_control() {
            local attempt="$1"
            local preflight="$2"
            python base/benchmarks/paired_open_loop.py \
              --base-root base --candidate-root base \
              --protocols 311 --payloads 256 --windows 64 \
              --target-rates 2500,10000 --completions callback \
              --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
              --policy strict --preflight-report "$preflight" \
              --output "$root/latency-aa-${attempt}.json" \
              --summary-output "$root/latency-aa-${attempt}.md"
          }
          set +e
          run_control 1 "$root/runner.json"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          python base/benchmarks/runner_probe.py \
            --output "$root/runner-retry.json" \
            --require-temperature --enforce
          run_control 2 "$root/runner-retry.json"

      - name: Strict writer latency A/B current main vs PR 252
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mqttium-252-writer"
          preflight="$root/runner.json"
          if [ -f "$root/runner-retry.json" ]; then
            preflight="$root/runner-retry.json"
          fi
          python base/benchmarks/paired_open_loop.py \
            --base-root base --candidate-root candidate \
            --protocols 311 --payloads 256 --windows 64 \
            --target-rates 2500,10000 --completions callback \
            --repeat 8 --count-small 4000 --timeout 120 --cpu 2 \
            --policy strict --preflight-report "$preflight" \
            --output "$root/latency-ab.json" \
            --summary-output "$root/latency-ab.md"

      - name: Upload exact-head paired evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pr252-writer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqttium-252-writer/*.json
            ${{ runner.temp }}/mqttium-252-writer/*.md
            ${{ runner.temp }}/mqttium-252-writer/mosquitto.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated broker
        if: always()
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/mqttium-252-writer/mosquitto.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
