name: PR454 RTT regime cause matrix
on:
  push:
    branches: [work/pr454-regime-cause-20260910]
permissions:
  contents: read
jobs:
  matrix-rpi5:
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: mqttium-arm64-runner
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MQTTIUM_BASE: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
      HARNESS_SHA: ef2382cf8ed20e5df4288102c1ae17e791a25d68
      TARGET_RATE: '3942'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 9ad1f01857306ac5079ffb1d073a59fdb60e1931
          path: seed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: yoch/mqtt-python-client-bench
          ref: ef2382cf8ed20e5df4288102c1ae17e791a25d68
          path: bench
      - name: Prepare isolated symmetric sources and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C seed rev-parse HEAD)" = "$MQTTIUM_BASE"
          test "$(git -C bench rev-parse HEAD)" = "$HARNESS_SHA"
          ROOT=$(mktemp -d "$RUNNER_TEMP/p454-cause-${GITHUB_RUN_ID}-XXXX")
          OUT="$GITHUB_WORKSPACE/diag-results-${GITHUB_RUN_ID}"
          rm -rf "$OUT"; mkdir -p "$OUT"
          echo "JOB_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cp -a seed "$ROOT/aa-a"
          cp -a seed "$ROOT/aa-b"
          A="$ROOT/aa-a"; B="$ROOT/aa-b"
          test "${#A}" -eq "${#B}"
          test "$(git -C "$A" rev-parse HEAD)" = "$MQTTIUM_BASE"
          test "$(git -C "$B" rev-parse HEAD)" = "$MQTTIUM_BASE"
          test -z "$(git -C "$A" status --porcelain --untracked-files=no)"
          test -z "$(git -C "$B" status --porcelain --untracked-files=no)"
          python3 -m venv "$ROOT/venv"
          echo "$ROOT/venv/bin" >> "$GITHUB_PATH"
          echo "PYTHON_BIN=$ROOT/venv/bin/python" >> "$GITHUB_ENV"
          {
            uname -a
            lscpu
            python3 -V
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'randomize_va_space='; cat /proc/sys/kernel/randomize_va_space
            command -v setarch || true
            setarch --version || true
            for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor /sys/class/thermal/thermal_zone*/temp; do
              if test -f "$f"; then printf '%s=' "$f"; cat "$f"; fi
            done
          } > "$OUT/machine.txt"
          printf 'a=%s\nb=%s\nlen_a=%s\nlen_b=%s\n' "$A" "$B" "${#A}" "${#B}" > "$OUT/paths.txt"
      - name: Install corrected harness
        run: python -m pip install -e 'bench[paho]'
      - name: Preflight fixed-layout personality
        shell: bash
        run: |
          set -euo pipefail
          if command -v setarch >/dev/null && setarch "$(uname -m)" -R "$PYTHON_BIN" -c 'import pathlib; print(pathlib.Path("/proc/self/personality").read_text().strip())' > "$OUT/setarch-preflight.txt" 2>&1; then
            echo "NOASLR_OK=1" >> "$GITHUB_ENV"
          else
            echo "NOASLR_OK=0" >> "$GITHUB_ENV"
            cat "$OUT/setarch-preflight.txt" || true
          fi
      - name: Start isolated broker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$JOB_ROOT/mosquitto.conf" <<'EOF'
          listener 18898 127.0.0.1
          allow_anonymous true
          persistence false
          set_tcp_nodelay true
          max_inflight_messages 1000
          max_queued_messages 100000
          log_type error
          EOF
          cp "$JOB_ROOT/mosquitto.conf" "$OUT/"
          mosquitto -c "$JOB_ROOT/mosquitto.conf" > "$OUT/mosquitto.log" 2>&1 &
          echo $! > "$JOB_ROOT/broker.pid"
          python seed/tools/ci/wait_for_endpoints.py --tcp 127.0.0.1:18898
          python - <<'PY'
          import json, os, pathlib
          from mqtt_client_bench.telemetry import allocate_cpuset
          sets=allocate_cpuset(['sut','broker','loadgen','orch'],profile='standard')
          pathlib.Path(os.environ['OUT'],'cpusets.json').write_text(json.dumps(sets,indent=2))
          ids=[]
          for part in sets['broker'].split(','):
              if '-' in part:
                  a,b=map(int,part.split('-')); ids.extend(range(a,b+1))
              else: ids.append(int(part))
          pid=int((pathlib.Path(os.environ['JOB_ROOT'])/'broker.pid').read_text())
          os.sched_setaffinity(pid,set(ids))
          PY
      - name: External pacer with normal ASLR — 4 blocks
        shell: bash
        run: |
          "$PYTHON_BIN" -m mqtt_client_bench.version_compare \
            --client mqttium --baseline-path "$JOB_ROOT/aa-a" --candidate-path "$JOB_ROOT/aa-b" \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate "$TARGET_RATE" \
            --pacer-mode external --broker 127.0.0.1:18898 --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 4 --max-block-retries 1 --profile standard --output "$OUT/external-aslr.json" \
            | tee "$OUT/external-aslr.log"
      - name: In-loop pacer with normal ASLR — 4 blocks
        shell: bash
        run: |
          "$PYTHON_BIN" -m mqtt_client_bench.version_compare \
            --client mqttium --baseline-path "$JOB_ROOT/aa-a" --candidate-path "$JOB_ROOT/aa-b" \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate "$TARGET_RATE" \
            --pacer-mode in_loop --broker 127.0.0.1:18898 --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 4 --max-block-retries 1 --profile standard --output "$OUT/inloop-aslr.json" \
            | tee "$OUT/inloop-aslr.log"
      - name: External pacer with ASLR disabled — 4 blocks
        if: env.NOASLR_OK == '1'
        shell: bash
        run: |
          setarch "$(uname -m)" -R "$PYTHON_BIN" -m mqtt_client_bench.version_compare \
            --client mqttium --baseline-path "$JOB_ROOT/aa-a" --candidate-path "$JOB_ROOT/aa-b" \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate "$TARGET_RATE" \
            --pacer-mode external --broker 127.0.0.1:18898 --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 4 --max-block-retries 1 --profile standard --output "$OUT/external-noaslr.json" \
            | tee "$OUT/external-noaslr.log"
      - name: In-loop pacer with ASLR disabled — 4 blocks
        if: env.NOASLR_OK == '1'
        shell: bash
        run: |
          setarch "$(uname -m)" -R "$PYTHON_BIN" -m mqtt_client_bench.version_compare \
            --client mqttium --baseline-path "$JOB_ROOT/aa-a" --candidate-path "$JOB_ROOT/aa-b" \
            --scenario application_rtt_fixed_rate --variant-index 0 --target-rate "$TARGET_RATE" \
            --pacer-mode in_loop --broker 127.0.0.1:18898 --broker-pid "$(cat "$JOB_ROOT/broker.pid")" \
            --blocks 4 --max-block-retries 1 --profile standard --output "$OUT/inloop-noaslr.json" \
            | tee "$OUT/inloop-noaslr.log"
      - name: Summarize regimes, scheduling and layouts
        if: always()
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          import json, math, os, pathlib, statistics
          root=pathlib.Path(os.environ['OUT'])
          conditions=['external-aslr','inloop-aslr','external-noaslr','inloop-noaslr']
          out={}
          for name in conditions:
              p=root/(name+'.json')
              if not p.exists():
                  out[name]={'missing':True}; continue
              d=json.loads(p.read_text())
              rows=[]
              for r in d.get('runs',[]):
                  if not r.get('active_for_verdict'): continue
                  w=next((x for x in r.get('workers',[]) if x.get('role')=='rtt_initiator'),{})
                  lat=w.get('latency_summary') or {}
                  rt=w.get('runtime') or {}
                  delta=rt.get('measure_delta') or {}
                  layout=(rt.get('measure_start') or {}).get('memory_layout') or {}
                  completed=int(w.get('completed_in_window') or 0)
                  cpu=(float(delta.get('ru_utime_s') or 0)+float(delta.get('ru_stime_s') or 0))
                  rows.append({
                    'label':r.get('ab_label'),'block':r.get('logical_block'),'slot':r.get('block_slot'),
                    'p50_ms':lat.get('p50_ms'),'p95_ms':lat.get('p95_ms'),'p99_ms':lat.get('p99_ms'),
                    'slow_p95': bool((lat.get('p95_ms') or 0)>0.28),
                    'completed':completed,'offered':w.get('offered'),'missed':w.get('missed_due_to_backpressure'),
                    'nvcsw_per_msg': (float(delta.get('ru_nvcsw') or 0)/completed if completed else None),
                    'nivcsw_per_msg': (float(delta.get('ru_nivcsw') or 0)/completed if completed else None),
                    'minflt_per_msg': (float(delta.get('ru_minflt') or 0)/completed if completed else None),
                    'cpu_us_per_msg': (cpu*1e6/completed if completed else None),
                    'libc_base':layout.get('libc_base'),'heap_start':layout.get('heap_start'),
                    'stack_start':layout.get('stack_start'),'maps':layout.get('maps_sha256'),
                    'temporal_ok':(r.get('temporal_quality') or {}).get('ok'),
                  })
              def vals(k): return [float(x[k]) for x in rows if x.get(k) is not None]
              out[name]={
                'qualification':d.get('qualification'),'verdict':d.get('verdict'),
                'n':len(rows),'slow_p95_count':sum(x['slow_p95'] for x in rows),
                'p50_range':[min(vals('p50_ms')),max(vals('p50_ms'))] if vals('p50_ms') else None,
                'p95_range':[min(vals('p95_ms')),max(vals('p95_ms'))] if vals('p95_ms') else None,
                'p99_range':[min(vals('p99_ms')),max(vals('p99_ms'))] if vals('p99_ms') else None,
                'p95_median':statistics.median(vals('p95_ms')) if vals('p95_ms') else None,
                'nvcsw_per_msg_median':statistics.median(vals('nvcsw_per_msg')) if vals('nvcsw_per_msg') else None,
                'minflt_per_msg_median':statistics.median(vals('minflt_per_msg')) if vals('minflt_per_msg') else None,
                'cpu_us_per_msg_median':statistics.median(vals('cpu_us_per_msg')) if vals('cpu_us_per_msg') else None,
                'unique_libc_bases':sorted(set(x['libc_base'] for x in rows if x.get('libc_base'))),
                'unique_heap_starts':sorted(set(x['heap_start'] for x in rows if x.get('heap_start'))),
                'unique_stack_starts':sorted(set(x['stack_start'] for x in rows if x.get('stack_start'))),
                'rows':rows,
              }
          (root/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({k:{kk:v for kk,v in x.items() if kk!='rows'} for k,x in out.items()},indent=2,sort_keys=True))
          PY
      - name: Final identity and cleanup
        if: always()
        shell: bash
        run: |
          if test -n "${JOB_ROOT:-}" && test -f "$JOB_ROOT/broker.pid"; then kill "$(cat "$JOB_ROOT/broker.pid")" 2>/dev/null || true; fi
          git -C seed rev-parse HEAD > "$OUT/final-base-sha.txt"
          git -C bench rev-parse HEAD > "$OUT/final-harness-sha.txt"
          git -C seed status --porcelain --untracked-files=no > "$OUT/final-base-status.txt"
          git -C bench status --porcelain --untracked-files=no > "$OUT/final-harness-status.txt"
          if test -n "${JOB_ROOT:-}"; then rm -rf "$JOB_ROOT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr454-regime-cause-rpi5
          path: diag-results-${{ github.run_id }}/
          retention-days: 30
