name: Direct ingress saturation calibration

on:
  push:
    branches: [perf/direct-decoder-ingress-prototype]
    paths:
      - .github/workflows/direct-ingress-saturation-calibration.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 1a2c8e52efebee845e507a35e1048d994f1b074a
  BASE_SHA: 1b52cbdf642d7b1ebe89db24ca754e949cb23322
  BENCH_SHA: 37160eed99b50d1f384e1565a16d0346eb01ca56
  BENCHTOOLS_SHA: 3369317e64bb164b672bdc4b634952fb904bdbf4
  PAYLOAD_SIZE: "65536"
  PORT: "11890"

jobs:
  calibrate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BENCHTOOLS_SHA }}
          path: benchtools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yoch/mqtt-python-client-bench
          ref: ${{ env.BENCH_SHA }}
          path: harness
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(python3 -c 'import platform; print(platform.python_version())')" = '3.14.7'
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C harness rev-parse HEAD)" = "$BENCH_SHA"
          test "$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" = performance
          out="$RUNNER_TEMP/direct-ingress-calibration-$GITHUB_RUN_ID"
          rm -rf "$out" && mkdir -p "$out"
          echo "CAL_OUT=$out" >> "$GITHUB_ENV"
          cc -O3 -pthread harness/scripts/mqtt_hammer.c -o "$out/mqtt_hammer"
          cat > "$out/mosquitto.conf" <<EOF
          listener $PORT 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          EOF
          taskset -c 1 mosquitto -c "$out/mosquitto.conf" > "$out/mosquitto.log" 2>&1 &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            if (echo > "/dev/tcp/127.0.0.1/$PORT") >/dev/null 2>&1; then exit 0; fi
            sleep 0.1
          done
          exit 1
      - name: Sweep offers
        shell: bash
        run: |
          set -euo pipefail
          : > "$CAL_OUT/completed.tsv"
          idx=0
          for rate in 10000 11000 12000 13000; do
            for arm in candidate base; do
              if [ "$arm" = candidate ]; then src="$PWD/candidate/src"; else src="$PWD/base/src"; fi
              topic="bench/direct-cal/${GITHUB_RUN_ID}/${rate}/${arm}"
              ready="$CAL_OUT/ready-$idx"
              sub="$CAL_OUT/sub-$idx.json"
              pub="$CAL_OUT/pub-$idx.json"
              taskset -c 0 env PYTHONPATH="$src" python3 benchtools/tools/mqtt_saturated_finalists_probe.py \
                subscriber --arm "$arm" --host 127.0.0.1 --port "$PORT" --topic "$topic" \
                --payload-size "$PAYLOAD_SIZE" --warmup-s 0.5 --duration-s 1.5 \
                --broker-pid "$BROKER_PID" --ready-file "$ready" --output "$sub" \
                > "$CAL_OUT/sub-$idx.log" 2>&1 &
              subpid=$!
              for _ in $(seq 1 100); do
                [ -f "$ready" ] && break
                kill -0 "$subpid" 2>/dev/null || { cat "$CAL_OUT/sub-$idx.log"; exit 1; }
                sleep 0.05
              done
              test -f "$ready"
              taskset -c 2 "$CAL_OUT/mqtt_hammer" pub --host 127.0.0.1 --port "$PORT" \
                --topic "$topic" --clients 2 --payload "$PAYLOAD_SIZE" --duration 3 --rate "$rate" \
                > "$pub" 2> "$CAL_OUT/pub-$idx.log" &
              pubpid=$!
              wait "$subpid"
              wait "$pubpid"
              printf '%s\t%s\t%s\n' "$idx" "$rate" "$arm" >> "$CAL_OUT/completed.tsv"
              idx=$((idx+1))
              sleep 0.1
            done
          done
      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          CAL_OUT="$CAL_OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CAL_OUT'])
          rows=[]
          for line in (root/'completed.tsv').read_text().splitlines():
              idx_s,rate_s,arm=line.split('\t'); idx=int(idx_s); rate=int(rate_s)
              sub=json.loads((root/f'sub-{idx}.json').read_text())
              pub=json.loads((root/f'pub-{idx}.json').read_text())
              offer=float(pub['msgs_per_s'])*65536/(1024*1024)
              delivered=float(sub['payload_mib_s'])
              rows.append({
                  'idx':idx,'rate_msgs_s':rate,'arm':arm,
                  'offer_mib_s':offer,'delivered_mib_s':delivered,
                  'offer_over_delivered': offer/delivered if delivered else None,
                  'sut_cpu_pct':sub['sut_cpu_pct'],'broker_cpu_pct':sub['broker_cpu_pct'],
                  'ru_minflt':sub['ru_minflt'],'ru_majflt':sub['ru_majflt'],
                  'broker_majflt':sub['broker_majflt'],
              })
          print(json.dumps(rows,indent=2))
          (root/'summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Stop broker
        if: always()
        shell: bash
        run: |
          [ -n "${BROKER_PID:-}" ] && kill "$BROKER_PID" 2>/dev/null || true
      - name: Upload calibration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-ingress-saturation-calibration-${{ github.run_id }}
          path: ${{ env.CAL_OUT }}
          if-no-files-found: error
          retention-days: 14
