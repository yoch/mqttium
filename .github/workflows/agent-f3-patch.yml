name: Temporary Finding 3 patch

on:
  push:
    branches:
      - agent/qos12-topic-bytes-handoff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited Finding 3 saturation fix
        shell: python
        run: |
          from pathlib import Path

          outbound = Path("src/mqttium/protocol/outbound.py")
          text = outbound.read_text()
          old = "if level is QoS.AT_MOST_ONCE or engine.state == ConnectionState.CONNECTED:\n            topic_bytes = encode_validated_publish_topic(topic)"
          new = "if level is QoS.AT_MOST_ONCE or (\n            engine.state == ConnectionState.CONNECTED and self.flow.available > 0\n        ):\n            topic_bytes = encode_validated_publish_topic(topic)"
          if text.count(old) != 1:
              raise SystemExit(f"expected one outbound match, got {text.count(old)}")
          outbound.write_text(text.replace(old, new))

          test = Path("tests/unit/test_topic_bytes_handoff.py")
          text = test.read_text()
          text = text.replace(
              "import mqttium.packets._publish as publish_v5_module\n",
              "import pytest\n\nimport mqttium.packets._publish as publish_v5_module\n",
              1,
          )
          text = text.replace(
              "from mqttium.packets._publish import encode_publish_item_v5\n",
              "from mqttium.packets import PubAckPacket\nfrom mqttium.packets._publish import encode_publish_item_v5\n",
              1,
          )
          text = text.replace(
              "from tests.support import write_item_bytes\n",
              "from tests.support import feed_engine, write_item_bytes\n",
              1,
          )
          marker = "\ndef test_qos1_topic_handoff_matches_direct_encode() -> None:\n"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one test insertion point, got {text.count(marker)}")
          added = '''\n@pytest.mark.parametrize("qos", [QoS.AT_LEAST_ONCE, QoS.EXACTLY_ONCE])\n@pytest.mark.parametrize(\n    ("topic_text", "encodes_while_queued", "encodes_after_drain"),\n    [\n        ("sensors/" + "a" * 256, 0, 1),\n        ("é" * 256, 1, 2),\n    ],\n)\ndef test_saturated_flow_does_not_discard_preencoded_topic_bytes(\n    qos: QoS,\n    topic_text: str,\n    encodes_while_queued: int,\n    encodes_after_drain: int,\n) -> None:\n    engine = _connected_engine()\n    engine.outbound.flow.limit = 1\n\n    blocker = engine.queue_publish("capteurs/blocker", b"one", qos=QoS.AT_LEAST_ONCE)\n    assert blocker.mid is not None\n    engine.take_effects()\n\n    topic, encodes = _counting_str(topic_text)\n    queued = engine.queue_publish(topic, b"two", qos=qos)\n\n    assert queued.mid is not None\n    assert engine.outbound.stats().queued_messages == 1\n    assert len(encodes) == encodes_while_queued\n\n    feed_engine(engine, PubAckPacket(mid=blocker.mid).encode(engine.config.protocol))\n    sends = [effect for effect in engine.take_effects() if effect.kind is EffectKind.SEND]\n\n    assert len(sends) == 1\n    assert len(encodes) == encodes_after_drain\n\n'''
          test.write_text(text.replace(marker, added + marker))
      - name: Syntax check
        run: python -m compileall -q src/mqttium/protocol/outbound.py tests/unit/test_topic_bytes_handoff.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mqttium/protocol/outbound.py tests/unit/test_topic_bytes_handoff.py
          git diff --cached --check
          git commit -m "Avoid discarded topic bytes when outbound flow is saturated"
          git push origin HEAD:agent/qos12-topic-bytes-handoff