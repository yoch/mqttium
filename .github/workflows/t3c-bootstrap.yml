name: T3c callback simplification bootstrap

on:
  push:
    branches: [perf/strict-sync-inline-burst2]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,docs]"
      - name: Harden bootstrap assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/t3c_bootstrap.py")
          text = path.read_text(encoding="utf-8")

          old = '''    text = replace_once(
              text,
              "            inline_callback_burst=inline_callback_burst,\\n",
              "",
              label="client validation call",
          )
          text = replace_once(
              text,
              "            inline_callback_burst=inline_callback_burst,\\n",
              "",
              label="delivery construction option",
          )
          '''
          new = '''    forwarded_option = "            inline_callback_burst=inline_callback_burst,\\n"
              forwarded_count = text.count(forwarded_option)
              if forwarded_count != 2:
                  raise RuntimeError(
                      f"client option forwarding: expected exactly two matches, found {forwarded_count}"
                  )
              text = text.replace(forwarded_option, "", 2)
          '''
          if text.count(old) != 1:
              raise RuntimeError("bootstrap forwarding patch did not match exactly once")
          text = text.replace(old, new, 1)

          old = "    return text[:start_index] + new + text[end_index:]\n"
          new = (
              "    suffix_index = end_index + len(end) if new.endswith(end) else end_index\n"
              "    return text[:start_index] + new + text[suffix_index:]\n"
          )
          if text.count(old) != 1:
              raise RuntimeError("replace_between hardening did not match exactly once")
          text = text.replace(old, new, 1)

          old = '''        "### Changed\\n\\n",
              "### Changed\\n\\n"
          '''
          new = '''        "## [Unreleased]\\n\\n### Changed\\n\\n",
              "## [Unreleased]\\n\\n### Changed\\n\\n"
          '''
          if text.count(old) != 1:
              raise RuntimeError("changelog anchor hardening did not match exactly once")
          text = text.replace(old, new, 1)

          text = text.replace(
              'assert client._messages.qsize() == 2',
              'assert client._delivery.messages_queue.qsize() == 2',
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply asserted T3c rewrite
        run: python tools/t3c_bootstrap.py
      - name: Format and lint
        run: |
          ruff format src/mqttium/api/_delivery.py src/mqttium/api/async_client.py tests/unit/test_topic_callback_dispatch_contract.py tests/unit/test_sync_callback_contract.py
          ruff check src/mqttium/api/_delivery.py src/mqttium/api/async_client.py tests/unit/test_topic_callback_dispatch_contract.py tests/unit/test_sync_callback_contract.py
      - name: Focused callback contracts
        run: |
          python -m pytest -q -W error --strict-config --strict-markers \
            tests/unit/test_sync_callback_contract.py \
            tests/unit/test_callback_message_batches.py \
            tests/unit/test_topic_callback_dispatch_contract.py \
            tests/project/test_public_api_surface.py
      - name: Strict docs and diff hygiene
        run: |
          mkdocs build --strict
          git diff --check
      - name: Commit validated rewrite and remove bootstrap
        run: |
          set -euo pipefail
          git rm .github/workflows/t3c-bootstrap.yml tools/t3c_bootstrap.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: simplify callback dispatch contract"
          git push origin HEAD:perf/strict-sync-inline-burst2
