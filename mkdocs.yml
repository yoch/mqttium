site_name: MQTTium
site_description: Dependency-free asyncio MQTT 3.1.1 and MQTT 5 client for Python
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://mqttium.readthedocs.io/en/latest/']
repo_url: https://github.com/yoch/mqttium
repo_name: yoch/mqttium
edit_uri: edit/main/docs/
copyright: Copyright © Yoch Melka — Apache-2.0

docs_dir: docs

exclude_docs: |
  /README.md
  /API-STABILITY.md
  /BENCHMARKING.md
  /BETA-REPORTING.md
  /COMPAT.md
  /MEMORY-BENCHMARK.md
  /OPERATIONS.md
  experiments/
  reports/*.md
  !reports/README.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mqttium-logo-900.png
  favicon: assets/mqttium-logo-900.png
  language: en
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - redirects:
      redirect_maps:
        API-STABILITY.md: api-stability.md
        BENCHMARKING.md: benchmarking.md
        BETA-REPORTING.md: reporting-issues.md
        COMPAT.md: paho-compatibility.md
        COMPATIBILITY.md: compatibility.md
        CONFIGURATION.md: configuration-and-sizing.md
        CONFORMANCE.md: conformance.md
        COOKBOOK.md: cookbook.md
        CORE-CONCEPTS.md: core-concepts.md
        DESIGN.md: architecture.md
        FUZZING.md: fuzzing.md
        GETTING-STARTED.md: getting-started.md
        IMPLEMENTATION-GUIDE.md: implementation-guide.md
        LOGGING.md: observability.md
        MEMORY-BENCHMARK.md: memory-benchmark.md
        MIGRATION.md: migration.md
        MQTT5.md: mqtt-5.md
        NETWORK-RELEASE-GATE.md: network-release-gate.md
        OPERATIONS.md: operations.md
        RELEASING.md: release-process.md
        REPORTING-ISSUES.md: reporting-issues.md
        ROADMAP.md: roadmap.md
        SESSIONS-AND-PERSISTENCE.md: sessions-and-persistence.md
        STABILITY.md: stability.md
        TRANSPORTS-AND-SECURITY.md: transports-and-tls.md
        TROUBLESHOOTING.md: troubleshooting.md
        WRITER-BACKPRESSURE.md: backpressure.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            unwrap_annotated: true
  - llmstxt:
      base_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://mqttium.readthedocs.io/en/latest/']
      full_output: llms-full.txt
      markdown_description: >-
        MQTTium is a dependency-free, async-native MQTT 3.1.1 and MQTT 5.0
        client for production Python services, gateways, and IoT systems.
        Prefer the Stable AsyncClient API. The Paho-compatible API is a
        Provisional migration aid with documented limitations.
      sections:
        Get started:
          - index.md: Product overview and documentation map
          - getting-started.md: Installation and first native round trip
          - core-concepts.md: Completion, ownership, and bounded-resource semantics
        Guides:
          - configuration-and-sizing.md
          - sessions-and-persistence.md
          - transports-and-tls.md
          - mqtt-5.md
          - operations.md
          - backpressure.md
          - troubleshooting.md
          - cookbook.md
        Migration and compatibility:
          - migration.md
          - paho-compatibility.md
          - compatibility.md
        Stable API reference:
          - reference/index.md
          - reference/async-client.md
          - reference/models.md
          - reference/errors-and-enums.md
          - reference/helpers.md
          - api-stability.md
        Design and conformance:
          - architecture.md
          - implementation-guide.md
          - conformance.md
          - observability.md
        Maintainers:
          - testing.md
          - reporting-issues.md
          - benchmarking.md
          - network-release-gate.md
          - memory-benchmark.md
          - fuzzing.md
          - runtime-soak.md
          - stability.md
          - release-process.md
          - roadmap.md
        Historical evidence:
          - reports/README.md: Curated archive index; report bodies are historical

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Core concepts: core-concepts.md
  - Guides:
      - Configuration and sizing: configuration-and-sizing.md
      - Sessions and persistence: sessions-and-persistence.md
      - Transports and security: transports-and-tls.md
      - MQTT 5: mqtt-5.md
      - Operations and observability: operations.md
      - Writer backpressure: backpressure.md
      - Troubleshooting: troubleshooting.md
      - Cookbook: cookbook.md
  - Migration:
      - Migrating to MQTTium: migration.md
      - Paho VERSION2 compatibility (Provisional): paho-compatibility.md
  - Reference:
      - Stable API: reference/index.md
      - AsyncClient: reference/async-client.md
      - Models and settings: reference/models.md
      - Errors and enums: reference/errors-and-enums.md
      - Helpers: reference/helpers.md
      - Compatibility and validation: compatibility.md
      - API stability policy: api-stability.md
  - Concepts:
      - Architecture: architecture.md
      - Implementation contracts: implementation-guide.md
      - Protocol conformance: conformance.md
      - Logging and observability: observability.md
  - Maintainers:
      - Testing and coverage: testing.md
      - Reporting issues: reporting-issues.md
      - Benchmarking contract: benchmarking.md
      - Network release gate: network-release-gate.md
      - Memory methodology: memory-benchmark.md
      - Fuzzing: fuzzing.md
      - Runtime soak: runtime-soak.md
      - Stability campaign: stability.md
      - Release procedure: release-process.md
      - Roadmap: roadmap.md
  - Historical evidence: reports/README.md
  - MQTT specification statements: spec/README.md
