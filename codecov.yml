coverage:
  precision: 2
  range: 89..100
  status:
    project:
      default:
        informational: true
        target: 89%
        threshold: 0.25%
    patch:
      default:
        informational: true
        target: 90%
        threshold: 1%

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: true

# GitHub annotations cannot be reliably cleared after a report changes.
github_checks:
  annotations: false
