[package]
name = "mqttiumd-lab"
description = "Bench of mqttiumd: contract validation now, deterministic store, scheduler and injections with later lots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mqttiumd-contract.workspace = true
# The runner of lot L4 drives the real core (DEM-024).
mqttiumd-core = { path = "../mqttiumd-core" }
# The interface of the store, and the SQLite store the bench runs on.
mqttiumd-store-api = { path = "../mqttiumd-store-api" }
mqttiumd-store-sqlite = { path = "../mqttiumd-store-sqlite" }
# Offline only: no HTTP or file retriever is compiled in, so a schema can
# never be downloaded during a run (DEM-014).
jsonschema = { version = "0.61.2", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
# Lexes the sources of the pure crates for the boundary test. Already a
# transitive dependency of the workspace.
proc-macro2 = "1"

[lints]
workspace = true

[features]
# Test instrumentation is explicit and is reproduced by run --rebuild.
kill-points = ["mqttiumd-store-sqlite/kill-points"]
