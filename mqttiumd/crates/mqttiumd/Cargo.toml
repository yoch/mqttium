[package]
name = "mqttiumd"
description = "Experimental MQTT 5 durable broker for private networks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mqttiumd-contract.workspace = true
mqttiumd-core = { path = "../mqttiumd-core" }
mqttiumd-store-api = { path = "../mqttiumd-store-api" }
mqttiumd-store-sqlite = { path = "../mqttiumd-store-sqlite" }
mqttiumd-store-volatile = { path = "../mqttiumd-store-volatile" }
serde_json = "1"
socket2 = "=0.6.0"
ctrlc = { version = "=3.4.7", features = ["termination"] }
getrandom = "=0.3.4"
# Readiness notification for the I/O reactors (ADR 0044). The binding holds
# the `unsafe`; this crate forbids it.
mio = { version = "=1.2.5", default-features = false, features = ["os-poll", "os-ext"] }
nix = { version = "=0.30.1", features = ["time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.11.1"
zeroize = "=1.9.2"

[features]
default = []
test-hooks = ["mqttiumd-store-sqlite/kill-points"]

[lints]
workspace = true
