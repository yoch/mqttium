[package]
name = "mqttiumd"
description = "Experimental MQTT 5 durable incoming QoS 2 TCP broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mqttiumd-contract.workspace = true
mqttiumd-core = { path = "../mqttiumd-core" }
mqttiumd-store-api = { path = "../mqttiumd-store-api" }
mqttiumd-store-sqlite = { path = "../mqttiumd-store-sqlite" }
serde_json = "1"
socket2 = "=0.6.0"
ctrlc = { version = "=3.4.7", features = ["termination"] }
getrandom = "=0.3.4"
nix = { version = "=0.30.1", features = ["time"] }

[features]
default = []
test-hooks = ["mqttiumd-store-sqlite/kill-points"]

[lints]
workspace = true
